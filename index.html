2026-10-20 07:42:16+08:00","time":"07:42","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.08"},{"title":"澳大利亚国民银行计划裁员 2500 人，澳大利亚房贷市场困境冲击银行业","summary":"澳大利亚国民银行（NAB）将最多裁减 2500 个岗位，以此推进业务改革，应对日趋激烈的行业竞争、拖累住房贷款业务的经济疲软以及快速的技术变革。这家总部位于墨尔本的银行在周二声明中表示，裁员将主要针对管理层与后台职能岗位；该行将在 2027 财年计提 3 亿澳元（折合 2.09 亿美元）的税前重组费用。银行同时将减少外部承包商与咨询顾问的使用，称此举能够优化决策流程、消除重复工作。本次裁员将影响其约 42000 名员工中的 6%。此次裁员是过去一年澳大利亚银行业一系列大规模人员缩减行动的最新一例，反映出行业经营环境持续恶化，以及房地产深度下行导致房贷新增业务萎缩。","published":"2026-10-20 07:36:39+08:00","time":"07:36","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.07"},{"title":"黑石集团CEO称拟未来三年在日本投资400亿美元","summary":"据NHK援引对黑石集团首席执行官Steve Schwarzman的采访报道，该公司计划未来三年在日本投资400亿美元。投资兴趣集中在房地产领域以及人工智能和国防行业的企业并购。Schwarzman表示，由于利率上升，日本经济可能会略微放缓，但他认为这只是暂时的。","published":"2026-10-20 07:28:14+08:00","time":"07:28","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.06"},{"title":"畅通跨境投资渠道 60/40结构ETF密集上市","summary":"在资本市场高水平对外开放持续推进的背景下，一种新的基金品类正成为港股ETF市场的亮点。9月，合计17只60/40结构ETF密集上市，涉及韩国、马来西亚、美国等多个资本市场。在业内人士看来，60/40结构ETF集中上市的背后，是ETF互联互通规则调整、内地与香港互联互通持续深化共同作用的结果。作为跨市场投资工具，60/40结构ETF被视为打开港股ETF市场发展空间，乃至推动跨境资本流动的重要抓手。此类基金持续发展，有望进一步疏通连接中国优质资产与国际资本的渠道。（上海证券报）","published":"2026-10-20 07:54:20+08:00","time":"07:54","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.05"},{"title":"中信证券：A股正转向多元化定价","summary":"中信证券策略研究首席分析师包承超表示，近年来，随着国内经济转型升级和资本市场持续改革，A股的投资价值逐步提升。从基本面看，当前A股市场处于盈利上行周期，上市公司业绩持续兑现，金融、创新药、新能源、有色、化工等领域的景气度显著改善，市场正由单一主线驱动向多元化定价转变。从产业趋势看，全球AI（人工智能）资本开支仍处于扩张阶段，国内AI产业链在算力、模型以及应用端均处于全球领先地位。","published":"2026-10-20 07:49:00+08:00","time":"07:49","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.04"},{"title":"多只银行股创年内新高 高股息资产受机构看好","summary":"多只银行股10月19日股价创年内新高，包括交通银行、招商银行、工商银行、邮储银行、建设银行、中国银行。其中工商银行当日股价收涨1.42%，盘中股价创历史新高，收盘总市值2.89万亿元，重回A股市值第一宝座。中信证券指出，从投资角度而言，在市场波动仍然较大的背景之下，银行业绩稳定性有望进一步夯实其稳定回报属性。","published":"2026-10-20 07:33:40+08:00","time":"07:33","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.03"},{"title":"险资“调仓不减势”，四季度掘金高股息与科技成长主线","summary":"近期市场波动有所加大，保险资金权益配置的调整动向受到市场关注。记者采访多位业内人士了解到，险资确有阶段性调仓，但整体减持体量有限；自有保险资金大账户受仓位要求约束不能净减仓，委外专户则面临客户赎回和回撤约束。保险资金“长钱长投”的核心导向并未改变。与此同时，险资权益配置仍在升温。国家金融监督管理总局数据显示，截至今年二季度末，保险资金运用余额首次突破40万亿元，险企股票和证券投资基金合计配置余额达6.39万亿元，占资金运用余额比重升至16.23%，规模和占比均创历史新高，其中股票配置占比10.41%，连续8个季度环比提升。举牌节奏虽明显放缓，但通过IPO战略配售、私募股权基金等渠道，险资正以耐心长钱加码科技与新质生产力。展望四季度，多家险资机构倾向谨慎乐观，配置主线聚焦“高股息+科技成长”，并更强调业绩确定性与估值安全边际。（经济参考报）","published":"2026-10-20 07:53:11+08:00","time":"07:53","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.02"},{"title":"国产存储板块结构分化 板块定价逻辑从价格普涨预期转向业绩验证","summary":"10月19日，A股存储器板块分化，国产DRAM（内存）龙头长鑫科技股价收跌7.77%，创下上市以来单日第二大跌幅，而大普微、德明利、佰维存储等行业细分龙头股价回升，扭转此前普遍跌势，同时，多家行业上市公司发布回购计划。业内人士向证券时报记者表示，当前资金对存储龙头溢价提出更苛刻的要求，板块定价逻辑从价格普涨预期转向业绩验证。","published":"2026-10-20 07:24:04+08:00","time":"07:24","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.01"}]};

        items = items.filter(item => 
          (item.title && item.title.toLowerCase().includes(searchKey)) ||
          (item.summary && item.summary.toLowerCase().includes(searchKey))
        );
      }

      document.getElementById('newsCount').textContent = `${items.length} 条新闻`;

      if (items.length === 0) {
        container.innerHTML = `<div class="card border rounded-xl p-8 text-center text-slate-500">暂无相关新闻或数据加载中...</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="card border rounded-xl p-5 space-y-3 hover:border-slate-700 transition">
          <div class="flex justify-between items-center text-xs">
            <div class="flex items-center space-x-2">
              <span class="text-amber-500 font-bold">${item.id || ''}</span>
              <span class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded">${item.tag || ''}</span>
            </div>
            <span class="text-slate-500">${item.time || ''}</span>
          </div>
          
          <h2 class="text-base sm:text-lg font-bold text-slate-100 leading-snug">${item.title || ''}</h2>
          
          ${item.summary ? `<p class="text-sm text-slate-400 leading-relaxed">${item.summary}</p>` : ''}
          
          <div class="bg-slate-900/60 rounded-lg p-3 text-xs space-y-1.5 border border-slate-800/50">
            <div class="text-slate-400"><span class="text-red-400">📌 市场传导影响:</span> ${item.impact || '需结合原文与实时行情判断。'}</div>
            <div class="text-slate-400"><span class="text-amber-400">💡 关联资产标的:</span> ${item.asset || '相关核心资产'}</div>
          </div>
          
          <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
            <span>来源: ${item.source || '公开源'}</span>
            ${item.url ? `<a href="${item.url}" target="_blank" class="text-slate-400 hover:text-amber-400 transition">阅读原文 ↗</a>` : '<span>暂无原文链接</span>'}
          </div>
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderNews();
    });
  </script>
</body>
</html>
