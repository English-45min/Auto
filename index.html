跌1.25%，恒科指跌1.79%。 债市 ：国债期货全线反弹，截至发稿，30年期主力合约涨0.33%，10年期主力合约涨0.16%，5年期主力合约涨0.09%，2年期主力合约涨0.02%。 商品 ：国内商品期货普跌，截至发稿，化工品跌幅居前，乙二醇跌3.18%；农副产品多数下跌，生猪跌2.37%；黑色系多数下跌，焦煤跌1.91%；贵金属全部下跌，钯跌1.53%；航运期货全部下跌，集运指数(欧线)跌1.15%；油脂油料多数下跌，豆一跌1.01%；能源品涨幅居前，燃油涨2.42%；新能源材料多数上涨，碳酸锂涨1.45%；非金属建材涨跌参半，PVC涨1.02%；基本金属涨跌参半，铅涨0.78%。 13:36 长鑫科技午后刷新日内低点，兆易创新、江波龙、佰维存储、德明利跟随走软。值得一提的是，长鑫科技40.5元位置两万余手托单被砸穿。韩股方面，SK海力士跌超5%。 13:16 MINIMAX-W跌近7%续创新低，智谱击穿500港元关口，港股端侧AI指数重回日内低位。此前，MINIMAX正式发布新一代Flash模型M3.1 Flash，在Agentic任务、编程、Computer Use及网络安全能力等方面实现了代际的提升，同时线上推理速度提升了近3倍，使用成本降低了70%。 12:05 盘面上，大型科网股多数下跌大市承压，其中，阿里巴巴跌3.2%，腾讯、京东跌1.7%，百度跌超1%，美团飘绿，唯独小米逆势上涨1.6%；锂电池股继续跌势，龙头宁德时代大跌超6%续刷阶段新低！黄金股、内房股、中资券商股、煤炭股普跌。另外，机器人概念股逆势走高，PCB概念股、光伏股普遍上涨。 宁德时代盘中一度跌超7%至408.6港元，股价创去年9月以来新低。消息面上，摩根大通在报告中指出，市场对电池股的担忧已从需求转向盈利，并下调宁德时代H股的评级至“中性”。 摩根大通称，日益担心行业盈利能力恶化的速度快于预期，电动汽车产业链的利润正经历更广泛的重新分配。电池消费税、出口退税率下调及不断增加的贸易壁垒接踵而至，整车厂盈利能力已经承压。 11:42 盘面上，个股涨多跌少，沪深京三市超3900股飘红，上午半天成交9448亿。沪深两市半日成交额9335亿，较上个交易日缩量近400亿。板块方面，人形机器人板块爆发，AI硬件侧复苏，CRO、传媒板块走强，银行、煤炭、家电等红利板块调整。 具体来看，人形机器人概念股集体爆发、十余只成分股涨停。长盈精密20cm涨停，浙江荣泰、福莱新材、宁波东力、大业股份等多股涨停；其中大业股份3连板，福莱新材、宁波东力、浙江荣泰2连板。赛摩智能、爱仕达等亦封板，宇树科技涨超7%（最近3个交易日涨近30%），华依科技、儒竞科技、安培龙等多股涨超10%。 催化逻辑密集共振： 其一，弗若斯特沙利文报告点燃产业预期。近日国际咨询机构弗若斯特沙利文发布《2026年全球人形机器人市场研究报告》，今年上半年全球人形机器人销量达3.6万台、市场收入达5.4亿美元，均超2025年全年水平；按收入计算，前五名全部由中国企业包揽，分别为优必选、智元机器人、宇树科技、银河通用和乐聚机器人。 官方口径同样印证高景气：工信部10月19日发布会披露，上半年我国人形机器人整机产品产量超4万台、预计全年将突破10万台，首批六项人形机器人国家标准已发布、将于2027年4月1日实施。 其二，特斯拉首次书面确认Optimus量产准备。据华源证券，10月19日特斯拉提交的年度股东大会材料中首次书面宣称\"已为V3 Optimus大规模量产做好准备\"，虽未披露产量、价格或交付日期，仍强化了量产落地预期。 其三，OpenAI入局\"造机器人\"。OpenAI官网近期挂出19个Robotics岗位，CEO奥特曼公开确认将做人形机器人，\"造大脑\"的资本正式入场，与国产链形成情绪共振。 其四，政策首次从消费侧打开空间。10月19日商务部等9部门发布《关于加快推进科技兴商的意见》，此番是首次从\"促消费/商贸流通\"角度为机器人打开需求侧空间——家庭服务、商贸物流被视为人形机器人最被看好的规模化落地场景。叠加10月20日至22日英伟达GTC柏林大会开幕、聚焦物理AI与机器人，事件催化窗口持续。 AI硬件局部反弹，电路板、覆铜板等概念股纷纷拉升。博敏电子、骏亚科技等涨停。 半导体芯片股反弹，银河微电、恒玄科技、博通集成、瑞芯微涨停。其中银河微电20cm涨停，催化来自其公告前三季度净利润同比增长109.70%；欧莱新材、中科仪等多股跟涨。 下跌方面，煤炭板块下挫，安泰集团、大有能源跌超7%。 10:44 创业板指涨超1%，中际旭创、天孚通信、三环集团开始发力。 科创50指数亦涨超1%。 10:36 宇树科技-W升超10%，人形机器人板块继续攀升。 10:17 人形机器人板块继续升温，赛摩智能、浙江荣泰率先涨停，奥比中光-W、奥普特、长盈精密飙升，宇树科技-W涨近6%。 10:04 洛阳钼业跌超7%，A股有色金属板块抛压明显，紫金矿业、宏桥控股、中国铝业、江西铜业集体下滑。港股方面，有色金属龙头股同步走软。 09:49 北证50日涨幅超5%，创业板指翻红，AI硬件侧复苏，覆铜板板块领涨。 消息面上，证监会将锚定打造服务创新型中小企业主阵地，稳步推出北证50ETF、北交所新股市值配售、创新性评价标准、优化新三板分层管理等一系列举措，促进北交所新三板一体化高质量发展。 09:47 宁德时代AH股同步下滑，均创阶段新低。港股新能源汽车指数跌超4%，蔚来、小鹏集团表现低迷。 09:34 创业板指、科创50指数均跌超1%，沪指跌0.32%，创业板指跌0.66%，贵金属、煤炭、军工、航运等方向跌幅居前，沪深京三市下跌个股近3200只。 北证50涨近3%，同惠电子、华密新材、纳科诺尔、并行科技、万通液压领涨。此前，证监会主席吴清宣布，推出北证50ETF、北交所新股市值配售、创新性评价标准等举措。 09:25 上证指数低开0.33%，创业板指跌0.5%。传媒、电路板、冰雪旅游、光通信板块调整。农业、教育板块活跃。 09:21 恒生指数低开0.81%，恒生科技指数跌1.28%。联想集团、三环集团、中远海能、中际旭创、剑桥科技领跌。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-20 13:41:28+08:00","time":"13:41","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3783987","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.08"},{"title":"英特尔半导体（大连）有限公司增资至8.16亿美元","summary":"天眼查App显示，近日，英特尔半导体（大连）有限公司发生工商变更，注册资本由2000万美元增至8.16亿美元，增幅3980%。英特尔半导体（大连）有限公司成立于2006年6月，法定代表人为CANDICECHRISTINEMOORE，经营范围包括半导体集成电路产品制造、封装测试、加工、仓储、销售自产产品和售后服务等。股东信息显示，该公司由英特尔（中国）有限公司全资持股。（南方财经）","published":"2026-10-20 14:17:59+08:00","time":"14:17","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.07"},{"title":"华泰降赣锋锂业目标价至32.74港元","summary":"华泰证券发表研究报告指，考虑到碳酸锂价格第三季按季下滑叠加市场对2027、2028年需求仍存在担忧，该行下调赣锋锂业(01772.HK)2026至2028年归母净利润至60.4亿、73.1亿及81.6亿元，较前值分别下调22.4%、23.2%及25.7%。赣锋锂业H股目标价由54.15港元降至32.74港元。","published":"2026-10-20 14:06:07+08:00","time":"14:06","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.06"},{"title":"摩尔线程盘中涨超10%","summary":"A股摩尔线程盘中涨超10%，现报359.73元。","published":"2026-10-20 14:19:51+08:00","time":"14:19","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.05"},{"title":"英国就业人数回升 料为财相公布的预算提供助力","summary":"官方数据显示，9月份英国雇主增加了就业岗位。这一消息为财政大臣约翰·希利提供了意想不到的助力。下周，他将公布一份至关重要的预算案。税务数据显示，上个月领薪雇员人数增加了1.3万人，这与此前预期的减少8000人形成了鲜明对比。8月份的数据也进行了大幅修正，         );
      }

      document.getElementById('newsCount').textContent = `${items.length} 条新闻`;

      if (items.length === 0) {
        container.innerHTML = `<div class="card border rounded-xl p-8 text-center text-slate-500">暂无相关新闻或数据加载中...</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="card border rounded-xl p-5 space-y-3 hover:border-slate-700 transition">
          <div class="flex justify-between items-center text-xs">
            <div class="flex items-center space-x-2">
              <span class="text-amber-500 font-bold">${item.id || ''}</span>
              <span class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded">${item.tag || ''}</span>
            </div>
            <span class="text-slate-500">${item.time || ''}</span>
          </div>
          
          <h2 class="text-base sm:text-lg font-bold text-slate-100 leading-snug">${item.title || ''}</h2>
          
          ${item.summary ? `<p class="text-sm text-slate-400 leading-relaxed">${item.summary}</p>` : ''}
          
          <div class="bg-slate-900/60 rounded-lg p-3 text-xs space-y-1.5 border border-slate-800/50">
            <div class="text-slate-400"><span class="text-red-400">📌 市场传导影响:</span> ${item.impact || '需结合原文与实时行情判断。'}</div>
            <div class="text-slate-400"><span class="text-amber-400">💡 关联资产标的:</span> ${item.asset || '相关核心资产'}</div>
          </div>
          
          <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
            <span>来源: ${item.source || '公开源'}</span>
            ${item.url ? `<a href="${item.url}" target="_blank" class="text-slate-400 hover:text-amber-400 transition">阅读原文 ↗</a>` : '<span>暂无原文链接</span>'}
          </div>
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderNews();
    });
  </script>
</body>
</html>
