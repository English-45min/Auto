<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

:root {
  --bg: #080d18;
  --panel: #101827;

  --muted: #91a1b8;
  --orange: #ffad42;
  --green: #46d6a0;
  --red: #ff727c;
  --blue: #72b8ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}

button, input, select { font: inherit; }

button { cursor: pointer; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(8,13,24,.94);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.container {
  width: min(1200px, 100%);

  padding: 0 18px;
}

.brand {

  letter-spacing: .4px;
  font-size: 20px;
}

.brand span { color: var(--orange); }

.eyebrow {
  font-size: 11px;
  letter-spacing: 1.7px;
  color: var(--muted);
  text-transform: uppercase;
}

.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 6px;
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 14px 0;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  white-space: nowrap;
  padding: 9px 15px;
  color: var(--muted);
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  font-size: 13px;
}

.tab.active {
  color: var(--orange);
  border-color: rgba(255,173,66,.42);

}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.metric {
  padding: 15px;
  min-height: 88px;
}

.metric-value {
  font-size: 25px;
  font-weight: 750;
  margin-top: 3px;
}

.muted { color: var(--muted); }

.section-title {
  font-size: 17px;
  font-weight: 750;
}

.small-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}
