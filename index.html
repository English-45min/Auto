<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloomberg 财经焦点看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .tab-active { border-bottom: 2px solid #f59e0b; color: #f59e0b; font-weight: bold; }
        .tab-inactive { color: #94a3b8; }
        .tab-inactive:hover { color: #cbd5e1; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="bg-amber-500 text-slate-950 font-black px-2 py-0.5 rounded text-xs tracking-wider">BLOOMBERG</span>
                <span class="font-bold text-sm text-slate-200">财经焦点看板</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="alert('海报生成功能准备中')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1 transition">
                    <span>生成高清海报</span>
                </button>
                <button onclick="copyTerminalText()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1 transition">
                    <span>复制终端文案</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-4">
        <!-- Live Status Bar -->
        <div class="flex flex-wrap items-center justify-between text-xs text-slate-400 mb-4 bg-slate-900/50 p-2.5 rounded-lg border border-slate-800/80">
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>终端实时同步中（自动化运行正常）</span>
            </div>
            <div id="updateTime" class="text-slate-400 mt-1 sm:mt-0">更新时间: 2026-10-18 18:11:25 (CST)</div>
        </div>

        <!-- Search Box -->
        <div class="mb-4">
            <input type="text" id="searchInput" oninput="filterNews()" placeholder="搜索关键词（如：美联储、芯片、GDP）..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500 transition">
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-800 mb-6 text-sm">
            <button id="tab-global" onclick="switchTab('global')" class="py-2.5 px-4 tab-active transition">彭博全球 Top 10</button>
            <button id="tab-asia" onclick="switchTab('asia')" class="py-2.5 px-4 tab-inactive transition">亚太焦点 Top 5</button>
            <button id="tab-china" onclick="switchTab('china')" class="py-2.5 px-4 tab-inactive transition">国内核心 Top 5</button>
        </div>

        <!-- News Cards Container -->
        <div id="newsContainer" class="space-y-4">
            <!-- Cards populated dynamically via JS -->
        </div>

        <!-- Footer -->
        <footer class="mt-12 text-center text-xs text-slate-500 space-y-1">
            <p>免责声明：本看板内容基于 Bloomberg 及公开市场数据综合二次编译整理，仅供信息参考。</p>
            <p>© 2026 Financial News Terminal. All rights reserved.</p>
        </footer>
    </main>

    <!-- NEWS_DATA_START -->
    <script>
        const newsData = {
            global: [
                { id: "NO.01", title: "10月18日 焦点：当前正等待下一轮实时电报广播", time: "08:00", tag: "实时播报", summary: "坚持100%真实报道原则，等待刷新。", impact: "N/A", asset: "N/A" }
            ],
            asia: [
                { id: "NO.01", title: "10月18日 焦点：当前正等待下一轮实时电报广播", time: "08:00", tag: "实时播报", summary: "坚持100%真实报道原则，等待刷新。", impact: "N/A", asset: "N/A" }
            ],
            china: [
                { id: "NO.01", title: "10月18日 焦点：当前正等待下一轮实时电报广播", time: "08:00", tag: "实时播报", summary: "坚持100%真实报道原则，等待刷新。", impact: "N/A", asset: "N/A" }
            ]
        };
    </script>
    <!-- NEWS_DATA_END -->

    <script>
        let currentTab = 'global';

        function renderNews(tabKey, filterQuery = '') {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';
            
            const list = newsData[tabKey] || [];
            const filtered = list.filter(item => 
                item.title.toLowerCase().includes(filterQuery.toLowerCase()) || 
                item.summary.toLowerCase().includes(filterQuery.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">暂未搜寻到相关新闻</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900/90 border border-slate-800/80 rounded-xl p-4 sm:p-5 hover:border-slate-700 transition space-y-3';
                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center space-x-2">
                            <span class="text-amber-500 font-bold tracking-wide">${item.id}</span>
                            <span class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[11px]">${item.tag}</span>
                        </div>
                        <span class="text-slate-500">${item.time}</span>
                    </div>
                    <h3 class="text-base sm:text-lg font-bold text-slate-100 leading-snug">${item.title}</h3>
                    <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">${item.summary}</p>
                    <div class="bg-slate-950/60 rounded-lg p-3 text-xs space-y-1.5 border border-slate-800/50">
                        <div class="text-slate-300"><span class="text-amber-500 font-medium">📌 市场传导影响：</span> ${item.impact}</div>
                        <div class="text-slate-300"><span class="text-amber-500 font-medium">💡 关联资产标的：</span> ${item.asset}</div>
                    </div>
                    <div class="flex justify-between items-center text-[11px] text-slate-500 pt-1">
                        <span>彭博财经 · 每日精编</span>
                        <span>来源: Bloomberg/公开数据</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tabKey) {
            currentTab = tabKey;
            ['global', 'asia', 'china'].forEach(key => {
                const btn = document.getElementById(`tab-${key}`);
                if (key === tabKey) {
                    btn.className = 'py-2.5 px-4 tab-active transition';
                } else {
                    btn.className = 'py-2.5 px-4 tab-inactive transition';
                }
            });
            const searchVal = document.getElementById('searchInput').value;
            renderNews(tabKey, searchVal);
        }

        function filterNews() {
            const searchVal = document.getElementById('searchInput').value;
            renderNews(currentTab, searchVal);
        }

        function copyTerminalText() {
            const list = newsData[currentTab] || [];
            let text = `【Bloomberg 财经焦点 - ${currentTab.toUpperCase()}】\n\n`;
            list.forEach(i => {
                text += `${i.id} | ${i.title}\n摘要：${i.summary}\n\n`;
            });
            navigator.clipboard.writeText(text).then(() => alert('已成功复制终端文案到剪贴板！'));
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            renderNews('global');
        });
    </script>
</body>
</html>
