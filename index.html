爬坡不断提速，并且特斯拉有望在四季度发布Optimus V3，将人形机器人产业发展带入新的阶段，基于此，看好机器人产业的量产和应用前景，建议关注产业链核心厂商。（人民财讯）","published":"2026-10-22 08:18:44+08:00","time":"10-22 08:18","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.07"},{"title":"经济日报金观平：努力实现发展和安全良性互动","summary":"中共中央、国务院印发《关于发展新质生产力的意见》明确提出“统筹发展和安全”。安全是发展的前提，发展是安全的保障。发展和安全统筹得当，二者相得益彰；顾此失彼，则两头落空。在发展新质生产力过程中，要以高质量发展促进高水平安全，以高水平安全保障高质量发展，努力实现二者良性互动、动态平衡。","published":"2026-10-22 08:14:30+08:00","time":"10-22 08:14","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.06"},{"title":"中信证券：国家数据集团成立，重视稀缺数据流通及Infra建设机遇","summary":"中信证券研报表示，国家数据集团正式成立，定位为数据资源开发利用的国家级市场化主体，旨在强化央地及跨行业数据资源协同。掌握医保等稀缺行业数据资源的应用公司，以及既有业务涵盖可信数据空间、数据交易平台等Infra建设的相关公司有望率先受益。建议关注两条投资主线：1. 稀缺数据应用；2. 数据基础设施建设。","published":"2026-10-22 08:13:38+08:00","time":"10-22 08:13","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.05"},{"title":"中信证券：看好具备技术、产品和市场份额优势的海风核心设备龙头","summary":"中信证券指出，国内加码海风政策规划支持力度，深远海项目开发有望加速；欧洲海风供应链采购需求蓄力新一轮放量，内外需求有望迎来增长拐点。对于管桩和海缆等核心供应链环节，国内深远海趋势将带动产品规格升级和价值量上行，并推动份额向头部集中；欧洲本土产能结构性趋紧，具备制造优势与全球化配套能力的龙头厂商出海空间打开。预计2027年国内外项目招标和供应链订单有望率先复苏，2028年起或将开启产品出货和业绩增长兑现的新阶段，看好具备技术、产品和市场份额优势的海风核心设备龙头。","published":"2026-10-22 08:12:37+08:00","time":"10-22 08:12","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.04"},{"title":"风险交织催生套保新需求 期货公司加速向产业“风险管家”转型","summary":"10月19日，在2026金融街论坛年会上，证监会主席吴清表示：“当前百年变局加速演进，新一轮科技革命和产业变革蓬勃发展，世界政治经济格局和金融生态面临深刻调整和重塑，对资本市场产生日益广泛而深远的影响。”全球宏观环境复杂多变，风险因素加速向实体经济传导，产业企业的风险管理需求也在发生深刻变化。业内人士表示，产业链供应链不确定性增加，驱动实体企业套保需求正从单一商品价格对冲向多维度、全链条风险管理转变。随着我国期货市场品种体系不断完善、双向开放稳步推进，期货公司正加快突破传统经纪业务边界，向覆盖产业链上下游、贯穿企业经营全过程的“风险管家”转型。（中证报）","published":"2026-10-22 08:05:40+08:00","time":"10-22 08:05","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.03"},{"title":"数字货币两大核心成果发布 15只概念股低估值且大幅回调","summary":"10月21日，数字人民币基础设施服务体系迎来重大升级，数字人民币运营管理中心对外宣布，推出央行端数字人民币系统（DCEPS）、数字人民币智能合约生态服务框架（e-CNY SMART Contract）两大核心成果。数字人民币概念股今年以来整体下跌，其中中科金财、四方精创、翠微股份年内跌幅超45%，赢时胜、证通电子、京北方、长亮科技等跌超40%。今年以来，有15只概念股获得机构调研，宇信科技、广电运通、京北方、天阳科技获得百家以上机构调研，新开普、中科江南、证通电子获得40家以上机构调研。年内跌幅超20%个股中，有15股最新市净率不足3倍，海联金汇、广电运通、神州信息、新开普、南天信息等不足2倍。","published":"2026-10-22 08:02:34+08:00","time":"10-22 08:02","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.02"},{"title":"中国裁军大使呼吁防止外空军备竞赛和武器化","summary":"中国裁军事务大使李驰江21日在联大第一委员会关于外空问题作专题发言，指出防止外空军备竞赛和武器化是外空安全治理的最紧迫任务。 李驰江说，当前，外空军备竞赛与武器化已成为现实威胁。美国将外空界定为“作战疆域”，公开承认在轨部署太空控制武器，向国际社会释放出极其危险的信号。大多数国家维护外空安全愿望与一国称霸外空的矛盾空前尖锐，这是外空安全面临的最大挑战。他提出四点中方主张： 第一，防止外空军备竞赛和武器化是外空安全治理的最紧迫任务。不解决这个根本问题，外空领域的其他规则都将受到冲击。各国应坚持“外空战打不赢也打不得”理念，放弃“主导外空”战略，不在外空搞“大国竞争”和阵营对抗。 第二，加强谈判缔结外空军控条约的国际努力。事实证明，自愿性规则无法阻止外空武器化。中俄“防止在外空放置武器、对外空物体使用或威胁使用武力条约”草案是当前唯一的外空军控法律文书建议，其核心条款能够从根源上遏制外空武器化、战场化。中方欢迎各方讨论完善该草案文本。 第三，坚持多边协商，反对双重标准。外空规则应由各国共同制定，不能搞“小圈子”、排他性安排。应积极推进和平利用外空国际合作。一边放任在轨部署武器的行为，一边搞“选择性军控”，无助于维护外空和平与安全。 第四，重视新兴问题治理。深入研究商业航天介入他国武装冲突带来的法律争议和现实问题，在广泛磋商基础上探寻可行的治理方案。","published":"2026-10-22 08:02:30+08:00","time":"10-22 08:02","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.01"}]};

      if (!items || items.length === 0) {

            暂无最新资讯，请稍后刷新或运行 GitHub Actions 更新
          </div>`;
        return;
      }

      container.innerHTML = items.map((item, index) => {
        const urlBtn = item.url ? `
          <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-400 hover:text-amber-400 flex items-center gap-0.5 transition">
            阅读原文 ↗
          </a>` : '<span class="text-xs text-slate-600">暂无原文链接</span>';

        return `
          <div class="news-card rounded-lg p-4 shadow-sm">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
              <div class="flex items-center space-x-2">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                  ${item.id || ('NO.' + (index + 1))}
                </span>
                <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300">
                  ${item.tag || '财经'}
                </span>
              </div>
              <span class="font-mono text-slate-400">${item.time || ''}</span>
            </div>

            <h3 class="text-base font-bold text-slate-100 leading-snug mb-2">
              ${item.title || ''}
            </h3>

            ${item.summary ? `
              <p class="text-xs text-slate-300 leading-relaxed mb-3">
                ${item.summary}
              </p>` : ''}

            <div class="bg-slate-900/60 rounded p-2.5 mb-3 text-xs space-y-1.5 border border-slate-800/80">
              <div class="flex items-start text-slate-300">
                <span class="text-red-400 font-bold shrink-0 mr-1.5">📌 市场传导影响:</span>
                <span>${item.impact || '需结合原文、官方数据及实时行情进一步判断影响。'}</span>
              </div>
              <div class="flex items-start text-slate-300">
                <span class="text-amber-400 font-bold shrink-0 mr-1.5">💡 关联资产标的:</span>
                <span>${item.asset || '相关资产标的'}</span>
              </div>
            </div>

            <div class="flex items-center justify-between pt-1 text-xs text-slate-500 border-t border-slate-800/40">
              <span>来源: ${item.source || '官方/权威媒体'}</span>
              ${urlBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    // 页面初始化渲染
    document.addEventListener('DOMContentLoaded', () => {
      renderNews();
    });

    // 移动端下拉刷新手势监听（顶部向下拖拽 > 150px 时无视缓存刷新）
    let startY = 0;
    window.addEventListener('touchstart', (e) => {
      startY = e.touches[0].pageY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const y = e.touches[0].pageY;
      if (window.scrollY === 0 && y - startY > 150) {
        location.reload(true);
      }
    }, { passive: true });
  </script>
</body>
</html>
