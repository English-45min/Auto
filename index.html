  function esc(str) {

  }

  function list(arr) {

  }

  function switchTab(tab) {
   currentTab = tab;
   document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.className = "tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-gray-800 text-gray-300 hover:bg-gray-700 transition whitespace-nowrap";
   });
   const activeBtn = document.getElementById('tab-' + tab);
   if (activeBtn) {
    activeBtn.className = "tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-amber-500 text-gray-950 transition shadow-lg shadow-amber-500/10 whitespace-nowrap";
   }
   render();
  }

  function renderAIResearch(n) {

    </article>

  }

  function render() {
   const data = window.newsData || {};

   if (aiStatusEl) {
    aiStatusEl.textContent = "🟢 DeepSeek 已配置 · deepseek-chat";

   }
