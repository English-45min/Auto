+08:00","time":"10-22 14:18","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.04"},{"title":"中际旭创A股成交额超200亿元","summary":"中际旭创A股成交额超200亿元，现跌超6%。","published":"2026-10-22 14:17:30+08:00","time":"10-22 14:17","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.03"},{"title":"工信部NVDB发布关于防范PHP远程代码执行超危漏洞的风险提示","summary":"工业和信息化部网络安全威胁和漏洞信息共享平台（NVDB）监测发现，PHP存在两个远程代码执行超危漏洞，危害严重。PHP是一款广泛用于Web开发的开源服务器端脚本语言。由于其存在两个超危远程代码执行漏洞，未经身份验证的攻击者可利用其远程执行任意代码，造成服务器受控、敏感信息泄露、业务中断等危害。受影响的PHP范围包括：8.5系列＜8.5.12、8.4系列＜8.4.27、8.3系列＜8.3.36、8.2系列＜8.2.35、8.1系列及更早版本。目前，PHP安全团队已修复漏洞并发布安全公告（URL链接：https://www.php.net/archive/2026.php#2026-10-21-5）。建议相关单位和用户立即开展全面排查，及时升级至最新安全版本，或采取临时下线、关闭会话上传进度功能、网络隔离、网络访问限制等临时防护措施；加强网络安全监测和管理，及时修改账号、口令和密钥等凭证，防范网络攻击风险。（工信部）","published":"2026-10-22 14:16:05+08:00","time":"10-22 14:16","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.02"},{"title":"招商证券国际：下调福耀玻璃目标价至76港元，维持“增持”评级","summary":"招商证券国际发表报告指，福耀玻璃第三季净利润20.36亿元，同比及环比均跌9.9%，低于市场预期的20.7亿元。剔除汇兑损失、美国工厂火灾修复及一次性售后服务费合计约4.32亿元后，测算税前利润约29.19亿元，同比升0.5%，较市场预期低4.4%。该行下调2026至2028年利润预测11%、8%及9%，以反映汇兑影响、国内车市恢复乏力及其他一次性因素，并将目标价由83港元下调至76港元，相当于2027年财政年度16.2倍市盈率，维持“增持”评级。该行认为，尽管第三季业绩低于预期，公司在产业链中的地位并未动摇，电动化、智能化带来持续产品创新机遇，预期2027年国内车市企稳后，公司有望恢复收入及利润双位数增长。","published":"2026-10-22 14:11:37+08:00","time":"10-22 14:11","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.01"}]};

        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-sm">
            暂无最新资讯，请稍后刷新或运行 GitHub Actions 更新
          </div>`;
        return;
      }

      container.innerHTML = items.map((item, index) => {
        const urlBtn = item.url ? `
          <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-400 hover:text-amber-400 flex items-center gap-0.5 transition">
            阅读原文 ↗
          </a>` : '<span class="text-xs text-slate-600">暂无原文链接</span>';

        return `
          <div class="news-card rounded-lg p-4 shadow-sm">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
              <div class="flex items-center space-x-2">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                  ${item.id || ('NO.' + (index + 1))}
                </span>
                <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300">
                  ${item.tag || '财经'}
                </span>
              </div>
              <span class="font-mono text-slate-400">${item.time || ''}</span>
            </div>

            <h3 class="text-base font-bold text-slate-100 leading-snug mb-2">
              ${item.title || ''}
            </h3>

            ${item.summary ? `
              <p class="text-xs text-slate-300 leading-relaxed mb-3">
                ${item.summary}
              </p>` : ''}

            <div class="bg-slate-900/60 rounded p-2.5 mb-3 text-xs space-y-1.5 border border-slate-800/80">
              <div class="flex items-start text-slate-300">
                <span class="text-red-400 font-bold shrink-0 mr-1.5">📌 市场传导影响:</span>
                <span>${item.impact || '需结合原文、官方数据及实时行情进一步判断影响。'}</span>
              </div>
              <div class="flex items-start text-slate-300">
                <span class="text-amber-400 font-bold shrink-0 mr-1.5">💡 关联资产标的:</span>
                <span>${item.asset || '相关资产标的'}</span>
              </div>
            </div>

            <div class="flex items-center justify-between pt-1 text-xs text-slate-500 border-t border-slate-800/40">
              <span>来源: ${item.source || '官方/权威媒体'}</span>
              ${urlBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    // 页面初始化渲染
    document.addEventListener('DOMContentLoaded', () => {
      renderNews();
    });

    // 移动端下拉刷新手势监听（顶部向下拖拽 > 150px 时无视缓存刷新）
    let startY = 0;
    window.addEventListener('touchstart', (e) => {
      startY = e.touches[0].pageY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const y = e.touches[0].pageY;
      if (window.scrollY === 0 && y - startY > 150) {
        location.reload(true);
      }
    }, { passive: true });
  </script>
</body>
</html>
