<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19"><title>财经研究辅助看板</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f19;color:#e2e8f0;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
.tab{padding:.75rem .6rem;border-bottom:2px solid transparent;color:#94a3b8;font-weight:700;cursor:pointer;touch-action:pan-y}.tab.active{border-color:#f59e0b;color:#f59e0b}
.card{background:#111827;border:1px solid #263244;border-radius:14px;padding:16px;overflow-wrap:anywhere}.muted{color:#94a3b8}.ai{background:#0d2430;border:1px solid #155e75;border-radius:10px;padding:12px}
.pill{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1}.read{opacity:.72}.btn{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:7px 10px;cursor:pointer}
.btn:hover{background:#334155}a{color:#fbbf24;text-decoration:none}a:hover{text-decoration:underline}input{outline:none}input:focus{border-color:#f59e0b}.news-title{font-size:1.1em;line-height:1.55}
.research-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.research-box{background:#0b1220;border:1px solid #263244;border-radius:9px;padding:10px;min-width:0}
.research-box h4{font-size:.85em;font-weight:800;color:#7dd3fc;margin:0 0 6px}.research-box p,.research-box li{font-size:.92em;line-height:1.6;color:#dbeafe}.research-box ul{padding-left:1.2rem;margin:0}.research-wide{grid-column:1/-1}
@media(max-width:520px){.card{padding:12px}.tab{font-size:12px;padding:.65rem .18rem}.news-title{font-size:1.03em}.research-grid{grid-template-columns:1fr}.research-wide{grid-column:auto}}
</style></head><body>
<header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950/95 backdrop-blur"><div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
<div><h1 class="text-xl sm:text-2xl font-black">📈 财经研究辅助看板</h1><p class="muted text-sm mt-1">新闻事实 · 传导逻辑 · 证据意识 · 风险约束</p></div>
<div class="text-xs muted">最近更新：<span id="updateTime">等待更新</span><div id="aiStatus" class="mt-1">AI 状态读取中</div></div></div></header>
<main class="max-w-6xl mx-auto px-4 py-5">
<div class="flex flex-wrap gap-2 items-center mb-4"><input id="searchInput" type="search" class="flex-1 min-w-48 rounded-lg bg-slate-900 border border-slate-700 px-3 py-2" placeholder="搜索标题、摘要、来源、逻辑或资产…" aria-label="搜索新闻">
<button class="btn" id="fontDown" type="button">A−</button><button class="btn" id="fontUp" type="button">A+</button><button class="btn" id="clearRead" type="button">清除已读</button></div>
<nav class="grid grid-cols-2 sm:grid-cols-4 border-b border-slate-800 mb-5" id="tabs" aria-label="新闻栏目">
<button class="tab active" data-tab="global" type="button">国际财经 Top 20</button><button class="tab" data-tab="asia" type="button">亚太财经 Top 10</button><button class="tab" data-tab="china" type="button">国内财经 Top 10</button><button class="tab" data-tab="earnings" type="button">📊 核心财报 Top 10</button></nav>
<div class="flex justify-between items-center gap-3 mb-3"><h2 id="sectionTitle" class="text-lg font-bold">国际财经新闻</h2><span id="count" class="muted text-sm">0 条</span></div>
<p class="muted text-xs mb-4">手机左右滑动切换栏目：水平移动至少 70px，且水平距离超过垂直距离 2 倍才触发，避免上下阅读长文章时误切换。</p>
<div id="newsList" class="space-y-4" aria-live="polite"><div class="card muted">等待新闻数据。请在 GitHub Actions 中运行 Daily Update。</div></div>
<footer class="muted text-xs mt-8 leading-relaxed">研究辅助说明：AI 输出是基于标题、来源和摘要的初步分析，不等于已核验的完整研究。请区分新闻事实、分析推断与情景假设；关联资产不代表价格必然上涨或下跌。投资决策前应查阅原始报道、公司公告和可靠数据，不构成投资建议。</footer>
</main>
<!-- NEWS_DATA_START --><script>window.newsData = {};</script><!-- NEWS_DATA_END -->
<script>
"use strict";
const labels={global:"国际财经新闻",asia:"亚太财经新闻",china:"国内财经新闻",earnings:"核心财报新闻"};let active="global",fontSize=15;
const readKey="financeDashboardRead_v2";let readIds=new Set();try{readIds=new Set(JSON.parse(localStorage.getItem(readKey)||"[]"))}catch(e){}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeUrl(v){try{const u=new URL(String(v||""),location.href);if(["https:","http:"].includes(u.protocol))return u.href}catch(e){}return "#"}
function list(items){return Array.isArray(items)&&items.length?`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<p>暂无足够信息；需核验原文。</p>"}
function render(){
 const all=Array.isArray(window.newsData?.[active])?window.newsData[active]:[],q=(document.getElementById("searchInput").value||"").trim().toLowerCase();
 const items=all.filter(n=>[n.title,n.summary,n.source,(n.asset||[]).join(" "),n.analysis,n.coreLogic,n.marketImpact,n.transmission,n.risk,n.originalTitle].join(" ").toLowerCase().includes(q));
 document.getElementById("sectionTitle").textContent=labels[active];document.getElementById("count").textContent=`显示 ${items.length} / ${all.length} 条`;
 const root=document.getElementById("newsList");if(!items.length){root.innerHTML=`<div class="card muted">${all.length?"没有找到符合条件的新闻。":"此栏目暂时没有新闻，请稍后运行 Daily Update。"}</div>`;return}
 root.innerHTML=items.map((n,i)=>{
 const rid=active+"_"+String(n.url||n.title||i),read=readIds.has(rid),assets=Array.isArray(n.asset)?n.asset:[];
 const research=n.analysis?`<section class="ai mb-3"><div class="font-bold text-cyan-300 mb-2">🧭 AI 分层研究分析 <span class="pill">${esc(n.confidence||"置信度未标注")}</span></div><p class="leading-relaxed mb-3">${esc(n.analysis)}</p>
 <div class="research-grid">
 <div class="research-box"><h4>📌 核心逻辑</h4><p>${esc(n.coreLogic||"暂无，需核验原文。")}</p></div>
 <div class="research-box"><h4>📈 潜在市场影响</h4><p>${esc(n.marketImpact||n.impact||"暂无法判断。")}</p></div>
 <div class="research-box"><h4>🔗 传导机制</h4><p>${esc(n.transmission||"当前信息不足以判断传导路径。")}</p></div>
 <div class="research-box"><h4>⏳ 影响周期</h4><p>${esc(n.timeHorizon||"暂不确定，需结合后续数据。")}</p></div>
 <div class="research-box"><h4>🧾 证据线索（来自摘要）</h4>${list(n.evidence)}</div><div class="research-box"><h4>⚖️ 情景分析（条件假设）</h4>${list(n.scenarios)}</div>
 <div class="research-box research-wide"><h4>⚠️ 风险、反证与信息缺口</h4><p>${esc(n.risk||"尚未识别；需阅读原始报道并核验数据。")}</p></div></div>
 <p class="muted text-xs mt-3">置信度是对当前材料充分程度的定性判断，不是统计概率或收益预测。</p></section>`
 :`<div class="rounded-lg bg-slate-900 p-3 muted text-sm mb-3">${window.newsData?.aiEnabled?"本条尚未生成分析，可能是调用额度已用完或服务暂时繁忙；下次更新会再尝试。":"尚未检测到 Gemini API 密钥，请检查 GitHub Secrets。"}</div>`;
 return `<article class="card ${read?"read":""}" style="font-size:${fontSize}px"><div class="flex flex-wrap justify-between gap-2 items-center mb-3"><div class="flex flex-wrap gap-2 items-center"><span class="pill">${esc(n.id||("NO."+(items.length-i)))}</span><span class="pill">${esc(n.source||"新闻来源")}</span><span class="pill">${esc(n.publishedAt||"")}</span>${n.aiStatus==="Gemini AI"?'<span class="pill">已完成 AI 分析</span>':""}</div><button class="btn text-xs" type="button" data-read-id="${esc(rid)}">${read?"✓ 已读":"标记已读"}</button></div>
 <h3 class="news-title font-bold mb-2">${esc(n.title||"无标题")}</h3>${n.originalTitle&&n.originalTitle!==n.title?`<details class="mb-3 text-xs muted"><summary class="cursor-pointer">查看原文标题</summary><p class="mt-2">${esc(n.originalTitle)}</p></details>`:""}
 <p class="text-slate-300 leading-relaxed mb-3">${esc(n.summary||"暂无摘要")}</p><div class="flex flex-wrap gap-2 mb-3"><span class="pill">潜在影响：${esc(n.impact||"待分析")}</span>${assets.map(a=>`<span class="pill">${esc(a)}</span>`).join("")}</div>${research}<div class="text-sm"><a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener noreferrer">阅读原始报道 ↗</a></div></article>`;
 }).join("");
 root.querySelectorAll("[data-read-id]").forEach(b=>b.addEventListener("click",()=>{readIds.add(b.getAttribute("data-read-id"));try{localStorage.setItem(readKey,JSON.stringify([...readIds]))}catch(e){}render()}));
}
function setTab(name){const keys=["global","asia","china","earnings"];if(!keys.includes(name))return;active=name;document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));render()}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
document.getElementById("searchInput").addEventListener("input",render);document.getElementById("fontUp").addEventListener("click",()=>{fontSize=Math.min(22,fontSize+1);render()});document.getElementById("fontDown").addEventListener("click",()=>{fontSize=Math.max(12,fontSize-1);render()});
document.getElementById("clearRead").addEventListener("click",()=>{readIds.clear();try{localStorage.removeItem(readKey)}catch(e){}render()});
/* 手势阈值：只接受明显水平主导的滑动。 */
(()=>{let sx=0,sy=0,started=0,tracking=false;const MIN_X=70,DOMINANCE=2,MAX_MS=900;
 document.addEventListener("touchstart",e=>{if(e.touches.length!==1){tracking=false;return}const target=e.target;
 if(target.closest("input,textarea,select,button,a,summary,[data-no-swipe]")){tracking=false;return}
 sx=e.touches[0].clientX;sy=e.touches[0].clientY;started=Date.now();tracking=true},{passive:true});
 document.addEventListener("touchend",e=>{if(!tracking||!e.changedTouches.length){tracking=false;return}tracking=false;
 const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);
 if(Date.now()-started>MAX_MS||ax<MIN_X||ax<=ay*DOMINANCE)return;
 const tabs=["global","asia","china","earnings"],i=tabs.indexOf(active);if(dx<0&&i<tabs.length-1)setTab(tabs[i+1]);else if(dx>0&&i>0)setTab(tabs[i-1]);
 },{passive:true});})();
if(window.newsData?.updatedAt)document.getElementById("updateTime").textContent=window.newsData.updatedAt;
const st=window.newsData?.aiStats;document.getElementById("aiStatus").textContent=window.newsData?.aiEnabled?`🟢 Gemini 已配置 · ${window.newsData.aiModel||"模型未标注"}${st?` · 本次成功 ${st.successes}/${st.attempts}`:""}`:"🟠 未检测到 Gemini API 密钥";render();
</script></body></html>
