益：韩国半导体出口链、科技硬件板块；承压：韩国消费类股、内需敏感行业、韩元汇率。", "transmission": "供需：芯片外需支撑出口，内需消费疲软；利率：增长分化使加息路径不确定，压制利率敏感资产；汇率：政策不确定性增加韩元波动。", "timeHorizon": "短期（1-3个月）：数据公布后市场重新定价加息预期；中期（3-6个月）：关注芯片周期持续性与消费能否修复；长期（6个月以上）：取决于全球科技需求与韩国政策调整。", "scenarios": ["情景1：芯片出口持续强劲且消费企稳→加息预期升温，韩元走强；触发条件：下一季度消费数据回升。", "情景2：芯片繁荣见顶且消费继续收缩→增长放缓，央行转鸽，韩元承压；触发条件：半导体出口增速回落。", "情景3：政策维持观望→市场区间震荡；触发条件：央行声明中性且数据分化延续。"], "evidence": ["韩国GDP超预期但消费收缩的数据分化", "半导体出口对增长的贡献突出", "央行加息轨迹复杂化的政策信号"], "confidence": "中", "aiStatus": "DeepSeek AI", "_importance": 30, "provider": "DeepSeek", "id": "NO.10"}, {"title": "CNBC：日銀擬維持利率 但未來升息機率高", "originalTitle": "CNBC：日銀擬維持利率 但未來升息機率高", "summary": "（中央社東京27日綜合外電報導）美國財經媒體CNBC近期訪問的專家均預期日本銀行（BoJ，日本央行）這週會維持政策利率1.25%不動，並預測日銀將為12月或明年1月的升息鋪路，因為日本通膨與薪資持續上升。", "source": "中央社 CNA (台湾)", "url": "https://www.cna.com.tw/news/afe/202610270067.aspx", "publishedAt": "2026-10-27 11:28", "timestamp": 1793071701, "impact": "日银升息预期升温将推动日元走强与日债收益率上行，边际收紧全球流动性并压制日元套利交易。", "asset": ["日元（USD/JPY）", "日本10年期国债", "日本银行股ETF", "美国国债"], "analysis": "日银维持1.25%利率但释放未来升息信号，反映日本通胀与薪资持续上行的结构性变化。这标志着日本超宽松货币政策正常化进入后半程，对全球资本流动具有重要含义：日元套利交易的基础正在被逐步侵蚀，日本资金回流本土的预期升温，可能收紧全球风险资产的边际流动性。同时，日银谨慎推进升息节奏，避免重演2024年8月市场剧烈波动，显示政策层对金融稳定的考量。", "risk": "反证与风险：若日本通胀回落或全球金融市况恶化（如美股大幅调整），日银可能推迟升息，日元走弱、套利交易延续；此外，市场已部分定价升息预期，若日银措辞不及预期鹰派，日元可能出现反向波动；美国利率路径与美联储政策变化也会削弱日银升息的相对影响。", "coreLogic": "通胀与薪资持续上升→日银维持利率但为12月或明年1月升息铺路→市场提前定价日银加息预期→日元走强、日债收益率上行→日元套利交易吸引力下降→日本海外资金回流预期升温→全球风险资产边际流动性收紧。", "marketImpact": "潜在受益方向：日元、日本银行股（利差改善）、日本国债收益率相关产品；潜在承压方向：日元融资的套利交易头寸、依赖日本资金流入的海外资产（美债、美股高估值板块）、日本出口企业盈利（日元升值拖累）。", "transmission": "主要通过利率与汇率渠道传导：日银升息预期推高日债收益率与日元汇率，压缩日元套利交易的利差空间，触发套利头寸平仓与日本海外资金回流，进而影响全球债市与风险资产的资金供给；风险偏好渠道上，升息预期升温可能阶段性压制全球股市风险偏好。", "timeHorizon": "短期（1-3个月）：日银会议维持利率但措辞偏鹰，日元与日债收益率波动加大；中期（3-12个月）：12月或明年1月升息落地概率较高，套利交易平仓压力逐步显现；长期（1年以上）：日本货币政策正常化持续推进，全球资金配置格局或发生结构性调整。", "scenarios": ["鹰派情景：日银会议释放明确升息时间表，日元快速升值、日债收益率跳升，套利交易加速平仓；触发条件：通胀数据超预期或薪资谈判结果强劲。", "中性情景：日银维持利率并保留升息选项，市场温和定价，日元小幅走强；触发条件：通胀与薪资数据符合预期。", "鸽派情景：日银措辞偏谨慎、推迟升息指引，日元走弱、套利交易维持；触    <div class="font-bold text-cyan-300 mb-2">🧭 AI 深度宏观与时政分析 <span class="pill">${esc(n.confidence || "置信度未标注")}</span></div>
   <p class="leading-relaxed mb-3">${esc(n.analysis)}</p>
   <div class="research-grid">
    <div class="research-box"><h4>📌 核心逻辑</h4><p>${esc(n.coreLogic || "暂无。")}</p></div>
    <div class="research-box"><h4>📈 潜在市场影响</h4><p>${esc(n.marketImpact || n.impact || "暂无法判断。")}</p></div>
    <div class="research-box"><h4>🔗 传导机制</h4><p>${esc(n.transmission || "当前信息不足。")}</p></div>
    <div class="research-box"><h4>⏳ 影响周期</h4><p>${esc(n.timeHorizon || "暂不确定。")}</p></div>
    <div class="research-box"><h4>🧾 证据线索</h4>${list(n.evidence)}</div>
    <div class="research-box"><h4>⚖️ 情景分析</h4>${list(n.scenarios)}</div>
    <div class="research-box research-wide"><h4>⚠️ 风险与缺口</h4><p>${esc(n.risk || "尚未识别。")}</p></div>
   </div>
  </section>`;
}

function renderCard(n, i, listLen, isFeatured = false) {
 const rid = active + "_" + String(n.url || n.title || i);
 const read = readIds.has(rid);
 const assets = Array.isArray(n.asset) ? n.asset : [];
 const score = n._importance || 50;
 const level = score >= 65 ? "高" : score >= 45 ? "中" : "常规";

 if (isFeatured) {
  return `
   <article class="featured-card priority-${level === "高" ? "high" : "medium"}">
    <div class="flex flex-wrap gap-2 items-center mb-2">
     <span class="score-badge">🔥 TOP ${i + 1} · 权重 ${score}/100</span>
     <span class="pill">评级：${level}</span>
     <span class="pill">${esc(n.source || "国际权威媒体")}</span>
     <span class="pill">${esc(n.publishedAt || "")}</span>
    </div>
    <h3 class="adaptive-title font-bold text-amber-200 mb-2">${esc(n.title || "无标题")}</h3>
    <p class="featured-meta mt-2 text-slate-300 leading-relaxed">${esc(n.summary || "暂无摘要")}</p>
    
    <div class="flex flex-wrap gap-2 mt-3 mb-2">
     <span class="pill">潜在影响：${esc(n.impact || "待分析")}</span>
     ${assets.map(a => `<span class="pill">${esc(a)}</span>`).join("")}
    </div>

    ${renderAIResearch(n)}
    <div class="mt-3 text-sm flex justify-between items-center">
     ${articleLink(n)}
     <button class="btn text-xs" type="button" data-read-id="${esc(rid)}">${read ? "✓ 已读" : "标记已读"}</button>
    </div>
   </article>`;
 }

 return `
  <article class="card ${read ? "read" : ""} priority-${level === "高" ? "high" : "low"}">
   <div class="flex flex-wrap justify-between gap-2 items-center mb-3">
    <div class="flex flex-wrap gap-2 items-center">
     <span class="score-badge">权重 ${score}/100</span>
     <span class="pill">${esc(n.id || ("NO." + (listLen - i)))}</span>
     <span class="pill">${esc(n.source || "国际权威媒体")}</span>
     <span class="pill">${esc(n.publishedAt || "")}</span>
    </div>
    <button class="btn text-xs" type="button" data-read-id="${esc(rid)}">${read ? "✓ 已读" : "标记已读"}</button>
   </div>
   
   <h3 class="adaptive-title font-bold text-slate-100 mb-2" title="${esc(n.title || "")}">${esc(n.title || "无标题")}</h3>

   <p class="text-slate-300 leading-relaxed mb-3">${esc(n.summary || "暂无摘要")}</p>
   
   <div class="flex flex-wrap gap-2 mb-3">
    <span class="pill">潜在影响：${esc(n.impact || "待分析")}</span>
    ${assets.map(a => `<span class="pill">${esc(a)}</span>`).join("")}
   </div>

   ${renderAIResearch(n)}
   <div class="text-sm">${articleLink(n)}</div>
  </article>`;
}

function render() {
 const container = document.getElementById("newsList");
 const featuredWrap = document.getElementById("featuredWrap");
 const featuredList = document.getElementById("featuredList");
 if (!container) return;

 const all = getRankedData();
 const q = (document.getElementById("searchInput")?.value || "").trim().toLowerCase();
 const filtered = all.filter(n => [
  n.title, n.summary, n.source, (n.asset || []).join(" "),
  n.analysis, n.coreLogic, n.marketImpact, n.transmission, n.risk, n.originalTitle
 ].join(" ").toLowerCase().includes(q));

 document.getElementById("sectionTitle").textContent = labels[active] || "财经新闻";

 // 经典分层：只要有新闻，前 3 条独立渲染为醒目的 TOP 3，其余作为常规资讯流
 const useFeatured = filtered.length > 0 && !q;
 
 if (featuredWrap) {
  if (useFeatured) {
   featuredWrap.style.display = "block";
   const top3 = filtered.slice(0, 3);
   if (featuredList) featuredList.innerHTML = top3.map((n, i) => renderCard(n, i, top3.length, true)).join("");
  } else {
   featuredWrap.style.display = "none";
  }
 }

 const regularItems = useFeatured ? filtered.slice(3) : filtered;
 document.getElementById("count").textContent = `显示常规资讯 ${regularItems.length} 条`;

 if (!regularItems.length) {
  container.innerHTML = `<div class="card muted">当前栏目常规资讯已全部在上方 TOP 3 区域置顶展示。</div>`;
  return;
 }

 container.innerHTML = regularItems.map((n, i) => renderCard(n, i, regularItems.length, false)).join("");

 container.querySelectorAll("[data-read-id]").forEach(button => {
  button.addEventListener("click", () => {
   readIds.add(button.getAttribute("data-read-id"));
   try { localStorage.setItem(readKey, JSON.stringify([...readIds])); } catch(e) {}
   render();
  });
 });
}

function setTab(name) {
 if (!validTabs.includes(name)) return;
 active = name;
 try { localStorage.setItem(activeKey, name); } catch(e) {}
 document.querySelectorAll("[data-tab]").forEach(button => {
  button.classList.toggle("active", button.dataset.tab === name);
 });
 render();
 window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll("[data-tab]").forEach(button => {
 button.addEventListener("click", () => setTab(button.dataset.tab));
});

const searchInput = document.getElementById("searchInput");
if (searchInput) searchInput.addEventListener("input", render);

/* 手机手势逻辑：同时支持左右滑动切换栏目 与 顶部下拉刷新 */
(() => {
 let startX = 0, startY = 0, tracking = false;
 const MIN_X = 70, DOMINANCE = 2, MAX_MS = 900;
 const ptrSpinner = document.getElementById("ptr-spinner");

 document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { tracking = false; return; }
  if (e.target.closest("input, textarea, select, button, a, summary")) { tracking = false; return; }
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  tracking = true;
 }, { passive: true });

 document.addEventListener("touchmove", e => {
  if (!tracking || !e.touches.length) return;
  const dy = e.touches[0].clientY - startY;
  // 当页面处于最顶端且向下拖动时，显示刷新提示
  if (window.scrollY === 0 && dy > 40 && ptrSpinner) {
   ptrSpinner.style.top = "15px";
   ptrSpinner.style.opacity = "1";
  }
 }, { passive: true });

 document.addEventListener("touchend", e => {
  if (!tracking || !e.changedTouches.length) { tracking = false; return; }
  tracking = false;
  
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;
  const ax = Math.abs(dx), ay = Math.abs(dy);

  // 1. 下拉刷新逻辑：页面在最顶部且下滑距离超过 90px
  if (window.scrollY <= 10 && dy > 90 && ay > ax * 1.5) {
   if (ptrSpinner) {
    ptrSpinner.innerHTML = "⚡ 正在刷新页面...";
    ptrSpinner.style.top = "15px";
    ptrSpinner.style.opacity = "1";
   }
   setTimeout(() => {
    window.location.reload();
   }, 300);
   return;
  }

  // 隐藏刷新提示
  if (ptrSpinner) {
   ptrSpinner.style.top = "-50px";
   ptrSpinner.style.opacity = "0";
  }

  // 2. 左右滑动切换栏目逻辑
  if (ax >= MIN_X && ax > ay * DOMINANCE) {
   const i = validTabs.indexOf(active);
   if (dx < 0 && i < validTabs.length - 1) setTab(validTabs[i + 1]);
   else if (dx > 0 && i > 0) setTab(validTabs[i - 1]);
  }
 }, { passive: true });
})();

if (typeof window.newsData !== "undefined" && window.newsData?.updatedAt) {
 const ut = document.getElementById("updateTime");
 if (ut) ut.textContent = window.newsData.updatedAt;
}

const st = window.newsData?.aiStats;
const aiStatusEl = document.getElementById("aiStatus");
if (aiStatusEl) {
 aiStatusEl.textContent = window.newsData?.aiEnabled
  ? `🟢 DeepSeek 已配置 · ${window.newsData.aiModel || "deepseek-chat"}${st ? ` · 成功 ${st.successes}/${st.attempts}` : ""}`
  : "🟠 未检测到 DeepSeek API 密钥";
}

document.querySelectorAll("[data-tab]").forEach(button => {
 button.classList.toggle("active", button.dataset.tab === active);
});

document.addEventListener("DOMContentLoaded", render);
render();
</script>
</body>
</html>
