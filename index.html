  <!-- JS 交互逻辑 -->
  <script>
    let currentTab = 'global';
    let currentFontSizeLevel = 0;
    const fontSizes = ['text-base', 'text-lg', 'text-xl'];
    const summaryFontSizes = ['text-xs', 'text-sm', 'text-base'];

    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['global', 'asia', 'china', 'earnings'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "py-2.5 px-3.5 font-bold text-amber-500 border-b-2 border-amber-500 transition whitespace-nowrap focus:outline-none";
        } else {
          btn.className = "py-2.5 px-3.5 font-bold text-slate-400 border-b-2 border-transparent transition whitespace-nowrap focus:outline-none";
        }
      });
      renderNews();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function highlightKeywords(text) {
      if (!text) return '';
      const keywords = ['降息', '加息', '央行', 'A股', '美联储', '半导体', '台积电', '关税', '通胀', 'CPI', 'GDP', '人民币', '沪指', '港股', '财报', '营收', '净利润', '超预期'];
      let formatted = text;
      keywords.forEach(kw => {
        const regex = new RegExp(`(${kw})`, 'gi');
        formatted = formatted.replace(regex, '<span class="highlight-word">$1</span>');
      });
      return formatted;
    }

    function getReadStatus() {
      try {
        return JSON.parse(localStorage.getItem('read_news_items') || '{}');
      } catch(e) {
        return {};
      }
    }

    function markAsRead(url, titleKey) {
      const readMap = getReadStatus();
      readMap[url || titleKey] = true;
      try {
        localStorage.setItem('read_news_items', JSON.stringify(readMap));
      } catch(e) {}
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      const items = (typeof newsData !== 'undefined' && newsData[currentTab]) ? newsData[currentTab] : [];
      const readMap = getReadStatus();

      if (!items || items.length === 0) {
        const emptyTips = currentTab === 'earnings' 
          ? '当前非密集财报季，暂无重点公司财报发布，财报季期间将自动聚合美股/A股/港股巨头财报。' 
          : '暂无最新资讯，请稍后刷新或运行 GitHub Actions 更新';
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-sm px-4 leading-relaxed">
            ${emptyTips}
          </div>`;
        return;
      }

      const titleSizeClass = fontSizes[currentFontSizeLevel];
      const summarySizeClass = summaryFontSizes[currentFontSizeLevel];

      container.innerHTML = items.map((item, index) => {
        const uniqueKey = item.url || item.title;
        const isRead = readMap[uniqueKey] ? 'read-title' : '';

        const urlBtn = item.url ? `
          <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
             onclick="markAsRead('${item.url}', '${item.title}')"
             class="text-xs text-slate-400 hover:text-amber-400 flex items-center gap-0.5 transition">
            阅读原文/财报 ↗
          </a>` : '<span class="text-xs text-slate-600">暂无原文链接</span>';

        return `
          <div class="news-card rounded-lg p-4 shadow-sm" onclick="markAsRead('${item.url || ''}', '${item.title}')">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
              <div class="flex items-center space-x-2">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                  ${item.id || ('NO.' + (index + 1))}
                </span>
                <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300">
                  ${item.tag || '财经'}
                </span>
              </div>
              <span class="font-mono text-slate-400">${item.time || ''}</span>
            </div>

            <h3 class="${titleSizeClass} font-bold text-slate-100 leading-snug mb-2 adaptive-title ${isRead}" title="${item.title || ''}">
              ${highlightKeywords(item.title || '')}
            </h3>

            ${item.summary ? `
              <p class="${summarySizeClass} text-slate-300 leading-relaxed mb-3">
                ${highlightKeywords(item.summary)}
              </p>` : ''}

            <div class="bg-slate-900/60 rounded p-2.5 mb-3 text-xs space-y-1.5 border border-slate-800/80">
              <div class="flex items-start text-slate-300">
                <span class="text-red-400 font-bold shrink-0 mr-1.5">📌 AI深度解读:</span>
                <span>${item.impact || '需结合原文、官方数据及实时行情进一步判断影响。'}</span>
              </div>
              <div class="flex items-start text-slate-300">
                <span class="text-amber-400 font-bold shrink-0 mr-1.5">💡 关联资产标的:</span>
                <span>${item.asset || '相关资产标的'}</span>
              </div>
            </div>

            <div class="flex items-center justify-between pt-1 text-xs text-slate-500 border-t border-slate-800/40">
              <span>来源: ${item.source || '官方/权威媒体'}</span>
              ${urlBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    function adjustFontSize(direction) {
      currentFontSizeLevel += direction;
      if (currentFontSizeLevel > 2) currentFontSizeLevel = 2;
      if (currentFontSizeLevel < 0) currentFontSizeLevel = 0;
      renderNews();
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const btn = document.getElementById('backToTop');
      if (window.scrollY > 400) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    }, { passive: true });

    document.addEventListener('DOMContentLoaded', () => {
      renderNews();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });

    let startX = 0;
    let startY = 0;
    let startTime = 0;
    const tabsOrder = ['global', 'asia', 'china', 'earnings'];

    window.addEventListener('touchstart', (e) => {
      startX = e.touches[0].pageX;
      startY = e.touches[0].pageY;
      startTime = Date.now();
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const y = e.touches[0].pageY;
      if (window.scrollY === 0 && y - startY > 150) {
        location.reload(true);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].pageX;
      const endY = e.changedTouches[0].pageY;
      const diffX = endX - startX;
      const diffY = endY - startY;
      const duration = Date.now() - startTime;

      if (
        duration < 250 && 
        Math.abs(diffX) > 100 && 
        Math.abs(diffX) > Math.abs(diffY) * 3.5
      ) {
        const currentIndex = tabsOrder.indexOf(currentTab);
        if (diffX < 0 && currentIndex < tabsOrder.length - 1) {
          switchTab(tabsOrder[currentIndex + 1]);
        } else if (diffX > 0 && currentIndex > 0) {
          switchTab(tabsOrder[currentIndex - 1]);
        }
      }
    }, { passive: true });
  </script>
