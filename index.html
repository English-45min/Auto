 <script>
  let currentTab = 'china';

  function esc(str) {
   if (!str) return '';
   return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function list(arr) {
   if (!arr || !arr.length) return '<p class="text-gray-500 text-xs">暂无。</p>';
   return `<ul class="list-disc text-xs text-gray-300">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  }

  function switchTab(tab) {
   currentTab = tab;
   document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.className = "tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-gray-800 text-gray-300 hover:bg-gray-700 transition whitespace-nowrap";
   });
   const activeBtn = document.getElementById('tab-' + tab);
   if (activeBtn) {
    activeBtn.className = "tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-amber-500 text-gray-950 transition shadow-lg shadow-amber-500/10 whitespace-nowrap";
   }
   render();
  }

  function renderAIResearch(n) {
   if (!n.analysis) return '';
   return `
    <section class="ai mt-4 mb-2 p-4 rounded-xl bg-slate-900/90 border border-slate-800">
     <div class="font-bold text-cyan-400 mb-2 flex flex-wrap items-center justify-between gap-2 text-xs md:text-sm">
      <span class="flex items-center gap-2">🧭 DeepSeek 深度宏观与时政分析</span>
      <span class="pill">${esc(n.confidence || "高置信度")}</span>
     </div>
     <p class="text-gray-300 text-sm leading-relaxed mb-3 font-normal">${esc(n.analysis)}</p>
     
     <div class="research-grid mt-3">
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">📌 核心逻辑</h4>
       <p class="text-xs text-gray-300">${esc(n.coreLogic || "暂无。")}</p>
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">📈 潜在市场影响</h4>
       <p class="text-xs text-gray-300">${esc(n.marketImpact || n.impact || "暂无法判断。")}</p>
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">🔗 传导机制</h4>
       <p class="text-xs text-gray-300">${esc(n.transmission || "当前信息不足。")}</p>
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">⏳ 影响周期</h4>
       <p class="text-xs text-gray-300">${esc(n.timeHorizon || "暂不确定。")}</p>
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">🧾 证据线索</h4>
       ${list(n.evidence)}
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">⚖️ 情景分析</h4>
       ${list(n.scenarios)}
      </div>
      <div class="research-box research-wide">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">⚠️ 风险与缺口</h4>
       <p class="text-xs text-gray-300">${esc(n.risk || "尚未识别。")}</p>
      </div>
     </div>
    </section>`;
  }

  function renderCard(n, index) {
   const isTop3 = index < 3;
   const cardClass = isTop3 ? "top3-card glow-border rounded-xl p-5 mb-5 transition hover:border-amber-500/60" : "card-bg rounded-xl p-4 mb-3 transition hover:border-gray-700";
   
   return `
    <article class="${cardClass}">
     ${isTop3 ? `
      <div class="flex items-center justify-between gap-2 mb-3 pb-2 border-b border-amber-500/20">
       <div class="flex items-center gap-2">
        <span class="bg-amber-500 text-gray-950 font-black text-xs px-2.5 py-0.5 rounded shadow">🔥 TOP ${index + 1} 重磅</span>
        <span class="text-xs font-mono text-amber-400 font-bold">重要度得分: ${n._importance || 50}/100</span>
       </div>
       <span class="text-xs text-amber-300 bg-amber-950/80 px-2.5 py-0.5 rounded border border-amber-600/40 font-mono whitespace-nowrap">DeepSeek 深度研报</span>
      </div>` : `
      <div class="flex items-center justify-between mb-2">
       <span class="text-xs font-mono text-gray-400 font-bold">${n.id || 'NO.00'}</span>
       <span class="text-xs text-gray-400">${esc(n.source)} · ${esc(n.publishedAt)}</span>
      </div>`}

     ${isTop3 ? `<div class="text-xs text-gray-400 mb-1.5 flex items-center gap-2 font-mono"><span class="text-gray-300 font-bold">${esc(n.source)}</span> · <span>${esc(n.publishedAt)}</span></div>` : ''}

     <h2 class="${isTop3 ? 'text-lg md:text-xl font-bold text-white mb-2 leading-snug tracking-wide' : 'text-base font-bold text-white mb-1.5 leading-snug'}">
      ${esc(n.title)}
     </h2>

     <p class="text-sm text-gray-300 mb-3 leading-relaxed font-normal">
      ${esc(n.summary)}
     </p>

     ${renderAIResearch(n)}

     <div class="flex items-center justify-between pt-2.5 mt-2 border-t border-gray-800/80 text-xs">
      <a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer" class="text-amber-400 hover:text-amber-300 font-bold flex items-center gap-1 transition">
       查看原始报道 ↗
      </a>
      <span class="text-gray-500 font-mono">100% 开放媒体直达</span>
     </div>
    </article>
   `;
  }

  function render() {
   const data = window.newsData || {};
   const items = data[currentTab] || [];
   const area = document.getElementById('contentArea');
   
   if (!items.length) {
    area.innerHTML = `<div class="text-center py-16 text-gray-500 font-mono">当前栏目暂无资讯，正在等待后台更新...</div>`;
    return;
   }

   let htmlContent = '';
   if (items.length > 0) {
    htmlContent += `
     <div class="mb-8">
      <h2 class="text-amber-500 font-bold text-sm tracking-wider uppercase flex items-center gap-2 mb-4">
       <span>🔥 重点聚焦 · TOP 3 核心事件</span>
      </h2>
      <div>
       ${items.slice(0, 3).map((n, i) => renderCard(n, i)).join('')}
      </div>
     </div>
    `;
   }

   if (items.length > 3) {
    htmlContent += `
     <div class="mt-8">
      <h2 class="text-gray-400 font-bold text-sm tracking-wider uppercase flex items-center gap-2 mb-4">
       <span>📰 实时资讯流</span>
      </h2>
      <div>
       ${items.slice(3).map((n, i) => renderCard(n, i + 3)).join('')}
      </div>
     </div>
    `;
   }

   area.innerHTML = htmlContent;
   document.getElementById('updateTime').textContent = data.updatedAt || '刚刚';
   
   const aiStatusEl = document.getElementById("aiStatus");
   if (aiStatusEl) {
    aiStatusEl.textContent = "🟢 DeepSeek 已配置 · deepseek-chat";
    aiStatusEl.className = "text-emerald-400";
   }
  }

  window.addEventListener('DOMContentLoaded', render);
 </script>
