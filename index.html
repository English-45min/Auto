const words=['降息','加息','央行','A股','美联储','半导体','台积电','关税','通胀','CPI','GDP','人民币','沪指','港股','财报','营收','净利润','超预期'];
function data(){const d=window.newsData&&typeof window.newsData==='object'?window.newsData:{};Object.keys(labels).forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function highlight(v){let s=esc(v);words.forEach(w=>{const r=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');s=s.replace(new RegExp(r,'gi'),m=>'<span class="highlight-word">'+m+'</span>')});return s}
function safeUrl(v){try{const u=new URL(String(v||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(_){return ''}}
function readMap(){try{return JSON.parse(localStorage.getItem('read_news_items')||'{}')||{}}catch(_){return {}}}
function markRead(key,heading){const m=readMap();m[key]=true;try{localStorage.setItem('read_news_items',JSON.stringify(m))}catch(_){}if(heading)heading.classList.add('read-title')}
function updateStatus(){const d=data(),total=Object.keys(labels).reduce((n,k)=>n+d[k].length,0),time=d.updatedAt||d.updateTime||d.updated_at||'';document.getElementById('updateTime').textContent=time?'更新时间：'+String(time)+'（北京时间）':'更新时间：请查看 GitHub Actions 更新日志';document.getElementById('statusText').textContent=total?'已载入 '+total+' 条新闻；当前页面数据读取正常。':'当前页面没有载入新闻数据，请检查 update.py 及 GitHub Actions 更新日志。';document.getElementById('statusDot').className='mt-1 h-2 w-2 shrink-0 rounded-full '+(total?'bg-emerald-500':'bg-amber-500')}
function render(){
 const d=data(),q=document.getElementById('searchInput').value.trim().toLocaleLowerCase(),container=document.getElementById('news-container'),read=readMap();
 const all=d[currentTab].slice(0,limits[currentTab]||20),items=all.filter(i=>(String(i.title||'')+' '+String(i.summary||'')+' '+String(i.tag||'')+' '+String(i.source||'')).toLocaleLowerCase().includes(q));
 document.getElementById('sectionLabel').textContent=labels[currentTab];document.getElementById('newsCount').textContent=items.length+' 条新闻';container.replaceChildren();
 if(!items.length){const box=document.createElement('div');box.className='rounded-xl border border-slate-800 bg-[#131b2e]/50 p-8 sm:p-10 text-center text-sm text-slate-400 leading-relaxed';const h=document.createElement('p');h.className='font-bold text-slate-200 mb-2';h.textContent=q?'没有找到匹配的新闻':(currentTab==='earnings'?'暂无财报数据':labels[currentTab]+'暂时没有可显示的新闻');const p=document.createElement('p');p.textContent=q?'请尝试其他关键词。':'请检查后台更新任务是否成功，并确认 update.py 已写入本页面的数据区。这里不会用虚构内容补足数量。';box.append(h,p);container.appendChild(box);return}
 items.forEach((item,index)=>{
  const title=String(item.title||'（无标题）'),url=safeUrl(item.url||item.link||''),key=String(item.url||item.link||title),card=document.createElement('article');
  card.className='news-card rounded-xl p-4 sm:p-5 shadow-sm';card.dataset.newsKey=key;
  const top=document.createElement('div');top.className='flex items-center justify-between gap-3 text-xs text-slate-400 mb-2';
  const left=document.createElement('div');left.className='flex items-center gap-2 min-w-0';
  const rank=document.createElement('span');rank.className='shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20';rank.textContent=item.id!==undefined&&item.id!==null&&item.id!==''?String(item.id):'NO.'+(index+1);
  const tag=document.createElement('span');tag.className='truncate px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300';tag.textContent=item.tag||labels[currentTab];left.append(rank,tag);
  const tm=document.createElement('time');tm.className='font-mono shrink-0';tm.textContent=item.time||'';top.append(left,tm);
  const h=document.createElement('h2');h.className=titleSizes[fontLevel]+' news-title font-bold text-slate-100 leading-snug mb-2 adaptive-title'+(read[key]?' read-title':'');h.innerHTML=highlight(title);h.title=title;
  const summary=document.createElement('p');summary.className=summarySizes[fontLevel]+' text-slate-300 leading-relaxed mb-3';summary.innerHTML=highlight(item.summary||'暂无摘要，请阅读原文了解详情。');
  const box=document.createElement('div');box.className='bg-slate-900/60 rounded-lg p-3 mb-3 text-xs space-y-2 border border-slate-800/80';
  const impact=document.createElement('p');impact.className='flex items-start text-slate-300 gap-1.5';const il=document.createElement('strong');il.className='text-red-400 shrink-0';il.textContent='📌 市场影响：';const iv=document.createElement('span');iv.textContent=item.impact||'需结合新闻原文、官方数据及实时行情进一步判断。';impact.append(il,iv);
  const asset=document.createElement('p');asset.className='flex items-start text-slate-300 gap-1.5';const al=document.createElement('strong');al.className='text-amber-400 shrink-0';al.textContent='💡 关联资产：';const av=document.createElement('span');av.textContent=item.asset||'请根据新闻内容核对相关资产。';asset.append(al,av);box.append(impact,asset);
  const bottom=document.createElement('div');bottom.className='flex items-center justify-between gap-3 pt-2 text-xs text-slate-500 border-t border-slate-800/60';const source=document.createElement('span');source.className='min-w-0 truncate';source.textContent='来源：'+(item.source||'公开新闻源');bottom.appendChild(source);
  if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.className='shrink-0 text-slate-400 hover:text-amber-400';a.textContent=currentTab==='earnings'?'查看财报 ↗':'阅读原文 ↗';a.addEventListener('click',()=>markRead(key,h));bottom.appendChild(a)}else{const no=document.createElement('span');no.className='shrink-0 text-slate-600';no.textContent='暂无原文链接';bottom.appendChild(no)}
  card.append(top,h,summary,box,bottom);card.addEventListener('click',e=>{if(e.target.closest('a,button'))return;markRead(key,h)});container.appendChild(card)
 })
}
window.switchTab=function(tab){if(!Object.prototype.hasOwnProperty.call(labels,tab))return;currentTab=tab;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});render();window.scrollTo({top:0,behavior:'smooth'})};
window.adjustFontSize=function(dir){fontLevel=Math.max(0,Math.min(2,fontLevel+dir));render()};
window.scrollToTop=function(){window.scrollTo({top:0,behavior:'smooth'})};
window.addEventListener('scroll',()=>document.getElementById('backToTop').classList.toggle('hidden',window.scrollY<=400),{passive:true});
document.getElementById('searchInput').addEventListener('input',render);
const order=['global','asia','china','earnings'];let sx=0,sy=0,st=0,allowed=true;
document.addEventListener('touchstart',e=>{allowed=!e.target.closest('a,button,input,textarea,select');if(!e.touches[0])return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
document.addEventListener('touchend',e=>{if(!allowed||!e.changedTouches[0])return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Date.now()-st>600||Math.abs(dx)<75||Math.abs(dx)<Math.abs(dy)*1.5)return;const i=order.indexOf(currentTab);if(dx<0&&i<order.length-1)window.switchTab(order[i+1]);else if(dx>0&&i>0)window.switchTab(order[i-1])},{passive:true});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{updateStatus();render()});else{updateStatus();render()}
})();
</script>
</body>
</html>
