<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<title>财经与时政焦点看板</title>
<style>
:root{
  --bg:#0b0f19;--panel:#121a29;--panel2:#172235;--border:#29364b;
  --text:#e5edf7;--muted:#94a3b8;--orange:#f59e0b;
  --green:#34d399;--red:#fb7185;--blue:#7dd3fc
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
line-height:1.65}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.container{width:min(1100px,100%);margin:auto;padding:0 15px}
header{position:sticky;top:0;z-index:10;background:#0b0f19f5;
border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0}
.brand{font-size:20px;font-weight:800}
.brand span{color:var(--orange)}
.muted,.meta{color:var(--muted)}
.meta{font-size:12px}
.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:transparent;color:var(--muted);
border:1px solid transparent;border-radius:8px;padding:8px 13px;font-size:13px}
.tab.active{color:var(--orange);border-color:#f59e0b66;background:#f59e0b12}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px}
main{padding-top:20px;padding-bottom:35px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.metric{padding:13px;min-width:0}
.metric-label{font-size:11px;color:var(--muted)}
.metric-value{font-size:24px;font-weight:800;margin-top:3px}
.section{margin-bottom:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-title{font-size:17px;font-weight:800;margin:0}
.featured{padding:15px;background:linear-gradient(135deg,#192236,#121a29)}
.featured-item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.featured-item:first-child{border-top:0}
.feature-number{font-size:22px;font-weight:800;color:var(--orange);min-width:30px}
.feature-title{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700}
.high{background:#fb71851b;color:#fb8999}
.medium{background:#f59e0b1c;color:#fbbf24}
.low{background:#7dd3fc18;color:#7dd3fc}
.ai-badge{background:#34d39919;color:var(--green)}
.controls{padding:14px;margin-bottom:18px}
.control-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
input,select{width:100%;min-width:0;padding:10px;background:#0b1220;
border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px}
.btn{border:1px solid var(--border);background:#172235;color:var(--text);
padding:7px 10px;border-radius:7px;font-size:12px}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.news-card{padding:15px;margin-bottom:11px;overflow:hidden}
.news-card.read{opacity:.68}
.news-title{font-size:16px;font-weight:750;line-height:1.6;margin:7px 0;overflow-wrap:anywhere}
.summary{font-size:13px;color:#bac7d8;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.news-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.ai-box{margin-top:13px;padding:12px;border:1px solid var(--border);
background:#0b1220;border-radius:9px}
.ai-heading{color:var(--green);font-size:13px;font-weight:800;margin-bottom:8px}
.ai-row{display:grid;grid-template-columns:85px minmax(0,1fr);gap:9px;
padding:7px 0;border-top:1px solid #29364b88;font-size:12px}
.ai-row:first-of-type{border-top:0}
.ai-key{color:var(--muted)}
.ai-value{white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:9px;margin-top:13px}
.notice{padding:12px;border:1px solid #29364b;border-radius:8px;
color:var(--muted);font-size:12px}
.empty{text-align:center;padding:30px 14px;color:var(--muted);font-size:13px}
footer{border-top:1px solid var(--border);padding:20px 0 30px;color:var(--muted);font-size:11px}
@media(max-width:650px){
 .container{padding-left:11px;padding-right:11px}
 .brand{font-size:17px}
 .metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .metric-value{font-size:22px}
 .control-grid{grid-template-columns:1fr}
 .news-card{padding:12px}
 .news-title{font-size:15px}
 .ai-row{grid-template-columns:73px minmax(0,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-row">
      <div>
        <div class="eyebrow">MARKET INTELLIGENCE</div>
        <div class="brand">财经<span>焦点</span>看板</div>
      </div>
      <div style="text-align:right">
        <div class="meta">● 新闻更新系统</div>
        <div id="updateTime" class="meta">等待数据更新</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-channel="global">国际财经</button>
      <button class="tab" data-channel="asia">亚太财经</button>
      <button class="tab" data-channel="china">国内财经</button>
      <button class="tab" data-channel="earnings">公司财报</button>
    </nav>
  </div>
</header>

<main class="container">
  <section class="metrics">
    <div class="panel metric">
      <div class="metric-label">当前栏目新闻</div>
      <div class="metric-value" id="totalCount">0</div>
      <div class="meta">当前栏目收录量</div>
    </div>
    <div class="panel metric">
      <div class="metric-label">重点新闻</div>
      <div class="metric-value" id="highCount">0</div>
      <div class="meta">重要性评分 ≥ 7</div>
    </div>
    <div class="panel metric">
      <div class="metric-label">AI 已分析</div>
      <div class="metric-value" id="aiCount">0</div>
      <div class="meta">当前栏目分析数量</div>
    </div>
    <div class="panel metric">
      <div class="metric-label">已读新闻</div>
      <div class="metric-value" id="readCount">0</div>
      <div class="meta">保存在当前浏览器</div>
    </div>
  </section>

  <section class="section panel featured">
    <div class="section-head">
      <div>
        <div class="eyebrow">TOP STORIES</div>
        <h2 class="section-title">重点新闻</h2>
      </div>
      <span class="badge medium">按重要性排序</span>
    </div>
    <div id="featuredList"><div class="empty">正在读取数据……</div></div>
  </section>

  <section class="panel controls">
    <div class="section-head">
      <h2 class="section-title">新闻检索</h2>
      <button class="btn" id="clearFilters">清除条件</button>
    </div>
    <div class="control-grid">
      <div>
        <label for="searchInput">关键词</label>
        <input id="searchInput" type="search" placeholder="搜索标题、摘要、媒体或 AI 分析">
      </div>
      <div>
        <label for="importanceFilter">重要性</label>
        <select id="importanceFilter">
          <option value="all">全部新闻</option>
          <option value="high">高重要性（7—10）</option>
          <option value="medium">中重要性（4—6）</option>
          <option value="low">一般新闻（1—3）</option>
        </select>
      </div>
      <div>
        <label for="readFilter">阅读状态</label>
        <select id="readFilter">
          <option value="all">全部状态</option>
          <option value="unread">只看未读</option>
          <option value="read">只看已读</option>
        </select>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <div>
        <div class="eyebrow" id="channelEyebrow">GLOBAL MARKETS</div>
        <h2 class="section-title" id="channelTitle">国际财经新闻</h2>
      </div>
      <span class="meta" id="resultCount">0 条新闻</span>
    </div>
    <div id="dataNotice" class="notice" style="display:none;margin-bottom:12px"></div>
    <div id="newsList"><div class="panel empty">正在读取新闻数据……</div></div>
  </section>
</main>

<footer>
  <div class="container">
    <strong style="color:#d5dfec">财经焦点看板 · 市场信息研究工具</strong>
    <p>新闻来自公开信息源。重要性评分和 AI 分析仅供研究参考，可能存在遗漏或错误。</p>
    <p>本页面不构成投资建议。投资前请独立核实信息、数据和风险。</p>
  </div>
</footer>

<!-- NEWS_DATA_START -->
<script>
window.newsData = {
  "updatedAt": "",
  "aiEnabled": false,
  "aiModel": "",
  "aiStats": {
    "attempts": 0,
    "successes": 0,
    "failures": 0,
    "maxPerRun": 8
  },
  "global": [],
  "asia": [],
  "china": [],
  "earnings": []
};
</script>
<!-- NEWS_DATA_END -->

<script>
(function(){
"use strict";

const CHANNELS={
  global:{title:"国际财经新闻",eyebrow:"GLOBAL MARKETS"},
  asia:{title:"亚太财经新闻",eyebrow:"ASIA PACIFIC"},
  china:{title:"国内财经新闻",eyebrow:"CHINA MARKETS"},
  earnings:{title:"公司财报",eyebrow:"CORPORATE EARNINGS"}
};

const ACTIVE_KEY="financeDashboardActiveTab_v3";
const READ_KEY="financeDashboardRead_v3";

let data=window.newsData||{};
let active="global";
let readSet=new Set();

const $=id=>document.getElementById(id);
const str=value=>value==null?"":String(value);

function esc(value){
  return str(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[ch]);
}

function loadRead(){
  try{
    const parsed=JSON.parse(localStorage.getItem(READ_KEY)||"[]");
    readSet=new Set(Array.isArray(parsed)?parsed:[]);
  }catch(e){readSet=new Set();}
}

function saveRead(){
  try{
    localStorage.setItem(READ_KEY,JSON.stringify([...readSet]));
  }catch(e){}
}

function keyOf(item){
  return str(item.url||item.id||item.originalTitle||item.title);
}

function scoreOf(item){
  const n=Number(item.importance!=null?item.importance:item.score);
  return Number.isFinite(n)?Math.max(1,Math.min(10,n)):1;
}

function scoreClass(score){
  return score>=7?"high":score>=4?"medium":"low";
}

function scoreLabel(score){
  return score>=7?"高重要性":score>=4?"中重要性":"一般新闻";
}

function sortedItems(){
  const items=Array.isArray(data[active])?data[active].slice():[];
  return items.sort((a,b)=>{
    const diff=scoreOf(b)-scoreOf(a);
    if(diff)return diff;
    return Number(b.timestamp||0)-Number(a.timestamp||0);
  });
}

function hasAI(item){
  return ["analysis","coreLogic","marketImpact","transmission",
    "impact","asset","timeHorizon","scenarios","evidence",
    "risk","confidence"].some(k=>str(item[k]).trim()!=="");
}

function safeLink(item){
  const url=str(item.url).trim();
  if(!url)return '<span class="meta">暂无可用原文链接</span>';

  try{
    const parsed=new URL(url);
    if(!["https:","http:"].includes(parsed.protocol)){
      return '<span class="meta">链接格式无效</span>';
    }
    const aggregated=parsed.hostname.toLowerCase()==="news.google.com";
    const label=aggregated?"通过 Google News 查看 ↗":"查看原始报道 ↗";
    return '<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
  }catch(e){
    return '<span class="meta">链接格式无效</span>';
  }
}

function aiHTML(item){
  const fields=[
    ["新闻解读","analysis"],
    ["核心逻辑","coreLogic"],
    ["市场影响","marketImpact"],
    ["传导路径","transmission"],
    ["影响判断","impact"],
    ["相关资产","asset"],
    ["时间周期","timeHorizon"],
    ["情景分析","scenarios"],
    ["事实依据","evidence"],
    ["风险提示","risk"],
    ["分析信心","confidence"]
  ];

  const rows=fields.filter(([label,key])=>str(item[key]).trim()!=="")
    .map(([label,key])=>
      '<div class="ai-row"><div class="ai-key">'+esc(label)+
      '</div><div class="ai-value">'+esc(item[key])+'</div></div>'
    ).join("");

  if(!rows){
    return '<div class="notice" style="margin-top:12px">暂无 AI 分析。请检查 API 密钥、调用额度或运行日志。</div>';
  }

  return '<div class="ai-box"><div class="ai-heading">✦ AI 深度分析</div>'+rows+'</div>';
}

function getFiltered(){
  const query=$("searchInput").value.trim().toLowerCase();
  const level=$("importanceFilter").value;
  const readMode=$("readFilter").value;

  return sortedItems().filter(item=>{
    const score=scoreOf(item);
    const isRead=readSet.has(keyOf(item));

    if(level==="high"&&score<7)return false;
    if(level==="medium"&&(score<4||score>=7))return false;
    if(level==="low"&&score>=4)return false;
    if(readMode==="read"&&!isRead)return false;
    if(readMode==="unread"&&isRead)return false;

    if(query){
      const haystack=[
        item.title,item.originalTitle,item.summary,item.source,
        item.analysis,item.coreLogic,item.marketImpact
      ].join(" ").toLowerCase();
      if(!haystack.includes(query))return false;
    }
    return true;
  });
}

function renderFeatured(){
  const items=sortedItems().slice(0,3);
  const box=$("featuredList");

  if(!items.length){
    box.innerHTML='<div class="empty">当前栏目暂无重点新闻。</div>';
    return;
  }

  box.innerHTML=items.map((item,i)=>{
    const score=scoreOf(item);
    return '<div class="featured-item">'+
      '<div class="feature-number">0'+(i+1)+'</div>'+
      '<div style="min-width:0;flex:1">'+
      '<div class="news-meta"><span class="badge '+scoreClass(score)+'">'+
      scoreLabel(score)+' · '+score+'/10</span>'+
      '<span>'+esc(item.source||"未知来源")+'</span></div>'+
      '<div class="feature-title" style="margin-top:6px">'+
      esc(item.title||item.originalTitle||"无标题")+'</div>'+
      '<div class="meta" style="margin-top:5px">'+safeLink(item)+'</div>'+
      '</div></div>';
  }).join("");
}

function renderNews(){
  const items=getFiltered();
  const all=sortedItems();
  const box=$("newsList");

  $("totalCount").textContent=all.length;
  $("highCount").textContent=all.filter(x=>scoreOf(x)>=7).length;
  $("aiCount").textContent=all.filter(hasAI).length;
  $("readCount").textContent=all.filter(x=>readSet.has(keyOf(x))).length;
  $("resultCount").textContent=items.length+" 条新闻";

  if(!items.length){
    if(!all.length){
      box.innerHTML='<div class="panel empty">'+
        '<div style="font-weight:800;color:#d7e2f0;margin-bottom:8px">当前栏目暂无新闻数据</div>'+
        '<div>请检查 GitHub Actions 是否更新成功，以及 RSS 来源是否正常。</div></div>';
    }else{
      box.innerHTML='<div class="panel empty">没有符合筛选条件的新闻，请调整搜索或筛选条件。</div>';
    }
    return;
  }

  box.innerHTML=items.map(item=>{
    const score=scoreOf(item);
    const isRead=readSet.has(keyOf(item));
    const title=item.title||item.originalTitle||"无标题";

    return '<article class="panel news-card '+(isRead?"read":"")+'">'+
      '<div class="news-meta">'+
      '<span class="badge '+scoreClass(score)+'">'+scoreLabel(score)+' · '+score+'/10</span>'+
      (hasAI(item)?'<span class="badge ai-badge">AI 已分析</span>':"")+
      '<span>'+esc(item.source||"未知来源")+'</span>'+
      '<span>'+esc(item.publishedAt||"发布时间未知")+'</span>'+
      '</div>'+
      '<h3 class="news-title">'+esc(title)+'</h3>'+
      (item.originalTitle&&item.originalTitle!==title?
        '<div class="meta">原文标题：'+esc(item.originalTitle)+'</div>':"")+
      (item.summary?'<div class="summary">'+esc(item.summary)+'</div>':"")+
      aiHTML(item)+
      '<div class="actions"><div>'+safeLink(item)+'</div>'+
      '<button class="btn read-toggle" data-key="'+esc(keyOf(item))+'">'+
      (isRead?"标记为未读":"标记为已读")+'</button></div>'+
      '</article>';
  }).join("");

  box.querySelectorAll(".read-toggle").forEach(button=>{
    button.addEventListener("click",()=>{
      const key=button.getAttribute("data-key");
      if(readSet.has(key))readSet.delete(key);
      else readSet.add(key);
      saveRead();
      renderNews();
    });
  });
}

function render(){
  const config=CHANNELS[active];
  $("channelTitle").textContent=config.title;
  $("channelEyebrow").textContent=config.eyebrow;

  document.querySelectorAll(".tab").forEach(button=>{
    button.classList.toggle("active",button.dataset.channel===active);
  });

  renderFeatured();
  renderNews();

  const notice=$("dataNotice");
  const stats=data.aiStats||{};

  if(data.aiEnabled===false){
    notice.style.display="block";
    notice.textContent="当前数据标记显示 AI 未启用。新闻采集与 AI 分析是两项独立功能，请检查 GEMINI_API_KEY 是否配置。";
  }else{
    notice.style.display="none";
  }

  const updated=str(data.updatedAt).trim();
  $("updateTime").textContent=updated?"更新于 "+updated:"尚无更新时间";
}

document.querySelectorAll(".tab").forEach(button=>{
  button.addEventListener("click",()=>{
    active=button.dataset.channel;
    try{localStorage.setItem(ACTIVE_KEY,active);}catch(e){}
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  });
});

["searchInput","importanceFilter","readFilter"].forEach(id=>{
  $(id).addEventListener(id==="searchInput"?"input":"change",renderNews);
});

$("clearFilters").addEventListener("click",()=>{
  $("searchInput").value="";
  $("importanceFilter").value="all";
  $("readFilter").value="all";
  renderNews();
});

loadRead();

try{
  const saved=localStorage.getItem(ACTIVE_KEY);
  if(saved&&CHANNELS[saved])active=saved;
}catch(e){}

render();
})();
</script>
</body>
</html>
