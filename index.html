<!DOCTYPE html>
<html lang="zh-CN" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <title>财经与时政焦点看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f17; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .news-card { background: #131b2e; border: 1px solid #1e293b; transition: all 0.2s ease-in-out; }
    .news-card:active { background: #1a243d; }
    .read-title { color: #64748b !important; }
    .highlight-word { color: #f59e0b; background-color: rgba(245, 158, 11, 0.1); padding: 0 2px; border-radius: 2px; }
    
    /* 标题自适应：手机端默认最多显示 2 行，超出显示省略号 */
    .adaptive-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* iPad / 平板 / 宽屏电脑端（>= 640px）：解除多行限制，完美强制单行显示 */
    @media (min-width: 640px) {
      .adaptive-title {
        display: block;
        -webkit-line-clamp: unset;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>
<body class="min-h-screen pb-12" id="body-root">

  <!-- 头部 Header -->
  <header class="sticky top-0 z-50 bg-[#0b0f17]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="space-y-1">
        <div class="flex items-center space-x-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <h1 class="text-base font-bold tracking-wide text-slate-100">TERMINAL // 财经与时政焦点</h1>
        </div>
        <div id="updateTime" class="text-slate-400 font-medium text-xs">
          更新时间: 加载中...
        </div>
      </div>
      <!-- 字体大小调节按钮 -->
      <div class="flex items-center space-x-1.5 bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs">
        <button onclick="adjustFontSize(-1)" class="px-2 py-1 text-slate-400 hover:text-white transition font-bold" title="缩小字体">A-</button>
        <span class="text-slate-600">|</span>
        <button onclick="adjustFontSize(1)" class="px-2 py-1 text-slate-400 hover:text-white transition font-bold" title="放大字体">A+</button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-4">

    <!-- 频道切换 Tabs（共 4 个板块） -->
    <div class="flex overflow-x-auto border-b border-slate-800 mb-4 text-sm scrollbar-none">
      <button id="tab-global" onclick="switchTab('global')" class="py-2.5 px-3.5 font-bold text-amber-500 border-b-2 border-amber-500 transition whitespace-nowrap focus:outline-none">
        国际财经 Top 20
      </button>
      <button id="tab-asia" onclick="switchTab('asia')" class="py-2.5 px-3.5 font-bold text-slate-400 border-b-2 border-transparent transition whitespace-nowrap focus:outline-none">
        亚太市场 Top 10
      </button>
      <button id="tab-china" onclick="switchTab('china')" class="py-2.5 px-3.5 font-bold text-slate-400 border-b-2 border-transparent transition whitespace-nowrap focus:outline-none">
        国内核心 Top 10
      </button>
      <button id="tab-earnings" onclick="switchTab('earnings')" class="py-2.5 px-3.5 font-bold text-slate-400 border-b-2 border-transparent transition whitespace-nowrap focus:outline-none">
        📊 核心财报季
      </button>
    </div>

    <!-- 新闻列表容器 -->
    <div id="news-container" class="space-y-3.5">
      <!-- 动态插入内容 -->
    </div>

    <!-- 免责声明底部 -->
    <footer class="mt-10 pt-6 border-t border-slate-800/60 text-center text-xs text-slate-500 leading-relaxed">
      <p>免责声明：本看板用于财经信息整理与阅读，不代表任何媒体官方产品，不构成投资建议。</p>
      <p class="mt-1">请以新闻原文、监管机构公告和实时市场数据为准。</p>
      <p class="mt-2 text-slate-600">© 2026 财经焦点看板</p>
    </footer>

  </main>

  <!-- 返回顶部悬浮按钮 -->
  <button id="backToTop" onclick="scrollToTop()" class="fixed right-5 bottom-6 z-50 hidden bg-slate-800/90 text-amber-400 border border-slate-700 hover:bg-slate-700 p-3 rounded-full shadow-lg transition backdrop-blur-sm" title="返回顶部">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
    </svg>
  </button>

  <!-- 静态数据嵌入区 (由 Python update.py 自动写入) -->
  <!-- NEWS_DATA_START -->
  <script>
    const newsData = { "global": [], "asia": [], "china": [], "earnings": [] };
  </script>
  <!-- NEWS_DATA_END -->

  <!-- JS 交互逻辑 -->
  <script>
    let currentTab = 'global';
    let currentFontSizeLevel = 0;
    const fontSizes = ['text-base', 'text-lg', 'text-xl'];
    const summaryFontSizes = ['text-xs', 'text-sm', 'text-base'];

    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['global', 'asia', 'china', 'earnings'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "py-2.5 px-3.5 font-bold text-amber-500 border-b-2 border-amber-500 transition whitespace-nowrap focus:outline-none";
        } else {
          btn.className = "py-2.5 px-3.5 font-bold text-slate-400 border-b-2 border-transparent transition whitespace-nowrap focus:outline-none";
        }
      });
      renderNews();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function highlightKeywords(text) {
      if (!text) return '';
      const keywords = ['降息', '加息', '央行', 'A股', '美联储', '半导体', '台积电', '关税', '通胀', 'CPI', 'GDP', '人民币', '沪指', '港股', '财报', '营收', '净利润', '超预期'];
      let formatted = text;
      keywords.forEach(kw => {
        const regex = new RegExp(`(${kw})`, 'gi');
        formatted = formatted.replace(regex, '<span class="highlight-word">$1</span>');
      });
      return formatted;
    }

    function getReadStatus() {
      try {
        return JSON.parse(localStorage.getItem('read_news_items') || '{}');
      } catch(e) {
        return {};
      }
    }

    function markAsRead(url, titleKey) {
      const readMap = getReadStatus();
      readMap[url || titleKey] = true;
      try {
        localStorage.setItem('read_news_items', JSON.stringify(readMap));
      } catch(e) {}
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      const items = (typeof newsData !== 'undefined' && newsData[currentTab]) ? newsData[currentTab] : [];
      const readMap = getReadStatus();

      if (!items || items.length === 0) {
        const emptyTips = currentTab === 'earnings' 
          ? '当前非密集财报季，暂无重点公司财报发布，财报季期间将自动聚合美股/A股/港股巨头财报。' 
          : '暂无最新资讯，请稍后刷新或运行 GitHub Actions 更新';
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-sm px-4 leading-relaxed">
            ${emptyTips}
          </div>`;
        return;
      }

      const titleSizeClass = fontSizes[currentFontSizeLevel];
      const summarySizeClass = summaryFontSizes[currentFontSizeLevel];

      container.innerHTML = items.map((item, index) => {
        const uniqueKey = item.url || item.title;
        const isRead = readMap[uniqueKey] ? 'read-title' : '';

        const urlBtn = item.url ? `
          <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
             onclick="markAsRead('${item.url}', '${item.title}')"
             class="text-xs text-slate-400 hover:text-amber-400 flex items-center gap-0.5 transition">
            阅读原文/财报 ↗
          </a>` : '<span class="text-xs text-slate-600">暂无原文链接</span>';

        return `
          <div class="news-card rounded-lg p-4 shadow-sm" onclick="markAsRead('${item.url || ''}', '${item.title}')">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
              <div class="flex items-center space-x-2">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                  ${item.id || ('NO.' + (index + 1))}
                </span>
                <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300">
                  ${item.tag || '财经'}
                </span>
              </div>
              <span class="font-mono text-slate-400">${item.time || ''}</span>
            </div>

            <!-- 响应式自适应标题：自带 adaptive-title 类名 -->
            <h3 class="${titleSizeClass} font-bold text-slate-100 leading-snug mb-2 adaptive-title ${isRead}" title="${item.title || ''}">
              ${highlightKeywords(item.title || '')}
            </h3>

            ${item.summary ? `
              <p class="${summarySizeClass} text-slate-300 leading-relaxed mb-3">
                ${highlightKeywords(item.summary)}
              </p>` : ''}

            <div class="bg-slate-900/60 rounded p-2.5 mb-3 text-xs space-y-1.5 border border-slate-800/80">
              <div class="flex items-start text-slate-300">
                <span class="text-red-400 font-bold shrink-0 mr-1.5">📌 AI深度解读:</span>
                <span>${item.impact || '需结合原文、官方数据及实时行情进一步判断影响。'}</span>
              </div>
              <div class="flex items-start text-slate-300">
                <span class="text-amber-400 font-bold shrink-0 mr-1.5">💡 关联资产标的:</span>
                <span>${item.asset || '相关资产标的'}</span>
              </div>
            </div>

            <div class="flex items-center justify-between pt-1 text-xs text-slate-500 border-t border-slate-800/40">
              <span>来源: ${item.source || '官方/权威媒体'}</span>
              ${urlBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    function adjustFontSize(direction) {
      currentFontSizeLevel += direction;
      if (currentFontSizeLevel > 2) currentFontSizeLevel = 2;
      if (currentFontSizeLevel < 0) currentFontSizeLevel = 0;
      renderNews();
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const btn = document.getElementById('backToTop');
      if (window.scrollY > 400) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    }, { passive: true });

    document.addEventListener('DOMContentLoaded', () => {
      renderNews();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });

    let startX = 0;
    let startY = 0;
    let startTime = 0;
    const tabsOrder = ['global', 'asia', 'china', 'earnings'];

    window.addEventListener('touchstart', (e) => {
      startX = e.touches[0].pageX;
      startY = e.touches[0].pageY;
      startTime = Date.now();
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const y = e.touches[0].pageY;
      if (window.scrollY === 0 && y - startY > 150) {
        location.reload(true);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].pageX;
      const endY = e.changedTouches[0].pageY;
      const diffX = endX - startX;
      const diffY = endY - startY;
      const duration = Date.now() - startTime;

      if (
        duration < 250 && 
        Math.abs(diffX) > 100 && 
        Math.abs(diffX) > Math.abs(diffY) * 3.5
      ) {
        const currentIndex = tabsOrder.indexOf(currentTab);
        if (diffX < 0 && currentIndex < tabsOrder.length - 1) {
          switchTab(tabsOrder[currentIndex + 1]);
        } else if (diffX > 0 && currentIndex > 0) {
          switchTab(tabsOrder[currentIndex - 1]);
        }
      }
    }, { passive: true });
  </script>
</body>
</html>
