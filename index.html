<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloomberg 财经焦点看板</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:dark}body{background:#0b0f19;color:#e2e8f0;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.tab{padding:.65rem .8rem;border-bottom:2px solid transparent;color:#94a3b8;font-weight:700}.tab.active{border-color:#f59e0b;color:#f59e0b}.card{background:#111827;border:1px solid #263244;border-radius:14px;padding:16px}.muted{color:#94a3b8}.ai{background:#0d2430;border:1px solid #155e75;border-radius:10px;padding:12px}.pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1}.read{opacity:.65}.highlight{background:#713f12;color:#fef3c7}.btn{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:6px 10px}a{color:#fbbf24}
</style></head>
<body>
<header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950/95 backdrop-blur"><div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-xl sm:text-2xl font-black">📈 Bloomberg 财经焦点看板</h1><p class="muted text-sm mt-1">全球市场 · 亚太财经 · 国内财经 · 核心财报</p></div><div class="text-xs muted">最近更新：<span id="updateTime">等待更新</span><div id="aiStatus" class="mt-1">AI 状态读取中</div></div></div></header>
<main class="max-w-6xl mx-auto px-4 py-5">
<div class="flex flex-wrap gap-2 items-center mb-4"><input id="searchInput" class="flex-1 min-w-48 rounded-lg bg-slate-900 border border-slate-700 px-3 py-2" placeholder="搜索新闻标题、摘要或资产…"><button class="btn" id="fontDown">A−</button><button class="btn" id="fontUp">A+</button><button class="btn" id="clearRead">清除已读标记</button></div>
<nav class="grid grid-cols-2 sm:grid-cols-4 border-b border-slate-800 mb-5" id="tabs"><button class="tab active" data-tab="global">国际财经 Top 20</button><button class="tab" data-tab="asia">亚太财经 Top 10</button><button class="tab" data-tab="china">国内财经 Top 10</button><button class="tab" data-tab="earnings">📊 核心财报 Top 10</button></nav>
<div class="flex justify-between items-center mb-3"><h2 id="sectionTitle" class="text-lg font-bold">国际财经新闻</h2><span id="count" class="muted text-sm"></span></div><div id="newsList" class="space-y-4"><div class="card muted">等待新闻数据。请在 GitHub Actions 中运行 Daily Update。</div></div>
<p class="muted text-xs mt-8">说明：AI 分析仅用于新闻理解与信息整理，不构成投资建议。新闻源内容可能存在延迟或翻译误差，请以原始来源为准。</p>
</main>
<!-- NEWS_DATA_START -->
<script>window.newsData = window.newsData || {global:[],asia:[],china:[],earnings:[],updatedAt:""};</script>
<!-- NEWS_DATA_END -->
<script>
const labels={global:'国际财经新闻',asia:'亚太财经新闻',china:'国内财经新闻',earnings:'核心财报新闻'};let active='global',fontSize=15;const readKey='financeDashboardRead_v1';let readIds=new Set();try{readIds=new Set(JSON.parse(localStorage.getItem(readKey)||'[]'))}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function markRead(id){readIds.add(id);localStorage.setItem(readKey,JSON.stringify([...readIds]));render()}
function render(){const all=window.newsData?.[active]||[];const q=(document.getElementById('searchInput').value||'').trim().toLowerCase();const items=all.filter(n=>[n.title,n.summary,n.source,(n.asset||[]).join(' '),n.analysis].join(' ').toLowerCase().includes(q));document.getElementById('sectionTitle').textContent=labels[active];document.getElementById('count').textContent=`显示 ${items.length} / ${all.length} 条`;
const list=document.getElementById('newsList');if(!items.length){list.innerHTML='<div class="card muted">此栏目暂时没有匹配的新闻。请稍后运行 GitHub Actions 更新。</div>';return}
list.innerHTML=items.map((n,i)=>{const id=active+'_'+(n.url||n.title);const isRead=readIds.has(id);return `<article class="card ${isRead?'read':''}" style="font-size:${fontSize}px"><div class="flex flex-wrap justify-between gap-2 items-center mb-3"><div class="flex flex-wrap gap-2 items-center"><span class="pill">${esc(n.id||('NO.'+(items.length-i)))}</span><span class="pill">${esc(n.source||'新闻来源')}</span><span class="pill">${esc(n.publishedAt||'')}</span></div><button class="btn text-xs" onclick="markRead('${esc(id)}')">${isRead?'✓ 已读':'标记已读'}</button></div><h3 class="text-lg font-bold leading-snug mb-2">${esc(n.title||'无标题')}</h3>${n.originalTitle&&n.originalTitle!==n.title?`<details class="mb-2 text-xs muted"><summary class="cursor-pointer">查看原文标题</summary><p class="mt-1">${esc(n.originalTitle)}</p></details>`:''}<p class="text-slate-300 leading-relaxed mb-3">${esc(n.summary||'暂无摘要')}</p><div class="flex flex-wrap gap-2 mb-3"><span class="pill">潜在影响：${esc(n.impact||'待分析')}</span>${(n.asset||[]).map(a=>`<span class="pill">${esc(a)}</span>`).join('')}</div>${n.analysis?`<section class="ai mb-3"><div class="font-bold text-cyan-300 mb-2">🤖 Gemini AI 分析</div><p class="leading-relaxed">${esc(n.analysis)}</p>${n.risk?`<p class="muted text-sm mt-2"><b>风险与不确定性：</b>${esc(n.risk)}</p>`:''}</section>`:`<div class="rounded-lg bg-slate-900 p-3 muted text-sm mb-3">${window.newsData?.aiEnabled?'本条尚未生成 AI 分析（本次调用额度有限或模型调用失败）。':'尚未启用 Gemini：请在 GitHub 仓库 Secrets 中配置 GEMINI_API_KEY。'}</div>`}<div class="text-sm"><a href="${esc(n.url||'#')}" target="_blank" rel="noopener noreferrer">阅读原始报道 ↗</a></div></article>`}).join('')}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()}));document.getElementById('searchInput').addEventListener('input',render);document.getElementById('fontUp').onclick=()=>{fontSize=Math.min(22,fontSize+1);render()};document.getElementById('fontDown').onclick=()=>{fontSize=Math.max(12,fontSize-1);render()};document.getElementById('clearRead').onclick=()=>{readIds.clear();localStorage.removeItem(readKey);render()};
if(window.newsData?.updatedAt)document.getElementById('updateTime').textContent=window.newsData.updatedAt;document.getElementById('aiStatus').textContent=window.newsData?.aiEnabled?'🟢 Gemini AI 已配置':'🟠 未检测到 Gemini API 密钥';render();
</script></body></html>
