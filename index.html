<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>TERMINAL // 财经时政新闻助手</title>
 <script src="https://cdn.tailwindcss.com"></script>
 <style>
  body { background-color: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .glow-border { border: 1px solid rgba(245, 158, 11, 0.4); box-shadow: 0 0 15px rgba(245, 158, 11, 0.15); }
  .card-bg { background-color: #131b2e; border: 1px solid #1e293b; }
  .top3-card { background: linear-gradient(135deg, #172033 0%, #111827 100%); border: 1px solid rgba(245, 158, 11, 0.3); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
  .research-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 0.5rem; padding: 0.75rem 1rem; }
  .research-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.75rem; }
  .research-wide { grid-column: 1 / -1; }
  ul { padding-left: 1.2rem; margin-top: 0.25rem; }
  li { margin-bottom: 0.2rem; }
 </style>
</head>
<body class="min-h-screen pb-12">
 <header class="max-w-6xl mx-auto px-4 pt-8 pb-6 border-b border-gray-800">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
   <div>
    <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider text-white flex items-center gap-2">
     📈 TERMINAL <span class="text-amber-500">//</span> 财经时政新闻助手
    </h1>
    <p class="text-sm text-gray-400 mt-1">全球公信力媒体 · 宏观深度分析 · 纯净直达</p>
   </div>
   <div class="text-xs text-gray-400 flex flex-col md:items-end gap-1">
    <div>最近更新: <span id="updateTime" class="text-gray-200 font-mono">2026-10-24 00:00:00</span></div>
    <div id="aiStatusContainer" class="flex items-center gap-2">
     <span id="aiStatus" class="text-emerald-400 font-mono">🟢 DeepSeek 已配置 · deepseek-chat</span>
    </div>
   </div>
  </div>

  <!-- 导航栏切换 -->
  <div class="flex gap-2 mt-6 overflow-x-auto pb-2" id="navTabs">
   <button onclick="switchTab('china')" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-amber-500 text-gray-950 transition">🇨🇳 国内财经 Top 10</button>
   <button onclick="switchTab('earnings')" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-gray-800 text-gray-300 hover:bg-gray-700 transition">📊 核心财报 Top 10</button>
   <button onclick="switchTab('global')" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-gray-800 text-gray-300 hover:bg-gray-700 transition">🌍 全球宏观 Top 20</button>
   <button onclick="switchTab('asia')" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-gray-800 text-gray-300 hover:bg-gray-700 transition">🌏 亚太市场 Top 10</button>
  </div>
 </header>

 <main class="max-w-6xl mx-auto px-4 mt-6">
  <div id="contentArea"></div>
 </main>

 <!-- 动态数据注入区 -->
 <!-- NEWS_DATA_START -->
 <script>
  window.newsData = {
   "global": [], "asia": [], "china": [], "earnings": [],
   "updatedAt": "2026-10-24 00:00:00", "aiEnabled": true, "aiModel": "deepseek-chat"
  };
 </script>
 <!-- NEWS_DATA_END -->

 <script>
  let currentTab = 'china';

  function esc(str) {
   if (!str) return '';
   return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function list(arr) {
   if (!arr || !arr.length) return '<p class="text-gray-500 text-xs">暂无。id</p>';
   return `<ul class="list-disc text-xs text-gray-300">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  }

  function switchTab(tab) {
   currentTab = tab;
   document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.className = "tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-gray-800 text-gray-300 hover:bg-gray-700 transition";
   });
   event.currentTarget.className = "tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-amber-500 text-gray-950 transition";
   render();
  }

  function renderAIResearch(n) {
   if (!n.analysis) return '';
   return `
    <section class="ai mt-3 mb-3 p-4 rounded-xl bg-gray-900/80 border border-gray-800">
     <div class="font-bold text-cyan-400 mb-2 flex items-center justify-between text-sm">
      <span>🧭 DeepSeek 深度宏观与时政分析</span>
      <span class="pill">${esc(n.confidence || "高置信度")}</span>
     </div>
     <p class="text-gray-300 text-sm leading-relaxed mb-3">${esc(n.analysis)}</p>
     <div class="research-grid mt-3">
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">📌 核心逻辑</h4>
       <p class="text-xs text-gray-300">${esc(n.coreLogic || "暂无。")}</p>
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">📈 潜在市场影响</h4>
       <p class="text-xs text-gray-300">${esc(n.marketImpact || n.impact || "暂无法判断。")}</p>
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">🔗 传导机制</h4>
       <p class="text-xs text-gray-300">${esc(n.transmission || "当前信息不足。")}</p>
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">⏳ 影响周期</h4>
       <p class="text-xs text-gray-300">${esc(n.timeHorizon || "暂不确定。")}</p>
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">🧾 证据线索</h4>
       ${list(n.evidence)}
      </div>
      <div class="research-box">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">⚖️ 情景分析</h4>
       ${list(n.scenarios)}
      </div>
      <div class="research-box research-wide">
       <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">⚠️ 风险与缺口</h4>
       <p class="text-xs text-gray-300">${esc(n.risk || "尚未识别。")}</p>
      </div>
     </div>
    </section>`;
  }

  function renderCard(n, index) {
   const isTop3 = index < 3;
   const cardClass = isTop3 ? "top3-card glow-border rounded-xl p-5 mb-6" : "card-bg rounded-xl p-4 mb-4";
   
   return `
    <article class="${cardClass}">
     ${isTop3 ? `
      <div class="flex items-center justify-between mb-3 pb-2 border-b border-amber-500/20">
       <div class="flex items-center gap-2">
        <span class="bg-amber-500 text-gray-950 font-black text-xs px-2 py-0.5 rounded">🔥 TOP ${index + 1}</span>
        <span class="text-xs font-mono text-amber-400 font-bold">权重分数: ${n._importance || 50}/100</span>
       </div>
       <span class="text-xs text-amber-300 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-600/30">评级: 中高</span>
      </div>` : `
      <div class="flex items-center justify-between mb-2">
       <span class="text-xs font-mono text-gray-400 font-bold">${n.id || 'NO.00'}</span>
       <span class="text-xs text-gray-400">${esc(n.source)} · ${esc(n.publishedAt)}</span>
      </div>`}

     ${isTop3 ? `<div class="text-xs text-gray-400 mb-1 flex items-center gap-2 font-mono"><span class="text-gray-300">${esc(n.source)}</span> · <span>${esc(n.publishedAt)}</span></div>` : ''}

     <h2 class="${isTop3 ? 'text-lg md:text-xl font-bold text-white mb-2 leading-snug' : 'text-base font-bold text-white mb-2 leading-snug'}">
      ${esc(n.title)}
     </h2>

     <p class="text-sm text-gray-300 mb-3 leading-relaxed">
      ${esc(n.summary)}
     </p>

     ${renderAIResearch(n)}

     <div class="flex items-center justify-between pt-2 border-t border-gray-800/60 text-xs">
      <a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer" class="text-amber-400 hover:text-amber-300 font-bold flex items-center gap-1 transition">
       查看原始报道 ↗
      </a>
      <span class="text-gray-500 font-mono">${esc(n.linkStatus || "100% 免费直达")}</span>
     </div>
    </article>
   `;
  }

  function render() {
   const data = window.newsData || {};
   const items = data[currentTab] || [];
   const area = document.getElementById('contentArea');
   
   if (!items.length) {
    area.innerHTML = `<div class="text-center py-12 text-gray-500">当前栏目暂无资讯或正在等待定时更新。</div>`;
    return;
   }

   let htmlContent = '';
   if (items.length > 0) {
    htmlContent += `
     <div class="mb-6">
      <h2 class="text-amber-500 font-bold text-sm tracking-wider uppercase flex items-center gap-2 mb-4">
       <span>🔥 当日重点新闻 · TOP 3 深度聚焦</span>
      </h2>
      <div class="space-y-4">
       ${items.slice(0, 3).map((n, i) => renderCard(n, i)).join('')}
      </div>
     </div>
    `;
   }

   if (items.length > 3) {
    htmlContent += `
     <div class="mt-8">
      <h2 class="text-gray-400 font-bold text-sm tracking-wider uppercase flex items-center gap-2 mb-4">
       <span>📰 常规资讯流 · 实时追踪</span>
      </h2>
      <div class="space-y-4">
       ${items.slice(3).map((n, i) => renderCard(n, i + 3)).join('')}
      </div>
     </div>
    `;
   }

   area.innerHTML = htmlContent;
   document.getElementById('updateTime').textContent = data.updatedAt || '刚刚';
   
   const aiStatusEl = document.getElementById("aiStatus");
   if (aiStatusEl) {
    const st = data.aiStats;
    aiStatusEl.textContent = data.aiEnabled
     ? `🟢 DeepSeek 已配置 · ${data.aiModel || "deepseek-chat"}${st ? ` · 成功 ${st.successes}/${st.attempts}` : ""}`
     : "🟠 未检测到 DeepSeek API 密钥";
   }
  }

  window.addEventListener('DOMContentLoaded', render);
 </script>
</body>
</html>
