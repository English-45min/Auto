</main>

<script>
"use strict";

const labels = {
  global: "国际财经新闻",
  asia: "亚太财经新闻",
  china: "国内财经新闻",
  earnings: "核心财报新闻"
};

let active = "global";
let fontSize = 15;

const readKey = "financeDashboardRead_v1";
let readIds = new Set();

try {
  readIds = new Set(JSON.parse(localStorage.getItem(readKey) || "[]"));
} catch (e) {
  readIds = new Set();
}

const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[ch]));

function saveRead() {
  try {
    localStorage.setItem(readKey, JSON.stringify([...readIds]));
  } catch (e) {}
}

function markRead(id) {
  readIds.add(id);
  saveRead();
  render();
}

function safeUrl(value) {
  try {
    const url = new URL(String(value || ""), window.location.href);
    if (url.protocol === "https:" || url.protocol === "http:") {
      return url.href;
    }
  } catch (e) {}
  return "#";
}

function render() {
  const all = Array.isArray(window.newsData?.[active])
    ? window.newsData[active]
    : [];

  const query = (document.getElementById("searchInput").value || "")
    .trim().toLowerCase();

  const items = all.filter(news => {
    const assets = Array.isArray(news.asset) ? news.asset.join(" ") : "";
    const haystack = [
      news.title, news.summary, news.source, assets,
      news.analysis, news.impact, news.risk, news.originalTitle
    ].join(" ").toLowerCase();

    return haystack.includes(query);
  });

  document.getElementById("sectionTitle").textContent = labels[active];
  document.getElementById("count").textContent =
    `显示 ${items.length} / ${all.length} 条`;

  const list = document.getElementById("newsList");

  if (!items.length) {
    const message = all.length
      ? "没有找到符合搜索条件的新闻，请尝试其他关键词。"
      : "此栏目暂时没有抓取到新闻。请稍后在 GitHub Actions 中运行 Daily Update。";

    list.innerHTML = `<div class="card muted">${esc(message)}</div>`;
    return;
  }

  list.innerHTML = items.map((news, index) => {
    const newsUrl = safeUrl(news.url);
    const readId = active + "_" + String(news.url || news.title || index);
    const isRead = readIds.has(readId);
    const assets = Array.isArray(news.asset) ? news.asset : [];
    const newsFont = `font-size:${fontSize}px`;

    const analysisHtml = news.analysis
      ? `<section class="ai mb-3">
           <div class="font-bold text-cyan-300 mb-2">🤖 Gemini AI 分析</div>
           <p class="leading-relaxed">${esc(news.analysis)}</p>
           ${news.risk
             ? `<p class="muted text-sm mt-3"><b>风险与不确定性：</b>${esc(news.risk)}</p>`
             : ""}
         </section>`
      : `<div class="rounded-lg bg-slate-900 p-3 muted text-sm mb-3">
           ${window.newsData?.aiEnabled
             ? "本条尚未生成 AI 分析：可能是本次调用额度已用完，或模型请求失败。"
             : "尚未检测到 Gemini API 密钥。请在 GitHub 仓库 Secrets 中配置 GEMINI_API_KEY。"}
         </div>`;

    return `
      <article class="card ${isRead ? "read" : ""}" style="${newsFont}">
        <div class="flex flex-wrap justify-between gap-2 items-center mb-3">
          <div class="flex flex-wrap gap-2 items-center">
            <span class="pill">${esc(news.id || ("NO." + (items.length - index)))}</span>
            <span class="pill">${esc(news.source || "新闻来源")}</span>
            <span class="pill">${esc(news.publishedAt || "")}</span>
            ${news.aiStatus === "Gemini AI"
              ? '<span class="pill">AI 已分析</span>'
              : ""}
          </div>
          <button
            class="btn text-xs"
            type="button"
            data-read-id="${esc(readId)}"
          >${isRead ? "✓ 已读" : "标记已读"}</button>
        </div>

        <h3 class="news-title font-bold mb-2">${esc(news.title || "无标题")}</h3>

        ${news.originalTitle && news.originalTitle !== news.title
          ? `<details class="mb-3 text-xs muted">
               <summary class="cursor-pointer">查看原文标题</summary>
               <p class="mt-2">${esc(news.originalTitle)}</p>
             </details>`
          : ""}

        <p class="text-slate-300 leading-relaxed mb-3">${esc(news.summary || "暂无摘要")}</p>

        <div class="flex flex-wrap gap-2 mb-3">
          <span class="pill">潜在影响：${esc(news.impact || "待分析")}</span>
          ${assets.map(asset => `<span class="pill">${esc(asset)}</span>`).join("")}
        </div>

        ${analysisHtml}

        <div class="text-sm">
          <a href="${esc(newsUrl)}" target="_blank" rel="noopener noreferrer">
            阅读原始报道 ↗
          </a>
        </div>
      </article>
    `;
  }).join("");

  list.querySelectorAll("[data-read-id]").forEach(button => {
    button.addEventListener("click", () => {
      markRead(button.getAttribute("data-read-id"));
    });
  });
}

document.querySelectorAll("[data-tab]").forEach(button => {
  button.addEventListener("click", () => {
    active = button.dataset.tab;

    document.querySelectorAll("[data-tab]").forEach(tab => {
      tab.classList.toggle("active", tab === button);
    });

    render();
  });
});

document.getElementById("searchInput").addEventListener("input", render);

document.getElementById("fontUp").addEventListener("click", () => {
  fontSize = Math.min(22, fontSize + 1);
  render();
});

document.getElementById("fontDown").addEventListener("click", () => {
  fontSize = Math.max(12, fontSize - 1);
  render();
});

document.getElementById("clearRead").addEventListener("click", () => {
  readIds.clear();
  try {
    localStorage.removeItem(readKey);
  } catch (e) {}
  render();
});

if (window.newsData?.updatedAt) {
  document.getElementById("updateTime").textContent =
    window.newsData.updatedAt;
}

document.getElementById("aiStatus").textContent =
  window.newsData?.aiEnabled
    ? `🟢 Gemini AI 已配置${window.newsData.aiModel ? " · " + window.newsData.aiModel : ""}`
    : "🟠 未检测到 Gemini API 密钥";

render();
</script>
</body>
