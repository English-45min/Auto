      "source": "财新网",
      "url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTFAtMFJWUDdoQ240dmVYVVVyd1JOdjFTTzZWWlhNY0N4dlp1UW1oSEdIWi1JOWJMdWplZVNmTkpzbEVpdjB5alBDT0paSlBIMXkyY0VnZUVoc1ZOYWhXdHlmQmlLVjQ?oc=5",
      "publishedAt": "2026-10-30 08:50",
      "title": "T早报｜谷歌、亚马逊发布三季报后大跌；智元上半年营收近20亿元；海力士、摩尔线程三季度营收大增 - 财新",
      "summary": "<a href=\"https://news.google.com/rss/articles/CBMiZEFVX3lxTFAtMFJWUDdoQ240dmVYVVVyd1JOdjFTTzZWWlhNY0N4dlp1UW1oSEdIWi1JOWJMdWplZVNmTkpzbEVpdjB5alBDT0paSlBIMXkyY0VnZUVoc1ZOYWhXdHlmQmlLVjQ?oc=5\" target=\"_blank\">T早报｜谷歌、亚马逊发布三季报后大跌；智元上半年营收近20亿元；海力士、摩尔线程三季度营收大增</a>  <font color=\"#6f6f6f\">财新</font>",

    {
      "source": "华尔街见闻",
      "url": "https://wallstreetcn.com/articles/3784799",
      "publishedAt": "2026-10-30 05:22",
      "title": "AWS收入劲增39%但AI支出吓退市场，亚马逊Q3自由现金流恶化，线上销售乏力，盘后跳水｜财报见闻",
      "summary": "<p>亚马逊三季度财报呈现明显的两面性：核心经营利润强于预期、备受关注的云计算业务AWS保持高速增长，但核心业务电商增长乏力，公司总营收和EPS盈利均逊于华尔街预期，且AI相关资本开支继续维持高位，令市场对自由现金流和投资回报周期的担忧升温。</p>\n<p>美东时间29日周四美股盘后，亚马逊公布，截至2026年9月30日的今年第三季度，公司净销售额同比增长12%至2019.4亿美元，略低于分析师预期的约2022.6亿美元；稀释后每股收益（EPS）同比下降约3.1%至1.89美元，分析师预期同比微增0.5%至1.96美元；而经营利润同比增61.5%至280.8亿美元，较市场预期高逾7%，经营利润率升至13.9%，为公司史上最高水平。</p>\n<p><img class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/d7c4b727-c4e8-4041-8f6a-c1084bddf216.png\" /></p>\n<p>财报最大亮点仍是AWS。三季度AWS净销售额同比增长39.3%至459.8亿美元，较分析师预期高1.3%，创将近五年来最高单季增速，季末年化收入运转率达1840亿美元，环比二季度末时增长8.9%。CEO Andy Jassy在财报中强调，AWS在功能和基础设施上的投入正在奏效，并预计2027年和2028年AWS收入增速都将超过40%。</p>\n<p><img class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/8eadbb03-0f30-467d-949c-f5255d1b6f46.png\" /></p>\n<p>相比AWS，三季度线上销售仅同比增长2%，创2023年初以来最低单季增速。亚马逊对假日季、第四季度销售的指引中值逊于分析师预期也显示，其线上业务短期内恐难迅速回暖。</p>\n<p>虽然AWS收入继续劲增，但市场更在意“代价”。亚马逊三季度购置物业和设备的资本支出高达772.6亿美元、约为去年同期的1.2倍，较市场预期高逾34%；自由现金流连续第二季录得负值，从去年同期的流入147.9亿美元转为流出423.6亿美元，流出规模远超二季度。公司还维持约2200亿美元的2026年全年现金资本支出指引不变，并未释放AI投入放缓的信号。</p>\n<p><img class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/744a4571-bac1-48e4-b5db-59baa5a8a94e.png\" /></p>\n<p>财报公布后，周四本已收跌超4%的亚马逊股价盘后进一步跳水，盘后跌幅一度超过10%。</p>\n<p><img class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/2470cac1-4775-4ec5-a83e-401347ac2142.jpeg\" /></p>\n<div>\n<h2 id=\"540fe1aa\">营收略低于预期，但经营利润率创历史新高</h2>\n</div>\n<p>从整体收入看，亚马逊三季度净销售额2019.4亿美元，同比增长12%；若剔除汇率影响，增速为13%。</p>\n<p>亚马逊特别提示，今年会员日Prime Day在公司的多数重要市场地区均提前至二季度，而2025年Prime Day完全落在三季度，因此今年三季度同比增速受到时点错位影响；若剔除这一因素，三季度收入同比增速将高出约400个基点。</p>\n<p>利润端则明显更强。亚马逊三季度经营利润为280.8亿美元，较去年同期的174.2亿美元大增61%，经营利润率从去年同期的9.7%提升至13.9%。这意味着，即便收入略低于预期，公司在履约、销售营销、管理费用等方面的效率改善，仍然支撑了创纪录的经营利润率。</p>\n<p>净利润为206.9亿美元，低于去年同期的211.9亿美元；稀释后EPS为1.89美元，同比下降3%。这一同比下滑很大程度上与去年同期的非经营性高基数有关——2025年三季度亚马逊因Anthropic投资确认了95亿美元税前收益，而今年同期没有类似收益，其他收入/费用项目从去年同期的正101.9亿美元转为负7亿美元。</p>\n<p>换言之，这份财报不是经营层面的利润失速，而是收入和每股收益略低于预期、叠加非经营性项目和资本开支压力，削弱了投资者对短期回报的信心。</p>\n<p><img class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/9207b79e-f078-44b2-9041-b6bd59f97391.jpeg\" /></p>\n<div>\n<h2 id=\"aws-ai\">AWS继续加速：AI需求支撑云业务，但市场也在追问投入回报</h2>\n</div>\n<p>AWS是三季度最亮眼的业务线。该部门净销售额459.8亿美元，同比增长39%，高于分析师预期的约454亿美元，同比增速较二季度的约37%进一步加快，继续创2021年四季度以来最高增速；AWS经营利润177.7亿美元，同比增长55%，经营利润率为38.7%，高于去年同期的34.6%。</p>\n<p><img class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/2c62c59b-8e45-4106-80c2-e152769568e6.jpeg\" /></p>\n<p>从收入结构看，三季度线上销售额685亿美元，贡献亚马逊三分之一的净销售额，AWS销售额占总额的23%，高于去年同期的18%，但其贡献了亚马逊整体经营利润的约63%。这说明亚马逊的利润池仍高度依赖云业务，而AWS的重新加速，对支撑集团估值至关重要。</p>\n<p>财报披露，AWS近期与Meta、英伟达、OpenAI、Salesforce、甲骨文、高通、Verizon等签署了新协议。Amazon Bedrock继续快速增长，财富500强企业在Bedrock上的支出同比接近7倍，整体token量同比增长近17倍；Bedrock AgentCore已有数万名客户使用，三季度部署的智能体数量超过前三个季度总和的两倍。</p>\n<p>Jassy对AWS前景的表态也非常激进。他称AWS三季度年化收入运行率已达1840亿美元，并预计2027年和2028年AWS收入增速均超过40%。他还表示，历史上从未出现过万亿美元收入规模的企业，而亚马逊未来5到10年可能拥有两个这样的业务。</p>\n<p><img class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/aebbc39b-10b9-41e9-a7af-77a3f5419970.jpeg\" /></p>\n<p>但这也是市场分歧所在：AWS的增长说明AI投入正在转化为需求，但高增长同时需要巨额算力、数据中心和芯片投资。投资者并非否认AWS复苏，而是在重新评估这种增长需要消耗多少现金流。</p>\n<div>\n<h2 id=\"ai\">AI资本开支成为股价压力核心：自由现金流大幅转负</h2>\n</div>\n<p>资本开支是这份财报引发市场负面反应的关键。</p>\n<p>三季度，亚马逊购置物业和设备支出为772.6亿美元，远高于去年同期的351亿美元，远超市场预期的574.7亿美元。过去12个月，公司购置物业和设备净额达到2106.6亿美元，同比增长82%。亚马逊明确表示，这一增长主要反映了人工智能相关投资。</p>\n<p>现金流表显示，过去12个月亚马逊经营现金流为1683亿美元，同比增长29%；但自由现金流为流出423.6亿美元、流出规模约为二季度76亿美元的5.6倍，而去年同期为流入147.9亿美元。也就是说，公司主营业务造血能力仍在增强，但AI基础设施投入的速度更快，已经吞噬并反转了自由现金流。</p>\n<p>资产负债表也体现出扩张压力。截至三季度末，亚马逊现金及现金等价物为557.8亿美元，低于去年底的868.1亿美元；长期债务升至1731.3亿美元，而去年底为656.5亿美元。三季度公司新增长期债务融资481亿美元，前三季度新增长期债务融资1151亿美元。</p>\n<p>对成长型科技公司而言，资本开支本身并非负面，尤其是在AWS增速重新上行的背景下。但当三季度资本开支大幅超预期、自由现金流显著转负，同时公司又维持全年约2200亿美元现金资本开支预期时，市场自然会担心：AI投入何时进入回报期？未来几年是否还会持续挤压现金流？</p>\n<div>\n<h2 id=\"prime-day\">北美和国际业务：收入受Prime Day错位影响，利润改善明显</h2>\n</div>\n<p>零售相关业务表面上增速不强，但利润端改善较为明显。</p>\n<p>北美业务三季度净销售额1128.5亿美元，同比增长6%，略低于市场预期的约1133.9亿美元；经营利润87.2亿美元，较去年同期的47.9亿美元大增82%，经营利润率从4.5%提升至7.7%。</p>\n<p>国际业务净销售额431.1亿美元，同比增长5%，也略低于预期；若剔除汇率影响，增速为8%。该部门经营利润15.8亿美元，高于去年同期的12亿美元，经营利润率从2.9%提升至3.7%。</p>\n<p>亚马逊解释称，Prime Day时点变化压低了三季度收入增速。在线商店收入684.7亿美元，同比仅增长2%；第三方卖家服务收入464.9亿美元，同比增长9%；实体店收入57.1亿美元，同比增长2%。全球付费商品数量同比增长12%，全球运输成本同比增长11%，显示订单量仍在增长，但收入结构受到促销时点影响。</p>\n<p>因此，零售业务不能简单理解为需求恶化。更准确地说，三季度零售收入表现不如市场预期，但利润率改善和配送效率提升仍然延续。公司称，Prime会员三季度收货速度创历史同期最快，超过15亿件商品实现当日或次日送达。</p>\n<p><img class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/a00d6f2b-826f-4ca4-93bb-8fe1f4161d0d.jpeg\" /></p>\n<div>\n<h2 id=\"67c30461\">广告业务增长放缓，是财报中另一短板</h2>\n</div>\n<p>广告业务三季度表现低于预期，是除资本开支外另一个压制情绪的因素。</p>\n<p>亚马逊广告服务收入同比增长11%至196.4亿美元，较分析师预期收入208.7亿美元低约6%；剔除汇率影响增长12%。这一增速相比此前多个季度20%以上的增长明显放缓，也低于市场预期的约208.7亿美元。</p>\n<p>公司表示，广告收入受到Prime Day时点以及其他若干时间因素影响，并预计四季度广告收入同比增速将回升至高十位数区间。如果这一指引兑现，三季度广告降速可能更多是时点扰动，而非广告业务结构性放缓。</p>\n<p>不过，市场短期难免会更敏感。广告是亚马逊近年来利润率更高、增长更快的业务之一，一旦增速放缓，就会削弱投资者对零售生态商业化能力的信心。相比之下，订阅服务表现较稳，三季度收入140.1亿美元，同比增长11%，高于市场预期的约136.9亿美元。</p>\n<div>\n<h2 id=\"21624157\">四季度指引不算差，但营收和利润中值低于预期</h2>\n</div>\n<p>亚马逊给出的四季度指引总体处于华尔街预期附近，但并未带来足够惊喜。</p>\n<p>公司预计四季度净销售额在2400亿至2470亿美元之间，同比增长12%至16%，其中包含约60个基点的汇率不利影响。该营收区间的中值为2435亿美元，略低于分析师预期的2445.2亿美元，但预期值落在指引区间内。</p>\n<p>更关键的是经营利润指引。亚马逊预计四季度经营利润为285亿至335亿美元，而市场预期约331亿美元。换言之，公司指引上限仅略高于共识预期，中点310亿美元则低于预期。</p>\n<p>这解释了为何股价反应如此剧烈：三季度营收和EPS均小幅不及预期，广告收入低于预期，四季度利润指引中点偏弱，同时资本开支大幅超预期且全年AI投入计划维持高位。AWS的强劲增长和历史最高经营利润率是财报的亮点，但在当前市场环境下，投资者更关注AI投入是否会持续压低自由现金流，以及高资本开支能否在可见周期内转化为足够高的利润和现金回报。</p>\n<p><img class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/2291ad51-8543-4ddf-b1e7-494b000864cd.jpeg\" /></p><p>本文来自华尔街见闻，欢迎下载APP查看更多</p>",

      "title": "看了财报后，高盛、摩根大通双双下调谷歌目标价",
      "summary": "<p>谷歌母公司Alphabet第三季度财报公布后，华尔街主要机构随即下调目标价。搜索业务收入低于预期，叠加外汇逆风与资本支出持续高企，令市场对其自由现金流前景的担忧明显升温。</p>\n<p>据追风交易台消息，摩根大通将Alphabet目标价从425美元下调至375美元。高盛同样下调12个月目标价，从435美元调降至385美元，降幅约11.5%，但维持买入评级不变。按高盛10月28日收盘价324.89美元计算，新目标价对应约18.5%的上行空间。</p>\n<p>财报显示，Alphabet第三季度搜索及其他业务收入为633.5亿美元，低于高盛预期的642亿美元及市场一致预期的648.95亿美元。与此同时，公司维持2026年资本支出1950亿至2050亿美元的指引不变，并预告2027年资本开支将进一步大幅增加，令自由现金流前景承压，成为投资者关注的核心焦点之一。</p>\n<div>\n<h2 id=\"5e7e0f5f\">搜索收入承压，外汇及比较基数构成双重拖累</h2>\n</div>\n<p>Alphabet第三季度搜索及其他业务收入同比增长12%，低于市场预期，管理层将主要原因归结为外汇逆风，同时指出公司正面临较难的收入比较基数——搜索收入增速加速始于2025年第三季度，令本季度同比数据承压。</p>\n<p>此外，<strong>高盛分析师还指出若干垂直行业的特殊因素：部分亚太地区零售商受欧盟取消最低税收豁免政策影响，媒体及娱乐广告支出则在2026年世界杯结束后出现正常化回落。管理层表示，第四季度外汇逆风预计将略大于第三季度，比较基数压力亦将延续。</strong></p>\n<p>从全季表现来看，谷歌服务整体收入963亿美元，低于高盛预估的975.75亿美元；YouTube广告收入112.07亿美元，同样不及预期。GAAP每股收益为2.12美元，受公司持有股权资产公允价值波动造成约87亿美元损失影响，大幅低于高盛预期的2.96美元。</p>\n<div>\n<h2 id=\"ai\">云业务强劲，AI需求推动收入超预期</h2>\n</div>\n<p>云业务成为本季财报的最大亮点。据高盛数据，谷歌云第三季度收入达307.09亿美元，同比增长约103%，超出高盛预期295.56亿美元约3.9%，超出市场一致预期约5.7%，经营利润率同比扩张约1250个基点至36.2%。</p>\n<p>管理层披露，谷歌云收入积压订单目前已达5610亿美元，同比增长256%，其中约55%预计将在未来24个月内转化为收入。高盛报告指出，企业AI需求旺盛——包括TPU系统销售贡献显著，目前已有近100家客户在使用TPU，预计四季度及2027年将进一步放量。管理层同时表示，计算资源供给不足仍是制约云业务增速进一步提升的关键瓶颈。</p>\n<p>在订阅业务方面，管理层披露YouTube Premium订阅用户已超过1.5亿，订阅收入整体增速快于广告业务，Google One AI套餐需求亦保持强劲。</p>\n<div>\n<h2 id=\"47105cdf\">资本支出高企，自由现金流转负引发关注</h2>\n</div>\n<p>Alphabet维持2026年资本支出1950亿至2050亿美元的指引，高盛更新后的预估约为2030亿美元。<strong>对于2027年，公司尚未给出具体指引，但明确表示支出将\"大幅增加\"，高盛预计约为3504亿美元。</strong></p>\n<p>在此背景下，高盛将Alphabet 2027年自由现金流预估从此前的-405.67亿美元进一步调整至-405.67亿美元，<strong>2026年自由现金流已转为负值（-126.2亿美元），较2025年的732.66亿美元出现大幅逆转。折旧及摊销费用同样大幅攀升，高盛预计2026年为387.74亿美元，2027年将跃升至750.17亿美元。</strong></p>\n<p>管理层表示，预计资本回报率（ROIC）将保持在远高于资本成本的水平，但承认当前自由现金流与大规模投资之间的背离将阶段性持续，直至计算约束得到缓解。</p>\n<div>\n<h2 id=\"5b2a4b08\">高盛下调目标价，维持买入评级</h2>\n</div>\n<p>高盛将12个月目标价从435美元调降至385美元，主要反映前瞻盈利预估的下修及估值倍数的小幅收缩。估值方法上，高盛采用EV/GAAP EBIT与修正后DCF（EV/FCF-SBC）各50%等权混合，EV/GAAP EBIT倍数从此前26倍下调至24倍，以反映较低的前瞻盈利预估，同时维持约0.80倍的倍数对增长比率不变。</p>\n<p><img class=\" wscnph\" src=\"https://wpimg-wscn.awtmt.com/3ff786ea-9475-4106-8a79-5f1172c026ed.png\" /></p>\n<p>盈利预估方面，高盛将2026年EPS从20.54美元下调至19.76美元，2027年EPS从15.50美元下调至15.01美元，2028年EPS从19.15美元下调至18.53美元。按当前股价计算，GOOGL约对应高盛2027年GAAP EPS预估（剔除净现金）约18倍，2028年约15倍。</p>\n<p>高盛分析师Eric Sheridan团队在报告中指出，长期来看仍看好Alphabet在AI消费级与企业级计算领域的战略定位，认为其兼具AI规模化分发能力（逾10亿用户应用矩阵）与大规模算力投资优势，是当前AI货币化从\"基础设施层\"向\"平台层\"和\"应用层\"演进过程中被市场低估的双重叙事逻辑。主要下行风险包括：搜索业务受行业颠覆冲击、重资产投入对利润率的长期压制、监管审查趋严，以及宏观环境对成长股估值的冲击。</p>\n<p> </p>\n\n\n\n<p>本文来自华尔街见闻，欢迎下载APP查看更多</p>",

      "source": "华尔街见闻",
      "url": "https://wallstreetcn.com/articles/3784729",
      "publishedAt": "2026-10-29 11:01",
      "title": "谷歌云逼近微软Azure，但微软赢得“财报日大考”",
      "summary": "<p style=\"text-align: left;\">谷歌与微软同日发布季度财报，云计算战场格局悄然生变，但两家公司在资本市场的命运却截然相反。</p>\n<p style=\"text-align: left;\">10月28日，谷歌母公司Alphabet公布第三季度营收，同比增长25%至1275.8亿美元，略低于华尔街预期。</p>\n<p style=\"text-align: left;\"><strong>尽管谷歌云业务表现亮眼，但搜索广告收入增速放缓引发投资者担忧，谷歌股价盘后重挫10%。</strong></p>\n<p style=\"text-align: left;\"><img alt=\"\" class=\"wscnph\" src=\"https://wpimg-wscn.awtmt.com/bde1a89e-76dc-4a9c-be4b-3499218c4c77.png\" title=\"\" /></p>\n<p style=\"text-align: left;\">微软则凭借整体业绩稳健超预期，股价盘后上涨约3%，年内累计涨幅达12%。</p>\n<p style=\"text-align: left;\">The Information分析认为，两份财报折射出AI投资浪潮下，科技巨头各自不同的变现困境与增长逻辑：<strong>谷歌正承受着AI重塑搜索体验所带来的变现阵痛，而微软则在企业软件与云服务的双轮驱动下，向市场展示了更为稳健的AI变现路径。</strong></p>\n<h2 style=\"text-align: left;\">谷歌搜索广告失速，AI模式变现成软肋</h2>\n<p style=\"text-align: left;\"><a href=\"https://wallstreetcn.com/articles/3784714\" rel=\"noopener noreferrer nofollow\" target=\"_blank\">华尔街见闻提及</a>，Alphabet第三季度总营收同比增长25%至1275.8亿美元，略低于华尔街预期。</p>\n<p style=\"text-align: left;\">受大规模AI支出拖累，公司自由现金流由正转负，录得逾90亿美元的负值，而上年同期这一数字为正240亿美元以上。</p>\n<p style=\"text-align: left;\"><strong>令投资者真正感到不安的，是谷歌搜索广告业务的表现。</strong>当季搜索营收同比增长12%至633.5亿美元，增速较上季度的17%明显放缓，为2025年第二季度以来最低水平。</p>\n<p style=\"text-align: left;\">这与Alphabet CEO Sundar Pichai在电话会议上所称\"<strong>搜索查询量同比增速为五年来最高</strong>\"的描述形成鲜明反差。</p>\n<p style=\"text-align: left;\">谷歌首席商务官Philipp Schindler在电话会议上对此作出解释：</p>\n<blockquote>\n<p style=\"text-align: left;\">AI模式查询量的强劲增长带来了一定影响，因为我们在AI模式下的变现程度较低。</p>\n</blockquote>\n<p style=\"text-align: left;\"><strong>他补充称，AI模式下的查询平均时长是传统搜索的三倍，但目前广告变现效率相对较低。公司还提及汇率波动对搜索营收造成一定拖累。</strong></p>\n<p style=\"text-align: left;\">Direxion高级副总裁Ryan Lee在周三研报中将<strong>上述组合称为\"糟糕的叠加\"</strong>，并指出：</p>\n<blockquote>\n<p style=\"text-align: left;\">在核心业务未能充分增长、AI投入又尚未见到明显变现回报的情况下，持续的现金消耗愈发难以为外界所接受。</p>\n</blockquote>\n<p style=\"text-align: left;\">BNP Paribas分析师Nick Jones则在研报中指出，<strong>本季财报很可能重新点燃市场对AI竞争对手的关注，包括OpenAI旗下ChatGPT以及Meta的Muse智能体正在持续蚕食谷歌搜索份额。</strong></p>\n<p style=\"text-align: left;\">市场更深层的担忧在于，<strong>若AI智能体逐渐替代用户完成网页浏览与购物决策，谷歌以广告为核心的商业模式将面临结构性压力</strong>。</p>\n<h2 style=\"text-align: left;\">谷歌云强势追赶，但增速难掩整体失色</h2>\n<p style=\"text-align: left;\">云业务是谷歌这份财报中少有的亮点。</p>\n<p style=\"text-align: left;\">Google Cloud季度营收较上年同期翻逾一倍，达到逾300亿美元，运营利润则增至111.2亿美元，较上年同期增长约两倍。</p>\n<p style=\"text-align: left;\"><strong>这一数字已非常接近微软同期的Azure营收，后者录得330亿美元，同比增长48%。若Google Cloud维持当前较高的增速，赶超Azure在时间上将不再遥远。</strong></p>\n<p style=\"text-align: left;\">不过，两者的营收口径并不完全可比。<strong>Google Cloud收入中包含了一块日益壮大的服务器硬件业务，即向客户销售其自研AI芯片张量处理器（TPU）系统，供客户部署于自有数据中心。</strong></p>\n<p style=\"text-align: left;\">谷歌未披露本季度TPU的具体销售额，仅表示其为\"营收增长的重要贡献来源\"。Google Cloud CEO Thomas Kurian在电话会上表示：</p>\n<blockquote>\n<p style=\"text-align: left;\">我们看到了异乎寻常的需求。</p>\n</blockquote>\n<p style=\"text-align: left;\">公司高管还向分析师预告，<strong>TPU销售明年将对Google Cloud产生更大影响。</strong></p>\n<p style=\"text-align: left;\">尽管如此，Bernstein分析师Mark Shmulik指出，<strong>部分机构投资者在财报发布前对谷歌云的增速预期已超过115%，这意味着即便是这份超预期的成绩，对于预期最高的多头而言仍略显不足。</strong></p>\n<h2 style=\"text-align: left;\">微软停披Copilot用户数，变现逻辑悄然转向</h2>\n<p style=\"text-align: left;\"><a href=\"https://wallstreetcn.com/articles/3784713\" rel=\"noopener noreferrer nofollow\" target=\"_blank\">华尔街见闻提及</a>，微软方面，第三季度整体营收同比增长19%至923亿美元，增速较上季度加快1个百分点。其365商业云业务（涵盖Copilot及Office软件套件）营收增长17%至277亿美元，增速亦较上季度略有提升。</p>\n<p style=\"text-align: left;\">然而，微软此次财报中有一处引人注目的缺失。The Information指出，此前微软曾披露Copilot付费用户数量——截至6月底为3000万，较2025年底的1500万翻倍。</p>\n<p style=\"text-align: left;\">这一数据曾被视为微软AI软件商业化的有力证明，也帮助缓解了部分投资者对AI投资回报率的疑虑。但<strong>本季度财报中，这一数字不见踪影，令外界对Copilot订阅增速是否依然强劲产生疑问。</strong></p>\n<p style=\"text-align: left;\"><strong>对此，微软的解释指向更深层的商业模式转型。</strong></p>\n<p style=\"text-align: left;\">CEO Satya Nadella在电话会上强调，本季度按使用量付费的Copilot功能用户数增长了75%；CFO Amy Hood则表示，随着按需付费AI工具使用量的增加，每用户平均收入有所提升。</p>\n<p style=\"text-align: left;\"><strong>微软正将增长重心从\"扩大付费席位\"转向\"提升单用户使用深度\"，并整合了包括AI智能代理在内的多项新功能。</strong></p>\n<p style=\"text-align: left;\">与此同时，面对来自OpenAI和Anthropic的竞争压力，微软已开始对席位订阅提供更大幅度的折扣，AI软件市场的定价战正在升温。微软能否维持其AI软件收入的增长势头，将是投资者持续关注的核心问题。</p><p>本文来自华尔街见闻，欢迎下载APP查看更多</p>",

      "title": "腾讯系办公开始围着workbuddy转",
      "summary": "<p>10月14日，WorkBuddy进入了企业微信的通讯录。</p>\n<p>在新发布的联合版本中，员工可以像给同事发消息一样，向这个AI智能体交办任务。经过企业授权后，它能够调用相关消息、文档、会议等工作资料，完成任务后再将结果发回企业微信。</p>\n<p>15天后，腾讯又将WorkBuddy与旗下更多办公产品连接起来。</p>\n<p>10月29日，在2026腾讯全球数字生态大会上，腾讯正式推出跨应用AI协同体系Buddy One，打通腾讯会议、腾讯文档、ima、腾讯网盘等办公产品的账号与协作能力。其中，腾讯文档、ima及腾讯网盘将接入WorkBuddy的Agent技术底座，共享其任务执行能力。</p>\n<p>过去分别承担会议沟通、文档编辑、知识管理的办公产品，开始共享同一套Agent执行能力。</p>\n<p>这种变化甚至可能影响部分办公软件未来是否还需要独立存在。</p>\n<p>腾讯集团高级执行副总裁、云与智慧产业事业群CEO汤道生向全天候科技等媒体表示，如果未来用户逐渐不再使用腾讯会议的独立版本，而是习惯在WorkBuddy中完成会议相关工作，腾讯届时可能重新考虑是否还有必要维护独立客户端。</p>\n<p>当然，这还只是一个假设。汤道生同时强调，短期内用户已经形成的使用习惯很难改变，腾讯不会刻意要求用户转向另一款产品。</p>\n<p>但腾讯已经开始调整旗下办公产品之间的分工。</p>\n<p>这轮调整发生在WorkBuddy使用量快速增长之后。自今年3月上线以来，WorkBuddy累计完成90亿次用户任务请求，Token消耗较上线初期增长50倍。企业版已落地50多个行业，覆盖中国企业500强中的50%、企业100强中的60%。</p>\n<p>随着WorkBuddy逐渐成为腾讯AI办公体系的核心，腾讯需要处理的也不再只是旗下产品如何协同。</p>\n<p>一方面，即便是腾讯内部的办公产品仍存在数据和权限边界，外部企业对于开放核心数据库则更加谨慎；</p>\n<p>另一方面，快速增长的Token消耗、逐渐激烈的市场竞争，也让WorkBuddy面临商业化考验。</p>\n<p>当腾讯进一步向第三方Agent和开发者开放能力，原有办公产品如何参与商业化、生态伙伴如何分享收益，也将成为这轮整合需要解决的新问题。</p>\n<h2>先把自己的产品接起来</h2>\n<p>腾讯并不缺少办公软件。</p>\n<p>会议、文档、知识管理、企业沟通、云存储，腾讯在这些领域都有独立产品，部分产品已经积累了庞大的用户基础。</p>\n<p>但即便同属腾讯，用户在不同应用之间切换时，仍可能需要反复上传资料、整理文件，向AI重新交代工作背景。</p>\n<p>此次发布的Buddy One，首先打通了这些产品之间的账号和资料检索能力。</p>\n<p>用户免费绑定Buddy One ID后，可以通过WorkBuddy检索已授权的腾讯文档、会议记录及ima知识库内容，并生成附带信息来源的回答。</p>\n<p>腾讯还统一了部分办公产品的AI积分体系。原有WorkBuddy积分升级为Buddy One积分，可以在WorkBuddy、腾讯文档、ima、腾讯网盘之间通用。</p>\n<p>更深一层的调整发生在技术底座。按照腾讯公布的方案，腾讯文档、腾讯网盘、ima等产品将打通WorkBuddy Agent底座，在各自应用中调用WorkBuddy的Harness能力。</p>\n<p>同步发布的腾讯网盘，则负责为不同应用及Agent提供统一存储，让此前积累的工作资料和任务成果能够在后续工作中继续使用。</p>\n<p>汤道生解释称，过去几十年，办公协作主要围绕文件展开。用户使用不同编辑器制作文档、PPT及报表，再交给其他人修改，反复传递不同版本。</p>\n<p>随着AI逐渐承担内容生成工作，这套协作方式也将发生变化。</p>\n<p>在他看来，过去围绕文件反复修改和传递的模式，在AI时代会“完全重新再设计”。</p>\n<p>按照腾讯的设想，未来用户可以直接向WorkBuddy提出需求，由Agent调用相应工具完成任务，腾讯文档、会议、网盘及设计产品继续提供各自的专业能力。</p>\n<p>但要让WorkBuddy真正承担这些工作，仅仅打通账号和技术底座还不够。</p>\n<p><strong>一方面，腾讯内部不同产品之间仍存在数据访问边界。</strong></p>\n<p>企业微信就是一个例子。10月14日推出的联合版本，已经允许WorkBuddy在授权范围内调用企业微信的部分工作信息。但这并不意味着，它能够直接读取所有聊天记录。</p>\n<p>目前企业微信拥有独立的聊天记录Agent，用于保护用户隐私，避免WorkBuddy直接访问其他员工的聊天内容。</p>\n<p>只有在获得充分授权的情况下，企业微信Agent才能与WorkBuddy交换信息。</p>\n<p>换言之，即使是在腾讯内部，将不同产品接入同一套Agent体系，也不等于WorkBuddy能够自由获取全部工作上下文。</p>\n<p><strong>另一方面，企业客户对于开放核心业务系统则更加谨慎。</strong></p>\n<p>此前，全天候科技走访生活用纸企业中顺洁柔发现，尽管WorkBuddy已经在这家企业内部广泛使用，截至10月10日开通账号接近1300个，但企业仍未向其开放核心数据库。</p>\n<p>中顺洁柔专门建立了独立的数据环境，只允许WorkBuddy访问经过筛选的数据，并根据员工身份设置不同的权限。</p>\n<p>WorkBuddy虽然逐渐成为腾讯AI办公生态的重要工作台，却仍面临两道墙：腾讯内部不同产品之间的信息边界，以及外部企业对核心业务数据的访问限制。</p>\n<p>目前，Buddy One已经实现的跨产品能力仍主要集中在账号互通、授权资料检索、积分共享及统一存储等方面，更进一步的跨应用记忆共享仍在推进中。</p>\n<p>腾讯丰富的办公产品和企业客户基础，为WorkBuddy提供了大量潜在的上下文来源。但这些分散的信息究竟能在多大范围内被Agent有效调用，仍是此次整合尚未完成的工作。</p>\n<h2>重新安排收费方式</h2>\n<p>办公产品逐渐围绕WorkBuddy整合，腾讯也开始重新安排收费方式。</p>\n<p>此次腾讯推出Buddy One VIP个人会员套餐，连续包月价格为700元。</p>\n<p>这一套餐同时提供WorkBuddy个人旗舰版、腾讯会议专业版、腾讯文档超级会员Plus等权益，并包含每月5万通用AI积分和1TB共享存储空间。</p>\n<p>值得注意的是，WorkBuddy个人旗舰版此前的连续包月价格同样为700元。此次Buddy One的变化，主要在于将原本分属不同办公产品的会员权益整合进同一套订阅体系。</p>\n<p>但对于企业市场，腾讯仍面临商业化压力。</p>\n<p>汤道生向全天候科技等媒体表示，腾讯目前尚未对WorkBuddy团队提出明确的收入目标，更多从支撑产品和服务发展的角度考虑商业化。</p>\n<p>随着WorkBuddy任务请求量不断增长，模型调用和算力消耗也随之增加。</p>\n<p>按照腾讯云的计费规则，WorkBuddy积分消耗由模型类型、Token用量及任务复杂度共同决定。用户执行的任务越多、使用的模型越复杂，相关资源消耗通常也越高。</p>\n<p>对于腾讯而言，快速增长的使用量意味着更大的市场机会，同时也需要持续投入算力资源。</p>\n<p>目前，腾讯已开始通过企业版的安全、可观测、管理等能力获取收入。</p>\n<p>按照腾讯云官网价格，WorkBuddy企业旗舰版定价为198元/人/月，包含每人每月2000积分；企业专享版则为316元/人/月。</p>\n<p><strong>这一价格也面临来自竞争对手的约束。</strong>飞书旗下豆包工作伙伴的团队订阅月付价格同样为198元/席。钉钉则在今年9月推出四个AI商业版本，将千问办公纳入不同版本的权益，并按照企业购买人数赠送相应积分。</p>\n<p>不同产品的功能和积分消耗规则并不完全一致，但办公Agent正在逐渐成为企业协作软件套餐的一部分。</p>\n<p>这意味着，腾讯需要证明WorkBuddy提供的任务执行能力和企业级服务，能够支撑其独立收费。</p>\n<p>对企业客户而言是否愿意持续付费，还取决于实际的投入产出。</p>\n<p>例如苏宁易购通过WorkBuddy可观测中心分析任务执行轨迹，调整提示词、模型和工具配置，将Token消耗降低10%；新华三员工每天与WorkBuddy的对话达到130万次，管理团队已经开始根据使用情况调整Token分配和激励策略。</p>\n<p>这些案例可以看出，随着Agent在企业内部普及，企业已经开始精细化管理AI资源的使用。</p>\n<p>但控制Token消耗与Agent最终能为企业创造多少经营收益，仍是两回事。</p>\n<p>对于WorkBuddy而言，未来的收入来源可能不止于软件订阅，还包括企业级管理能力、系统部署以及生态伙伴提供的专业服务。</p>\n<p>但腾讯仍需要证明，这些收入能够支撑持续增长的算力消耗和服务成本。</p>\n<h2>能走多远</h2>\n<p>腾讯的办公整合并没有局限于自身产品。</p>\n<p>此次大会上，汤道生还宣布，WorkBuddy将全面开放产品架构，支持企业自研Agent、第三方Agent以及第三方即时通信系统接入。</p>\n<p>他表示企业可以自主选择模型、Agent和即时通信工具。</p>\n<p>目前，WorkBuddy已经接入Slack、Telegram等海外协作工具。即便企业没有全面使用腾讯旗下的办公软件，也可以在原有系统中调用WorkBuddy。</p>\n<p><strong>这些动作也让WorkBuddy未来的产品形态逐渐清晰。</strong></p>\n<p><strong>对于个人用户，它正在成为统一的AI工作台。腾讯文档、会议、网盘等产品仍然保留独立形态，但也开始为WorkBuddy提供可调用的专业能力。</strong></p>\n<p><strong>对于企业，WorkBuddy则可能进一步成为汤道生所说的“企业智能中枢”。</strong></p>\n<p><strong>企业可以在WorkBuddy中接入自研Agent、第三方Agent及内部业务系统，将原本分散的智能体组织起来，形成可以跨系统执行任务的Agent网络。</strong></p>\n<p><strong>而在开发者一侧，腾讯已经开始搭建技能分发和交易体系。</strong></p>\n<p><strong>目前，WorkBuddy开放平台已汇聚超过5万家伙伴及开发者，上架Skills超过20万个。</strong></p>\n<p>其中，SkillHub承担技能上架、分发等功能。今年7月上线的SkillPay，则进一步打通技能调用与支付环节，让开发者和企业能够将专业能力封装成按次收费的Pay Skill。</p>\n<p>在这套体系中，WorkBuddy既是用户调用技能的入口，也有机会成为连接开发者、企业客户和第三方服务的交易渠道。</p>\n<p>但当越来越多产品通过Agent提供服务，原有的用户关系和商业利益也可能发生变化。</p>\n<p>类似的问题已经开始出现在腾讯地图身上。</p>\n<p>腾讯地图的地图能力正在通过MCP、Skill等方式向其他Agent开放。</p>\n<p>至于未来的商业模式，腾讯集团副总裁、腾讯智慧出行总裁钟翔平向全天候科技等媒体坦言，除了原有的接口调用收费，还可能出现流量分佣、按效果付费等形式，但具体模式目前尚未确定。</p>\n<p>这一问题同样可能出现在WorkBuddy与其他办公产品及第三方服务的合作中。当用户越来越多地通过WorkBuddy完成工作，原有产品提供什么能力、保留多少独立入口，又如何参与商业化，都可能需要重新安排。</p>\n<p>与此同时，国内办公Agent竞争仍在升温。飞书已经在原有协作平台内发展多Agent能力，字节跳动、阿里巴巴及百度等厂商也在继续扩展相关产品。</p>\n<p>对于WorkBuddy目前的市场地位，汤道生并没有急于下结论。</p>\n<p>他坦言，WorkBuddy当前确实处于“相对领先的位置”，但这一赛道才刚刚开始，未来几年产品仍需要持续迭代，其他厂商也在不断追赶。</p>\n<p>从统一个人办公入口，到连接企业内部的Agent网络，再到通过SkillHub、SkillPay吸引开发者提供专业能力，WorkBuddy正在向一个更完整的Agent生态延伸。</p>\n<p><strong>不过，这三个层次的发展并不同步。</strong></p>\n<p><strong>对于个人用户，腾讯已经开始整合旗下办公产品；对于企业，核心业务系统的接入仍受到数据和权限边界的限制；对于开发者，技能的分发与收费机制虽然已经建立，但能否形成持续的交易规模仍有待观察。</strong></p>\n<p><strong>腾讯已经为WorkBuddy搭建起连接产品、企业和开发者的框架。</strong></p>\n<p><strong>接下来，决定这套生态能走多远的，不仅是WorkBuddy能够调用多少工具，还包括企业愿意向它开放多少业务，以及那些提供能力的产品和开发者能否从中获得持续回报。</strong></p><p>本文来自华尔街见闻，欢迎下载APP查看更多</p>",

      "title": "现金流“烧穿了”！亚马逊电话会：加码支出，AI是“此生仅有的机遇”，零售业务被低估",
      "summary": "<p><img class=\" wscnph\" src=\"https://wpimg-wscn.awtmt.com/25670124-950a-429a-8ead-0061908c71d6.png\" /></p>\n<p>在AI算力强劲需求推动下，亚马逊三季度AWS云业务创下近五年来最快增速，管理层更是罕见给出了“未来两年AWS增速超40%、迈向万亿美元营收”的指引。</p>\n<p><a href=\"https://wallstreetcn.com/articles/3784799\">华尔街见闻提及</a>，10月29日美股盘后，亚马逊披露Q3营收同比增12%、略低于分析师预期，EPS同比不增反降3%，经营利润率逼近14%创历史新高。</p>\n<p>财报最大亮点仍是AWS云业务。三季度AWS净销售额同比增长39.3%至459.8亿美元，较分析师预期高1.3%，创将近五年来最高单季增速，季末年化收入运转率达1840亿美元，环比二季度末时增长8.9%。</p>\n<p>随后电话会议上，亚马逊CEO Andy Jassy将当前AWS的增长逻辑描述为一个自我强化的\"飞轮\"：<strong>领先的功能与安全性吸引客户迁移上云，云端集中的数据与应用反过来驱动AI推理需求，AI推理又带动核心计算、存储与网络消耗，进而推动AWS在基础功能上持续再投资</strong>。</p>\n<p>Jassy预计AWS在2027年和2028年的增速均可超过40%，并有望在未来五至十年内实现年收入突破1万亿美元。与此同时，公司积压订单达5780亿美元，同比增速达三位数。</p>\n<p>管理层同时强调，AI需求将继续推高资本开支。<strong>Jassy将AI称为“一生中仅有的机遇”，并表示公司有能力为这一计划提供资金</strong>。<strong>Amazon预计2026年现金资本开支约为2200亿美元，其中多数用于AWS，并预计2027年支出将“显著增加”。</strong></p>\n<div>\n<h2 id=\"14-ai-aws\">“每14秒安装一个AI加速器”：AWS云业务全面爆发</h2>\n</div>\n<p>作为亚马逊的利润引擎，AWS在本季度的表现打破了市场对其“体量过大难以维持高增长”的担忧。</p>\n<p>AWS Q3营收达到460亿美元，同比增长39.3%，实现了连续第六个季度的加速增长，创下近五年来的最快增速。目前的年化营收运转率已高达1840亿美元。</p>\n<p>CEO Andy Jassy 在会上用极具画面感的原话向投资者描述了当前的狂热需求：</p>\n<blockquote>\n<p>我们大约每14秒就安装一个AI加速器，而几乎在我们安装产能的同时，客户就把它们抢光了。</p>\n</blockquote>\n<p>不仅是眼前的火爆，未来的订单池同样深不可测。据披露，AWS目前的未积压订单高达5780亿美元，同比呈现三位数增长。</p>\n<p>对于未来，Jassy给出了极具想象空间的业绩指引：</p>\n<blockquote>\n<p><strong>在如此庞大的基数下，我们预计AWS在2027年和2028年的年增速都将超过40%。我们相信，AWS在未来5到10年内将成为一个营收超万亿美元的业务。这绝对是一个极其罕见的非凡机遇。</strong></p>\n</blockquote>\n<p><strong>Amazon将Bedrock列为AWS AI增长的关键服务。</strong></p>\n<p>公司称，财富500强企业在Bedrock上的支出同比接近7倍，Bedrock的token总量同比增长近17倍，是AWS历史上增长最快的数十亿美元级服务。</p>\n<p><strong>Jassy将Bedrock定位为多模型聚合平台，认为未来两到三年内将有六至八个旗鼓相当的前沿模型并存，大多数企业将同时使用多个模型，甚至在同一个生成式AI应用中混合调用</strong>。</p>\n<p>他将Bedrock的长期潜力与EC2相比拟，认为其规模\"可能与EC2一样大\"。</p>\n<div>\n<h2 id=\"a392c6e7\">回应巨额资本开支：“这是一生一次的机会”</h2>\n</div>\n<p>市场始终高度关注科技巨头在AI领域的巨额资本开支能否转化为实际利润。</p>\n<p>亚马逊第三季度资本支出为759亿美元，主要用于AWS和AI基础设施建设，以支撑客户的强劲需求。公司管理层坚信AI是一个巨大的机遇，有望在长期驱动营收和自由现金流的增长，以及优异的已投资资本回报率。</p>\n<p>截至9月30日的过去12个月，亚马逊经营现金流达到1683亿美元，同比增长29%。<strong>自由现金流则为负424亿美元，而去年同期为正148亿美元。</strong></p>\n<p><strong>亚马逊维持全年约2200亿美元现金资本开支的预期，没有在本次财报中进一步上调，不过预计2027年这一支出还将“显著增加”。</strong></p>\n<p>面对这种“烧钱”速度，Jassy的立场异常坚定。他坦言，这是构建长期平台的战略，而非短期出租数据中心：</p>\n<blockquote>\n<p><strong>AI是我们一生一次的机会，它是我们有生之年最大的技术变革。如果我们能将一个1840亿美元年营收的业务连续两年保持40%以上的增速，并最终走向万亿美元，为了继续保持领导地位，我们必须投资。</strong></p>\n</blockquote>\n<p>Jassy用一句话总结了这场豪赌的意义：</p>\n<blockquote>\n<p>我们有能力为这一计划提供资金，我认为它将永远改变亚马逊的规模，永远改变我们的营收和自由现金流。</p>\n</blockquote>\n<p><strong>除了买算力，亚马逊自研芯片的效益正在显现。</strong></p>\n<p>Q3单季度，使用亚马逊定制芯片（Graviton和Trainium）的客户节省了超过20亿美元。Trainium和Graviton的收入承诺同比增加了20倍以上。Jassy透露：</p>\n<blockquote>\n<p><strong>由于Trainium的需求如此强劲，客户不断鼓励我们将其在AWS之外提供，我们打算在2027年底这样做。</strong></p>\n</blockquote>\n<div>\n<h2 id=\"db797a3\">“人们有些低估了零售业务”：生鲜成为新引擎，超百万台机器人上岗</h2>\n</div>\n<p><strong>电商业务方面，三季度销售仅同比增长2%，创2023年初以来最低单季增速</strong>。亚马逊对假日季、第四季度销售的指引中值逊于分析师预期也显示，其线上业务短期内恐难迅速回暖。</p>\n<p><strong>但管理层强调剔除Prime Day时间错配的影响</strong>，北美和国际业务依然保持了6%和8%的增长。</p>\n<p>今年亚马逊Prime会员日销售活动的时间安排有所调整：包括美国在内的大多数主要市场均将活动移至第二季度，而2025年的Prime Day全部安排在第三季度。</p>\n<p>剔除Prime Day时间调整的影响，2026年第三季度同比增速将提高约4个百分点。管理层认为第三季度客户参与度强劲，延续了上半年的增长趋势。Jassy 特别提醒市场不要低估其实体店和零售业务的进展：</p>\n<blockquote>\n<p>我认为有些人有点忽视了这项业务取得了多少进展。我不知道还有哪家零售企业的营收能接近亚马逊的数千亿美元规模，并且在保持两位数营业利润率（包含广告）的同时还能以这种速度增长。</p>\n</blockquote>\n<p><strong>其中，生鲜杂货和日常必需品成为了巨大的流量入口，其增速是其他零售类别的3倍</strong>。</p>\n<p>数据显示，购买生鲜并使用当日达服务的客户，其购买日常必需品的数量是不使用该服务客户的7倍；同时，这些生鲜客户在非杂货类别（如家居、服装）上的花费也是其他客户的2倍以上。</p>\n<p>在降本增效方面，机器人技术功不可没。CFO Brian Olsavsky 指出，目前亚马逊履约网络中已有超过100万台机器人投入使用。</p>\n<p>在2026年，亚马逊将其机械臂（如Cardinal和Sparrow）的车队规模增加了一倍，这使得<strong>公司在面临燃料和运输成本上涨的逆风下，依然连续第四年降低了单件履约成本。</strong></p>\n<p><strong>关于广告业务</strong>，Q3广告业务营收达196亿美元，增速放缓主要是因为Prime Day促销时间调整等短期因素拖累了约8.5个百分点。管理层预计，Q4广告增速将大幅回升至接近20%的高位水平。</p>\n<p>针对即将到来的四季度，亚马逊给出了强劲的指引：预计Q4净销售额将在2400亿至2470亿美元之间；营业利润预计在285亿至335亿美元之间。</p>\n<p><strong>亚马逊Q3季度财报电话会全文（AI辅助翻译）：</strong></p>\n<blockquote>\n<p>欢迎各位参加亚马逊2026年第三季度财务业绩电话会议。本次会议所有与会者均处于仅收听模式，演讲结束后将进行问答环节。本次电话会议全程录音。</p>\n<p><strong>投资者关系副总裁 Dave Fildes 致辞</strong></p>\n<p>欢迎参加我们的2026年第三季度财务业绩电话会议。今天与大家共同回答问题的，是我们的首席执行官 Andy Jassy 和首席财务官 Brian Olsavsky。</p>\n<p>在收听本次电话会议的同时，建议各位参考我们的新闻稿，其中包含本季度的财务业绩、各项指标及相关说明。除非另有说明，本次通话中的所有比较均以2025年同期业绩为基准。我们今天的评论和回答仅代表管理层截至2026年10月29日的观点，并包含前瞻性陈述，实际结果可能存在重大差异。</p>\n<p>影响我们财务业绩的潜在因素详见今日新闻稿及我们向美国证券交易委员会（SEC）提交的文件，包括最新的10-K年度报告及后续文件。本次通话中，我们可能会讨论若干非GAAP财务指标，相关补充披露及与可比GAAP指标的调节说明，均可在我们的投资者关系网站上查阅。</p>\n<p>我们的业绩指引综合考虑了迄今观察到的订单趋势及我们认为合理的假设，但实际结果本质上具有不可预测性，可能受到多种因素的重大影响，包括：外汇汇率和能源价格波动、全球经济及地缘政治形势变化、关税和贸易政策、资源和供应波动（包括内存芯片）、客户需求及消费支出变化（包括衰退担忧、通货膨胀、利率及地区劳动力市场制约的影响）、全球事件、互联网及在线商务增速、云服务与新兴技术发展，以及我们向SEC提交文件中详述的其他各类因素。</p>\n<p>我们的业绩指引假设，我们不会完成任何额外的业务收购、重组或法律和解。由于无法准确预测市场对我们商品和服务的需求，实际结果可能与指引存在重大差异。</p>\n<p>下面，我将把电话转交给 Andy Jassy。</p>\n<p><strong>首席执行官 Andy Jassy 致辞</strong></p>\n<p><strong>营收与利润概览</strong></p>\n<p>本季度营收为2019亿美元，同比增长12%；运营利润为281亿美元，同比增长61%。第三季度是亚马逊又一个强劲季度。</p>\n<p><strong>AWS业务</strong></p>\n<p>AWS 的战略正在有效推进。尽管面临去年同期大规模扩容带来的高基数效应，AWS 的同比增速仍达到 39.3%，连续第六个季度加速，创近五年来最快增速。合同积压金额达 5780亿美元，同比实现三位数增长，且结构多元化。我们大约每14秒就安装一台AI加速器，容量几乎刚一上线就被客户抢占一空。核心计算与存储业务收入均实现近年来最快增速。我们的核心业务运营利润率长期处于高位，AI业务的利润率也在快速改善，进度远超核心业务在类似发展阶段的水平——即便面临内存等关键组件成本上升以及资本支出带来的大量折旧压力，情况依然如此。我们持续加快资本支出的回收周期，并比以往更加坚信：我们对AWS的投资将创造出一个远比两年前预想更大的业务规模，带来更高的营收、自由现金流和已投资资本回报率。</p>\n<p>AWS 正在形成一个强大的飞轮效应——借用 Jim Collins 在《从优秀到卓越》中对飞轮的描述：领先的功能、安全性和运营表现，推动客户将应用和数据迁移至AWS；客户迁移至AWS，又带动AI需求的增长，因为客户希望将生产推理部署在与其数据和应用相邻的位置；AI需求的增长，进而带动核心AWS需求，因为AI需要利用核心服务完成强化学习、后训练、工具调用等工作；而这一切又反过来推动我们不断加大对AWS整体功能的再投资。这与单纯提供GPU托管或短期数据中心容量租赁的模式截然不同，而是一种长期平台战略——广泛帮助客户创新和迭代其用户体验，稳定运营，并建立可持续多年的可靠伙伴关系。这一战略也为我们带来极具吸引力的长期经济收益，不依赖于供应稀缺性。</p>\n<p><strong>AWS进展举例</strong></p>\n<p>在核心业务方面，需要强调的是，全球IT支出的绝大部分——约85%——仍在本地部署。未来10到20年，这一格局将逐步向云端转移。以往业界普遍认为，主机或存储区域网络等关键工作负载永远不会迁移至云端，但随着AWS推出独特的云端替代方案和AI驱动的迁移能力，这类工作负载已开始加速向云迁移。企业客户由此受益：资本支出减少、运营成本降低、创新速度加快、开发者生产力提升，以及数据可访问性增强，从而更便捷地利用AI。我们的核心业务拥有极具吸引力的利润率，这得益于我们在过去20年间精益运营所积累的深厚经验。随着核心业务的持续增长，我们不断将资源再投入到核心AI功能的建设中。</p>\n<p>举例而言，随着客户生成的数据量日益增大，并寻求通过数据分析和AI从中获取价值，在不同数据存储和分析引擎之间移动数据变得繁琐且昂贵。通过收购 DuckLabs，DuckDB 将成为AWS存储分析的通用SQL方言，以现代化的分析引擎简化数据处理——该引擎速度快、易用性强、覆盖面广。客户只需编写一次SQL查询，便可通过任意AWS分析服务执行。这将是分析领域的首次突破，客户无需在不同查询引擎之间承担任何迁移或移植成本，意义重大，对未来代理（Agent）高效查询同样大有裨益。</p>\n<p>在AI业务方面，我们持续扩展推理服务 Amazon Bedrock 的功能，带动了显著的业务增长：财富500强企业在Bedrock上的支出同比增长近7倍，Bedrock总token用量同比增长近17倍。Bedrock 是AWS历史上增长最快的数十亿美元量级服务。我们近期已将 OpenAI 模型接入Bedrock，使用量增长迅速；同时新增了 Kimi、GLM 及 SpaceX 模型的 Bedrock 托管版本。</p>\n<p>如今，任何关于AI的讨论都绕不开安全性，这也是客户持续选择Bedrock的重要原因之一。我们在设计上确保客户数据的安全性与私密性：输入和输出内容绝不会与模型提供商共享，也不会用于训练基础模型；当客户对基础模型进行微调时，我们会为其专属使用创建独立的私有副本，数据在传输和存储过程中均进行全程加密。</p>\n<p>随着前沿模型能力不断增强，它们正以前所未有的速度发现此前未被察觉的软件漏洞。为此，我们构建了 AWS Continuum，以机器速度发现、优先排序、验证并修复代码漏洞，目前已有 Capital One、IBM、Infor、Luminate 和 Robinhood 等企业客户采用。第三季度，我们宣布将其集成到代码编写工具中，包括 Anthropic 的 Claude Code、OpenAI 的 Codex 以及 AWS 的 Cura。来自客户的关注度超过了我们有史以来推出任何安全服务时所见到的水平。</p>\n<p>代理（Agent）的部署速度持续加快，其中许多基于 Bedrock Agent Core 构建。目前已有数万名客户使用 Agent Core，第三季度部署的代理数量是此前三个季度之和的2倍。除自行构建专用代理外，大多数企业还会使用开箱即用的代理服务，我们提供了多款深受客户喜爱的服务：面向代码编写的 Kiro、面向联络中心代理的 Amazon Connect、面向迁移的 Amazon Transform，以及作为智能AI工作助手的 Amazon Q——均在快速迭代并赢得客户的广泛认可。尤其是 Amazon Q，随着 Mondelez、EchoStar、3M、西南航空、DXC 等大型企业纷纷选择它作为专为工作场景打造、对客户数据零妥协的AI伴侣，其增长极为迅速。</p>\n<p>芯片业务同比继续实现三位数增长，Graviton 和 Trainium 的营收承诺均同比增长超过20倍。AI 为 Graviton 带来额外增长动力，原因在于后训练强化学习和代理工具调用主要运行在CPU而非AI加速器上，而 Graviton 是最强劲的CPU芯片，比其他替代方案具有高出30%至40%的性价比优势。客户在第三季度仅通过使用我们的定制芯片就节省了超过20亿美元。我们还刚刚将 TorchNeuron 开源，使开发者无需改写任何代码，便可直接将现有的 PyTorch 代码运行在 Trainium 上（绝大多数开发者目前已在使用 PyTorch）。</p>\n<p>随着新一代芯片的推出，上一代芯片的需求依然强劲：Graviton 5 发布后，上一代 Graviton 实例的积压订单仍环比翻倍；上一代 Trainium 实例的短期容量售价也较上半年呈现溢价。鉴于 Trainium 需求如此旺盛，客户持续鼓励我们将其面向 AWS 以外的市场开放。我们计划于2027年底启动外部销售。</p>\n<p>整体而言，AWS容量需求依然极为强劲。客户在大规模推理应用方面仍处于非常早期的阶段，但推理业务已占AWS AI营收的一半以上且比例持续上升；与此同时，我们的训练业务营收同样可观。我们维持2026年资本支出约2200亿美元的预期，其中大部分用于AWS；并预计2027年资本支出将进一步大幅增加，且清晰可见有吸引力的财务回报路径，正如我在上次电话会议中所阐述的那样。</p>\n<p>AWS 目前的年化营收运行率已达1840亿美元，但发展机遇依然巨大。凭借我们持续的创新步伐、不断完善的核心与AI功能、企业客户将核心及AI工作负载迁移至AWS的强烈意愿，以及我们每年持续扩充的容量规模，我们相信AWS在2027年和2028年均能实现40%以上的增速，并在未来5至10年内成为年营收超万亿美元的业务。我们正处于这一拐点的极早期阶段，战略正在奏效，我相信这一势头在可预见的未来将持续下去。</p>\n<p><strong>零售业务</strong></p>\n<p>我认为，部分人士对这项业务近年来所取得的进展及其已达到的规模尚未给予充分重视。我不知道还有哪家零售企业能在达到亚马逊体量（数千亿美元）的同时，在包含广告收入的情况下实现两位数的运营利润率，并以如此之快的速度增长。</p>\n<p>今年迄今，销售单位同比增长近15%，且是在一个极为庞大的基数上实现的——去年全年销售商品超过300亿件。以绝对金额计算，过去12个月我们新增了逾900亿美元的商品销售额（GMV），增速明显快于其他零售竞争对手，每季度新增的GMV约为美国第二大竞争对手的两倍，并持续在各零售细分市场抢占份额。</p>\n<p>过去几年，我们的北美和国际业务板块均将运营利润率提升了近10个百分点，这使我们能够持续将资源再投入到改善客户体验中。当然，这一切仍处于早期阶段——目前零售销售的绝大部分（近80%）仍发生在实体店，未来这一格局将逐步向电子商务转移。我们正通过快速构建高效、快速的履约网络，在为客户提供卓越购物体验的同时，创造可观的自由现金流和已投资资本回报率，从而积极推动这一转变。</p>\n<p>我们各项战略重点——更快配送、降低单位服务成本、生鲜杂货与药品业务，以及AI购物——相互强化，目前各项工作均在全力推进。随着我们持续投入当日达网络建设，以及 Amazon Now 和 Amazon Prime Air 超快配送服务的推进，配送速度不断刷新纪录。本季度是我们全球有史以来最快的第三季度，仅第三季度就有超过15亿件商品实现了当日或隔日送达Prime会员手中。</p>\n<p>Amazon Now 在全球范围内的快速推广令我们备受鼓舞，目前已覆盖超过450个城镇和城市，通过 Amazon Now 下单的商品数量同比增长10倍。我们有望连续第四年降低单位服务成本，这使我们能够持续以具有竞争力的价格提供品种丰富的新鲜杂货和日常生活必需品。</p>\n<p>配送速度的提升推动了我们杂货业务的快速增长（包括生鲜和日常必需品），过去12个月的商品销售额增长至近2500亿美元。第三季度，新鲜杂货和日常必需品的增速约为我们其他品类的3倍，占全部销售单位的约一半。当日送达生鲜杂货的客户购买日常必需品的数量，是不购买生鲜杂货客户的近7倍；购买生鲜杂货的客户在家居、服装等非杂货品类的购买频次约为非杂货客户的4倍，在这些品类上的消费额也高出2倍以上。</p>\n<p>Amazon Pharmacy 同样增势迅猛：使用客户数量同比增长超过60%，增速在2026年各季度持续加快；复购客户同比增长超过50%。JD Power 连续第三年将 Amazon Pharmacy 评为邮购药房第一名，我们也在持续提升服务能力，目前已在超过350个城市提供三小时处方送达服务。</p>\n<p>在AI购物方面，过去12个月，超过4亿名客户使用了购物代理助手 Alexa，与Alexa的客户互动量同比增长570%，使用 Alexa 购物的美国客户每单消费额比不使用 Alexa 的客户高出50%。Alexa 为用户研究商品、比较选项、查看全年价格历史、获取个性化礼品推荐，并代用户追踪优惠和降价信息。我们预计，尽管未来会有水平向代理与我们协同，Alexa for Shopping 仍将是客户在亚马逊购物时使用的主要购物代理——始终陪伴在您身旁，帮您浏览、获取灵感、解答商品页面上的细节问题，并能在了解您历史购买记录、收货地址和支付信息的前提下，只需您一声吩咐便完成下单，这对客户而言极为便捷和贴心。</p>\n<p><strong>广告业务</strong></p>\n<p><strong>广告业务第三季度营收为196亿美元，同比增长12%。本季度增速受若干时间性因素影响：</strong></p>\n<p><strong>第一</strong>，我们将大多数国家的Prime会员日活动移至第二季度，这意味着2025年第三季度原有的大量销售和广告收入转移到了2026年第二季度，对Q2同比增速构成顺风、对Q3构成逆风，对广告业务Q3同比增速产生了约850个基点的环比影响。</p>\n<p><strong>第二</strong>，2026年第二季度包含NBA on Prime的首个赛季，而去年Q2没有，第三季度也没有NBA（NBA将于第四季度开播）。</p>\n<p><strong>第三</strong>，2025年第三季度，我们调整了搜索引擎营销项目以引导更多流量至亚马逊搜索页面，这为客户提供了更好的体验，同时我们也能以更高费率变现该流量。此举从一年前开始推动广告收入增速加快，而第三季度我们开始面临该效应的高基数比较压力。</p>\n<p><strong>我们预计，第四季度广告业务同比增速将恢复至高十几个百分点的水平。</strong></p>\n<p>关于外部水平向代理购物是否对亚马逊广告业务产生实质性冲击，答案是否定的。目前，通过这种方式购物的用户数量极少，体验尚不成熟，也远不如直接访问零售商进行研究或一键下单便捷。</p>\n<p>第三季度，广告团队推出了大量创新产品，其中最重要的是亚马逊广告代理（Amazon Ads Agent），将我们完整的广告产品体系整合在一个以AI为核心的平台上，依托万亿级购物、浏览和流媒体信号，在洞察输出、问题解答、优化建议等每个环节为广告主提供支持，并代表广告主执行相应操作。我们还推出了全漏斗广告活动功能，将赞助广告、展示广告、视频广告和流媒体TV广告整合到同一广告活动中。广告主只需提供初始预算和投放时长，亚马逊AI将负责规划、执行和持续优化其余所有事项。</p>\n<p><strong>其他业务亮点</strong></p>\n<p><strong>Prime Video 已成为一项重要业务，年营收运行率达数百亿美元，自身已实现盈利。</strong>我们推出了《嘉莉》、《我变美的那个夏天》、《黑袍纠察队》、《校外》、《神秘博士》和《辐射》等热播剧集，以及《拯救计划》等突破性院线电影，同时还拥有极具竞争力的直播体育内容，包括周四橄榄球之夜（2026赛季开局创历史最佳）、NBA on Prime、NASCAR、名人赛及欧冠足球赛事。</p>\n<p>我们刚刚推出了迄今最强大的硬件产品阵容，横跨 Echo、Kindle、Alexa 平板、Fire TV、Ring 及 Blink 共34款新品。目前虽处于发布初期，但势头非常强劲，期待更多客户在节日季获得这些产品体验。</p>\n<p><strong>最后，Amazon Leo 商业服务仍按计划于今年启动初始服务。</strong>随着re:Invent大会和节日季的临近，我们正进入全年最令人期待的阶段之一。感谢亚马逊全体同仁的辛勤付出与不懈创新，让客户的生活每天都变得更美好、更便捷。</p>\n<p><strong>亚马逊正在构建前所未有的商业版图。历史上从未有过年营收达万亿美元的企业，而亚马逊正处于同时拥有两个万亿美元级业务——AWS和零售——的路径之上。这是极为罕见的，我们对未来充满期待。</strong></p>\n<p>下面请 Brian 发言。</p>\n<p><strong>高级副总裁兼首席财务官 Brian Olsavsky 致辞</strong></p>\n<p><strong>营收概览</strong></p>\n<p>全球营收为2019亿美元，同比增长12%，剔除外汇影响后同比增长13%。全球运营利润为281亿美元，运营利润率为13.9%，创历史最高水平。</p>\n<p><strong>北美和国际业务板块</strong></p>\n<p>首先提醒各位，今年Prime会员日销售活动的时间安排有所调整：包括美国在内的大多数主要市场均将活动移至第二季度，而2025年的Prime Day全部安排在第三季度。剔除Prime Day时间调整的影响，2026年第三季度同比增速将提高约400个基点。第三季度，客户参与度强劲，延续了上半年的增长趋势。</p>\n<p>北美：第三季度营收为1129亿美元，同比增长6%。<br />国际：第三季度营收为431亿美元，剔除外汇影响后同比增长8%。<br />全球付费商品销售单位：同比增长12%。<br />Prime 会员体系依然是我们业务的重要支柱，数亿Prime会员对我们丰富的商品选择、低价策略和创纪录的配送速度给予了积极响应。过去一年，Prime会员每月通过同日达下单的新鲜杂货订单量增长了逾三倍。</p>\n<p><strong>盈利能力</strong></p>\n<p>北美：运营利润87亿美元，运营利润率7.7%。<br />国际：运营利润16亿美元，运营利润率3.7%。<br />在履约网络方面，团队克服了燃油通胀和干线运费上涨带来的运输成本压力。尽管面临上述逆风，我们在第三季度仍通过优化库存布局、缩短配送距离和包裹合并等措施整体降低了单位服务成本。配送成本同比增长11%，而单位增速为12%；剔除燃油和干线运费通胀影响，配送成本增速为8%，约比单位增速低400个基点。</p>\n<p>机器人和AI技术在生产效率和员工安全方面带来了可量化的收益，预计将在未来持续复利增长。2026年，我们将以Cardinal和Sparrow为代表的机器臂数量翻倍，同时正在研发机器人基础模型，以加速机器人编程并逐步教会机器人执行日益复杂的物理任务，目标是大规模部署实用型机器人。展望未来，我们看到了在全球履约网络中大幅提升生产效率、持续降低单位服务成本的重要机遇，同时不断加快商品送达速度。虽然我们的运营利润率可能逐季波动，但我们致力于推动单位服务成本的长期持续改善。</p>\n<p><strong>AWS业务板块</strong></p>\n<p>AWS 第三季度营收为460亿美元，同比增长39.3%，核心服务与AI服务均有贡献。季度环比新增营收38亿美元，年化营收运行率已达1840亿美元。客户持续迁移至云端并扩大AWS核心服务的使用规模；同时，寻求全面受益于AI能力的客户正在加快向云端迁移的步伐。我们观察到AI支出与核心服务营收增长之间存在显著的正向关联——随着客户AI投入的增加，核心服务消费量也随之上升。随着更多AI工作负载进入生产阶段，这种关联效应预计将进一步增强，带动计算、存储和网络需求持续扩大。</p>\n<p>AWS 运营利润为178亿美元，运营利润率为38.7%，反映了强劲的增长势头和我们持续提升运营效率的成果。对定制芯片和定制网络的投资，以及软件和流程改进，正在帮助我们优化容量配置，构建更具成本效益的基础设施。正如我们长期以来所言，AWS运营利润率将随不同时期的投资力度而波动。AI产品正在获得越来越多客户的认可，AI营收同比实现三位数增长。</p>\n<p><strong>资本支出</strong></p>\n<p><strong>第三季度资本支出为759亿美元，主要用于AWS和AI基础设施建设，以支撑客户的强劲需求。我们坚信AI是一个巨大的机遇，有望在长期驱动营收和自由现金流的增长，以及优异的已投资资本回报率。</strong></p>\n<p><strong>第四季度财务指引</strong></p>\n<p>净销售额：预计在2400亿至2470亿美元之间。<br />外汇影响：基于当前汇率估算，预计将对营收增速产生约60个基点的逆风效应。<br />运营利润：预计在285亿至335亿美元之间。<br />关于第四季度指引需特别说明的一点：Amazon Leo 商业服务按计划于今年启动初始服务，我们预计从明年第一季度起开始将部分相关成本资本化，包括生产和发射成本。这一时间点晚于此前电话会议中的预测，因此第四季度大部分 Leo 相关成本将继续计入费用。</p>\n<p>我们已做好充分准备，迎接本次节日购物季，并为数百万在AWS上构建业务的客户提供支持。感谢亚马逊全体团队的辛勤工作和对客户的高度专注。我们坚信，持续提升客户体验是为股东创造持久价值的唯一可靠途径。</p>\n<p><strong>下面进入问答环节。</strong></p>\n<p><strong>问答环节</strong></p>\n<p><strong>问题一：Justin Post（美国银行）</strong><br /><strong>提问： 云业务加速令人欣喜，但环比增速有所放缓，请问背后有哪些因素？另外，Brian，燃料成本对第四季度指引有何影响？</strong></p>\n<p><strong>Andy Jassy 回答（AWS增速）：</strong></p>\n<p>我们对39.3%的增速非常满意——这是一个年化营收运行率高达1840亿美元的业务，实现这一增速实属不凡，是近五年来最快的，也是连续第六个季度加速。推动增长的因素是多方面的。</p>\n<p>在AI方面，我们拥有从底层到顶层的完整技术栈：如果要构建自己的模型，SageMaker AI是最简便的方式；如果要调用领先的前沿模型，Bedrock提供了高安全性和极具竞争力的性价比；如果要构建自己的代理，我们有 Strands 和 Agent Core；如果要使用开箱即用的代理服务，Kiro（代码编写）、Connect（呼叫中心）、Transform（迁移）和 Q（AI工作助手）等产品均在快速获得客户采用。此外，芯片方面我们也处于有利地位。对于大规模使用AI的企业客户而言，尤其是在将更多推理部署到生产环境之后，他们迫切希望优化性价比，而 Trainium 在性价比上相比其他替代方案具有显著优势。同时，随着AI应用的全面铺开，强化学习、后训练、工具调用等工作对核心算力的需求日益旺盛，而 Graviton 作为领先的CPU芯片，在性价比上比其他x86方案高出约30%至40%。这些因素共同推动了显著的业务增长。</p>\n<p>每季度新增的容量有所不同，但在1840亿美元年化运行率的基础上，展望2027年和2028年实现40%以上的同比增速，是相当可观的。我们相信AWS有望在5至10年内成为超万亿美元的业务，这是一个极为难得的机遇。</p>\n<p><strong>Brian Olsavsky 回答（燃料成本）：</strong></p>\n<p>关于燃料和干线运费通胀的影响，我没有精确的数字，但第四季度该成本将略高于第三季度。年初我们对FBA卖家的运费增加了燃油附加费，可覆盖部分成本，剩余部分则体现在零售入库和出库运输中。这一成本在第四季度会略高于第三季度。</p>\n<p><strong>问题二：Brian Nowak（摩根士丹利）</strong><br /><strong>提问： AWS万亿美元营收的判断依据是什么？另外，2027年机器人技术的关键里程碑是什么？</strong></p>\n<p><strong>Andy Jassy 回答（AWS万亿美元路径）：</strong></p>\n<p>看看增速和营收运行率，再结合我们对2027年和2028年的预测——我们对大客户（数百兆瓦乃至数百万瓦级别的大容量预定）有着很好的可见度，这类客户必须提前锁定容量，我们对未来八至十个季度的需求情况把握较为清晰。将这些增速叠加在当前的营收规模上，数字会迅速攀升。</p>\n<p>我也不认为当前的使用量会很快消退——企业客户在生产应用中大规模普及推理的进程才刚刚开始。影响因素之一是推理成本，要使企业客户能够以我们所设想的方式使用推理，就必须持续降低成本，这也是我们构建Trainium定制芯片的核心原因之一。过去两年，推理成本已大幅下降，我预计未来还将持续下降。</p>\n<p>安全领域将是一个巨大的应用场景——当前前沿模型发现的漏洞是人类此前未能发现的，有观点认为未来一两年的token消耗中，相当大的比例可能仅用于安全领域。这是在代码编写等已成熟应用场景之上新兴的重大使用场景。进一步叠加AI助手的持续增长（无论是消费者场景还是企业工作场景，如Amazon Q），以及我认为几乎每一个现代企业生产应用最终都将被重写为具备代理能力的版本——因为这是快速行动并有效防范安全风险的必然路径。面向未来，可以想象的AI应用场景实在太多。因此，虽然无法精确预测5至10年后的情况，但我们认为AWS成为超万亿美元的业务并非没有可能，而是我们切实看到的发展方向。</p>\n<p><strong>Andy Jassy 回答（机器人技术里程碑）：</strong></p>\n<p>亚马逊目前在履约网络中部署了超过100万台机器人，它们对成本结构、生产效率和员工安全产生了显著影响——我们履约网络的安全指标已处于历史最低水平，过去四五年取得了巨大进步，机器人技术功不可没。尽管如此，无论是在已部署的系统还是在研发中的技术方面，我们都仍处于非常早期的阶段。</p>\n<p>我认为，未来我们履约中心的许多重复性工作将由机器人承担，同时我们也在投入各种不同形态的机器人，包括有望协助完成\"最后100码\"到客户住所配送的机器人。我们评估机器人投资的标准是：能否带来相当或更优的生产效率、安全水平、成本结构和配送时效——当经济账算得过来，我们就会在履约网络中大规模部署。在我们新一代的履约中心设计中，包括当日达中心的扩建，机器人的比重非常高。我们认为，机器人技术迄今已发挥了重要作用，但这与未来五年的影响相比，不过是冰山一角。</p>\n<p><strong>问题三：Mark Mahaney（Evercore ISI）</strong><br /><strong>提问： AWS未来两年的利润率结构是否相对稳定？生鲜杂货覆盖情况及对Prime会员消费提升的拉动效应如何？</strong></p>\n<p><strong>Brian Olsavsky 回答（AWS利润率展望）：</strong></p>\n<p>我们不对AWS的利润率进行单独指引，但可以提供一些背景信息。本季度38.7%的高利润率，是多年来在运营纪律、效率提升、容量优化、严格管控固定成本以及定制芯片占比持续提升等方面努力的综合结果，并非偶然。然而，也存在多重波动因素：AI超高速增长对整体利润率形成压力，因为AI业务目前的利润率低于整体；同时还有来自组件定价的成本逆风。AI业务的利润率虽在改善（正如Andy所说，已领先于核心业务在类似发展阶段的水平），但目前仍低于核心业务。总体而言，利润率将始终由多重因素共同决定，我们将持续致力于在成本和效率端发力，并应对新产品投入阶段的利润摊薄。</p>\n<p><strong>Andy Jassy 回答（生鲜杂货业务）：</strong></p>\n<p>我们在生鲜杂货方面的激动之情不亚于您。我们长期运营大型杂货业务，但此前主要聚焦于食品货架中间区域的商品——消耗品、罐头食品、药品、美妆产品。我们拥有全食超市这一领先的有机杂货零售商，其增速在杂货品类中居于前列，无论是营收端还是利润端均表现出色，正在推进新业态和城市\"日常购\"模式的布局，反响良好。</p>\n<p>我们一直深知，若要以我们所设想的方式服务客户，就必须拥有大众品类的主流供给，而这一切的起点就是生鲜杂货。从整体家庭消费视角来看，我们所能供应的商品类目与客户实际在我们这里消费的金额之间，差距最大的恰恰在于杂货品类，而大量杂货消费又以生鲜为起点。</p>\n<p>正是因此，我们对在当日达仓库体系中配送生鲜杂货所取得的进展感到振奋。日常必需品业务的增速是我们其他品类的约三倍，目前占全部销售单位的约一半。购买生鲜的同日达客户所购买的日常必需品单位，是不购买生鲜的客户的约7倍。这对缩小\"客户总消费潜力\"与\"在亚马逊的实际消费\"之间的差距具有重大意义。与此同时，杂货客户在家居、服装等非杂货品类的购买频次约为非杂货客户的4倍，在这些品类的消费额也高出约2倍。这些差异显著，我们相信，生鲜杂货方面的持续进展将最终使我们在更多购物场景中赢得客户的首选地位。</p>\n<p><strong>问题四：Eric Sheridan（高盛）</strong><br /><strong>提问： Bedrock 的市场机遇如何？对外销售 Trainium 的决策，如何平衡内部使用与外部销售？</strong></p>\n<p><strong>Andy Jassy 回答（Bedrock市场机遇）：</strong></p>\n<p>过去20余年服务技术客户的经验告诉我们：不存在\"统治一切的单一工具\"。无论是数据库还是分析领域，早期的领导者从来都不是唯一选项。AI领域亦然——最初大家认为TensorFlow是唯一的框架，结果 PyTorch 如今更为主流。模型领域也不会例外。</p>\n<p>我认为，未来两三年内将有六到八个旗鼓相当的主流模型并存，它们各自在推理、代码、视觉、延迟、成本等维度各有侧重，且都能满足95%以上的工作负载需求。大多数客户将同时使用多个模型，很多人甚至会在同一个生成式AI应用中混用多个模型。</p>\n<p>这正是客户真正需要的：一项支持宽泛模型选择、具备卓越性价比、安全性和访问控制强有力的服务，让他们可以在各模型能力此消彼长的过程中灵活切换。这正是Bedrock所提供的。我们同时拥有Anthropic和OpenAI等闭源模型，以及Kimi、GLM等开源模型，我认为西方世界对更多西方开源模型也有强烈需求，这一空间未来将继续扩展。Bedrock的市场机遇极为巨大，它有可能成为与EC2体量相当的AWS支柱业务。</p>\n<p><strong>Andy Jassy 回答（Trainium内外部平衡）：</strong></p>\n<p>这是一个我们仍在持续评估的问题。目前，同时拥有重要云业务和足够强大的外部销售级芯片的公司，实际上只有两家，处理这一平衡问题的规模和复杂度，是绝大多数企业都不会遇到的。</p>\n<p>当前所有先进芯片均由同一家代工厂生产，产能有限，每家公司都有分配额度，需要决定分配给外部销售和内部云部署的比例。</p>\n<p>这一取舍的逻辑在于：对外销售，能够在短期内更快确认营收（芯片出库即确认收入）；对内部署（以EC2实例或Bedrock的形式），虽然营收确认周期长，但可以在五六年内持续产生营收，最终带来更多的绝对营收和自由现金流。因此，这需要认真权衡。</p>\n<p>我们目前的做法与另一家面临同样选择的公司有所不同。如前所述，我们计划于2027年底启动Trainium的外部销售，未来可能每年都会重新审视这一平衡。两种渠道都将是重要的业务组成部分。我们构建高性价比、可扩展定制芯片的能力，将成为极具战略意义的竞争优势——既能优化自身成本结构，也能构建独立的外部芯片销售业务；而外部芯片销售与云基础设施，本质上是两种截然不同的商业模式。</p>\n<p><strong>问题五：Doug Anmuth（摩根大通）</strong><br /><strong>提问： 支撑未来两年及以后40%以上增速所需的资本支出规模如何？AWS服务器、网络和数据中心的投资回收期有何变化？</strong></p>\n<p><strong>Andy Jassy 回答：</strong></p>\n<p>先谈投资回收期——我们确实在持续缩短。不同类别的资产（AI与传统计算、不同融资方式等）有所差异，但整体上我们在延长有效使用寿命、缩短投资回收期方面一贯有良好的进展，目前也在持续推进。</p>\n<p>关于支撑上述增速所需的资本支出规模，答案是：相当可观。但我们认为，这是一次千载难逢的历史性机遇。在年化营收运行率已达1840亿美元的基础上，以39%的增速增长，并在此后两年每年继续以40%的速度增长，最终成为超万亿美元的业务——为了保持并巩固我们的领导地位，我们将坚定投入。如果这样的加速机遇能够分散在25年内发生，资本支出的压力会更小，但现实不是这样，机遇就在眼前。我们有能力支撑这一计划，这将永久改变亚马逊的体量——不仅是营收规模，还有自由现金流，我们将以此继续保持领先。</p>\n<p><strong>问题六：Ross Sandler（巴克莱银行）</strong><br /><strong>提问： 随着Bedrock上的token市场（推理即服务）规模扩大，且大部分工作负载运行在Trainium上，这一业务转型将如何影响AWS的营收增长，尤其是利润率？</strong></p>\n<p><strong>Andy Jassy 回答：</strong></p>\n<p>您说得对，Bedrock上的大部分工作负载确实运行在Trainium上，这在很大程度上是因为我们对Trainium的性价比非常满意——它使我们既能为客户保持尽可能低的价格，又能维持我们期望的利润水平。</p>\n<p>从更宏观的视角来看云计算行业的成本结构，有几个关键要素值得关注。</p>\n<p>第一是数据中心的持有方式：长期购买或长期租赁，比使用托管机柜（colocation）或新兴云服务商（neocloud）在运营利润率上好约3500个基点。</p>\n<p>第二是硬件层面：如果使用与所有人相同的硬件，成本结构就与市场均值相当；如果能使用差异化的硬件，就会拥有成本优势。</p>\n<p>我们的大部分容量是自有或长期租赁的，这比以托管机柜或新兴云服务商模式运营的竞争对手享有更好的运营利润率。加之我们运行在自研芯片上，无论是对客户的性价比还是对我们自身的经济效益而言，都带来了结构性的成本优势。我认为，这些优势将持续惠及客户，并有助于提升AWS整体的经济效益。</p>\n<p>感谢各位参与今天的电话会议。本次会议的回放将在我们的投资者关系网站上至少保留三个月。感谢您对亚马逊的关注，期待下个季度与您再次交流。</p>\n</blockquote><p>本文来自华尔街见闻，欢迎下载APP查看更多</p>",

      "summary": "<p style=\"text-align: left;\">云计算业务连续加速，却难以掩盖电商核心的疲态——亚马逊正在经历一场与谷歌类似的市场考验。</p>\n<p style=\"text-align: left;\">第三季度财报显示，亚马逊总营收同比增长12%至2019亿美元，低于分析师预期。AWS营收增速连续六个季度提升，但在线零售销售增速跌至三年低点，广告业务增速亦创下有记录以来最低水平。与此同时，第三季度设备与物业支出逾770亿美元，远超市场预期，过去12个月自由现金流录得负424亿美元。</p>\n<p style=\"text-align: left;\">财报公布后，亚马逊股价在盘后交易中下跌约7%，此前该股今年累计涨幅约5.6%。这一跌势与同期Alphabet的遭遇高度相似——<a href=\"https://wallstreetcn.com/articles/3784718?keyword=%E8%B0%B7%E6%AD%8C\" rel=\"noopener noreferrer nofollow\" target=\"_blank\">后者因搜索与广告营收低于预期</a>，周四收盘大跌13%，创该股有史以来单日最大跌幅。</p>\n<p style=\"text-align: left;\"><img class=\" wscnph\" src=\"https://wpimg-wscn.awtmt.com/4d7f6be7-6943-4cc2-b1c9-c5bfed4e16bc.png\" /></p>\n<p style=\"text-align: left;\"><img class=\" wscnph\" src=\"https://wpimg-wscn.awtmt.com/ffc8d01b-a11f-4f8b-bdcb-ba8710c1ed65.png\" /></p>\n<h2 style=\"text-align: left;\">AWS加速，但“超预期”门槛已被微软抬高</h2>\n<p style=\"text-align: left;\">AWS第三季度营收同比增长39%至460亿美元，高于上季度37%的增速，为连续第六个季度加速。首席执行官Andy Jassy在财报电话会上表示，AWS核心算力与存储租赁业务正以\"数年来最快的速度\"增长，并预计AWS未来两年每年均可实现逾40%的同比增长。</p>\n<p style=\"text-align: left;\">AWS的增长部分受益于OpenAI、Anthropic等AI公司的需求——这两家公司均依赖亚马逊服务器运行其模型。Jassy还透露，公司自研AI芯片Trainium将于2027年底开始向外部客户销售。</p>\n<p style=\"text-align: left;\">然而，AWS的亮眼表现并未能完全安抚市场。Emarketer分析师Sky Canaves表示：\"<strong>AWS加速增长未能达到过度膨胀的预期，也未能超越微软和谷歌设定的更高竞争标杆。</strong>云业务运营利润率的改善是一个积极信号，但这可能不足以消除市场对资本支出急剧攀升、以及自由现金流随之大幅下滑的担忧。\"</p>\n<p style=\"text-align: left;\">相比之下，<strong>微软同日公布云业务营收增长48%，且资本支出保持克制，股价周四跌幅不足1%。</strong></p>\n<h2 style=\"text-align: left;\">电商增速三年最低，Prime Day时间调整难辞其咎</h2>\n<p style=\"text-align: left;\"><strong>在线销售额第三季度仅增长2%至685亿美元，为2023年初以来最低增速。</strong>亚马逊将部分原因归结于Prime Day购物节促销活动的时间调整——今年大多数主要市场的Prime Day从第三季度提前至第二季度举行，导致相关销售收入未能计入本季度。</p>\n<p style=\"text-align: left;\">研究机构M Science分析师John Tomlinson认为，零售端的相对疲软\"在一定程度上\"与Prime Day时间调整有关，但他同时指出：\"这里出现了一点裂缝。市场对各公司AI支出规模的关注度非常高。\"</p>\n<p style=\"text-align: left;\">Sky Canaves则进一步指出，Prime Day时间调整\"并不能完全解释在线商店和广告增速的疲软，这表明消费者压力可能正在变得更加明显——消费者在能省的地方开始收手，这对广告主的投放意愿产生了连锁影响\"。</p>\n<p style=\"text-align: left;\"><strong>广告业务方面，第三季度营收增长11%，为亚马逊2020年单独披露该数据以来最慢增速。</strong>相比之下，从2025年第二季度至2026年第二季度，亚马逊广告业务每季度增速均超过20%。</p>\n<h2 style=\"text-align: left;\">资本支出飙升，自由现金流深度转负</h2>\n<p style=\"text-align: left;\">亚马逊第三季度在设备与物业上的支出逾770亿美元，远超分析师预期。过去12个月自由现金流录得负424亿美元，而上年同期为正148亿美元——这一逆转主要源于同期物业与设备采购同比增加948亿美元。</p>\n<p style=\"text-align: left;\">公司维持了此前在7月给出的2026年资本支出约2200亿美元的预测，但Jassy在电话会上表示，2027年的资本支出将\"大幅\"进一步增加。</p>\n<p style=\"text-align: left;\">这一支出节奏令投资者感到不安。彭博报道指出，即便是亚马逊这样高度多元化的企业，云业务的稳健增长也未能抵消市场对AI投入速度的担忧。</p>\n<h2 style=\"text-align: left;\">四季度指引低于预期，消费端隐忧浮现</h2>\n<p style=\"text-align: left;\">亚马逊预计四季度（假日购物季）营收在2400亿至2470亿美元之间，分析师此前平均预期为2445亿美元，指引中值略低于预期。四季度运营利润指引为285亿至335亿美元，分析师平均预期约330亿美元，指引区间下沿明显低于市场预期。</p>\n<p style=\"text-align: left;\">第三季度运营利润为178亿美元，高于上年同期的114亿美元。</p>\n<p style=\"text-align: left;\">Jassy在电话会上着力强调公司核心业务的健康状况。他指出，食品杂货与日用品销售额在截至9月的12个月内接近2500亿美元，增速是整体电商的三倍，占第三季度所有商品销售单元的约一半。购物聊天机器人Alexa for Shopping在过去12个月内的用户数超过4亿，高于上季度披露的3.5亿。</p>\n<p style=\"text-align: left;\">但上述积极信号均未能扭转盘后股价的跌势。</p>\n<h2 style=\"text-align: left;\">与Alphabet同病相怜，市场情绪高度共振</h2>\n<p style=\"text-align: left;\">亚马逊此次遭遇的市场反应，与同期Alphabet的处境形成了明显呼应。Alphabet三季报显示，搜索广告营收同比增长12%至633亿美元，低于市场预期的649亿美元，自由现金流录得负91亿美元，股价周四收盘重挫13%。</p>\n<p style=\"text-align: left;\">Alphabet管理层在电话会上将AI搜索变现滞后定性为主动选择，CEO Sundar Pichai将当前阶段类比为十年前的移动端转型：<strong>\"</strong><a href=\"https://wallstreetcn.com/articles/3784718?keyword=%E8%B0%B7%E6%AD%8C\" rel=\"noopener noreferrer nofollow\" target=\"_self\"><strong>就像十年前我们转向移动端一样，我们专注于先打造最佳搜索用户体验，然后再实现变现。</strong></a><strong>\"</strong>但市场并未买账。</p>\n<p style=\"text-align: left;\">两家公司的共同困境折射出同一个市场命题：AI投入正在以可见的方式压制核心业务的现金流与增速，而变现的兑现时间表仍不明朗。相比之下，微软凭借云业务高增速与相对克制的资本支出，成为本轮财报季中少数令投资者满意的科技巨头。</p><p>本文来自华尔街见闻，欢迎下载APP查看更多</p>",

function safeUrl(v) {
 try {

  if (["https:", "http:"].includes(u.protocol)) return u.href;
 } catch(e) {}
 return "#";
}

function articleLink(n) {

 if (!href || href === "#") return '<span class="muted text-xs">暂无可用原文链接</span>';

}

}

 const featuredList = document.getElementById("featuredList");
 if (!container) return;

 const all = getRankedData();
 const q = (document.getElementById("searchInput")?.value || "").trim().toLowerCase();
 const filtered = all.filter(n => [
  n.title, n.summary, n.source, (n.asset || []).join(" "),
  n.analysis, n.coreLogic, n.marketImpact, n.transmission, n.risk, n.originalTitle
 ].join(" ").toLowerCase().includes(q));

 document.getElementById("sectionTitle").textContent = labels[active] || "财经新闻";

 // 经典分层：只要有新闻，前 3 条独立渲染为醒目的 TOP 3，其余作为常规资讯流
 const useFeatured = filtered.length > 0 && !q;
 
 if (featuredWrap) {
  if (useFeatured) {
   featuredWrap.style.display = "block";
   const top3 = filtered.slice(0, 3);
   if (featuredList) featuredList.innerHTML = top3.map((n, i) => renderCard(n, i, top3.length, true)).join("");
  } else {
   featuredWrap.style.display = "none";
  }
 }

 const regularItems = useFeatured ? filtered.slice(3) : filtered;
 document.getElementById("count").textContent = `显示常规资讯 ${regularItems.length} 条`;

 if (!regularItems.length) {
  container.innerHTML = `<div class="card muted">当前栏目常规资讯已全部在上方 TOP 3 区域置顶展示。</div>`;
  return;
 }

 container.innerHTML = regularItems.map((n, i) => renderCard(n, i, regularItems.length, false)).join("");

 container.querySelectorAll("[data-read-id]").forEach(button => {
  button.addEventListener("click", () => {
   readIds.add(button.getAttribute("data-read-id"));
   try { localStorage.setItem(readKey, JSON.stringify([...readIds])); } catch(e) {}
   render();
  });
 });
}

function setTab(name) {
 if (!validTabs.includes(name)) return;
 active = name;
 try { localStorage.setItem(activeKey, name); } catch(e) {}
 document.querySelectorAll("[data-tab]").forEach(button => {
  button.classList.toggle("active", button.dataset.tab === name);
 });
 render();
 window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll("[data-tab]").forEach(button => {
 button.addEventListener("click", () => setTab(button.dataset.tab));
});

const searchInput = document.getElementById("searchInput");
if (searchInput) searchInput.addEventListener("input", render);

/* 手机手势逻辑：同时支持左右滑动切换栏目 与 顶部下拉刷新 */
(() => {
 let startX = 0, startY = 0, tracking = false;
 const MIN_X = 70, DOMINANCE = 2, MAX_MS = 900;
 const ptrSpinner = document.getElementById("ptr-spinner");

 document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { tracking = false; return; }
  if (e.target.closest("input, textarea, select, button, a, summary")) { tracking = false; return; }
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  tracking = true;
 }, { passive: true });

 document.addEventListener("touchmove", e => {
  if (!tracking || !e.touches.length) return;
  const dy = e.touches[0].clientY - startY;
  // 当页面处于最顶端且向下拖动时，显示刷新提示
  if (window.scrollY === 0 && dy > 40 && ptrSpinner) {
   ptrSpinner.style.top = "15px";
   ptrSpinner.style.opacity = "1";
  }
 }, { passive: true });

 document.addEventListener("touchend", e => {
  if (!tracking || !e.changedTouches.length) { tracking = false; return; }
  tracking = false;
  
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;
  const ax = Math.abs(dx), ay = Math.abs(dy);

  // 1. 下拉刷新逻辑：页面在最顶部且下滑距离超过 90px
  if (window.scrollY <= 10 && dy > 90 && ay > ax * 1.5) {
   if (ptrSpinner) {
    ptrSpinner.innerHTML = "⚡ 正在刷新页面...";
    ptrSpinner.style.top = "15px";
    ptrSpinner.style.opacity = "1";
   }
   setTimeout(() => {
    window.location.reload();
   }, 300);
   return;
  }

  // 隐藏刷新提示
  if (ptrSpinner) {
   ptrSpinner.style.top = "-50px";
   ptrSpinner.style.opacity = "0";
  }

  // 2. 左右滑动切换栏目逻辑
  if (ax >= MIN_X && ax > ay * DOMINANCE) {
   const i = validTabs.indexOf(active);
   if (dx < 0 && i < validTabs.length - 1) setTab(validTabs[i + 1]);
   else if (dx > 0 && i > 0) setTab(validTabs[i - 1]);
  }
 }, { passive: true });
})();

if (typeof window.newsData !== "undefined" && window.newsData?.updatedAt) {
 const ut = document.getElementById("updateTime");
 if (ut) ut.textContent = window.newsData.updatedAt;
}

const st = window.newsData?.aiStats;
const aiStatusEl = document.getElementById("aiStatus");
if (aiStatusEl) {
 aiStatusEl.textContent = window.newsData?.aiEnabled
  ? `🟢 DeepSeek 已配置 · ${window.newsData.aiModel || "deepseek-chat"}${st ? ` · 成功 ${st.successes}/${st.attempts}` : ""}`
  : "🟠 未检测到 DeepSeek API 密钥";
}

document.querySelectorAll("[data-tab]").forEach(button => {
 button.classList.toggle("active", button.dataset.tab === active);
});

document.addEventListener("DOMContentLoaded", render);
render();
</script>
</body>
</html>
