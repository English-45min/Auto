    <script>
    "use strict";

    let currentTab = "global";

    const channelInfo = {
        global: { title: "国际财经", limit: 10 },
        asia: { title: "亚太财经", limit: 5 },
        china: { title: "国内财经", limit: 5 }
    };

    function safeText(value, fallback = "") {
        if (value === null || value === undefined) return fallback;
        const text = String(value).trim();
        return text || fallback;
    }

    // 使用 DOM 创建元素并通过 textContent 写入新闻内容，避免把新闻文本当作 HTML 执行。
    function makeElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
    }

    function getItems(tabKey) {
        const value = window.newsData && window.newsData[tabKey];
        return Array.isArray(value) ? value.filter(item => item && safeText(item.title)) : [];
    }

    function normalizeItem(item, index, total) {
        const generatedNumber = total - index;
        return {
            id: safeText(item.id, `NO.${String(generatedNumber).padStart(2, "0")}`),
            title: safeText(item.title, "无标题"),
            summary: safeText(item.summary || item.desc || item.description, "暂无摘要，请打开新闻原文查看。"),
            tag: safeText(item.tag, channelInfo[currentTab].title),
            time: safeText(item.time, ""),
            source: safeText(item.source, "来源未标注"),
            url: safeText(item.url || item.link, ""),
            impact: safeText(item.impact, "请结合新闻原文、官方数据及实时行情判断影响。"),
            asset: safeText(item.asset, "相关市场 / 行业")
        };
    }

    function makeNewsCard(item, index, total) {
        const news = normalizeItem(item, index, total);
        const card = makeElement("article", "news-card space-y-3 rounded-xl p-4 transition sm:p-5");

        const top = makeElement("div", "flex items-center justify-between gap-3 text-xs");
        const labels = makeElement("div", "flex min-w-0 flex-wrap items-center gap-2");
        labels.appendChild(makeElement("span", "font-bold tracking-wide text-amber-500", news.id));
        labels.appendChild(makeElement("span", "rounded bg-slate-800 px-2 py-1 text-[11px] text-slate-300", news.tag));
        top.appendChild(labels);
        top.appendChild(makeElement("time", "shrink-0 text-slate-500", news.time));
        card.appendChild(top);

        const title = makeElement("h2", "news-title text-base font-bold leading-snug text-slate-100 sm:text-lg", news.title);
        if (news.url && /^https?:\/\//i.test(news.url)) {
            const link = document.createElement("a");
            link.href = news.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.className = "hover:text-amber-300";
            link.textContent = news.title;
            title.textContent = "";
            title.appendChild(link);
        }
        card.appendChild(title);

        card.appendChild(makeElement("p", "text-sm leading-relaxed text-slate-400", news.summary));

        const impactBox = makeElement("div", "space-y-2 rounded-lg border border-slate-800/70 bg-slate-950/60 p-3 text-xs leading-relaxed");
        const impactRow = makeElement("div", "text-slate-300");
        impactRow.appendChild(makeElement("span", "font-semibold text-amber-500", "📌 市场传导影响："));
        impactRow.appendChild(document.createTextNode(news.impact));
        impactBox.appendChild(impactRow);

        const assetRow = makeElement("div", "text-slate-300");
        assetRow.appendChild(makeElement("span", "font-semibold text-amber-500", "💡 关联资产标的："));
        assetRow.appendChild(document.createTextNode(news.asset));
        impactBox.appendChild(assetRow);
        card.appendChild(impactBox);

        const bottom = makeElement("div", "flex flex-wrap items-center justify-between gap-2 border-t border-slate-800/70 pt-3 text-[11px] text-slate-500");
        bottom.appendChild(makeElement("span", "", `来源：${news.source}`));

        if (news.url && /^https?:\/\//i.test(news.url)) {
            const sourceLink = document.createElement("a");
            sourceLink.href = news.url;
            sourceLink.target = "_blank";
            sourceLink.rel = "noopener noreferrer";
            sourceLink.className = "source-link";
            sourceLink.textContent = "阅读原文 ↗";
            bottom.appendChild(sourceLink);
        } else {
            bottom.appendChild(makeElement("span", "", "暂无原文链接"));
        }
        card.appendChild(bottom);

        return card;
    }

    function renderNews(tabKey, filterQuery = "") {
        const container = document.getElementById("newsContainer");
        const caption = document.getElementById("channelCaption");
        const resultCount = document.getElementById("resultCount");
        const query = safeText(filterQuery).toLocaleLowerCase();

        container.replaceChildren();
        caption.textContent = channelInfo[tabKey].title;

        const original = getItems(tabKey);
        const filtered = original.filter(item => {
            const haystack = [
                item.title, item.summary, item.desc, item.source, item.tag
            ].map(value => safeText(value)).join(" ").toLocaleLowerCase();
            return haystack.includes(query);
        });

        resultCount.textContent = `${filtered.length} 条新闻`;

        if (original.length === 0) {
            const empty = makeElement("div", "rounded-xl border border-slate-800 bg-slate-900/60 px-5 py-12 text-center");
            empty.appendChild(makeElement("p", "text-sm font-semibold text-slate-300", `${channelInfo[tabKey].title}暂时没有可显示的新闻`));
            empty.appendChild(makeElement("p", "mt-2 text-xs leading-relaxed text-slate-500", "请稍后重新运行 GitHub Actions，并检查 update.py 的抓取日志。此处不会用虚构内容补足数量。"));
            container.appendChild(empty);
            return;
        }

        if (filtered.length === 0) {
            container.appendChild(makeElement("div", "rounded-xl border border-slate-800 bg-slate-900/60 px-5 py-10 text-center text-sm text-slate-500", "没有找到匹配的新闻，请尝试其他关键词。"));
            return;
        }

        // 如果数据没有 id，前端按当前列表自动生成倒序编号，防止 undefined。
        filtered.forEach((item, index) => {
            container.appendChild(makeNewsCard(item, index, filtered.length));
        });
    }

    function switchTab(tabKey) {
        if (!channelInfo[tabKey]) return;
        currentTab = tabKey;

        Object.keys(channelInfo).forEach(key => {
            const button = document.getElementById(`tab-${key}`);
            button.classList.toggle("tab-active", key === tabKey);
            button.classList.toggle("tab-inactive", key !== tabKey);
            button.setAttribute("aria-current", key === tabKey ? "page" : "false");
        });

        renderNews(currentTab, document.getElementById("searchInput").value);
    }

    function filterNews() {
        renderNews(currentTab, document.getElementById("searchInput").value);
    }

    async function copyTerminalText() {
        const list = getItems(currentTab);
        const lines = [`【${channelInfo[currentTab].title}】`, ""];
        list.forEach((item, index) => {
            const news = normalizeItem(item, index, list.length);
            lines.push(`${news.id}｜${news.title}`);
            lines.push(`摘要：${news.summary}`);
            lines.push(`来源：${news.source}`);
            if (news.url) lines.push(`原文：${news.url}`);
            lines.push("");
        });

        const text = lines.join("\n");
        try {
            await navigator.clipboard.writeText(text);
            alert("已复制当前频道的新闻文案。");
        } catch (error) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            const ok = document.execCommand("copy");
            textarea.remove();
            alert(ok ? "已复制当前频道的新闻文案。" : "复制失败，请检查浏览器剪贴板权限。");
        }
    }

    function printPoster() {
        window.print();
    }

    function updateStatus() {
        const counts = Object.keys(channelInfo).map(key => getItems(key).length);
        const total = counts.reduce((sum, count) => sum + count, 0);
        const statusText = document.getElementById("statusText");
        const dot = document.getElementById("statusDot");

        if (total > 0) {
            statusText.textContent = `新闻数据已载入：国际 ${counts[0]} 条 · 亚太 ${counts[1]} 条 · 国内 ${counts[2]} 条`;
            dot.className = "h-2 w-2 rounded-full bg-emerald-500";
        } else {
            statusText.textContent = "当前页面没有载入新闻数据，请检查自动更新任务";
            dot.className = "h-2 w-2 rounded-full bg-amber-500";
        }

        const timeElement = document.getElementById("updateTime");
        if (timeElement && !timeElement.textContent.includes("北京时间")) {
            timeElement.textContent = "更新时间：请查看 GitHub Actions 更新日志（北京时间）";
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("[data-tab]").forEach(button => {
            button.addEventListener("click", () => switchTab(button.dataset.tab));
        });
        document.getElementById("searchInput").addEventListener("input", filterNews);
        document.getElementById("copyButton").addEventListener("click", copyTerminalText);
        document.getElementById("posterButton").addEventListener("click", printPoster);

        updateStatus();
        renderNews(currentTab);
    });
    </script>

    <style>
        @media print {
            body { background: #fff !important; color: #111827 !important; }
            header, nav, #searchInput, #posterButton, #copyButton, footer { display: none !important; }
            .news-card { background: #fff !important; color: #111827 !important; break-inside: avoid; }
            .news-card * { color: #111827 !important; }
        }
    </style>
</body>
</html>
