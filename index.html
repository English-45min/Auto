散注意力。相比之下，按一下录音卡按键、看到指示灯亮起，操作更简单直接，用户的体验会轻松些。 硬件销量反映用户购买意愿，用户黏性要依据订阅转化、持续使用和续费情况判断。 虽然模型推理和任务执行能力可以由外部平台提供，但硬件厂商也可以参与上下文管理。 千问整合模型、App和硬件，韶音借助外部AI能力提供服务，未来智能旗下品牌viaim尝试通过自有Personal Agent调度其他Agent，亚马逊旗下Bee接入已有的助手和购物服务，不同企业正在探索各自的位置。 硬件充当Personal Agent在现实世界吸收上下文的感官，围绕这些信息的长期管理、任务调用和服务收费，各厂商的竞争正在展开。 耳边、眼前，同一个Agent 一个Personal Agent，串起了一场硬件发布会。 10月13日，阿里巴巴旗下千问发布AI眼镜N1、N1 Pro和AI耳夹式耳机，三款产品当天现货开售。叠加国补及限时优惠后，眼镜到手价2218元起，耳机首销价1099元起。 阿里巴巴集团千问事业部副总裁宋刚在发布会上表示： “千问的目标是成为每个人的Personal Agent，我们认为AI穿戴是千问在物理世界的延伸，也是Personal Agent的重要组成部分。无论你从哪里发起需求，背后都是同一个千问，理解同一个人，延续同一个目标。” 这场发布会之前，阿里已围绕千问布局AI应用、集团内部服务和硬件终端。 眼镜、耳机和录音卡分别面向视觉感知、随身语音交互和办公记录等场景。千问开放平台的“技能广场”开始引入第三方服务，这样用户的语音指令就可以调用更多功能。 8月，韶音推出OpenFit 2 AI耳机；9月，Meta在Connect大会上宣布把个人智能体Muse引入AI眼镜产品线，落地时间预计在数月后。 AI原生的故事，两年前Humane AI Pin、Rabbit R1就讲过，但产品体验没走那么远，宣传片里的新鲜感没能兑现。新一轮AI硬件大多不再讲替代手机，耳机、眼镜和录音设备要承担更多感知与交互任务。 一个硬件覆盖用户的全部生活场景，未必是最合理的选择。 耳机、眼镜和录音设备等硬件体积有限，需要贴身佩戴或随身携带，如果要拼功能集成和硬件配置，很难拼得过智能手机。 关键是如何找到各自的生态位，相互协同，分别覆盖不同使用场景和用户需求，最终服务于完整的Agent工作流。 对于接入同一个Agent的多款硬件，性能、参数仍然重要，是用户长期体验的一部分。在此前提下，硬件还需要持续获取对Agent有用的场景信息。 听清只是前提 Agent要利用现实对话完成后续任务，首先需要获得清晰、完整的录音。如果一开始拿到的录音不完整，后续模型很难准确还原缺失的内容。 Agent处理过程中需要的上下文不局限于文本内容。历史录音、转写、文档、人物、项目背景和未完成的任务，都可能是完成下一个任务需要的上下文。 声学技术公司Soundskrit中国区总监严更真向全天候科技解释，不同形态的AI硬件，对麦克风和声音处理算法有不同要求。 眼镜首先需要提取佩戴者自己的声音，在嘈杂环境中去除周边噪声；如果用于面对面翻译，还需要听清交流对象的讲话。录音卡则更强调远距离拾音、复杂会议室环境，以及区分不同说话人。 当全天候科技问及新增的声学需求主要来自哪类公司，严更真回答： “两个都有吧，有些传统的做音频硬件的公司，考虑新增声学与AI结合的应用形态，比如缩小麦克风阵列的尺寸，同时降低噪声环境下文字转录的误码率； 有些AI背景的公司，考虑围绕大模型落地重新定义应用场景，采用新的声学技术与应用。” 拾音设备放置的位置同样会影响上下文。 贴在耳边的耳机离佩戴者本人更近，在嘈杂的公共场景里更容易优先保证清晰收录用户本人的声音。但在办公室里开会的时候，大家往往把录音卡放在桌面上，确保每个人的声音都能录进去。 有产品尝试让耳机和充电盒都能录音。未来智能创始人马啸介绍，9月在柏林IFA发布的AI智能体耳机viaim Rise，把过去线上录音、面对面录音、音视频录音等多种模式合并为一个录音键。 充电盒上的按键在手机App关闭后也可以启动录音，录音功能不完全依赖于耳机佩戴状态和手机App。 “这个盒子也花了不少精力，可能一开始有很多的反对意见，但我们还是勇敢地把它往下推下去了，因为Agent的硬件肯定是要有一些新的东西在里面的。” 马啸并不认为这一轮Personal Agent热潮带来了硬件技术的本质变化。在他看来，变化的是人们看待硬件的视角。 Agent将设备与上下文联系起来，让一次录音成为后续任务的起点。马啸认为，当Agent能够推动会议事项形成闭环，硬件的使用场景和商业价值也会随之改变。 声音收进来之后，还需要经过相应的信号处理和模型解析，才能成为Agent可调用的信息。具体到端侧和云端如何分工，各款产品并不相同。 千问办公录音卡QwenNote A2内置4G物联网卡，可以不依赖手机将声音传输到云端，进行实时转写和纪要处理，原始音频在转写完成后删除，只保留文字和纪要。 viaim看重的是把多条录音、文档和历史讨论组织进同一个项目，供Agent在后续任务中调用，设备端主要承担拾音、降噪和传输等任务，网络信号不佳时会先在本地缓存录音，待恢复连接后上传。 当前上传云端处理的是原始音频，转写及后续Agent分析主要在云端完成，用户可以导出原始音频和转写文本。 从倾听到记住 录音、转写、上下文管理和后续Agent服务，可以由不同公司提供。 以韶音OpenFit 2 AI耳机为例，韶音掌握硬件和用户交互入口，录音转写与纪要生成交给千问，光帆为相对独立的“AI实验室”功能提供支持。 韶音方面回复全天候科技，用户按下录音键后，音频先存储在耳机内置芯片中，左右耳各支持4小时录音；录音结束并连接手机后，音频自动上传至Shokz App，再由韶音服务端调用千问大模型进行转写和纪要生成。 9月云栖大会上，韶音携手光帆科技在OpenFit 2 AI上推出了“AI实验室”。 据韶音回复，光帆为Shokz App中AI实验室的智能对话、日程待办、随口记和消息助手等功能提供技术支持，录音纪要服务与AI实验室服务相互独立，数据不交叉。 韶音还表示，韶音信息安全管理系统已通过网络安全等级保护三级和SOC 2 Type 1认证，并对录音、转写到文件归档的过程采取加密措施。 千问走的是整合式路径，推出眼镜、耳机和录音卡，同时经营App、模型能力和第三方技能生态，将多个入口纳入同一套服务体系。如果同一个千问能够理解用户、调取历史上下文并连接阿里服务，那么阿里将有机会从入口一直经营到任务执行和服务消费。 这条路线的商业价值在于闭环，挑战在于用户未必愿意把日常任务全部交给同一生态。 Plaud支持用户选择不同模型。用户可以通过ChatGPT、Claude等外部AI工具发起任务，通过MCP等连接方式调用Plaud保存的会议资料。 集成多款外部AI工具给了用户更多的自由度，下一步要考虑的是用户留存。在一个可能被替代的生态位上，厂商需要提供差异化的价值。 viaim希望通过自有Agent承担一部分上下文管理和任务分配。 “我们做了一个调动其他Agent的Agent。” 未来智能创始人马啸向全天候科技解释。 马啸介绍了viaim与腾讯WorkBuddy合作的两种方式。一种是由主机方调度，自有Personal Agent分析用户积累的信息、识别需求，任务交给WorkBuddy执行。另一种是开放CLI，用户在WorkBuddy里发起任务，通过viaim CLI调取录音记录。 两种模式可以使用同一批录音，区别在于任务从哪里发起。 当地时间10月15日，亚马逊旗下Bee发布Bee Frontier手环与磁吸卡片配件Bee Eclipse。 两款硬件可从用户的对话及已连接应用中提取信息、生成摘要和待办，付费订阅服务Bee Pro支持第三方应用及Alexa+、Amazon.com集成。 从已公布的功能来看，亚马逊正在尝试将硬件采集的现实场景信息与AI助手、电商服务连接起来。 同样做硬件，厂商选择了不同的价值链位置。有的经营硬件和用户入口，有的希望掌握上下文与任务分配，也有平台公司尝试把现实信息接入自有服务。至于用户实际调用这些信息的频率和付费意愿，目前公开披露的数据还不能充分说明。 订阅制分别卖什么 上下文处理是一条长链，不同企业分别覆盖这条链上不同的环节。一次具体的任务中，各家收取的并不是同一层费用。硬件卖出去只是第一步，长期使用过程中，软件服务、订阅制度是重要的收入来源。 目前已推出订阅服务的厂商不少，但具体到收费标准上，各家正在尝试为信息处理量、上下文管理和后续任务服务分别设计付费权益。 近半年来，阿里、科大讯飞、阶跃、腾讯混元、小米等先后发布或升级语音识别模型。 9月千问发布Qwen-Audio-3.1系列时，全线语音模型价格下调，其中语音识别降幅达95%。手机等通用设备可以通过软件调用语音识别能力，独立硬件的订阅价值还需要体现在上下文管理和Agent服务。 对于经常开会、采访的用户，要是每次都先看一眼剩余时长，再考虑要不要录音，额度本身就可能成为使用门槛。但如果用户规模扩大以后，单位用户带来的收入无法覆盖相应成本，订阅业务的毛利率仍可能承压。 未来智能创始人马啸认为，当前AI主动性有两个瓶颈，一是判断用户需求的准确度，需要持续积累用户信息；二是任务的完成度，涉及任务执行和反馈。 用户持续使用硬件及Agent服务，录音数量多了，可用的上下文不一定同比例增加。上下文管理还需要把多次交流组织成项目背景、人物关系和历史决策，Agent才能在后续任务中持续调用，优化执行效率和交付结果。 例如，会议结束后，Agent需要准确识别负责人和截止时间，将待办同步到用户的办公系统。 这样用户再次讨论同一个项目时，才能方便地找回上次的任务结果和待办事项。Agent如需向外部人员发送消息，也应在必要的环节请求用户确认。 以往硬件产品销售通常是一次性的买卖，更新迭代很多时候意味着再换一台。 Personal Agent讲长期故事，硬件开始强调“always on”，上下文正在成为资源，但资源本身不会直接沉淀为竞争壁垒，也不能证明做Personal Agent硬件一定是好生意，Agent执行的任务越来越复杂，可能同时带来新的收入和新的成本。 Agent硬件的长期价值，首先取决于产品能力。很少有人愿意花钱雇一个经常失忆、想到哪句说哪句的Agent助理，主动提供服务也需要讲究分寸。 产品能力到位以后，要考虑用户需求。如果用户购买硬件后大多数时间都闲置，或者新鲜感过去就转手，最终调用Agent功能的频率不高，那么硬件承担的主要功能就仍然是采集，而不是积累。 商业模式方面，当前订阅套餐的构成各有差异，各厂商对Agent带来的价值有不同考量。订阅业务要持续运转，用户需要获得可感知的长期价值，厂商也需要用收入覆盖存储、推理和任务执行成本。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 10:00:44+08:00","time":"10-23 10:00","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784275","tag":"国内核心","impact":"AI智能解读：AI算力基础设施景气度验证，上游供应链订单与产能利用率成核心定价锚。","asset":"费城半导体指数 / 纳斯达克 / A股半导体产业链","id":"NO.10"},{"title":"沪指跌破3600点，创业板跌2%，存储芯片、机器人活跃，算力硬件、贵金属集体调整，恒科指反弹超1%，小米涨6%","summary":"算力硬件、芯片半导体等再度下挫，覆铜板、光模块、光通信、电路板等概念股集体下跌，隔夜 Meta财报引爆AI资本开支恐慌 ，美股科技板块重挫，光通信、存储芯片等纷纷大跌。隔夜国际现货黄金、白银遭遇重挫，A股贵金属板块以及商品期货市场的贵金属期货均承压。 10月23日，A股低开低走，三大股指盘初集体下跌，且跌幅均超过了1%，贵金属、算力硬件、半导体芯片等方向跌幅居前，沪深京三市下跌个股超5000只。机器人再度活跃，白酒、汽车等板块走强。 港股高开高走，恒科指盘初涨1%，权重科网股集体反弹，小米大涨近6%。AI大模型亦走高，智谱、MINIMAX均拉升。债市方面，国债期货全线下跌。商品方面，国内商品期货多数下跌，贵金属期货跌幅居前。核心市场走势： A股 ：截至发稿，沪指跌1.37%，深成指跌1.61%，创业板指跌1.80%。 港股 ：截至发稿，恒指涨0.14%，恒科指涨0.86%。 债市 ：国债期货全线下跌，截至发稿，30年期主力合约跌0.08%，10年期主力合约跌0.02%，5年期主力合约跌0.02%，2年期主力合约跌0.01%。 商品 ：国内商品期货多数下跌，截至发稿，燃油涨近5%，原油涨超3%，锰硅涨2%，鸡蛋、沥青涨超1%，豆粕、焦煤、菜籽、集运指数、铁矿石等纷纷上涨，焦炭、橡胶、沪铝、热轧卷板、玻璃、螺纹钢、多晶硅、不锈钢、沪铜等品种下跌，纸浆、氧化铝、碳酸锂、沪镍跌超1%，烧碱、铂金、钯金、沪锡、沪金均跌超2%，沪银暴跌超5%。 09:51 人形机器人概念反复走强，兆威机电5天3板，此前睿能科技、赛福天2连板，大洋电机、福莱新材、均胜电子等冲高。 消息面上，特斯拉CEO马斯克在特斯拉财报电话会上表示，他坚信人形机器人整个赛道都将成为全球最大的产业，未来地球上人形机器人的数量甚至会超过人类。他还预计，到明年年末，机器人AI、机电设计、可靠性以及使用寿命等一系列问题有望得到解决。 存储芯片概念表现活跃，大港股份涨停，普冉股份、德明利、长鑫科技跟涨。 消息面上，三星电子及SK海力士正推进其中国厂房生产逾200层NAND晶片，将中国厂房技术提升至韩国厂房的水平。目前三星位于西安的工厂占公司全球NAND产量约40%，公司目标将目前生产约200层NAND晶片。 09:46 PCB概念集体调整，奥士康逼近跌停，中京电子、澳弘电子、崇达技术、金禄电子、强达电路跟跌。 09:26 上证指数低开0.94%，创业板指跌1.66%，贵金属、通信设备、电子元器件等板块跌幅居前。 09:21 恒生指数开盘涨0.41%，恒生科技指数涨0.51%，消费股表现活跃，理想汽车涨超3%领涨蓝筹。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 09:56:01+08:00","time":"10-23 09:56","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784272","tag":"国内核心","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.09"},{"title":"AI崩了、法国爆了，高盛推荐“对冲策略”：关注日元！","summary":"高盛FICC团队将三条看似无关的市场主线——AI估值重挫、法国债券危机与日元被低估——串联成同一个故事，并向机构客户推荐以日元多头作为当前最具性价比的对冲工具。 高盛FICC交易员Jonathon Chryssafis在最新发布的报告中指出，AI巨头财报令市场失望，正在重燃外界对这一科技趋势持续性的担忧。特斯拉削减资本开支、Meta的AI支出推动其信用违约互换（CDS）升至历史高位、Lam Research业绩指引令人失望，三重利空叠加，令对冲基金加速撤离科技板块。 与此同时，法国国债与德国国债的利差已扩至欧元诞生以来最宽水平，法国10年期国债收益率突破5%，超过欧债危机时期的绝对水平。高盛认为，上述风险最终都指向同一个方向： 美元资产吸引力下降、资本回流日本，进而推动日元升值。高盛的长期公允价值模型显示，日元相对美元被低估约40%，是其追踪货币中估值最为偏低的一个。 AI信贷裂缝：数据中心债券成为风暴眼 Chryssafis在报告中强调，AI估值重挫的真正震中并非股票市场，而是信用市场——尤其是低评级借款人的债券。 数据显示，2026年迄今（截至10月13日），美元项目融资债券发行规模已达约1050亿美元，几乎全部流向数据中心及芯片/算力融资项目。这一规模约为AI时代之前历史最高纪录（2020年约250亿美元）的四倍，也是2025年（已是当时历史纪录）的近三倍。 高盛信用策略团队对美元投资级科技债维持低配评级，并在其《AI、信用与更高资本成本》报告中指出，在利率\"更高更久\"及潜在能源成本压力的背景下，市场正在重新评估AI建设的经济逻辑。在高收益债领域，高盛维持中性，但预计AI相关发行人之间的分化将持续扩大，\"尤其是项目融资债券领域\"。Bernstein目前估计CoreWeave存在760亿美元的融资缺口，所谓\"高度分化\"或许意味着部分债券得到偿付、部分则不然。 法国债市\"飞出轨道\"：欧元承压 欧洲方面，法国债券危机持续升温。 法德10年期利差已扩至173个基点，不仅超过2011年欧债危机时期的水平，更创下欧元诞生以来的历史最宽纪录。 法国10年期国债收益率达到5.08%，而意大利国债收益率目前已较法国低出约50个基点——这一倒置在2011年危机期间几乎无法想象。 高盛策略师认为，能源价格下行是压缩利差的最清晰路径，原因在于：其一，可改善增长与财政赤字的风险偏斜；其二，有助于市场回归ECB有限加息的基准预期，从而带来一定的核心利率缓解；其三，可降低利率波动率，提升投资者重返套利交易的意愿。 Chryssafis表示， 若上述能源价格缓解未能实现，\"预计将看到更宽的利差和欧元汇率承受更大压力\"。 高盛交易台近期已观察到客户对欧元兑美元下行期权的需求上升，隐含波动率在长期历史回溯中仍处于相对低位。从估值角度看，欧元兑美元5年期实际利率差已收窄至-136个基点，与2025年初欧元交投于1.03附近时的水平相当，而当前欧元兑美元仍在1.12附近，两者之间的缺口意味着欧元存在进一步下行空间。 日元：被低估40%的最廉价对冲工具 报告中最引人关注的部分，是高盛将AI交易与日元走势直接挂钩。 高盛的GSDEER长期公允价值模型显示，日元相对美元被低估约40%，是该行追踪货币名单中估值偏离最大的货币。其背后逻辑在于： 日本数十年来将过剩储蓄大规模配置于美国金融资产，一旦AI引发的\"美国例外论\"叙事动摇、美日利差收窄，资本回流日本的趋势将随之加速，表现为美元抛售、日元买入。 高盛交易台指出，三重结构性因素已天然指向日元走强：日本官员持续表达对强势日元的支持；日本首相高市早苗（Takaichi）积极推动国内资金加大对本土金融资产的配置；日本央行维持渐进加息路径，而日本最大劳工团体目前正寻求在2027年春季薪资谈判中设定6%的目标中值（据路透社），这为日本央行继续加息提供了充分理由。 更重要的是，对冲成本极低。2年期美元兑日元平值期权隐含波动率目前为9.9，远低于20年均值13.8，接近20年低点8.4。高盛认为，以接近历史低位的价格为其追踪名单中估值最低的货币购买保护，性价比突出。 相关性翻转：AI下跌即日元上涨 自10月14日（高盛AI领先股票篮子单日下跌4.7%）以来，该篮子与标普500的相关性从0.73跳升至0.91；与10年期美债收益率变动的相关性从-0.13翻转为+0.19； 与美元兑日元的相关性则从-0.34翻转为+0.46。 这意味着，当前市场的逻辑链条已清晰成型： AI下跌→标普下跌→美债收益率下行→日元升值。 高盛交易台表示，将继续看好\"股票下行/收益率下行\"双重二元期权作为增长冲击对冲工具，并特别指出近期已实现相关性已回归\"AI下跌、10年期收益率走低、美元兑日元走软\"的模式。 唯一可能打破上述逻辑的情景，是高盛自身提出的布伦特原油冲至140美元以上的尾部风险——届时收益率将随油价上行，股票同步下跌，双重对冲策略将失效。但在此之前，随着标普500与单一AI篮子的相关性已升至0.91，\"分散化\"在当下有了新的含义：持有日元。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 09:32:35+08:00","time":"10-23 09:32","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784269","tag":"国内核心","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.08"},{"title":"“晚一季度交电，客户损失上百亿美元！”AI缺电焦虑引爆业绩，“储能妖股”Bloom Energy Q3营收狂飙138%","summary":"席卷全球的AI浪潮不仅引爆了算力需求，更彻底点燃了“现场发电（On-site Power）”的万亿级市场。 随着科技巨头们对数据中心电力的渴求达到白热化阶段，“储能妖股”、燃料电池技术公司Bloom Energy交出了一份堪称惊艳的第三季度答卷。10月22日，最新公布的Q3财报显示，在现场发电解决方案强劲需求的驱动下， 公司Q3营收翻倍飙升138%至12.4亿美元 ， 单季营业利润暴增超500% ，并由此在 今年内第三次上调了全年业绩指引 。Q3自由现金流净流出1.81亿美元，CRO坦承认，大额交付与现金回收之间存在时间错配，警告产能扩张成本将压制2027年毛利率。 公司CEO在电话会中直言，老化的传统电网已无法匹配AI扩张的速度，这迫使科技巨头全面转向现场发电。 \"今天，世界正在从一个百年老旧的中央化电力模式，转向一种包含坚定、分布式现场发电的新架构。Bloom正在引领这场变革。\" 尽管基本面强劲，但在此前大盘及前期涨幅的综合博弈下，其股价在周四盘后交易中下跌7%至200美元附近。 业绩狂飙：单季利润超去年全年，年内三度上调指引 10月22日，Bloom Energy召开Q3财报电话会。在过去的一年里，市场的关注点已从单纯的AI芯片扩展到了为其提供动力的基础设施。 得益于强劲的产品交付，Bloom Energy第三季度实现营收12.4亿美元，较去年同期的5.19亿美元猛增138%，远超分析师预期的10.7亿美元。**其中，核心的产品收入首次在单季突破10亿美元大关（达到1.07亿美元），同比增长179%。 利润端的爆发更为显著。 公司第三季度实现净利润2.503亿美元（GAAP摊薄后每股收益0.78美元），而去年同期为亏损2310万美元；剔除一次性项目后，调整后每股收益高达0.94美元，大幅击败华尔街预期的0.69美元。 Bloom Energy首席财务官Simon Edwards在电话会中强调了公司业务模式中蕴含的巨大运营杠杆效应： “仅本季度的营业利润（2.86亿美元）就超过了去年全年的总和。本季度营业利润率从一年前的8.9%扩大至23.1%，因为在营收增长138%的同时，营业费用仅增长了26%。” 基于第三季度的强劲表现和对第四季度客户交付时机的清晰预见， Bloom Energy今年第三次上调了全年业绩指引： 全年营收指引： 上调至44亿至46亿美元（此前指引为39亿至42亿美元，中值意味着同比增长约122%）。 调整后每股收益（EPS）： 上调至3.10至3.40美元（此前指引为2.55至2.85美元）。 值得关注的是，财报显示， 本季度经营活动现金流净流出2700万美元，自由现金流净流出1.81亿美元。 CFO坦承，大额交付与现金回收之间存在时间错配，合同资产与应收账款持续积累，且随业务规模扩张，营运资本占用将进一步加剧。 与此同时，公司CFO称，新产线爬坡与加急交付在短期内推高成本，多项降本项目尚需时间兑现； 资本支出已是去年全年的4倍，规模扩张伴随的启动成本将对2027年毛利率形成阶段性压制。 另外，管理层在电话会上明确表示，季度业绩节奏由\"客户准备情况和交付时间节点\"决定，年末少量交付的时间窗口将直接决定全年业绩落在指引区间的哪个位置，存在不可控的季度间波动风险。 “晚一季度损失百亿”：唯快不破的“现场发电” 为什么科技巨头们会爆发出如此惊人的“现场发电”订单？Bloom Energy创始人兼CEO KR Sridhar在电话会上给出了最直接的答案—— 时间就是金钱。 “今天，世界正从一个拥有百年历史的集中式电力模式，向包含稳定、分布式现场发电的新架构转变。Bloom正在引领这场变革。”Sridhar指出，传统电网的设计初衷是将电力均匀分配给大面积分散的客户，面对数据中心集中且巨大的电力需求时，电网已被“压垮”。 他引用了英伟达CEO在柏林GTC大会上的原话来阐述超大规模计算客户（Hyperscalers）的焦虑： “ 对于 一个吉瓦（GW）级的数据中心来说，每延迟一个季度就意味着损失100亿美元的错失收入 。 （对于100兆瓦的数据中心，一个季度的延迟就是10亿美元的损失）。这种对速度的渴望，压倒了电力模块上的任何其他价值主张。” 在交付速度上，Bloom Energy展示了绝对的市场统治力。Sridhar透露： “就在15个月前，我们宣布了与甲骨文（Oracle）的首个项目，并在 不到两个月内 就向其犹他州的站点输送了电力。我们在新泽西的Nebius项目上也实现了同样的目标——在签署合同后三个月内获得规划委员会批准， 批准后仅两个月，第一块电力就已准备好供客户使用。 ” Sridhar进一步强调，Bloom是目前唯一能同时满足 “获批最快（无需空气污染许可）、部署最快、未来可扩展” 三大需求的现场电力方案。“我们永远不会成为客户开启数据中心的瓶颈。”Sridhar自信地表示。 想象空间全开：万亿级碳捕集市场与公用事业的新盟友 除了当前AI带来的爆发性收入，市场同样高度关注Bloom Energy未来增长的可持续性。在电话会中，管理层描绘了三大极具想象空间的TAM（总潜在市场）扩展方向： 1. 碳捕集与封存（CCS）的“万亿级机遇”： 本季度，美国电力公司（AEP）宣布将使用高达 700兆瓦支持碳捕集与封存的Bloom能源服务器 ，为谷歌提供近乎净零排放的电力，这是一个史无前例的行业大单。 Sridhar在会上极度看好这一前景：“燃烧技术目前无法提供经济且可扩展的碳捕集途径，而Bloom的技术在商业领域是独一无二的，它能直接提供高浓度的二氧化碳用于捕集。 当世界准备好迎接这一步时，我认为这对Bloom来说是一个价值超过1万亿美元的市场机遇。 ” 2. 从“电网竞争者”到“电网帮手”（表前市场）： 过去，分布式电源常被视为传统公用事业公司的威胁。但现在，面对缺电危机，公用事业公司开始主动采购Bloom的设备。 “许多公用事业公司日益认识到，将我们的清洁基荷发电设备部署在他们的配电网络中，是满足其客户电力需求增长、同时增强配电网络稳定性的一种更快速、更经济的方式。”Sridhar指出，公司正在得克萨斯州等拥有全美最低电价的地区实现出货，证明了其成本竞争力的普适性。 3. 800伏直流电（800 VDC）的架构革命： 传统数据中心从交流电网取电需要经过复杂的变压和交直流转换，带来巨大的能耗浪费。Sridhar抛出了一个极具冲击力的数据：“我们在一份报告中展示过， 在投入运营的前五年，一个吉瓦级的数据中心如果采用800伏直流电架构，相比当前的工业时代供电架构，将节省超过50亿美元。 ” 在资本支出方面，CFO Simon Edwards强调，公司年内资本支出达到了2.31亿美元，是去年的四倍，主要用于扩建弗里蒙特和纽瓦克的产能。但他指出， 公司实现了“自我造血” ：“我们在扩建产能的同时，现金余额基本与年初持平（期末现金为2.5亿美元）。这种利润率结构使我们能够在保持资产负债表强劲的同时，投资扩大业务规模。” 正如CEO Sridhar在总结时所言：“在经历了25年之后，我们才刚刚开始。现在，我们的增长正在加速。” Bloom Energy 2026财年第三季度业绩电话会议全文实录如下（由AI辅助翻译） 名称： Bloom Energy 2026年第三季度财报电话会议 会议日期： 2026年10月22日 公司名称： Bloom Energy 会议描述： 2026年第三季度财报电话会议 来源： Bloom Energy 陈述环节 主持人： 大家好，感谢各位的加入，欢迎参加Bloom Energy 2026年第三季度财报电话会议。在今天的准备发言结束后，我们将进行问答环节。（主持人说明）。 现在我将把电话转交给Michael Tierney，请开始。 Michael Tierney，投资者关系： 谢谢，大家下午好。感谢各位参加Bloom Energy 2026年第三季度财报电话会议。 为配合本次电话会议，我们已通过8-K表格向美国证券交易委员会（SEC）提交了2026年第三季度财报新闻稿及补充财务信息，并已将这些材料发布至我们的投资者关系网站，本次电话会议将全程参考这些材料。在本次电话会议中，无论是在准备发言还是回答问题的环节，我们可能会作出 前瞻性陈述 ，这些陈述代表我们对未来事件及未来财务业绩的预期。其中包括有关公司业务成果、产品、市场、客户、战略、财务状况、流动性以及 2026年全年展望 的陈述。这些陈述均基于我们的预期、估计和假设作出的预测。 然而，由于这些陈述涉及未来事件， 它们受到众多已知和未知风险及不确定性的影响 ，相关细节已在我们向SEC提交的文件中进行了详细讨论，包括我们最新提交的10-K及10-Q表格。我们不承担修订本次电话会议中任何前瞻性陈述的义务。在本次电话会议及2026年第三季度财报新闻稿和补充财务信息中，我们将引用 GAAP（美国通用会计准则）及非GAAP财务指标 。非GAAP财务指标并非依据美国通用会计准则编制，仅作为GAAP财务业绩指标的补充，而非替代或优于GAAP指标。GAAP与非GAAP财务指标之间的调节说明已包含在上述材料中，可在我们的投资者关系网站上查阅。今天与我一同参加电话会议的还有： KR Sridhar，公司创始人、董事长兼首席执行官 ，以及 Simon Edwards，首席财务官 。 KR 将首先对我们的进展情况进行概述，随后Simon将回顾本季度的财务亮点。在准备发言结束后，我们将进行问答环节。现在我将把电话转交给KR。 KR Sridhar，创始人兼董事长、首席执行官： 大家好。九月底，在我们又一个创纪录季度收官之际，我庆祝了Bloom成立25周年，以及公司被纳入标普500指数这一里程碑——我在纽约证券交易所敲响了开市钟，身边围绕着许多我们的生产团队成员。 我们的使命在四分之一个世纪里从未改变：为所有人提供清洁、可靠、可及且负担得起的电力。 毕竟，在我们这个现代时代，电力对于经济和身体健康、对于人的尊严与幸福而言不可或缺。上一次Bloom敲响开市钟是八年前，那是我们IPO的时候。彼时，市场将我们视为一家小众的电力供应商。而如今，我们被视为现场供电的标杆，是驱动AI革命的关键力量。我坚信，八年后回望今日，我们将会明白： Bloom引领了这个拥有150年历史的电力行业中第一次重大架构变革。 基于燃料电池的现场供电将成为各行各业、各个地区电力输送的首选方式，并与电网形成互补。基础设施不足的国家将直接跨越到分布式现场供电，正如发展中国家当年跳过固定电话、直接采用手机一样。 超大规模数据中心运营商（Hyperscalers）是最先拥抱现场供电的。他们需要快速、大规模地获取电力。一些单体数据中心的用电量甚至超过某些小型州。然而，电网的设计初衷是将电力均匀分配给分布在广大区域内的大量用户。 电网已经无法承受数据中心高度集中、规模庞大的用电需求。 强制性的成本加成定价机制和公用事业特许经营法律更是加剧了这一问题。从制度设计上看，这些机制并不激励受监管的公用事业公司去创新或提升效率。AI时代之前，长达二十年的电力需求停滞，导致投资严重不足，亟需的升级改造迟迟未能推进。 AI革命的速度与规模使电网的短板暴露无遗。超大规模运营商争相寻找任何可用的电网电力，并很快意识到，自建现场供电才是前进之路。 Bloom迅速脱颖而出，成为标准化解决方案。 它对社区友好，安全性更高。冗余、容错、分布式的架构提供了更高的可用性——始终在线，能够抵御自然灾害、网络攻击和物理攻击。它消除了对备用发电机的需求。在总拥有成本、安全性、可及性、部署速度和可持续性方面，我们均占优势，并拥有通往净零排放的清晰路径。现在，同样的驱动力正在推动大量电力市场用户转向现场供电。 根据我们近期对15个细分行业、逾200家商业与工业企业的电力调查， 四分之一的美国商业和工业设施预计到2030年将完全依靠现场供电；35%的设施预计到2035年实现完全现场供电。 为什么？展望未来，电气化与数字化、人口增长以及自动化意味着工厂和企业将消耗大量电力，并对高可靠性提出极高要求。事实上，国际能源署（IEA）预测， 全球电力需求到2035年将增长40%。 电网既难以快速扩容，也难以以高可靠性为集中负荷供电，正如它在为AI工厂供电时举步维艰一样。 Bloom将成为这一庞大市场细分领域的首选解决方案。 我们将成为引领电力市场捕获全球新增需求的领导者，推动电力市场在未来十年从目前约3万亿美元的规模增长至约6万亿美元。因此，走过25年，我们才刚刚起步。而今，我们的增长正在加速。 市场对我们所提供价值的认识更加深入，我们的品牌也获得了广泛认可。我们在2026年第一季度财报电话会议开始时，预期营收同比增长60%。 今天，我们上调了这一指引，预计中值营收同比增长超过120%。 我们的客户管道持续增长，积压订单的扩张速度持续超过营收增速，且客户、垂直行业和地区的多样性不断提升。 我们正在为客户切实交付。就在15个月前，我们宣布了与Oracle的首个项目，并在不到两个月内向其犹他州站点完成了供电。我们正在新泽西州与Nebius实现同样的成果——在合同签署后三个月内，我们便获得了燃料电池的规划委员会审批。 获批后仅两个月，第一批电力便已准备好供客户使用。 我们在这一重要细分市场的业务强劲且快速增长。社区和政策制定者认识到我们是清洁且安静的，我们是坚实的现场供电的最佳选择。 例如，在2026年的能源规划中，弗吉尼亚州州长Abigail Spanberger明确点名了非燃烧型燃料电池，并引用原文表示： \"与传统燃气发电相比，它们产生的本地排放量大幅降低，减少了对周边社区的健康影响。\" 这一点意义重大，因为这并非一个普通的司法管辖区—— 弗吉尼亚州是全球大多数数据中心的所在地，也是数据中心与社区之间紧张关系的核心地带。 我们对Spanberger州长在数据中心行业及其所在社区的关键时刻，认可我们非燃烧解决方案所带来的价值表示赞赏。以下是本季度五项商业进展，充分体现了我们如何扩大总体可寻址市场。 第一 ，美国陆军有条件地授予我们的合作伙伴Indelible长期租约，在美国陆军基地建设和运营使用Bloom Energy服务器的商业发电设施，目的是利用我们的分布式现场架构增强电力安全。我们将为军事和民用关键基础设施安全供电——例如军事基地、水处理厂、医院和机场——视为一项增长机会。 第二 ，AEP披露，700兆瓦配备碳捕获与封存（CCS）技术的Bloom Energy服务器将用于为Google提供近净零排放电力，这是同类项目中的首创。与涡轮机和发动机不同， Bloom的技术使CCS能够在规模化层面真正可行。 我们认为CCS对于实现脱碳目标至关重要，并将其视为Bloom潜在的万亿美元市场机遇。 第三 ，我们此前向大家介绍过我们在落基山、中西部和五大湖地区不断扩大的布局。 即使在美国电价最低的州，例如德克萨斯州，我们的价值主张也已具备竞争力——我们本季度正向该州发货首批设备。 第四 ，我们正在建立的公用事业合作关系，是推动美国在电力短缺背景下前行的重要渠道。越来越多的公用事业公司认识到，将Bloom Energy服务器这一清洁基荷发电资产部署在其配电网络中，是满足客户电力增长需求、增强配电网络稳定性和可靠性的更快速、更经济的方式。 我预计我们在公用事业相关业务（通常称为\"表前\"安排）中将取得重大突破。 第五 ，最后，我们正在许多国际市场看到部署Bloom系统以满足快速增长的电力需求的强烈兴趣。我们正在与其中几个市场的潜在本地合作伙伴积极洽谈，期待尽快向大家更新一些捷报。 总结而言， Bloom是对社区友好的现场供电首选解决方案——快速部署、清洁、可靠、具有竞争力。 我们的现场解决方案被部署于为吉瓦级智能工厂、兆瓦级推理数据中心、工厂、商业企业，以及医院、电信枢纽和基本服务等关键任务基础设施供电。Bloom现场供电的需求在国内外均持续增长，我们正在建立强大的合作伙伴关系。这一增长潜力，结合CCS和800 VDC等未来增长机遇，指向Bloom将在不断增长的电力市场中占据重要份额。 这一信念让我们对未来的走向有了清晰的判断。 这将要求我们扩大规模、切实执行，以把握这个百年一遇的机遇。我对我的团队充满信心，深知他们已准备好迎接这一挑战。接下来，有请Simon为大家详细解读我们的财务数据。 Simon Edwards，首席财务官： 谢谢你，KR。大家下午好。提醒一下，我将重点介绍非GAAP调整后的指标。与GAAP的调节说明已包含在我们的新闻稿和补充材料中。 第三季度是Bloom又一个创纪录的季度。 营收达到12.4亿美元，同比增长138%；营业利润达到2.86亿美元，增速更快，同比增长超过500%。 凭借本季度的强劲表现，我们今年第三次上调了全年营收、营业利润和每股收益的预期。在深入细节之前，有必要回顾一下我们今年迄今所取得的成绩。 年初至今的营收已达30.5亿美元，已经比我们2025年全年的营收高出50%。 仅本季度的营业利润就超过了去年全年的营业利润。 这正是我们商业模式中内嵌的运营杠杆效应，如今已在业绩中得到充分体现。 本季度营业利润率从一年前的8.9%扩大至23.1% ，原因在于营收增长了138%，而运营费用仅增长了26%。正如KR所说，要抓住这个百年一遇的机遇，我们既需要规模扩张，也需要高效执行，因此我们将持续投入于创新与工程路线图、增长举措，以及支撑我们规模扩张所需的基础设施。 年初至今的资本支出为2.31亿美元，我们正在投资产能以支持未来增长，并通过运营产生的现金流为这些投资提供资金。 尽管我们的投资规模是2025年全年的4倍，我们的现金余额仍与年初大体持平。 我们的利润结构使我们能够在投资扩大业务规模的同时，保持资产负债表的稳健。这正是我们精心设计并付诸实施的财务模式，目前运行符合预期。 现在来看本季度的具体情况。如我此前所述， 本季度营收为12.4亿美元，同比增长138%，环比增长16%。产品营收为10.7亿美元，同比增长179%，环比增长15%，首次在单季度突破10亿美元大关，占总营收的87%。 产品营收在控制权转移给客户时予以确认，因此是本季度系统交付和验收情况的直接体现。 服务营收为6760万美元，同比增长15%，环比基本持平。安装营收为8490万美元，同比增长29%，环比增长66%。安装范围因客户和项目而异，营收随工程进展按比例确认。因此，安装营收与产品营收并不会在同一季度同步变动，安装营收将随客户项目的时间节点和结构组合而波动。 在利润率方面， 产品毛利率为38.4%，同比提升250个基点，环比提升120个基点 ——这是在我们同时推进新产线爬坡和加急交付的季度中实现的。这直接体现了我们的定价能力以及我们在产品端持续推进的成本削减成效。 服务毛利率为21.4%，同比提升700个基点，这是我们连续第二个季度保持在20%以上。 总体毛利率为34.5%，同比提升412个基点，产品和服务均实现扩张，但部分被安装营收在收入结构中的时间性因素所抵消。鉴于这种季度间的结构性波动，这也是我们以全年为基准来管理和指引毛利率的原因。本季度运营费用为1.41亿美元，反映了我们在工程路线图、增长举措和基础设施方面的持续投入。 营业利润为2.86亿美元，同比增长超过500%，环比增长19%，营业利润率为23.1%，环比提升60个基点。 调整后EBITDA为2.99亿美元，占营收的24%，同比扩张1286个基点。非GAAP摊薄每股收益为0.94美元，去年同期为0.15美元。GAAP摊薄每股收益为0.78美元，去年同期为亏损0.10美元。 在现金方面，本季度经营活动现金流为净使用2700万美元。净利润被营运资本的增加所抵消，营运资本的增加主要由库存、合同资产和应收账款驱动，原因是我们支撑了业务的大幅增长并为未来交付建立了库存储备。如我此前所提，产品营收在控制权转移给客户时予以确认。合同账单则遵循合同里程碑节点，可能发生在不同的季度。因此，现金回收可能滞后于营收确认，两者之间的差额在完成开票和回款之前体现为合同资产和应收账款。 大额交付及相关现金回收的时间节点将因季度而异，这些差异会随时间推移趋于平衡。 我们预计将持续投入营运资本，以支持未来增长并与客户同步扩张规模。 本季度资本支出为1.53亿美元，年初至今累计2.31亿美元，主要用于投资机械设备和生产产能，以支持我们在Fremont和Newark现有工厂内的扩张。以这种增量方式增加产能，意味着我们的资本支出紧跟我们所看到的需求，而非超前于需求。本季度自由现金流为净使用1.81亿美元，年初至今为正4200万美元， 季度末现金余额为25亿美元。 此外，本季度Bloom被纳入 标普500指数 。我们认为这一纳入是对我们在业务规模、盈利能力和稳定性方面所取得成就的认可，我们也欢迎由此带来的更广泛的股东群体。 在业绩指引方面， 我们将全年营收预期上调至44亿至46亿美元，中值对应同比增长约122%。 此次上调反映了我们第三季度的业绩表现，以及对第四季度客户交付时间节点更清晰的能见度。我们的季度节奏由客户准备情况和交付时间节点决定，这也是我们以全年为基准管理业务和提供指引的原因。与今年每次上调一样，我们的预期建立在两个层面之上。第一层是积压订单，我们逐一评估每位客户的现场准备情况和转化时间节点。第二层是对我们管道中需要在当季获得电力供应的客户进行概率加权评估。 随着最后一个季度的到来，年末前后少量交付的时间节点将决定我们最终落在区间的哪个位置。 我们维持最新的非GAAP毛利率预期约为34%。 这高于2025年的30%，也高于年初约32%的原始预期。这一预期反映了我们对第四季度营收结构和各业务线利润率的预判。 我们同时将非GAAP营业利润预期上调至9.6亿至10.3亿美元。 中值对应22%的营业利润率，而我们2月份预期中值时的营业利润率为14%。 我们的非GAAP摊薄每股收益预期现为3.10至3.40美元。 总结而言， 我们正在创造创纪录的业绩、上调预期，并进行必要的投资以把握眼前巨大的市场机遇。 与此同时，我们在持续扩大利润率，并保持资产负债表的稳健。说到这里，接线员，我们现在开始接受提问。 问答环节 主持人： 问答环节现在开始。 （主持人提示）请稍候，我们正在整理提问名单。第一个问题来自摩根大通的 Mark Strouse，您的线路已开通，请提问。 Mark Strouse： 好的，下午好。非常感谢你们接受我们的提问。 KR，我很好奇，能否谈谈最近决定扩大在 Fremont 房地产布局的原因？在本次电话会议上，你们花了相当多的时间讨论 TAM 扩张的多种路径。我想了解的是， 为什么现在做出这个决定？ 既然你们之前提到当前的制造产能可以支持每年超过 5 吉瓦的产出，那么一旦新设施投入运营，我们是否应该认为这一数字将超过 10 吉瓦？ KR Sridhar（创始人兼董事长、首席执行官）： Mark，感谢你的提问。你看，有些事情对我们来说非常清晰，在这个充满不确定性的世界里，有些事情是可以完全确定的。 电力的使用、电力的需求，将会急剧攀升 ，不仅仅是因为 AI，还因为在这个数字时代，有太多的市场领域都需要电力。这不仅仅会发生在美国境内，我们已经开始看到同样的趋势在亚洲、欧洲以及世界其他地区显现。我们看到，对于现场自发电的需求，相较于电网供电，正在从数据中心以外的多个领域涌现出来——这些数据中心被要求自行解决供电问题。 这种需求来自于对 韧性 的追求，来自于对 安全性 的需求。在当前全球各种复杂局势下，关键设施对于可靠、安全的现场供电的需求正变得越来越重要。综合考量这一切，对我们来说非常明显，而且一直都是显而易见的—— 从时间节点来看，5 吉瓦这个里程碑只是漫长旅程中的一个节点 ，我们已经清晰地看到它即将到来，我们需要为超越这一里程碑之后的阶段做好准备。这就是你现在所看到的。我们永远不会以跳跃式的方式扩大产能，而是会像调节模拟旋钮一样，随着需求的增长逐步跟进。我们不会超出我们的视野范围，但也绝不会慢到成为客户获取电力的瓶颈。我们就是通过这样的方式来推进的。我们不会提供具体的时间表，但我们有强烈的信心，市场传递给我们的信号已经足够清晰，告诉我们应该开始为超越 5 吉瓦这一里程碑做准备。这就是我们这样做的原因。希望这回答了你的问题。 Mark Strouse： 非常好，谢谢。接下来是一个简短的追问，问 Simon 的。关于全年毛利率展望维持不变、但收入预期上调这一点，我理解这至少部分是由于产品结构的变化。能否提供更多细节？另外，我知道你们目前还没有给出 2027 年的指引，但 从方向性来看，随着收入规模的扩大，我们是否应该继续预期毛利率会进一步提升？ 谢谢。 Simon Edwards（首席财务官）： 好的，Mark，你好。首先，我想先退一步，看看我们已经走了多远—— 2024 年总体毛利率为 28.7%，2025 年为 30.3%，而第三季度已达到 34.5%。 我认为我们已经展示了随着业务规模扩大而持续提升利润率的良好记录，对于产品毛利率的表现，我感到非常满意。正如我在准备好的发言中提到的， 定价依然强劲 ，我们一直推进的降本举措也已体现在数据中。但与此同时，我们也在平衡利润率的扩张与抓住眼前市场机遇之间的关系。正如 Kara 所提到的，我们正在加快新产线的投产，加急交付以满足客户的时间节点要求，这在短期内会带来一定成本。此外，我们还有多项工程、采购、制造方面的降本项目，这些需要一定时间才能体现在成本端。因此，你问到明年的情况，我们是从 长远视角 来考量的。我们清楚，规模扩张伴随着启动成本，我认为我们在毛利率展望中已经审慎地反映了这一点。但随着这些项目逐步进入量产阶段，随着我们持续优化产线成熟度并提升产能利用率，我们认为将会从规模效应中获得更多收益。我只想说， 在我入职的头六个月里，我对团队在运营层面的表现以及这些进展在数据中的体现都印象深刻。 Mark Strouse： 谢谢。 操作员： 下一个问题来自Evercore ISI的Nick Amakuchi，请提问。 Nick Amakuchi： 嗨，大家好，非常感谢。 Simon，我想深入了解一下自由现金流的情况。本季度显然使用了2700万美元的现金，考虑到利润率的扩张等因素，我想深入了解一下这个问题。有哪些影响因素或一次性项目可以帮助我们理解？ Simon Edwards，首席财务官： 好的，Nick，你好。 首先，我想说的是， 我们真的将这个业务视为一个自我资金运营的业务。 也就是说，当你考虑业务的运营表现时，正是这种表现在为增长所需的投资提供资金。我想强调这一点对我们非常重要，因为 这将减少我们对外部资本的依赖，真正降低我们的执行风险。 同时，我认为这也给了我们KR所提到的灵活性，让我们能够针对客户需求进行投资。所以我想说，在这个背景下， 应该从全年的角度来看待现金生成，而不是从某一个季度来推断。 我们确实相信，这个业务将成为一个自由现金流为正的业务，因为我们能够持续为自身增长提供资金。回到你问题的第一部分，本季度我们在运营中使用了现金，但 这并不是一个趋势的开始。 即使我们增加了对人员和能力的运营投入， 我们今年迄今为止已经产生了正的运营现金流（CFOA）。 正如我在准备好的发言中提到的，我们也为这些客户部署的营运资本（听不清）提供了资金。所以，我认为我们能够从运营角度支持这些投资，同时也为今年迄今的资本支出提供资金，这恰恰体现了这个业务的 资本效率 。当我将这一切与我们从资本支出投资中获得的回报联系起来时， 我们对目前所处的发展轨迹感到非常乐观。 Nick Amakuchi： 很好，谢谢。KR，如果可以的话，我还想深入了解一下，您之前提到了在公用事业方面不断增加的需求和关系。 现在大家显然更多地将你们视为一种 表后解决方案 ，从这个角度来看似乎更具互补性。如果我们考虑一下目前已经公开的信息，我们已经看到不同地区的 综合资源规划（IRP） 中已经包含了燃料电池，能否更具体地阐述一下你们所看到的市场机会和整体可寻址市场（TAM），特别是在受监管的公用事业机会方面？ KR Sridhar，创始人、董事长兼首席执行官： Nick，这是一个很好的问题。首先让我们从客户的角度来谈谈。在这里，我要说，让我们考虑两类客户：一类是 电费缴纳者 ，也就是最终客户；另一类是为这些电费缴纳者提供服务的 公用事业公司 。如果你从优化这两类客户的角度来看， 他们越来越多地开始将我们视为一种配电资产，通过这种资产，他们可以降低总成本，同时继续为客户提供服务。 这对电费缴纳者越有利，公用事业公司就越容易向其政策制定者申请，将采购Bloom Energy服务器纳入费率基础，将其作为输电和配电资产部署到输配电网络中。这对他们意味着什么？ 这使他们能够将我们部署在电表前端，随着负荷的到来进行分配，而无需等待客户的具体订单。 他们可以像现在在综合资源规划中那样，根据计划和需求进行采购，而不需要针对特定客户。他们为什么要这样做，而不是购买集中式资产呢？ 输配电及其相关成本、瓶颈和时间问题对他们来说都行不通。 他们正在认识到这一点。如果客户不得不转向表后方案，他们就会失去客户，失去费率基础。 如果他们失去客户和费率基础，就必须提高其他电费缴纳者的成本，这不是州政府想要的，也不是最终客户想要的。 所以，在这个时间节点上， 我们对整个行业来说都是真正有价值的资产。 随着越来越多的地区开始理解这一点，你将会看到这种情况在多个地区逐步展开。 我们的团队在 向各大公用事业公司宣传将现场电力作为电网补充的好处 方面做得非常出色。我们一直在解释为什么电网存在不足。公用事业公司终于从监管机构那里获得了将这些资产纳入规划所需的空间，所以他们正在抓住这个机会。 我们将这视为未来巨大的业务增长机会。 Nick Amakuchi： 谢谢。 David Arcaro： 哦，你好。非常感谢你们回答我们的问题。AR，我想你们在碳捕获、热电联供以及行业向800伏直流电转型方面有几个未来机遇，我想了解这些未来举措目前在商业机遇方面进展如何，以及你们在近期看到的市场采用情况是怎样的？ KR Sridhar，创始人、董事长兼首席执行官： David，你好。感谢这个问题。 好的，让我来回答这个问题。你们知道吗，我对AEP宣布的700兆瓦碳捕获项目感到无比振奋——该项目将为超大规模客户提供近净零排放电力，在这个案例中他们宣布的客户是Google。这个项目将提供 及时、现场、可靠、无空气污染、无水资源消耗的近净零排放电力 。这还能有多好呢？好的。 我们有——这里有一个关键点，我认为参加电话会议的投资者需要理解。 燃烧技术目前无法提供经济实惠且可扩展的碳捕获路径。 Bloom的技术在商业领域是独一无二的，因为它能够提供用于碳捕获的 浓缩二氧化碳 。这就是Bloom的天才之处、力量所在。它既对钱包有利，又对环境友好。所以我相信，当世界准备好去碳化时，最快的方式就是使用我们的技术配合天然气，生产 既可靠又对地球友好的大量电力 。当世界为此做好准备时，我认为这将是一个 超过1万亿美元的机遇 。这就是我认为它有多大。 800伏直流电是显而易见的选择。 我们在发布的一份报告中表明，在运营的前五年，一个吉瓦级数据中心通过采用800伏直流电，与当前这种过时的工业时代电力传输架构相比，将 节省超过50亿美元 。800伏直流电无论如何都会到来。我们不需要推动市场去实现这一点，但为什么要使用中间所有的转换环节，并多付50亿美元呢？我 极度自信 ，当搭载800伏直流电的服务器机架问世时，我们将看到这种采用趋势的发生。 我们正在与所有超大规模客户进行对话。这一领域有很大的兴趣。当以800伏直流电为标准建设的直流数据中心建成时，这一切就会发生。 不是会不会发生的问题，而是多快发生的问题 ，所以他们比我更能回答时间节点的问题。 关于热量回收，也就是热电联供（CHP），我们坚定地认为，当你进行现场发电时，把那些可以用于制冷、从而减少20%电力需求的热量白白浪费掉， 同样是显而易见不应该做的事 。所以这是对我们所做一切的补充，无论你是向数据中心提供交流电，还是800伏直流电，有没有碳捕获，都无所谓。这成为了一个显而易见的选择。关于热电联供有一点很有趣—— 大多数工业应用，我们相信商业和工业领域（C\u0026I）将是我们巨大的增长方向 ，都将需要蒸汽形式的热能或制冷。 他们将使用热电联供。所以我认为这是一个 巨大的增长方向 ，也是为商业和工业客户使用我们产品创造价值的途径。美妙之处在于，这是 同一个平台 。这就是为什么我们一直告诉大家， Bloom是一个平台，而不是一个产品 。我们能够根据客户需要，为他们提供平台中任意一种或所有选项。 谢谢。 操作员： 下一个问题。 KR Sridhar，创始人兼董事长、首席执行官： David 可能有后续问题。 操作员： 下一个问题来自 RBC Capital Markets 的 Chris Dendrinos。请提问。 Christopher Dendrinos： 好的，非常感谢接受提问。恭喜本季度取得亮眼成绩。我想问一下关于\"上电时间\"的问题——我记得您在之前的发言中提到过，大约一年前你们能够在不到两个月的时间内为 Oracle 完成交付。如您所知，现在需求正在快速增长，你们也在持续扩张规模， \"上电时间\"是否仍然能保持在90天以内，还是说由于订单积压量较大而有所延长？ 另外，能否更具体地说明你们为 Nebius 站点供电的速度？您提到第一个区块即将上电，但这具体对应多少兆瓦？谢谢。 KR Sridhar，创始人兼董事长、首席执行官： 谢谢你，Chris，这是一个非常好的问题。我们的服务器已经为 Nebius 数据中心做好了准备。我们再次重申，我们确实履行了对他们的承诺。 我们不会成为他们整个300兆瓦数据中心上线的瓶颈。 只要我们准备好了，就会立即推进。 不过我想你也了解数据中心是如何建立起来的——它们不是一天之内从0跳到300兆瓦的，而是一个区块一个区块地推进。他们的第一个区块即将就绪，而我们已经为第一个区块做好了准备。在他们每一个后续区块建好之前，我们都会提前到位，确保我们不会成为他们的瓶颈。至于数据中心其余部分的时间安排，需要由客户自己来说明，我们不便置评。 但回到你更宏观的问题。 就在今天早上——我记得是柏林时间，或者也许是昨天，我记不太清了——在柏林 GTC 大会上，NVIDIA 的 CEO 说了这样一句话：一个吉瓦级数据中心每延误一个季度，就意味着损失100亿美元的收入。 也就是说，一个100兆瓦的数据中心，延误一个季度就会损失10亿美元的收入。这个数字远远超过了你在电力模块上所能获得的任何其他价值主张。而且 目前没有任何比我们更清洁的技术，能够在现场供电的同时获得空气排放许可；也没有任何技术能比我们更快地为客户提供电力； 更不用说我们在上一个问题中谈到的全面的未来保障能力，以及我们能够提供的所有附加价值。这就是我们对这一特定领域及其对我们意义持乐观态度的原因。谢谢。 Christopher Dendrinos： 谢谢。再追问一下，回到 Mark 关于扩大业务布局的问题—— 在这方面是否有机会引入更多自动化？你们是如何看待制造业的机遇，以及这可能带来哪些成本节省？ 谢谢。 KR Sridhar，创始人兼董事长、首席执行官： 我认为，凡是参观过我们工厂的人都会记得我们出色的总经理 Brad Fields 说过的一句话。他会提醒大家： 多年前，当我们每年生产100兆瓦的电堆时，我们有大约600名员工全天候工作；而当我们达到每年1吉瓦的产能时，整条生产线仍然只需要600名员工——这意味着效率提升了10倍。当我们达到5吉瓦产能时，那条生产线上依然只需要600名员工。 Bloom 是一家将 降本增效刻入DNA 的公司，持续创新是我们的本能。所以答案是肯定的，我们不仅仅是 AI 的受益者——他们是我们的客户，同时我们也在包括自动化在内的许多不同领域受益于 AI。 Christopher Dendrinos： 谢谢。 KR Sridhar，创始人兼董事长、首席执行官： 谢谢你。 操作员： 下一个问题来自UBS的Manav Gupta，请提问。 Manav Gupta： KR，我想回到上次电话会议，您说了一些非常有见地的话，您提到 LCOE（平准化能源成本）对于现场供电和数据中心来说是一个荒谬的构建，应该关注总成本 。能否帮我们理解一下，数据中心所看到的LCOE与实际输送给他们的电力价格之间的差异，以及您的解决方案实际上更具成本效益？另外，关于您提到的9月15日、16日的那份报告，那是一份非常好的报告，因为它详细说明了通过切换到您的解决方案可以节省的所有资金。我记得您曾提到， 一个1GW的设施通过切换到您的解决方案可以节省高达9%的成本 。最后一个问题，我保证是最后一个——我们了解您的解决方案具有更低的NOx和SOx排放，但我们也认为这里还涉及到 节水优势 。您的解决方案比竞争对手使用更少的水，这在竞争中可能是一个重大优势。如果您能就这些问题的部分内容作出解答，非常感谢。 KR Sridhar，创始人兼董事长兼首席执行官： 好的，Manav，谢谢你。问题很多，我会尽量记住并一一回答。让我先从 水资源 问题开始。 您看，如果针对每吉瓦的数据中心，比较燃烧技术与我们技术在发电厂的 用水量 ，我们的用水量连第二位小数的四舍五入误差都算不上。也就是说，如果您运营一个吉瓦级的数据中心，使用联合循环燃气轮机（CCGT）的话，在整个生命周期内的年用水量是极其巨大的——例如，如果使用湿冷CCGT，在该1GW数据中心的整个生命周期内， 大约会消耗250亿加仑的水 ，这是非常庞大的数字。 相比这250亿加仑， 我们只需要14亿加仑 。从用水量的角度来看，这简直是沧海一粟。好的，这就是理解水资源问题的方式。 现在，您问到与电网电力相比的 成本优势 。 从电网电力到机架供电，电力经过层层传输，从三个九的可靠性（99.9%），到电压和功率层面的不稳定性——我说的不是环保方面的清洁度，而是 电力质量的清洁度 ，这正是UPS（不间断电源）所要解决的问题，还有可靠性问题。再加上将电力转换为您所需电压和直流电的过程，这些都是 从电网电力到机架电力所带来的成本 。 此外，在机架内部，由于电网输送的技术无法快速升降负荷，燃气轮机也无法快速升降负荷，机架内部就会产生低效损耗。为了不烧坏另一侧的涡轮机、发动机或电池，他们只能白白消耗掉这些电力。 而使用燃料电池则完全不需要这样做。 因此，对于数据中心而言，真正的成本是 电力总成本与实际产出的算力（token）之间的比值 ，即每个token的电力成本。从LCOE出发，到输送到电网的电力成本，再到机架电力成本，最终到 每个token的电力成本 。将所有这些加在一起，我们是 压倒性的成本领先者，是总成本最低的方案 。这正是人们开始逐渐理解的事情。 我希望已经回答了您大部分的问题，Manav。我们继续下一个问题。 Manav Gupta： 非常感谢，非常感谢您，先生。谢谢。 操作员： 下一个问题来自Baird的Ben Kallo。为了节省时间，请所有剩余分析师每人只提一个问题，谢谢。Ben，您的线路现已开通，请提问。 Ben Kallo： 你好，谢谢。我有两个问题，很快。第一个，回到Mark和扩张的话题，你们之前谈到过每季度扩张，我记得是250兆瓦到300兆瓦。我只是想了解一下，当你们明年接近5吉瓦的时候，我们应该怎么看待这个问题，以及是否有什么供应方面的限制需要考虑。第二个问题是关于\"邻避效应\"，我们看到一些报道，说也许有些开发商正在向海外转移。我想知道，如果这是真的，我们应该如何期待你们从中获益，以及你们在水资源、噪音、硫氧化物和氮氧化物排放方面的优势，在海外是否同样适用。谢谢。 KR Sridhar，创始人兼董事长、首席执行官： 谢谢你，Ben。关于第一个问题， 让我说清楚，我们从未给出过任何关于季度增长或年度增长的具体数字。 我们所说的是，这就像一个旋钮，我们会根据需求来调大或调小。根据我刚才告诉你们的一切， 我认为我们近期不会调小，只会不断调大。 所以，调大多少，完全取决于负载需求，这是第一点。第二点，关于国际市场的问题，要记住的是， 如果每个token所对应的电力总交付成本，远低于使用Bloom系统消耗天然气的成本，那就意味着产生相同数量token所消耗的燃料会减少。 在大多数国际市场，天然气价格远高于美国，我们所带来的优势会进一步放大。基于所有这些原因， 国际市场对我们非常有吸引力，我们正在考虑国际扩张。 正如我在准备好的发言中所说， 请期待我们在不久的将来在这方面带来一些好消息。 Ben Kallo： 谢谢。 操作员： 下一个问题来自BMO资本市场的Ameet Thakkar，您的线路现已开通，请提问。 Ameet Thakkar： 恭喜本季度的业绩和上调后的展望。我只有一个简短的问题，我会遵守规则。KR，您今天大量谈到了规模的问题。 目前在美国运营的单一站点最大的Bloom部署，以兆瓦计算是多少？ 以及与您提到的即将在怀俄明州或新泽西州部署的项目规模相比，我们应该怎么看？ KR Sridhar，创始人兼董事长、首席执行官： 我们已经处于100兆瓦级别，怀俄明州的项目也是100兆瓦级别，而且正在向吉瓦级别迈进，因为它达到了700兆瓦。 所以，我们最小的系统是150千瓦，为一家小型Home Depot供电，而我们最大的系统正在接近吉瓦级别。我可以告诉你， 每一位客户对我们都很重要，我们让所有客户都满意。 谢谢。 Ameet Thakkar： 谢谢。 操作员： 下一个问题来自Mizuho的Maheep Mandloi。您的线路已开通，请继续。 Maheep Mandloi： 嗨，晚上好。感谢提问。这是一个小问题。关于积压订单的增长，我记得在准备好的发言中，你们提到积压订单的增长速度快于收入增长。我想理解一下，该如何解读这一点——考虑到收入同比增长大约140%。那么，这是否是本季度理解积压订单增长的一个参考框架？谢谢。 KR Sridhar，创始人兼董事长、首席执行官： Maheep，感谢你的问题。幸运的是，你不必等太久，因为现在是第四季度，也是我们年初的时候。我们会给你具体的指引。我认为在过去几个季度里，我们已经向你们证明了我们是有纪律的，我们给出的数字是我们实际能够兑现的。所以我们会给你那个数字。但我想说， 增长是稳健的，是强劲的。所以请期待一个扎实的增长。 我不会在方向上给你划定范围，抱歉。 未知发言人： 好的，感谢提问。 KR Sridhar，创始人兼董事长、首席执行官： 是的。 操作员： 下一个问题来自Bernstein的Sunaina Ocalan。您的线路已开通，请继续。 Sunaina Ocalan： 嗨，下午好。感谢接受我的问题并给我机会提问。也许我可以问一下，鉴于与谷歌的AT交易，您能否介绍一下您与其他超大规模数据中心客户的一些洽谈情况？您是否看到碳捕获与封存（CCS）作为超大规模客户洽谈中的一个潜在选项被越来越多地提及？以及从您的角度来看，这对降低电力成本有何影响？我很欣赏您方案中CO₂排放更清洁这一点。希望能听到更多您的想法。 KR Sridhar，创始人兼董事长、首席执行官： 这是一个非常好的问题。我想说， 是的，我们所有的超大规模客户目前都对碳捕获的可选方案表现出了浓厚的兴趣。 我们认为，随着我们向前推进，这将变得极其重要。我认为， 几乎所有我们的客户很快就会至少开始向我们购买具备碳捕获就绪功能的系统 ，这样当他们所在地区的生态系统中建有CO₂管道并连接到封存井时，他们就能够接入——这是第一点。第二点， 将10%到15%的成本视为大多数超大规模客户今天愿意接受的合理成本，以实现零碳电力供应。 如果能够提供这一点，那将是他们在没有强制要求的情况下自愿选择的方向，而Bloom将能够在这一成本范围内交付，涵盖碳捕获与封存的全部综合成本。 这就是为什么我说我们是最具经济可行性、技术上最成熟的碳捕获与封存平台。 Sunaina Ocalan： 谢谢。 操作员： 您的下一个问题来自Oppenheimer的Colin Rusch。您的线路现已开通，请继续。 Colin Rusch： 非常感谢，各位。这是一个两部分的问题。第一个问题主要是关于 合同资产的增长 ，以及您预计如何将其转化为可开票并完成收款的状态。第二个问题，或者说第二部分，主要是关于 碳捕获货币化的战略 。我认为我们相信你们确实能在这方面产生重大影响。请问您预计是通过服务器销售来实现货币化，还是可能会推出一种新的解决方案，来扩展目前服务中已有的一些机会？ KR Sridhar，创始人兼董事长、首席执行官： 好的，Colin，我来回答第一部分。 关于合同资产的定性，我确实预计它们 会发生周转 。因此，虽然合同资产余额可能会增长，但对我们真正重要的是它们在持续周转——因为我们正在达到开票里程碑并实现现金回收。我认为这是一个重要的细节，我想特别强调。总体而言，我预计随着业务规模的扩大，我们将能够持续有效地管理营运资本。但我认为， 确保应收账款和合同资产都能持续周转是我们的首要关注点 。 Colin，关于我们如何实现碳捕获的货币化——这个答案应该不会让你感到意外。 这正是Bloom在其商业模式乃至产品方案上一贯的做法：我们会迎合终端客户的需求。 如果终端客户恰好是一家具备碳捕获能力的天然气公司或油气公司，他们可以将这一功能附加进来，通过碳信用额度以及来自客户的收入流来实现货币化。我们也可以与合作伙伴协作，提供端到端的完整解决方案，并商议如何分配收益。或者在某些情况下，终端客户本身可能有碳信用额度的需求，他们自行使用，并以隐含电力成本或资本设备加利润的方式向我们支付报酬。 对于以上所有模式，我们都持开放态度。 这就是我们模式的魅力所在—— 我们为客户创造了多种选择的可能性 。这也是我们思考所有业务的方式。归根结底，我们存在的意义是服务客户、满足需求，而通往这一目标的路径有很多种。 说到这里，由于时间已经到了甚至超出了预定时间，让我来做一个总结。我想说，虽然今天你们从我们这里听到的一切都非常积极，但我也想承认 我们目前所处的这个动荡不安的时代 。和你们大多数人一样，我看到世界上存在着大量的不确定性，市场也充满波动。 然而， 正是在这样的时刻，我们更应该提醒自己，对我们共同的未来保持乐观是有充分理由的。 就我个人而言，我可以告诉大家，能够身处Bloom，我感到非常幸运。对我来说，这里是一座充满稳定、确定性与使命感的岛屿。让我来解释一下。 我在一个电力匮乏的地方长大。 我深知无法依赖稳定电力供应意味着什么，它如何压制经济活动、损害人类健康与福祉，这些我都有切身体会。在当今的数字化世界中，拥有电力比我童年时代更加重要。 毫无疑问，电力需求将持续上升，且这一趋势是循环往复的。 有一件事是可以确定的：未来几年，对电力的需求将急剧攀升。而Bloom已经建立了一个平台，能够 以清洁、可靠且大规模的方式 向有需要的人输送电力。正如我们一再证明的那样，我们能够实现这一目标，为股东创造利润和回报，并通过 自我造血的模式 推动业务规模化增长。 我们的未来一片光明。 我非常感激能够与如此强大的团队一起，共同肩负如此有意义的使命。这让我充满活力，我能清晰地看见我们光明的未来。感谢大家对Bloom的支持，祝大家今天愉快。 操作员： 今天的电话会议到此结束，感谢您的参与，您现在可以断开连接了。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 09:08:04+08:00","time":"10-23 09:08","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784267","tag":"国内核心","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.07"},{"title":"股东强烈反对、监管忧虑违规，海力士放弃Solidigm上市，\"美国最大芯片IPO\"告吹","summary":"SK海力士宣布放弃旗下子公司Solidigm赴美上市计划，这一原本被视为潜在\"美国最大芯片IPO\"的交易就此终止。 据彭博周五报道， SK海力士在一份监管文件中确认，已叫停Solidigm的美国上市进程，同时终止与上市同步推进的Pre-IPO融资工作。 公司表示，此次决定是在综合考量近期资本市场环境及股价走势后作出的，并不反映Solidigm业务前景或投资需求的任何变化。此前，Solidigm已选定高盛和摩根士丹利担任潜在上市的主承销商，计划最早于2027年登陆纳斯达克，估值最高或达1500亿美元。 这一决定的直接导火索，是来自韩国监管机构和现有股东的双重压力。韩国金融监督院院长李灿镇本月早些时候向议员表示， 金融监督院与金融委员会均认定Solidigm上市受\"重复上市\"限制规则约束；金融委员会主席李亿远随后也表示，SK海力士及其上层母公司有义务保护股东权益。 与此同时，SK海力士股价自6月高点已累计下跌58%，股东对独立上市可能稀释持股价值的担忧持续发酵。 监管定性\"重复上市\"，成压垮上市计划的关键 韩国监管层的明确表态，是此次上市计划夭折的核心因素之一。 据彭博报道，韩国金融监督院院长李灿镇本月向议员表示，金融监督院与金融委员会均认定Solidigm的计划上市构成\"重复上市\"，适用相关限制规则。金融委员会主席李亿远亦于10月22日表示，SK海力士及其上层母公司须履行保护股东权益的义务。 所谓\"重复上市\"，是指一家已上市公司的子公司再度独立上市，由此引发母公司股东利益受损的争议。 此次事件也被视为首尔方面强化公司治理、保护少数股东权益努力的一次重要检验——韩国股市长期存在所谓\"韩国折价\"（Korea discount）问题，即本土上市公司估值系统性低于全球同类企业。 股东忧虑价值稀释，股价重挫加剧压力 除监管层面的阻力外，SK海力士现有股东的强烈反对同样是促成这一决定的决定性因素。 据韩国经济日报援引业内人士报道， 股东担忧Solidigm独立上市将触发\"双重上市折价\"，侵蚀SK海力士整体企业价值。 一旦Solidigm向外部投资者发行新股，SK海力士对其持股比例将被摊薄，Solidigm未来的净利润和盈利增长也将部分流向新投资者，而非留存于现有股东。 Solidigm在SK海力士体系内举足轻重。据韩国经济日报，Solidigm占SK海力士总企业价值的12.9%；其母公司AI Company今年上半年净利润达5.84万亿韩元（约合42.1亿美元），相当于SK海力士同期总利润的4.3%，营收贡献比例则接近10%。 与此同时，SK海力士股价自6月高点已累计下跌58%，市场对内存芯片需求放缓及半导体板块整体回调的担忧持续压制估值，进一步放大了股东对独立上市方案的抵触情绪。 脱胎于英特尔NAND业务收购 Solidigm的诞生源于SK海力士对英特尔NAND闪存及固态硬盘业务的收购。SK海力士于2021年完成相关业务整合，Solidigm目前重点布局面向人工智能数据中心的企业级固态硬盘（eSSD）市场。 在公司治理架构上，SK海力士今年1月设立美国中间控股公司AI Company，并将新设的Solidigm实体置于其旗下，同时向其注入最高100亿美元资本，完成一轮治理架构重组。AI Company目前持有Solidigm 100%股权。 SK海力士此前于10月1日表示，尚未就Solidigm资本运作作出最终决定，正在评估内部资金与外部融资等多种方案，并强调任何决策都将以长期企业价值和股东利益为重要考量。此次正式放弃美国上市，意味着公司将转向其他融资路径，但SK海力士尚未就后续安排作出公开说明。 上市告吹，短期争议有望平息 随着SK海力士正式接受股东意见、宣布撤回上市计划，围绕股权价值稀释和股东利益受损的市场争议预计将阶段性缓解。 分析指出，此次Solidigm撤回上市，是近期全球多宗高知名度IPO相继搁浅浪潮的组成部分，背景是投资者对人工智能交易前景的疑虑上升以及市场波动加剧。不过，与其他案例有所不同，Solidigm的退出主要由韩国国内的监管阻力所驱动。 SK海力士强调，此次决定不代表Solidigm增长前景或资本需求发生任何变化。公司将继续评估为Solidigm扩充产能、加大研发投入提供资金的最优方案，但具体路径尚待明确。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 08:06:25+08:00","time":"10-23 08:06","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784259","tag":"国内核心","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.06"},{"title":"伊朗战事冲击，出口大国反进口：卡塔尔与美国签年购400万吨LNG至2054年长单","summary":"作为伊朗战事前全球名列前茅的液化天然气（LNG）出口国，卡塔尔首次以买方身份向美国采购天然气，全球能源贸易流向被地缘冲突撕开了一道罕见的裂口。 美东时间22日周四，卡塔尔国有油气公司卡塔尔能源（QatarEnergy）宣布，与美国最大LNG出口商切尼尔能源（Cheniere Energy）达成了二十余年内每年最高采购400万吨LNG的长期协议。据报道，这是卡塔尔首份对美LNG承购协议。 促成这笔交易的，是卡塔尔自身供应体系的断裂。国内Ras Laffan工业城在美以伊冲突期间受损，卡塔尔能源被迫大幅减少出口流量，叠加霍尔木兹海峡航运持续动荡，卡塔尔需向亚洲客户维持合同承诺，不得不借助美国的产能填补自家的缺口。 对切尼尔而言，一份来自主权级买家的超长期承购协议，为美国LNG的定价权与市场地位提供了新的背书。对全球市场而言，中东出口国开始反向进口，供应链脆弱性正从风险概念变为现实。 首份对美长单：两座液化厂各200万吨 卡塔尔能源称，与切尼尔能源公司（Cheniere）签署了两份长期购销协议（SPA），采购量最高可达每年400万吨液化天然气（LNG）。 卡塔尔能源将从切尼尔位于美国路易斯安那州Sabine Pass与得州Corpus Christi的两座液化厂每年各采购200万吨，其中，Sabine Pass工厂每年100万吨的供应量取决于该设施扩建阶段的最终投资决定，协议整体框架已经确立。 根据协议条款，交付方式为离岸价（FOB）模式，预计交付将于2031年开始，持续至2054年。 卡塔尔能源同时也是美国得州Golden Pass LNG出口项目的大股东，该项目正处于启动阶段，埃克森美孚（ExxonMobil）为另一股东。这意味着卡塔尔在美国LNG产业链中的角色，正从资产持有者扩展为实际承购方。 伊朗战事导致卡塔尔供给断裂 卡塔尔的困境源于两个叠加因素。其一是卡塔尔东北海岸的Ras Laffan工业城在伊朗战事中遭袭，LNG、氦气及尿素等生产持续中断；其二是霍尔木兹海峡通航的安全形势恶化，出口量大幅减少。 据人民日报报道，国际海事组织秘书长阿塞尼奥・多明格斯日前表示，霍尔木兹海峡及周边海域安全形势持续恶化，美以伊冲突以来已有超110艘船舶在海峡及周边遭袭，至少24名海员遇难。10月5日至11日，海峡及周边报告12起船只遇袭事件，创2月底以来单周最高纪录，仅11日单日就有6艘船舶遇袭。有统计显示，海峡航运量已降至冲突前的不足一成。 卡塔尔能源已将LNG交付的不可抗力条款延长至11月，显示交付中断仍在持续。 天然气收入蒸发对卡塔尔财政的冲击正在显现。 卡塔尔财政部公布，今年第二季度，卡塔尔政府预算赤字达212亿里亚尔（约合58亿美元），为2016年底以来最高水平，几乎是第一季度赤字的两倍。 贸易流向逆转意味着什么 这笔交易标志着传统能源贸易路线正被地缘政治力量重塑。过去LNG流向逻辑相对清晰——中东向亚洲、欧洲出口，美国作为新兴供应方向全球渗透。如今一个中东出口国开始从美国进口LNG，打破了这一格局的基本假设。 对市场而言，直接影响体现在两个层面：其一，美国LNG出口设施的产能锁定周期进一步拉长，切尼尔等出口商的现金流可见性增强；其二，卡塔尔的采购需求可能在未来数年内持续存在，为北美LNG价格提供额外需求支撑。 若霍尔木兹海峡的通行风险长期化，中东LNG出口能力恢复将面临结构性障碍，其他依赖该通道的海湾能源出口国是否也会寻求类似安排，将是后续需要密切观察的方向。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 03:35:04+08:00","time":"10-23 03:35","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784248","tag":"国内核心","impact":"AI智能解读：全球供应链格局面临重构压力，相关出海企业成本及海外市场份额面临测试。","asset":"外贸出口板块 / 汇率 / 跨境物流","id":"NO.05"},{"title":"特斯拉、英伟达联手锁定产能，三星电机扩产高端封装基板","summary":"特斯拉与英伟达正通过大规模资金投入，提前锁定下一代AI芯片所需的高端封装基板产能，三星电机由此成为供应链扩张的重要受益者。 10月22日，据韩国《每日经济新闻》援引业内消息人士报道， 三星电机将获得特斯拉和英伟达合计约3.7万亿韩元的投资承诺，用于扩大高端倒装芯片球栅阵列（FC-BGA）基板产能。 这类基板是高性能AI芯片封装的关键组件，随着AI推理需求增长，头部科技企业正通过资金支持和长期供货协议，提前锁定关键制造资源。 相关投资将纳入三星电机今年9月披露的4.27万亿韩元世宗工厂投资计划。 新产线预计于2027年底完工，2028年上半年完成设备安装与试生产，下半年进入量产，面向特斯拉的首批出货预计于2029年启动。 与此同时，英伟达正同步推进全球基板供应链扩张，布局日本、韩国和中国台湾地区的主要供应商，目标是在未来三年内将IC基板总产能提升至现有水平的2.5倍。 特斯拉、英伟达提前锁定产能，三星电机加速扩产 据报道，三星电机已与特斯拉签署为期五年的FC-BGA基板长期供应协议，期限为2029年至2033年。 特斯拉将出资约1.1万亿韩元，以获得世宗工厂专属生产线的优先供货保障。 相关基板将用于特斯拉自动驾驶汽车的AI芯片及人形机器人Optimus。通过提前投入资金、锁定专属产能，特斯拉试图降低未来产品规模化生产时的关键零部件供应风险。 英伟达的布局则覆盖更多供应商。 在日本，据科技媒体TechNews报道，英伟达已与Ibiden签署产能预付协议，承诺投入数十亿美元，支持后者将小野工厂的产能扩大至原来的三倍，新增产能预计于2028年第一季度开始释放。 在韩国，据《每日经济新闻》估算，英伟达对三星电机的投资承诺约为2.6万亿韩元，但英伟达官方声明并未披露具体金额。随着三星电机世宗及釜山工厂扩产推进，英伟达预计将在其2028年封装基板年产能中占据相当大比例。 在中国台湾地区，英伟达则通过产能预留协议支持欣兴电子（Unimicron）扩充KF基板产能。TechNews报道称，新增产量预计从2027年第二季度开始释放，并于2028年年中达到满产。 高端基板市场集中，三星电机挑战Ibiden主导地位 高端FC-BGA基板市场目前由三星电机、日本Ibiden及中国台湾地区的欣兴电子等少数厂商主导。据《每日经济新闻》援引业内估算， Ibiden的市场份额超过70%，占据领先地位。三星电机此次大规模扩产，旨在提升产能规模，缩小与行业龙头的差距。 英伟达将产能扩张延伸至多个地区，也反映出AI芯片供应链的竞争正从芯片设计和制造延伸至封装基板等关键环节。随着AI推理芯片需求增长，提前锁定高端基板产能有助于芯片厂商缓解供应瓶颈，也为基板供应商提供更明确的长期需求预期。 三星电机近期还披露了另一笔封装基板订单。10月19日，公司宣布与一家未具名的全球客户签订价值3605亿韩元的存储半导体封装基板供应合同，供货期覆盖2027年全年。 这笔订单进一步显示，三星电机正同时受益于AI芯片和存储半导体相关的封装基板需求。不过，新增产能能否顺利转化为收入与利润，仍取决于客户需求兑现、产线爬坡进度及高端基板市场竞争格局的变化。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 01:03:03+08:00","time":"10-23 01:03","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784240","tag":"国内核心","impact":"AI智能解读：AI算力基础设施景气度验证，上游供应链订单与产能利用率成核心定价锚。","asset":"费城半导体指数 / 纳斯达克 / A股半导体产业链","id":"NO.04"},{"title":"“所有人都崩溃了”......百名交易员，同一笔交易，两度爆仓！","summary":"欧洲国债套利交易接连爆仓，近百名伦敦交易员出局，一场高杠杆交易的集体崩塌正在冲击欧洲固定收益市场。 “Everyone has blown up（所有人都爆仓了）……他们全部出局了。” 说出这句话的，是一位流动性提供商的资深交易员。他亲眼目睹了这场欧洲国债市场的剧烈震荡： 近百名交易员在同一笔交易上前后两度爆仓，黯然离开了他们曾经年薪百万美元的岗位。 这并非个别基金的投资失误，而是一场由拥挤交易、高杠杆和流动性收缩共同引发的连锁崩塌。 那笔曾经像“印钞机”一样的交易 过去近三年，伦敦多策略对冲基金圈最热门的操作之一，是一笔逻辑简单、收益看似稳定的套利交易： 买入法国国债（OAT），再以国债作为抵押品，在回购市场（repo market）融资，赚取债券收益率与回购融资成本之间的利差（carry）。 通过不断加杠杆，原本只有几个基点的利差，也能被放大成数百万美元的年度收益。这种交易逐渐成为欧洲固定收益市场最拥挤的策略之一，Balyasny、Millennium、ExodusPoint等顶级多策略基金均参与其中。 Fidelity International固定收益首席投资官Marion Le Morhedec估计，对冲基金的交易活动可以解释近期法德国债利差走势的大约50%。 这意味着，市场价格不仅受到法国财政前景等基本面因素影响，也在很大程度上受到杠杆资金仓位变化的驱动。 一位在银行业观察这一交易的资深交易员对此并不客气。他认为，这些人并非真正意义上的组合经理，而是把欧洲政府债券当作套利工具，通过买入债券、赚取利差来获取分成。过去一段时间，这套模式确实带来了丰厚回报，但不少组合经理同时做多法国和意大利国债。随着通胀升温、利率走高，这种高度相似的仓位越来越难以维持。 另一位业内组合经理则用一句话概括了这一切： “每个泡沫都有它的时刻。” 第一次爆仓：3月的警报没能阻止重仓回归 今年3月，中东冲突及霍尔木兹海峡危机引发市场震荡，欧洲利率市场出现第一轮大规模去杠杆。原本依赖稳定利差和低融资成本的套利交易迅速承压，Millennium、Balyasny、ExodusPoint等多策略巨头在集中平仓中，吐回了当年年初以来的全部甚至更多收益。 这场冲击暴露了策略最脆弱的一面： 当市场波动突然上升，融资条件发生变化时，依靠杠杆放大利差收益的交易，也会同步放大损失。即便底层债券最终可能恢复稳定，基金也未必有足够的资金和时间等待市场反弹。 3月的抛售本应成为警报，提醒交易员重新评估仓位规模、融资条件以及市场流动性。然而，一些人选择继续留在这笔交易中，另一些人则在亏损稍有修复后，重新建立了相似的头寸。 问题在于，这并不是一笔可以脱离市场环境、单纯依靠时间赚取利差的交易。当越来越多基金持有相同方向的仓位时，平时看似充足的流动性，一旦遭遇集中平仓就可能迅速消失。 因此，3月的冲击并没有彻底终结这笔交易，反而为10月更剧烈的平仓埋下了伏笔。 第二次爆仓：10月，融资压力引爆连锁平仓 如果说3月只是一次警告，那么10月的市场震荡则让这套策略再次遭遇重创。 10月1日，法国政府提交预算方案。法国财政监督机构随后批评该方案过于乐观，进一步打击市场信心。投资者抛售法国国债，债券价格下跌，依赖国债抵押融资的套利交易随之承压。 随着抵押品价值下降、融资条件恶化，基金面临追加保证金的压力，不得不卖出更多债券以降低风险；而集中抛售又进一步压低债券价格，形成恶性循环： 抵押品价值下跌 → 融资压力上升 → 追加保证金 → 被迫抛售债券 → 债券价格进一步下跌。 法德10年期国债利差（OAT-Bund spread）在短短几天内升至154个基点，达到2011年欧债危机以来最宽水平，随后进一步扩大至156个基点、158个基点。与此同时，法国10年期国债收益率在2026年突破5%，为2002年7月以来首次。 高盛追踪的“做多法国国债、做空德国国债”滚动期货篮子也遭遇重挫：该组合从2月约104.3的峰值跌至约99.2，抹去了近五年的累计收益。 RBC BlueBay高级组合经理Kaspar Hense观察到，止损首先在国债收益率曲线陡峭化交易中触发，随后损失扩散至账簿上的其他杠杆套利头寸。高盛系统交易策略（STS）团队也在客户报告中指出，曲线陡峭化交易的止损首先触发，继而波及同一风险账簿中的杠杆套利仓位。 这意味着，10月的抛售并非仅仅反映投资者对法国财政前景的重新定价。不同策略之间的风险传导、融资压力和被动平仓相互叠加，使市场下跌演变成更广泛的去杠杆冲击。 最致命的细节：同一批人，在同一笔交易上爆仓两次 这场风波最令人震惊之处，在于部分交易员并非第一次遭遇重创。 据那位流动性提供商的资深交易员观察， 10月被清出市场的许多组合经理，在3月已经经历过一次爆仓。他们再次押注相同的交易方向，却在七个月后遭遇了相似的结局。 “他们在同一笔交易上爆了两次。” 两次爆仓之间，市场曾给过他们重新评估风险的机会，但相似的仓位再次积累，最终又在融资压力和集中平仓中遭到清算。这不仅暴露出个别交易员对风险的误判，也反映出拥挤交易的结构性问题： 当参与者都相信利差收益能够持续时，任何一方都可能低估所有人同时退出的代价。 更值得警惕的是，对冲基金已成为欧洲主权债市场边际流动性的重要提供者。在银行、养老金和央行减少做市或降低配置之后，伦敦多策略基金的高杠杆交易员填补了部分需求缺口。但这类资金在市场平稳时提供流动性，一旦风险限额触发、融资条件收紧，又可能迅速转为卖方。 法国央行数据显示，法国国债约占欧元区主权债回购抵押品总额的1000亿欧元，而相关市场规模约为2500亿欧元。法国国债在这一融资体系中占据重要位置，其价格和融资条件的剧烈变化，很容易通过抵押品渠道影响更广泛的市场。 危机期间，有报道称，部分银行在某些时段甚至拒绝为法国国债报价。Allianz Trade的报告则显示， 市场深度一度较正常水平下降超过50%。当做市能力收缩、杠杆资金又被迫退出，市场便可能陷入流动性枯竭与价格下跌相互强化的局面。 近百名交易员出局：高薪岗位并不好找 市场震荡的代价已经从交易账簿传导至就业市场。据猎头和业内人士统计， 数周前被清出欧洲利率交易市场的组合经理和交易员人数，已从七十多人增至接近100人。 对这些曾经年薪超过100万美元的交易员而言，离开对冲基金并不意味着能够轻松找到同等收入的下一份工作。 回到银行，是一条可能的出路，但岗位和薪酬都存在限制。 有猎头表示，银行确实需要熟悉欧洲央行敞口和债券账簿管理的人才。然而，要匹配对冲基金的薪酬水平，这些交易员通常需要在银行担任相当高级的负责人，而此类职位数量有限。 非竞争协议也限制了短期流动。 一部分离职者受到合同中竞业限制条款的约束，暂时无法加入竞争对手，只能等待限制期结束。 另一些人则仍在领取原合同承诺的保底薪酬，因此并不急于寻找新工作。对他们来说，短期内等待市场和招聘环境明朗，可能比仓促接受新职位更有利。 还有一部分人选择自行创业。据估计，约10%的离职者主动离开原有平台，计划自行募集资金、管理基金。一位业内人士指出，当前资金分配者很难找到既有能力又敢于承担风险的人，因此部分交易员仍有机会利用外部资金建立自己的投资业务。 但这也带来一个现实问题： 当一批刚刚经历严重亏损的交易员试图重新募资时，投资者究竟会把他们视为经历过市场考验的人才，还是需要重新评估风险管理能力的高风险管理者？对这些交易员而言，离开原有平台只是第一步，重新赢得资金信任同样不容易。 下一块多米诺骨牌：意大利国债也面临压力 法国国债风波尚未完全平息，市场的注意力已转向意大利国债（BTP）。 法国OAT与意大利BTP同属欧元区主权债市场，也是部分对冲基金套利组合中的共同持仓。相似的交易逻辑、融资结构和杠杆水平，意味着法国市场的去杠杆可能进一步影响意大利债券。 摩根士丹利首席全球经济学家Seth Carpenter明确指出， OAT利差扩大已经对BTP形成压力。市场目前最大的担忧之一，就是意大利国债利差可能重演法国国债的走势。 如果说法国市场的暴跌是一次集中清理拥挤仓位的“定位冲洗”（positioning flush），那么意大利就可能成为下一处风险集中释放的市场。一旦投资者开始削减整个欧元区外围主权债的风险敞口，抛售就未必局限于法国。 更棘手的是，过去几年为这些市场提供边际需求的部分杠杆交易员，如今已被迫退出。潜在的接盘资金能否及时填补空缺，将直接影响市场调整的深度和持续时间。 与此同时，一些离职交易员仍处于“园艺假期”（gardening leave，即离职后的冷却期），暂时不能立即加入新机构。对市场而言，这不仅意味着交易员个人职业生涯出现断档，也意味着原本活跃于欧洲国债市场的一部分交易能力和风险承接能力暂时退出。 尾声：这不只是近百名交易员的职业危机 一位交易员对这场风波作出了简短而沉重的判断： “This is systemic.（这是系统性的。）” 这场风波暴露的，不只是近百名交易员的职业挫折，而是欧洲固定收益套利体系对低融资成本、稳定利差和充足流动性的共同依赖。当相似的仓位集中在少数高杠杆参与者手中，市场一旦反向波动，原本分散在不同基金的风险就可能迅速汇集，并通过抵押品、融资成本和被动平仓形成连锁反应。 法国国债的调整是否会进一步传导至意大利，仍有待观察。但至少，这轮冲击已经表明，过去三年看似稳定的套利收益，并不意味着风险真正消失；它也可能只是被杠杆掩盖，直到市场条件发生变化才集中暴露。 当曾经靠这类交易赚取丰厚回报的人，开始警告这一资产类别可能再也回不到从前时，值得警惕的已不仅是一次交易亏损，而是支撑这套交易模式的市场结构正在发生变化。 毕竟，每一次泡沫破裂之前，都有人相信这笔钱可以一直赚下去。 所有人都崩溃了。然后，所有人都出局了。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-22 23:13:49+08:00","time":"10-22 23:13","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784234","tag":"国内核心","impact":"AI智能解读：货币政策走向发生边际变化，直接重塑无风险收益率曲线与全球资本流向。","asset":"黄金 / 美债 / 汇率 / 银行与高股息资产","id":"NO.03"},{"title":"精测电子实控人欲揽第三家上市公司，众凌科技启动IPO辅导","summary":"10月21日，据证监会网站披露浙江众凌科技股份有限公司（下称“众凌科技”）在浙江证监局办理IPO辅导备案，辅导机构为国泰海通证券。 众凌科技核心产品便是高精度金属掩膜版（FMM），这是OLED面板制造过程中的关键材料，主要用于控制有机发光材料的蒸镀位置和精度，直接影响面板的分辨率和生产良率。 众凌科技已实现20μm厚度FMM产品量产，并向国内头部OLED面板厂商批量供货，同时推进G8.6代高精度金属掩膜版的国产化。 随着产品逐渐实现商业化，众凌科技的收入从2022年127.85万元飙升至2024年的1.29亿元。 此次众凌科技启动IPO辅导，受到关注的另一大原因，在于其与A股上市公司聆达股份之间的一段资本运作往事。 众凌科技的实际控制人彭骞，同时控制着A股上市公司精测电子。2025年，彭骞还主导了另一家上市公司*ST聆达（现“聆达股份”）的破产重整，并于2026年初正式取得控制权。 众凌科技正是这场重整的产业投资人之一。 彼时，众凌科技的加入也让聆达股份的产业转型有了新的想象空间。2025年3月，聆达股份与众凌科技等签署《重整投资协议》，其中明确提出，重整完成后，上市公司将借助产业投资人的资源优势，在符合证券监管规则的前提下，择机、逐步引入产业投资人的电致变色EC膜材料或FMM业务。 由此形成了市场对众凌科技资产注入聆达股份的预期。 此后，聆达股份的重整逐步推进，但在最终获批的重整计划中，此前被提及的FMM业务并未成为一项明确的资产注入安排。 聆达股份优先与彭骞投资的另一家企业江苏精煜智显展开合作，布局彩色滤光膜等显示材料业务。 对于后续资产整合，重整计划则提出，在上市公司相关主营业务持续稳定发展三年后，再择机开展产业并购，包括将其他优质资产置入上市公司。 2026年1月，众凌科技在《详式权益变动报告书》进一步明确，除已披露的精煜智显合资事项外，暂无未来12个月内对上市公司或其子公司的资产、业务进行出售、合并、合资或合作的明确计划。 如今，随着众凌科技正式启动独立IPO辅导，昔日资产注入的猜想或就此化为泡影。 如果此次IPO顺利完成，彭骞旗下有望同时拥有众凌科技、聆达股份和精测电子三家A股上市公司。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-22 23:13:40+08:00","time":"10-22 23:13","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784238","tag":"国内核心","impact":"AI智能解读：国内政策面与产业资本风向共振，直接作用于本土风险偏好与估值体系。","asset":"A股核心指数 / 人民币资产 / 顺周期板块","id":"NO.02"},{"title":"“大9”混战，万辆爆款也站不稳了","summary":"作者 | 周智宇 10月21日，极氪公布9X上市一周年成绩：累计交付突破8.5万辆，单车成交均价超过53万元。 卖得贵，也卖得多，是中国车企争相造“大9”的初衷。2022年的理想L9、2023年底的问界M9先后证明了这种可能，到2025年春季，同行的旗舰开始密集上市。 如今，车企已经能造出配置相近的产品，消费者却多了许多选择，二十多万元就能买到一辆配置齐全的大六座。各家的品牌都想往上走，争夺的买家却越来越接近。 销量过万，也不再足以让一家车企放心。零跑D19在7月冲过万辆，9月又回到三千辆左右。 “大9”的花期越来越短。一次冲高可以证明产品曾经获得认可，却还不足以支撑车企对旗舰的全部期待：提高售价、贡献规模，并为后续研发带来利润。 早期“大9”的成功仍在吸引后来者。只是等各家的旗舰陆续开进展厅，当初看中的市场里，已经多了一批同样准备了数年的对手。车可以照着相近的思路造，先行者起步时的竞争环境，再难重现。 拥挤的“大9” 工信部近日公布的第412批新产品公示中，领克900L、尚界Z9、奕境X9、方程豹钛9、魏牌V9X等五个“9系”旗舰SUV车系同时出现。除了新车型，车企还在补充纯电、油混和不同座位版本。 这批产品涌向的，是一个快速增长、也迅速变得拥挤的市场。 汽车之家研究院按上险口径统计，今年上半年，更广泛的大型SUV市场销量约35万辆，同比增长97%；在售车系从2023年的24个增加到今年的50个。 增长没有平均分给每款车。按月度零售数据，极氪9X在3月突破万辆，8月降至2887辆，9月回升至5175辆；问界M9则在6月至9月保持万辆左右。 有人还在高位，有人已经走过一次回落，又开始爬坡。 车企想再靠配置制造惊喜，越来越难。蔚来董事长李斌此前对华尔街见闻直言，把车做大、加上舒适配置，其他厂商也能很快做到，“卷参数用户也脱敏”。消费者面前摆着几款相近的产品，可以在原来的预算里挑品牌、挑体验，也可以少花一些钱，买到配置接近的旗舰。 零跑D19的起售价是21.98万元。零跑高级副总裁曹力说，按上市初期用户选择的版型看，成交均价在25万元以上，老用户增换购占比较高。一部分客户愿意买更贵的零跑，品牌向上有了回应；放到整个旗舰市场，这辆车又把大六座的门槛拉低了。 对于后来者，争取高端用户也未必意味着让用户增加预算。奕境X9预售时，奕境汽车营销副总经理程劲文把核心目标群体指向过去购买30万元左右合资品牌的家庭。 消费者花相近的钱，就能换到一辆大六座；企业希望借这批客户进入更高价格带。 D19还要为零跑的年度销量目标出力。COO徐军今年4月向华尔街见闻解释年度目标时表示，要完成目标，各款产品都需要成为爆款。D19确实在7月冲过了万辆，但两个月后回到三千辆左右，尚未形成稳定的高销量。 对车企来说，首批需求和产能集中释放，可以推高一款车的交付量。后面几个月有没有足够的新客户接上，才是另一场更长的考验。销量回落的幅度看得见，订单和交付节奏各自的影响，却不能单靠月榜分清。 更高的价格带上，蔚来ES9自5月28日开始交付，到9月23日累计交付达到3万辆。蔚来披露，它已连续三个月位居50万元以上纯电车型月销首位。这批高预算用户，仍然是各家希望争取的客户。 不过，一辆旗舰开始热销，离它改善整家公司的利润还有距离。理想汽车CFO李铁在二季度财报中表示，全新L9有助于毛利率环比改善。当季理想整车毛利率回升至9.4%，仍低于上年同期的19.4%。 新旗舰已经在改善产品组合，过去的盈利水平却还没有回来。 旗舰的诱惑 四年前，L9给中国车企展示的，是一门此前很难做成的生意。 2022年6月，理想L9上市时只有一个45.98万元的版本。五米二的车身装下六个座位，三排都配有电动调节和加热，日常可以用电，长途又能加油。一家人要空间、要舒适，还想兼顾电驱体验和补能便利，L9把这些要求放进了同一辆车。 L9在首个完整生产月交付过万。2023年底上市的问界M9，又在2024年实现超过15万辆交付。中国品牌以往很难同时获得的高售价和较大销量，在这两款车上成为现实。 售价高、销量大，对仍要大量投入研发和渠道的车企格外有吸引力。李想在2022年三季度财报中就表达过这样的经营目标：获得健康的毛利率和能够自我支撑的现金流，再持续投入研发与经营能力。 旗舰若能提供这样的收入，品牌向上也就有了继续投入的资金。 高端市场当时仍保留着更好的利润空间。一位外资投行汽车行业分析师对华尔街见闻表示，过去两年，普通合资品牌赚钱已经很困难，豪华车仍能赚钱。这也是本土车企继续往上走的重要吸引力。 但一辆车从立项到上市需要时间。2025年4月领克900上市，而这个项目三年前就已开始开发。领克900承接了09用户对空间、舒适和智能化的反馈，也参考了友商满足这些需求后的市场表现。 等到2025年春季，这些研发计划开始集中兑现。腾势N9、领克900先后上市，后续产品还在准备。先行者不断证明市场存在，其他车企也在完成自己的旗舰。开发期间看到的机会，到了上市时，已经有更多人参与争夺。 供应链又让这场追赶变得更快。空气悬架等配置，不再要求每家车企都从头开发。2025年，保隆科技与倍适登合作，计划向整车厂提供减振器和空气弹簧的一站式方案，以优化成本、简化供应链接口、缩短上市周期。保隆当时已为空气悬架领域的数十家客户提供方案。 同一类高端部件进入更多产品，消费者就能在不同价格带找到相近的配置。先行者靠一套完整的家庭体验吸引买家，后来者则可以在相近的产品思路下继续增加配置，或者压低价格。每家的产品都在进步，单靠配置支撑高售价却越来越难。 这种变化，在奕境X9的定价中体现得很直接。8月预售时，品牌总经理曾清林解释，项目一开始便选择高规格的硬件与软件，先做旗舰是务实的选择，“否则成本也覆盖不了”。 面对高成本配置与利润空间之间的关系，他又表示：“宁让利润，不让配置。”奕境希望争取的核心客户，是过去购买30万元左右合资品牌的家庭。它要用更完整的配置吸引这些人，却不能只按硬件投入来决定售价。 旗舰需要较高的价格来容纳技术投入，争取客户时，又要让出一部分利润。这两种要求同时落在一款新车上。 消费者换成中国品牌，可能正是因为相近的预算可以买到更多东西；过去留在高端市场里的利润，也就很难随着客户一起照原样转过来。 长销的代价 今年，各家车企拼命地出大的9系的车，让这个原本就有限的赛道，愈发拥挤。 前述外资投行汽车行业分析师表示，行业里一些车型上市三至六个月销量见顶，十二个月后已明显转弱。 紧接着，他谈到开发成本：花数亿元做一款车，如果只能有效销售一年甚至几个月，投入便很难收回。车企用了几年把产品开发出来，留给它赚钱的时间，却可能远比预想中短。 已经卖了一段时间的旗舰，则在争取下一批买家。领克本周公布900L官图，此前的申报信息显示，它增加了七座布局；极氪9X已经补充五座版本、进入海外市场。10月19日，智己启动提前到来的“双十一”促销，LS9超级增程指定现车也被纳入。 增加版本能够覆盖新的需求，促销能够降低购买门槛，但这些动作各有代价。新版本要开发、验证和备货，降价则直接改变每辆车能够留下的收入。旗舰上市后，企业仍要决定哪些投入值得继续。 李斌提醒，销量能够摊薄的成本，没有外界想象的那么多。蔚来测算量价关系时，优先考虑毛利总额；小幅降价未必能带来足够增量，大幅降价又会碰到成本结构的限制。在他的测算中，厂房、设备、模具等真正可以靠增加销量分摊的固定成本，是有限的。 每多卖一辆车，电池、芯片和座椅仍要重新采购。售价降低以后，需要增加多少销量才能补回毛利，取决于具体的成本结构。对坚持“宁让利润，不让配置”的奕境而言，硬件也不能因为让价就少装几件。 能够在多个产品间共用研发、制造和渠道的车企，可以减轻单款旗舰承担的投入。新品牌还要一边交车，一边建立服务和口碑。即便两款车配置接近，继续经营它们的成本也可能相差很大。 销量起落越快，这些取舍就越紧迫。巩旻在今年5月的一次行业交流中，谈到车企“拼命地出大的9系的车”，并提醒行业内一些车型上市三至六个月销量见顶，十二个月后明显转弱。花数亿元开发的产品，如果只能有效销售一年甚至几个月，投入便很难收回。 为一款车延长销售周期，需要更多人愿意继续选择这个品牌。麦肯锡2026年消费者调查显示，在电动车购买考虑中，品牌的重要性已升至续航与充电时间之后的第二位，消费者最初考虑的品牌数量还在减少。配置越容易被追上，企业过去的产品和服务，就越会影响旗舰能否进入下一批客户的选择范围。 几款旗舰销量回落，也不足以让这场混战马上降温。前述外资投行汽车行业分析师指出，参与同质化竞争的企业很多，又很难有效退出，新品牌和更多大型SUV仍在出现。项目已经开发，渠道已经铺下去，企业还会继续争取订单。 中国车企已经证明，四五十万元的旗舰也能卖给足够多的消费者。混战之后，要留下当初看中的高端利润，就得在每一次改款、让价和渠道投入后，仍然有钱可赚。月销万辆可以靠一款新车冲上去，支撑下一代旗舰的钱，却要在它上市后的漫长销售中一点点挣回来。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-22 21:48:09+08:00","time":"10-22 21:48","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784235","tag":"国内核心","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.01"}],"earnings":[{"title":"AI崩盘终极推演：泡沫可能在2028年初破裂，科技股或断崖式暴跌40%！","summary":"当前，全球市场正将筹码高度集中于一场史无前例的基础设施大跃进——AI投资热潮。然而，这场繁荣的底层逻辑正变得极其脆弱：当前的盈利主要依赖于科技巨头内部的“资本支出循环（Capex recycling）”和债务融资，而非外部终端用户的真实买单。 据追风交易台消息，TS Lombard首席宏观策略师Dario Perkins在10月22日的研报中称， 根据终极推演，这场AI资本支出狂欢极有可能在2028年初走向终结，并引发一场剧烈的市场重置。 报告指出，标普500指数将下跌30%， 科技股将断崖式暴跌40% ，约 20万亿美元 的市值将灰飞烟灭，美国股市的科技股权重将一夜回到ChatGPT发布前的水平。尽管科技巨头能凭借强劲的资产负债表存活，但AI生态系统上游的弱势群体（如新兴云服务商、独立模型开发者）将面临违约潮，预计将产生 1250亿至1900亿美元的信贷损失 。 TS Lombard认为， 宏观经济将陷入温和衰退： AI资本支出的骤降将导致美国GDP下降约 2个百分点 ，并造成约 80万个 数据中心建设相关岗位流失。但由于私营部门资产负债表健康且美联储有充足的降息空间，这不会演变成2008年式的系统性金融危机。 AI投资热潮：史上最大基础设施豪赌，可持续性存疑 AI资本支出已成为人类历史上规模最大的基础设施项目之一。 美国科技公司每年在AI建设上的投入约为1万亿美元，超级数据中心的累计投资规模已超越曼哈顿计划、阿波罗登月计划乃至马歇尔计划。超大规模云服务商（Hyperscalers）的资本支出占美国GDP的比例已接近历史峰值。 然而，这场繁荣的根基并不稳固。 当前AI生态系统的收入增长，在很大程度上仍是\"资本支出循环\"（capex recycling）的产物 ——一家公司的资本支出，就是另一家公司的营收。只要超大规模云服务商持续大规模投入，生态系统内部的收入就会持续增长，但这并不代表真正的可持续性。 真正的可持续性标志 ，应是来自生态系统外部——普通消费者和非科技企业用户——的收入占比显著提升。但截至报告发布时，这一比例几乎没有改善。AI的商业化变现仍是最大悬念： OpenAI和Anthropic约80%的收入来自仅1%的客户 ，而这些客户大多是依赖风险投资持续输血的亏损AI初创企业。 报告称，当前的AI繁荣本质上是一场“资本支出循环”——只要科技巨头不断向系统注资，收入就会增长。但随着债务成为边缘融资的主要来源，这种模式极易受到资本支出放缓的致命打击。 六大崩盘触发器：任何一个都可能引爆连锁反应 报告梳理了六大潜在风险点，指出AI崩盘已处于\"过度决定\"（overdetermined）状态——以下六大触发因素中的任何一个，都可能成为刺破泡沫的利刃。 触发器一：收入严重不达预期 多项研究显示，要使当前的资本支出获得合理回报，AI行业到2030年的年收入需达到 2.5万亿至3万亿美元 ，约为当前水平的 14倍 。这一增速在如此短的时间内几乎难以实现，尤其是在中国开源（开放权重）模型迅速抢占市场份额的背景下。普通消费者对付费AI服务普遍抵触，AI服务面临商品化风险。 触发器二：信用风险急剧上升 超大规模云服务商此前主要依靠自有现金流投资，但 债务已成为AI建设的边际融资来源 。仅2027年一年，AI公司预计将发行约 7000亿美元 新债券，其中超大规模云服务商占 4000亿美元 ，其余来自AI生态系统其他参与者——这一数字超过了欧元区所有政府债券发行总量。 更令人担忧的是\"表外负债\"的快速膨胀。以Meta在路易斯安那州的Hyperion数据中心为例：这是一个 300亿美元 的投资项目，Meta将其80%的股权出售给Brown Owl，成立名为Beignet的合资公司，后者融资 270亿美元 新债，由Meta提供担保（承诺租用该数据中心20年）。由于租约被拆分为五个四年期租约，Meta资产负债表上只体现了极小部分杠杆。 整个AI生态系统的隐性负债估计已达1.5万亿至2万亿美元 。部分新兴云服务商（如CoreWeave）的融资利率已高达 15% 。 触发器三：\"诱导利率\"陷阱与折旧悬崖 报告将当前AI财务结构与2000年代初次贷危机中的\"诱导利率\"（teaser rate）进行类比。数据中心在建设期间无需计提折旧，但一旦投入使用， 折旧压力将骤然加大 。与此同时，AI实验室签署的多年期数据中心租约，在数据中心正式运营前不计入成本。一旦更多数据中心陆续上线，AI企业的财务状况可能在12个月内发生根本性转变。 触发器四：IPO浪潮揭开真相 Anthropic和OpenAI均计划IPO（后者已推迟至2027年）。历史经验表明， IPO浪潮往往标志着周期顶部 。更重要的是，IPO将首次为外界提供了解AI行业真实经济状况的窗口——目前AI公司披露的指标（如\"年度经常性收入\"ARR）明显经过美化，存在大量信息不透明问题。 触发器五：半导体周期与供应链风险 英伟达（NVIDIA）是AI建设的\"镐与铲\"，也是整个AI繁荣的晴雨表。 英伟达正在大规模开展\"供应商融资\"（vendor financing） ，向客户提供贷款以购买更多芯片，业内称之为\"资产负债表即服务\"。根据国际清算银行（BIS）最新研究， 超过55%流入AI企业的投资来自其他AI企业 ，循环融资特征极为明显。此外，半导体需求具有高度周期性，存在\"牛鞭效应\"——一旦需求放缓，当前的硬件短缺可能迅速转变为严重过剩。 触发器六：监管与安全风险 AI技术在公众中的形象持续恶化。 约55%的美国人希望放缓AI发展速度，仅13%持反对意见 ，且这一结论在各主要政治群体中均成立。根据2026年IBM/Ponemon数据泄露成本报告， 全球四分之一的恶意企业数据泄露事件涉及某种形式的AI辅助攻击 。一旦发生重大安全事故，可能引发强烈的政治反弹和监管收紧。 \"二阶导数问题\"：增速放缓就足以引爆危机 报告特别强调了AI繁荣的\"二阶导数问题\"（second derivative problem）： AI资本支出不需要绝对下降，只需增速放缓，就足以引发金融压力 。 这与2000年代初次贷危机的逻辑如出一辙——当时触发崩盘的不是房价下跌，而是房价停止快速上涨。在AI建设中，前沿实验室签署合同承诺向数据中心运营商支付数十亿美元，后者以此为抵押借款建设数据中心。但这些实验室本身没有利润，其持续支付能力完全依赖于不断融资。 超大规模云服务商的资本支出就像一本贷款账簿：一旦放缓，整个繁荣就会瓦解。 市场冲击量化：20万亿美元财富蒸发，信用损失可控 目前科技股占美国股市市值高达 40% ，半导体板块单独占比接近 20% 。美国科技板块当前市盈率约为 30倍 （一年前为40倍），远低于互联网泡沫时期70-75倍的峰值。在AI崩盘情景下，报告预测： S\u0026P 500整体下跌30%；科技股下跌40%；其他板块下跌约20%，合计蒸发市值约20万亿美元。 报告称，这些估算将科技股占美国市场的比重拉回至ChatGPT推出前的水平。 到2027年底，非超大规模云服务商的AI生态系统预计将有约 5450亿美元 未偿债券、 9200亿美元 银行贷款和约 6500亿美元 私人信贷。AI相关债务总规模约为 2.9万亿美元 ，其中约 25% 面临风险敞口。 报告假设2028-2030年间累计违约率为 35% ，回收率为 25%-50% ，由此估算整体信用损失为 1250亿至1900亿美元 。这一规模虽然可观，但对美国整体金融体系而言并不构成系统性威胁。 股权持有人将承受最大损失（约20万亿美元），但不会出现2008年式的信用损失级联和全面破产潮。 最脆弱的环节包括：新兴云服务商（neoclouds）、甲骨文（Oracle）、独立模型开发商（OpenAI、Anthropic）以及建筑/设备供应商。 经济温和衰退，类似1990年或2001年 到2028年初，美国科技相关资本支出将较2023年上升约 3个百分点 （实际GDP占比）。报告假设完全逆转，但由于数据中心投资高度依赖进口，进口下降将部分抵消资本支出下滑对GDP的冲击。综合各种效应， AI数据中心繁荣结束将使美国GDP水平下降约2个百分点 （IMF最新世界经济展望报告得出了几乎相同的估算）。 报告称，整体而言，这场衰退的严重程度将与1990年或2001年相当，属于历史标准中的温和衰退，并给出了以下三个理由： 第一，私人部门资产负债表健康。 私人信贷增长幅度不足GDP的10个百分点，与1980年代末更为相似，远未达到次贷危机前的水平，不存在系统性信用事件的风险。 第二，货币政策弹药充足。 美联储自全球金融危机以来首次重建了充足的货币政策空间，有充分的降息余地，无需依赖财政政策大规模刺激。 第三，降息将激活\"K型经济\"底层。 长期受高通胀和紧缩货币政策压制的低收入群体、消费耐用品需求和住宅房地产市场（存在大量被压抑的需求）将从降息中直接受益。历史上，互联网泡沫破裂后，美联储的宽松政策迅速催生了住宅市场的新一轮泡沫，类似情景可能重演。正如互联网泡沫破裂后美联储催生了房地产繁荣一样， 降息将迅速刺激非AI领域的增长，这也是衰退将保持温和的核心原因。 此外，对于就业市场方面，报告指出，AI建设热潮目前已创造约 50万个就业岗位 ，预计到2027年底将增至 80万个 。若这些岗位全部消失，美国失业率将上升约 50个基点 ，在不考虑更广泛商业信心影响的情况下。 报告指出，最大的尾部风险在于： AI崩盘可能反而加速企业采用AI自动化来削减成本 。历史表明，互联网相关自动化的大规模推进发生在2009年经济衰退期间，而非繁荣时期。若AI崩盘触发大规模自动化浪潮，劳动力市场的冲击可能超出预期，导致缓慢的\"无就业复苏\"。 如何在泡沫中保全资产 报告称，AI崩盘是典型的需求冲击，而非1970年代的供给冲击（滞胀型衰退）。 长期利率将显著下降 ，债券与股票的相关性将转为负值，有利于国债的避险属性。但由于衰退程度温和，不会回到零利率或永久量化宽松。 AI繁荣与互联网泡沫的关键区别在于： 这场科技热潮高度集中于少数美国和亚洲公司 ，而互联网泡沫涉及欧洲在内的广泛发达市场参与。韩国作为AI供应链核心，过去12个月科技出口占GDP比重上升了 10至30个百分点 ，将在崩盘中遭受重创。 但欧洲等未深度参与AI繁荣的市场，在初期恐慌性抛售过后，将显著跑赢美国市场。这些经济体承受了AI繁荣的负面影响（高通胀、高利率），却未能充分享受其红利，AI繁荣结束反而可能带来解脱。 报告认为， AI崩盘对美元的冲击将远大于互联网泡沫和次贷危机 。由于危机根源在于美国金融体系，资金将流向欧元、日元乃至英镑等其他货币。全球投资者无需涌入美国国债寻求避险，其本国债券可以发挥同等作用。 报告明确指出， 现阶段做空美国科技股或大幅增加久期均不可取 ——若AI繁荣仍有数年可持续，过早布局将导致严重跑输。 最优策略参照GMO的Ben Inker提出的\"易泡沫\"（easy bubble）交易框架： 持有多元化全球股票组合 ，在繁荣延续时同样受益，在崩盘时跑赢集中押注AI的美国科技股。 仅在AI生态系统出现明显压力信号时，才逐步增配政府债券。 TS Lombard的这份推演报告传递了一个清醒而非末日论的信号： AI泡沫破裂不会是2008年，更像是2001年 。美国经济将经历一场温和衰退，金融体系不会崩溃，美联储有充足工具应对。 但对投资者而言， 20万亿美元的财富蒸发、科技股40%的跌幅、以及AI供应链国家和地区的剧烈冲击 ，足以让任何集中押注AI的投资组合遭受毁灭性打击。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 10:49:54+08:00","time":"10-23 10:49","source":"华尔街见闻财报","url":"https://wallstreetcn.com/articles/3784277","tag":"核心财报季","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.10"},{"title":"暴跌之际，华尔街力挺Meta：投资进入收获期，五大AI“印钞机”已启动！","summary":"暴跌之际，华尔街选择力挺Meta，押注AI资本开支进入收获期。瑞银和德意志银行在最新研报中均维持买入评级并上调目标价，核心判断是，Meta过去三年AI资本开支开始进入收获期，广告系统率先受益，五条AI商业化路径已经启动。 隔夜纳指重挫2.6%，费城半导体大跌6.7%，AI产业链承压。尽管Meta三季度营收及四季度指引双双超预期，但其AI资金承诺激增至8250亿美元，致使自由现金流十四年来首次转负。市场高度担忧巨额资本开支将带来短期发债压力，其五年期CDS飙升创历史新高。受此拖累，Meta周四股价大跌约7%，市值蒸发超千亿美元。 据追风交易台，瑞银证券LLC分析师Stephen Ju在最新报告中将Meta目标价从884美元上调至892美元，维持买入评级。德意志银行分析师Benjamin Black也将目标价从820美元上调至840美元。两份研报的共同判断是， 市场对Meta AI支出的定价逻辑正在变化，算力开始从成本压力转向收入资产。 对投资者而言，真正的分水岭是“兑现速度”。广告仍是Meta最硬的支撑，AI收入第一站也仍在广告系统；若Muse、Business AI、搜索广告、Advantage+和创作者聊天机器人带来的收入快于折旧和费用上升，AI资本开支将获得重新定价。若收入兑现放慢，当前估值将面临更重压力。 广告仍是最硬支撑 Meta三季度应用家族广告收入631亿美元，同比增长26%，接近总收入646亿美元的绝大部分。广告仍是支撑估值的核心基本盘。 拆分来看，广告展示量同比增长10%，低于2Q26的18%和3Q25的14%，显示量的增长边际降温。但单条广告平均价格同比增长14%，抵消了展示量放缓带来的压力。美国中期选举广告支出升温，也对广告价格形成支撑。 四季度指引继续强化收入端韧性。Meta预计收入730亿-760亿美元，中点745亿美元，高于市场预期736亿美元，且该指引已包含约1个百分点汇率逆风。 产品层面的AI改进已经开始进入广告效果。Instagram Reels相关性升级后，用户使用时长增加超过4%；Facebook新的生成式检索架构使Reels观看时长提升1%；Meta Generative Recommender使Facebook Feed部分定向场景转化率提升近2%；GEM扩展带来站外转化提升1.7%、应用广告转化提升9.6%；Andromeda改进使Facebook转化率提升1.4%。 广告主端也有反馈。采用Meta AI Business Assistant建议的广告主，在相同转化成本下转化量增加近5%，广告投入比可比非采用者高9%。瑞银提到，Advantage+带来的预算增量热度为年内最高。 AI开支开始被看成“收入资产” Meta估值叙事的变化，在于AI基础设施已压到广告主投放效果、用户时长和转化率上。核心广告系统已经在吸收算力和模型升级带来的红利。 德银Benjamin Black的判断是，Meta正在经历一个转折： “算力将从被视为‘成本中心’，转向被视为‘收入驱动资产’。” 这句话概括了当前多头逻辑：若AI基础设施同时提升广告转化、延长用户停留、支撑消费端代理和企业端产品，市场对资本开支的折价会下降。 Muse是关键变量之一。上线约六周后，Muse在美国和加拿大用户数超过1000万；已设置Muse的用户中，约25%会在任意一天使用。购物成为最常见场景之一，超过四分之一用户参与购物，平均购买金额超过200美元。 这意味着Muse的价值不只来自聊天使用量，还来自商业意图。Meta有机会在用户表达购买意图后介入推荐、比较和交易链路，再将高意图数据反哺广告系统，提升现有广告机器的效率。 五条AI收入引擎启动 第一条是核心广告系统。 Muse用于广告定向和内容推荐，直接影响“向谁展示内容”和“向谁售卖广告”两个关键环节。Advantage+则用生成式AI做创意和投放自动化，提高广告主预算使用效率。 第二条是Business AI和Business Agents。 它们与消息广告绑定，目标是提高WhatsApp、Messenger的使用和变现。Meta应用家族有36.4亿日活用户，同时至少有5亿个自我标识为小企业的主体使用这些应用触达客户、创造收入。若消费端代理与商家端代理直接交互，Meta可把发现、线索生成、交易、商业消息、广告投放和商家生产力工具放进同一张网络。 第三条是搜索和购物广告。 MetaAI/Muse如果能捕捉购买意图，就能进入更接近交易决策的位置。购物和旅行已经是Muse领先场景，商业化路径包括交易佣金、订阅、更高级模型或更多token使用量、面向企业主的付费功能、企业API与Muse Code。 第四条是创作者聊天机器人。 面向网红和创作者的chatbot可以拉长用户停留时间，带来更多可变现表面。逻辑类似Reels：先提升参与度，再逐步提升广告负载和变现效率。 第五条是企业端、API和算力出口。 企业端产品短期包括模型API、Muse Code和Meta Business Agents；更长期路径是把Muse部署到企业环境，并把Business Agents扩展到销售、客服等功能。若前几条收入兑现偏慢，Meta还可在供给紧张环境下出售多余算力或模型访问权。 兑现速度成为分水岭 瑞银并未把AI乐观情形完全写进模型。最新测算显示，Meta收入预计为2026年2562亿美元、2027年3173亿美元、2028年3792亿美元、2029年4406亿美元、2030年5037亿美元。 上修幅度相对克制。2027年广告收入预测从3045亿美元上调至3086亿美元，增幅1.3%；2028年从3613亿美元上调至3671亿美元，增幅1.6%。总收入层面，2027年从3143亿美元上调至3173亿美元，2028年从3756亿美元上调至3792亿美元，均约上调1%。 EPS变化同样有限。GAAP摊薄EPS预测中，2026年从29.28美元下调至29.04美元，2027年从30.81美元上调至32.01美元，2028年从31.08美元小幅上调至31.11美元。收入上修主要体现于2027年，2028年EPS抬升并不明显。 这说明市场真正关注的是“兑现速度”。 Meta管理层希望Muse从产品开发到收入贡献的周期快于过去约4年的产品周期。若AI收入跑在折旧和费用上升之前，资本开支可被视为前置投资；若兑现节奏偏慢，利润率和自由现金流将继续承压。 成本曲线仍重，2027年是关键年份 Meta把2026年资本开支指引收窄至1350亿-1450亿美元，总费用指引提高到1750亿-1790亿美元，其中包含此前披露的99亿美元法律罚款。剔除该费用，基础费用指引并未变化。 瑞银模型中，2027年和2028年资本开支分别达到2510亿美元和2996亿美元，股权自由现金流收益率转负。 总费用预测为2026年1754亿美元、2027年2131亿美元、2028年2662亿美元。折旧摊销也快速上升，2026年266亿美元，2027年458亿美元，2028年688亿美元。 德银估算显示，2027年运营支出约2120亿美元，同比增长20%，高于市场一致预期2040亿美元；资本开支约2330亿美元，同比增长66%，同样明显高于一致预期。 Reality Labs全年亏损预期为180亿至190亿美元。 效率改善是缓冲成本压力的关键。管理层预计，未来一年Muse计算成本效率将提升超过10倍，抓手包括模型蒸馏、提高GPU利用率、推理优化、使用非高峰或闲置算力、产品层效率改进，以及为特定任务优化专用模型。内部效率也在变化，每名工程师的软件产出同比增长超过一倍，超过70%的可衡量分析产出由AI辅助。 估值区间拉大，华尔街押注AI进入收获期 瑞银将Meta目标价从884美元上调至892美元，基于29倍市盈率，作用于截至3Q28的全年GAAP摊薄EPS 30.77美元。以10月21日盘后712.29美元计，该目标价对应约25%上涨空间。 29倍估值并不低。瑞银框架显示，该倍数相当于Meta长期GAAP摊薄EPS交易均值上方约2个标准差。支撑这一估值的前提，是Business Agents已经普遍可用，Muse已经上线且使用量增长，AI支出出现变现线索。 瑞银多头情形给出1206美元目标价，对应约69%上涨空间。 该情形假设两年收入复合增速提高到30%，4Q27-3Q28经营利润率达到34%，EPS为40.20美元，并使用30倍PE。 空头情形为539美元，对应约24%下跌空间。 该情形假设两年收入复合增速降至15%，经营利润率25%，EPS 21.56美元，并使用25倍PE。主要压力来自Class C股票引入后的股权融资担忧、2027年以后运营费用和资本开支框架仍未明确，以及广告展示量增速放缓。 对投资者而言，Meta当前交易的核心已经很清楚：广告仍是最硬支撑，AI开支正在被重新定价为收入资产，五条AI收入线开始启动。接下来决定估值方向的，将是这些GPU能否在广告、代理、消息、搜索和企业端同时产生足够快的收入回报。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 10:07:40+08:00","time":"10-23 10:07","source":"华尔街见闻财报","url":"https://wallstreetcn.com/articles/3784271","tag":"核心财报季","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.09"},{"title":"沪指跌破3600点，创业板跌2%，存储芯片、机器人活跃，算力硬件、贵金属集体调整，恒科指反弹超1%，小米涨6%","summary":"算力硬件、芯片半导体等再度下挫，覆铜板、光模块、光通信、电路板等概念股集体下跌，隔夜 Meta财报引爆AI资本开支恐慌 ，美股科技板块重挫，光通信、存储芯片等纷纷大跌。隔夜国际现货黄金、白银遭遇重挫，A股贵金属板块以及商品期货市场的贵金属期货均承压。 10月23日，A股低开低走，三大股指盘初集体下跌，且跌幅均超过了1%，贵金属、算力硬件、半导体芯片等方向跌幅居前，沪深京三市下跌个股超5000只。机器人再度活跃，白酒、汽车等板块走强。 港股高开高走，恒科指盘初涨1%，权重科网股集体反弹，小米大涨近6%。AI大模型亦走高，智谱、MINIMAX均拉升。债市方面，国债期货全线下跌。商品方面，国内商品期货多数下跌，贵金属期货跌幅居前。核心市场走势： A股 ：截至发稿，沪指跌1.37%，深成指跌1.61%，创业板指跌1.80%。 港股 ：截至发稿，恒指涨0.14%，恒科指涨0.86%。 债市 ：国债期货全线下跌，截至发稿，30年期主力合约跌0.08%，10年期主力合约跌0.02%，5年期主力合约跌0.02%，2年期主力合约跌0.01%。 商品 ：国内商品期货多数下跌，截至发稿，燃油涨近5%，原油涨超3%，锰硅涨2%，鸡蛋、沥青涨超1%，豆粕、焦煤、菜籽、集运指数、铁矿石等纷纷上涨，焦炭、橡胶、沪铝、热轧卷板、玻璃、螺纹钢、多晶硅、不锈钢、沪铜等品种下跌，纸浆、氧化铝、碳酸锂、沪镍跌超1%，烧碱、铂金、钯金、沪锡、沪金均跌超2%，沪银暴跌超5%。 09:51 人形机器人概念反复走强，兆威机电5天3板，此前睿能科技、赛福天2连板，大洋电机、福莱新材、均胜电子等冲高。 消息面上，特斯拉CEO马斯克在特斯拉财报电话会上表示，他坚信人形机器人整个赛道都将成为全球最大的产业，未来地球上人形机器人的数量甚至会超过人类。他还预计，到明年年末，机器人AI、机电设计、可靠性以及使用寿命等一系列问题有望得到解决。 存储芯片概念表现活跃，大港股份涨停，普冉股份、德明利、长鑫科技跟涨。 消息面上，三星电子及SK海力士正推进其中国厂房生产逾200层NAND晶片，将中国厂房技术提升至韩国厂房的水平。目前三星位于西安的工厂占公司全球NAND产量约40%，公司目标将目前生产约200层NAND晶片。 09:46 PCB概念集体调整，奥士康逼近跌停，中京电子、澳弘电子、崇达技术、金禄电子、强达电路跟跌。 09:26 上证指数低开0.94%，创业板指跌1.66%，贵金属、通信设备、电子元器件等板块跌幅居前。 09:21 恒生指数开盘涨0.41%，恒生科技指数涨0.51%，消费股表现活跃，理想汽车涨超3%领涨蓝筹。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 09:56:01+08:00","time":"10-23 09:56","source":"华尔街见闻财报","url":"https://wallstreetcn.com/articles/3784272","tag":"核心财报季","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.08"},{"title":"AI崩了、法国爆了，高盛推荐“对冲策略”：关注日元！","summary":"高盛FICC团队将三条看似无关的市场主线——AI估值重挫、法国债券危机与日元被低估——串联成同一个故事，并向机构客户推荐以日元多头作为当前最具性价比的对冲工具。 高盛FICC交易员Jonathon Chryssafis在最新发布的报告中指出，AI巨头财报令市场失望，正在重燃外界对这一科技趋势持续性的担忧。特斯拉削减资本开支、Meta的AI支出推动其信用违约互换（CDS）升至历史高位、Lam Research业绩指引令人失望，三重利空叠加，令对冲基金加速撤离科技板块。 与此同时，法国国债与德国国债的利差已扩至欧元诞生以来最宽水平，法国10年期国债收益率突破5%，超过欧债危机时期的绝对水平。高盛认为，上述风险最终都指向同一个方向： 美元资产吸引力下降、资本回流日本，进而推动日元升值。高盛的长期公允价值模型显示，日元相对美元被低估约40%，是其追踪货币中估值最为偏低的一个。 AI信贷裂缝：数据中心债券成为风暴眼 Chryssafis在报告中强调，AI估值重挫的真正震中并非股票市场，而是信用市场——尤其是低评级借款人的债券。 数据显示，2026年迄今（截至10月13日），美元项目融资债券发行规模已达约1050亿美元，几乎全部流向数据中心及芯片/算力融资项目。这一规模约为AI时代之前历史最高纪录（2020年约250亿美元）的四倍，也是2025年（已是当时历史纪录）的近三倍。 高盛信用策略团队对美元投资级科技债维持低配评级，并在其《AI、信用与更高资本成本》报告中指出，在利率\"更高更久\"及潜在能源成本压力的背景下，市场正在重新评估AI建设的经济逻辑。在高收益债领域，高盛维持中性，但预计AI相关发行人之间的分化将持续扩大，\"尤其是项目融资债券领域\"。Bernstein目前估计CoreWeave存在760亿美元的融资缺口，所谓\"高度分化\"或许意味着部分债券得到偿付、部分则不然。 法国债市\"飞出轨道\"：欧元承压 欧洲方面，法国债券危机持续升温。 法德10年期利差已扩至173个基点，不仅超过2011年欧债危机时期的水平，更创下欧元诞生以来的历史最宽纪录。 法国10年期国债收益率达到5.08%，而意大利国债收益率目前已较法国低出约50个基点——这一倒置在2011年危机期间几乎无法想象。 高盛策略师认为，能源价格下行是压缩利差的最清晰路径，原因在于：其一，可改善增长与财政赤字的风险偏斜；其二，有助于市场回归ECB有限加息的基准预期，从而带来一定的核心利率缓解；其三，可降低利率波动率，提升投资者重返套利交易的意愿。 Chryssafis表示， 若上述能源价格缓解未能实现，\"预计将看到更宽的利差和欧元汇率承受更大压力\"。 高盛交易台近期已观察到客户对欧元兑美元下行期权的需求上升，隐含波动率在长期历史回溯中仍处于相对低位。从估值角度看，欧元兑美元5年期实际利率差已收窄至-136个基点，与2025年初欧元交投于1.03附近时的水平相当，而当前欧元兑美元仍在1.12附近，两者之间的缺口意味着欧元存在进一步下行空间。 日元：被低估40%的最廉价对冲工具 报告中最引人关注的部分，是高盛将AI交易与日元走势直接挂钩。 高盛的GSDEER长期公允价值模型显示，日元相对美元被低估约40%，是该行追踪货币名单中估值偏离最大的货币。其背后逻辑在于： 日本数十年来将过剩储蓄大规模配置于美国金融资产，一旦AI引发的\"美国例外论\"叙事动摇、美日利差收窄，资本回流日本的趋势将随之加速，表现为美元抛售、日元买入。 高盛交易台指出，三重结构性因素已天然指向日元走强：日本官员持续表达对强势日元的支持；日本首相高市早苗（Takaichi）积极推动国内资金加大对本土金融资产的配置；日本央行维持渐进加息路径，而日本最大劳工团体目前正寻求在2027年春季薪资谈判中设定6%的目标中值（据路透社），这为日本央行继续加息提供了充分理由。 更重要的是，对冲成本极低。2年期美元兑日元平值期权隐含波动率目前为9.9，远低于20年均值13.8，接近20年低点8.4。高盛认为，以接近历史低位的价格为其追踪名单中估值最低的货币购买保护，性价比突出。 相关性翻转：AI下跌即日元上涨 自10月14日（高盛AI领先股票篮子单日下跌4.7%）以来，该篮子与标普500的相关性从0.73跳升至0.91；与10年期美债收益率变动的相关性从-0.13翻转为+0.19； 与美元兑日元的相关性则从-0.34翻转为+0.46。 这意味着，当前市场的逻辑链条已清晰成型： AI下跌→标普下跌→美债收益率下行→日元升值。 高盛交易台表示，将继续看好\"股票下行/收益率下行\"双重二元期权作为增长冲击对冲工具，并特别指出近期已实现相关性已回归\"AI下跌、10年期收益率走低、美元兑日元走软\"的模式。 唯一可能打破上述逻辑的情景，是高盛自身提出的布伦特原油冲至140美元以上的尾部风险——届时收益率将随油价上行，股票同步下跌，双重对冲策略将失效。但在此之前，随着标普500与单一AI篮子的相关性已升至0.91，\"分散化\"在当下有了新的含义：持有日元。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 09:32:35+08:00","time":"10-23 09:32","source":"华尔街见闻财报","url":"https://wallstreetcn.com/articles/3784269","tag":"核心财报季","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.07"},{"title":"“晚一季度交电，客户损失上百亿美元！”AI缺电焦虑引爆业绩，“储能妖股”Bloom Energy Q3营收狂飙138%","summary":"席卷全球的AI浪潮不仅引爆了算力需求，更彻底点燃了“现场发电（On-site Power）”的万亿级市场。 随着科技巨头们对数据中心电力的渴求达到白热化阶段，“储能妖股”、燃料电池技术公司Bloom Energy交出了一份堪称惊艳的第三季度答卷。10月22日，最新公布的Q3财报显示，在现场发电解决方案强劲需求的驱动下， 公司Q3营收翻倍飙升138%至12.4亿美元 ， 单季营业利润暴增超500% ，并由此在 今年内第三次上调了全年业绩指引 。Q3自由现金流净流出1.81亿美元，CRO坦承认，大额交付与现金回收之间存在时间错配，警告产能扩张成本将压制2027年毛利率。 公司CEO在电话会中直言，老化的传统电网已无法匹配AI扩张的速度，这迫使科技巨头全面转向现场发电。 \"今天，世界正在从一个百年老旧的中央化电力模式，转向一种包含坚定、分布式现场发电的新架构。Bloom正在引领这场变革。\" 尽管基本面强劲，但在此前大盘及前期涨幅的综合博弈下，其股价在周四盘后交易中下跌7%至200美元附近。 业绩狂飙：单季利润超去年全年，年内三度上调指引 10月22日，Bloom Energy召开Q3财报电话会。在过去的一年里，市场的关注点已从单纯的AI芯片扩展到了为其提供动力的基础设施。 得益于强劲的产品交付，Bloom Energy第三季度实现营收12.4亿美元，较去年同期的5.19亿美元猛增138%，远超分析师预期的10.7亿美元。**其中，核心的产品收入首次在单季突破10亿美元大关（达到1.07亿美元），同比增长179%。 利润端的爆发更为显著。 公司第三季度实现净利润2.503亿美元（GAAP摊薄后每股收益0.78美元），而去年同期为亏损2310万美元；剔除一次性项目后，调整后每股收益高达0.94美元，大幅击败华尔街预期的0.69美元。 Bloom Energy首席财务官Simon Edwards在电话会中强调了公司业务模式中蕴含的巨大运营杠杆效应： “仅本季度的营业利润（2.86亿美元）就超过了去年全年的总和。本季度营业利润率从一年前的8.9%扩大至23.1%，因为在营收增长138%的同时，营业费用仅增长了26%。” 基于第三季度的强劲表现和对第四季度客户交付时机的清晰预见， Bloom Energy今年第三次上调了全年业绩指引： 全年营收指引： 上调至44亿至46亿美元（此前指引为39亿至42亿美元，中值意味着同比增长约122%）。 调整后每股收益（EPS）： 上调至3.10至3.40美元（此前指引为2.55至2.85美元）。 值得关注的是，财报显示， 本季度经营活动现金流净流出2700万美元，自由现金流净流出1.81亿美元。 CFO坦承，大额交付与现金回收之间存在时间错配，合同资产与应收账款持续积累，且随业务规模扩张，营运资本占用将进一步加剧。 与此同时，公司CFO称，新产线爬坡与加急交付在短期内推高成本，多项降本项目尚需时间兑现； 资本支出已是去年全年的4倍，规模扩张伴随的启动成本将对2027年毛利率形成阶段性压制。 另外，管理层在电话会上明确表示，季度业绩节奏由\"客户准备情况和交付时间节点\"决定，年末少量交付的时间窗口将直接决定全年业绩落在指引区间的哪个位置，存在不可控的季度间波动风险。 “晚一季度损失百亿”：唯快不破的“现场发电” 为什么科技巨头们会爆发出如此惊人的“现场发电”订单？Bloom Energy创始人兼CEO KR Sridhar在电话会上给出了最直接的答案—— 时间就是金钱。 “今天，世界正从一个拥有百年历史的集中式电力模式，向包含稳定、分布式现场发电的新架构转变。Bloom正在引领这场变革。”Sridhar指出，传统电网的设计初衷是将电力均匀分配给大面积分散的客户，面对数据中心集中且巨大的电力需求时，电网已被“压垮”。 他引用了英伟达CEO在柏林GTC大会上的原话来阐述超大规模计算客户（Hyperscalers）的焦虑： “ 对于 一个吉瓦（GW）级的数据中心来说，每延迟一个季度就意味着损失100亿美元的错失收入 。 （对于100兆瓦的数据中心，一个季度的延迟就是10亿美元的损失）。这种对速度的渴望，压倒了电力模块上的任何其他价值主张。” 在交付速度上，Bloom Energy展示了绝对的市场统治力。Sridhar透露： “就在15个月前，我们宣布了与甲骨文（Oracle）的首个项目，并在 不到两个月内 就向其犹他州的站点输送了电力。我们在新泽西的Nebius项目上也实现了同样的目标——在签署合同后三个月内获得规划委员会批准， 批准后仅两个月，第一块电力就已准备好供客户使用。 ” Sridhar进一步强调，Bloom是目前唯一能同时满足 “获批最快（无需空气污染许可）、部署最快、未来可扩展” 三大需求的现场电力方案。“我们永远不会成为客户开启数据中心的瓶颈。”Sridhar自信地表示。 想象空间全开：万亿级碳捕集市场与公用事业的新盟友 除了当前AI带来的爆发性收入，市场同样高度关注Bloom Energy未来增长的可持续性。在电话会中，管理层描绘了三大极具想象空间的TAM（总潜在市场）扩展方向： 1. 碳捕集与封存（CCS）的“万亿级机遇”： 本季度，美国电力公司（AEP）宣布将使用高达 700兆瓦支持碳捕集与封存的Bloom能源服务器 ，为谷歌提供近乎净零排放的电力，这是一个史无前例的行业大单。 Sridhar在会上极度看好这一前景：“燃烧技术目前无法提供经济且可扩展的碳捕集途径，而Bloom的技术在商业领域是独一无二的，它能直接提供高浓度的二氧化碳用于捕集。 当世界准备好迎接这一步时，我认为这对Bloom来说是一个价值超过1万亿美元的市场机遇。 ” 2. 从“电网竞争者”到“电网帮手”（表前市场）： 过去，分布式电源常被视为传统公用事业公司的威胁。但现在，面对缺电危机，公用事业公司开始主动采购Bloom的设备。 “许多公用事业公司日益认识到，将我们的清洁基荷发电设备部署在他们的配电网络中，是满足其客户电力需求增长、同时增强配电网络稳定性的一种更快速、更经济的方式。”Sridhar指出，公司正在得克萨斯州等拥有全美最低电价的地区实现出货，证明了其成本竞争力的普适性。 3. 800伏直流电（800 VDC）的架构革命： 传统数据中心从交流电网取电需要经过复杂的变压和交直流转换，带来巨大的能耗浪费。Sridhar抛出了一个极具冲击力的数据：“我们在一份报告中展示过， 在投入运营的前五年，一个吉瓦级的数据中心如果采用800伏直流电架构，相比当前的工业时代供电架构，将节省超过50亿美元。 ” 在资本支出方面，CFO Simon Edwards强调，公司年内资本支出达到了2.31亿美元，是去年的四倍，主要用于扩建弗里蒙特和纽瓦克的产能。但他指出， 公司实现了“自我造血” ：“我们在扩建产能的同时，现金余额基本与年初持平（期末现金为2.5亿美元）。这种利润率结构使我们能够在保持资产负债表强劲的同时，投资扩大业务规模。” 正如CEO Sridhar在总结时所言：“在经历了25年之后，我们才刚刚开始。现在，我们的增长正在加速。” Bloom Energy 2026财年第三季度业绩电话会议全文实录如下（由AI辅助翻译） 名称： Bloom Energy 2026年第三季度财报电话会议 会议日期： 2026年10月22日 公司名称： Bloom Energy 会议描述： 2026年第三季度财报电话会议 来源： Bloom Energy 陈述环节 主持人： 大家好，感谢各位的加入，欢迎参加Bloom Energy 2026年第三季度财报电话会议。在今天的准备发言结束后，我们将进行问答环节。（主持人说明）。 现在我将把电话转交给Michael Tierney，请开始。 Michael Tierney，投资者关系： 谢谢，大家下午好。感谢各位参加Bloom Energy 2026年第三季度财报电话会议。 为配合本次电话会议，我们已通过8-K表格向美国证券交易委员会（SEC）提交了2026年第三季度财报新闻稿及补充财务信息，并已将这些材料发布至我们的投资者关系网站，本次电话会议将全程参考这些材料。在本次电话会议中，无论是在准备发言还是回答问题的环节，我们可能会作出 前瞻性陈述 ，这些陈述代表我们对未来事件及未来财务业绩的预期。其中包括有关公司业务成果、产品、市场、客户、战略、财务状况、流动性以及 2026年全年展望 的陈述。这些陈述均基于我们的预期、估计和假设作出的预测。 然而，由于这些陈述涉及未来事件， 它们受到众多已知和未知风险及不确定性的影响 ，相关细节已在我们向SEC提交的文件中进行了详细讨论，包括我们最新提交的10-K及10-Q表格。我们不承担修订本次电话会议中任何前瞻性陈述的义务。在本次电话会议及2026年第三季度财报新闻稿和补充财务信息中，我们将引用 GAAP（美国通用会计准则）及非GAAP财务指标 。非GAAP财务指标并非依据美国通用会计准则编制，仅作为GAAP财务业绩指标的补充，而非替代或优于GAAP指标。GAAP与非GAAP财务指标之间的调节说明已包含在上述材料中，可在我们的投资者关系网站上查阅。今天与我一同参加电话会议的还有： KR Sridhar，公司创始人、董事长兼首席执行官 ，以及 Simon Edwards，首席财务官 。 KR 将首先对我们的进展情况进行概述，随后Simon将回顾本季度的财务亮点。在准备发言结束后，我们将进行问答环节。现在我将把电话转交给KR。 KR Sridhar，创始人兼董事长、首席执行官： 大家好。九月底，在我们又一个创纪录季度收官之际，我庆祝了Bloom成立25周年，以及公司被纳入标普500指数这一里程碑——我在纽约证券交易所敲响了开市钟，身边围绕着许多我们的生产团队成员。 我们的使命在四分之一个世纪里从未改变：为所有人提供清洁、可靠、可及且负担得起的电力。 毕竟，在我们这个现代时代，电力对于经济和身体健康、对于人的尊严与幸福而言不可或缺。上一次Bloom敲响开市钟是八年前，那是我们IPO的时候。彼时，市场将我们视为一家小众的电力供应商。而如今，我们被视为现场供电的标杆，是驱动AI革命的关键力量。我坚信，八年后回望今日，我们将会明白： Bloom引领了这个拥有150年历史的电力行业中第一次重大架构变革。 基于燃料电池的现场供电将成为各行各业、各个地区电力输送的首选方式，并与电网形成互补。基础设施不足的国家将直接跨越到分布式现场供电，正如发展中国家当年跳过固定电话、直接采用手机一样。 超大规模数据中心运营商（Hyperscalers）是最先拥抱现场供电的。他们需要快速、大规模地获取电力。一些单体数据中心的用电量甚至超过某些小型州。然而，电网的设计初衷是将电力均匀分配给分布在广大区域内的大量用户。 电网已经无法承受数据中心高度集中、规模庞大的用电需求。 强制性的成本加成定价机制和公用事业特许经营法律更是加剧了这一问题。从制度设计上看，这些机制并不激励受监管的公用事业公司去创新或提升效率。AI时代之前，长达二十年的电力需求停滞，导致投资严重不足，亟需的升级改造迟迟未能推进。 AI革命的速度与规模使电网的短板暴露无遗。超大规模运营商争相寻找任何可用的电网电力，并很快意识到，自建现场供电才是前进之路。 Bloom迅速脱颖而出，成为标准化解决方案。 它对社区友好，安全性更高。冗余、容错、分布式的架构提供了更高的可用性——始终在线，能够抵御自然灾害、网络攻击和物理攻击。它消除了对备用发电机的需求。在总拥有成本、安全性、可及性、部署速度和可持续性方面，我们均占优势，并拥有通往净零排放的清晰路径。现在，同样的驱动力正在推动大量电力市场用户转向现场供电。 根据我们近期对15个细分行业、逾200家商业与工业企业的电力调查， 四分之一的美国商业和工业设施预计到2030年将完全依靠现场供电；35%的设施预计到2035年实现完全现场供电。 为什么？展望未来，电气化与数字化、人口增长以及自动化意味着工厂和企业将消耗大量电力，并对高可靠性提出极高要求。事实上，国际能源署（IEA）预测， 全球电力需求到2035年将增长40%。 电网既难以快速扩容，也难以以高可靠性为集中负荷供电，正如它在为AI工厂供电时举步维艰一样。 Bloom将成为这一庞大市场细分领域的首选解决方案。 我们将成为引领电力市场捕获全球新增需求的领导者，推动电力市场在未来十年从目前约3万亿美元的规模增长至约6万亿美元。因此，走过25年，我们才刚刚起步。而今，我们的增长正在加速。 市场对我们所提供价值的认识更加深入，我们的品牌也获得了广泛认可。我们在2026年第一季度财报电话会议开始时，预期营收同比增长60%。 今天，我们上调了这一指引，预计中值营收同比增长超过120%。 我们的客户管道持续增长，积压订单的扩张速度持续超过营收增速，且客户、垂直行业和地区的多样性不断提升。 我们正在为客户切实交付。就在15个月前，我们宣布了与Oracle的首个项目，并在不到两个月内向其犹他州站点完成了供电。我们正在新泽西州与Nebius实现同样的成果——在合同签署后三个月内，我们便获得了燃料电池的规划委员会审批。 获批后仅两个月，第一批电力便已准备好供客户使用。 我们在这一重要细分市场的业务强劲且快速增长。社区和政策制定者认识到我们是清洁且安静的，我们是坚实的现场供电的最佳选择。 例如，在2026年的能源规划中，弗吉尼亚州州长Abigail Spanberger明确点名了非燃烧型燃料电池，并引用原文表示： \"与传统燃气发电相比，它们产生的本地排放量大幅降低，减少了对周边社区的健康影响。\" 这一点意义重大，因为这并非一个普通的司法管辖区—— 弗吉尼亚州是全球大多数数据中心的所在地，也是数据中心与社区之间紧张关系的核心地带。 我们对Spanberger州长在数据中心行业及其所在社区的关键时刻，认可我们非燃烧解决方案所带来的价值表示赞赏。以下是本季度五项商业进展，充分体现了我们如何扩大总体可寻址市场。 第一 ，美国陆军有条件地授予我们的合作伙伴Indelible长期租约，在美国陆军基地建设和运营使用Bloom Energy服务器的商业发电设施，目的是利用我们的分布式现场架构增强电力安全。我们将为军事和民用关键基础设施安全供电——例如军事基地、水处理厂、医院和机场——视为一项增长机会。 第二 ，AEP披露，700兆瓦配备碳捕获与封存（CCS）技术的Bloom Energy服务器将用于为Google提供近净零排放电力，这是同类项目中的首创。与涡轮机和发动机不同， Bloom的技术使CCS能够在规模化层面真正可行。 我们认为CCS对于实现脱碳目标至关重要，并将其视为Bloom潜在的万亿美元市场机遇。 第三 ，我们此前向大家介绍过我们在落基山、中西部和五大湖地区不断扩大的布局。 即使在美国电价最低的州，例如德克萨斯州，我们的价值主张也已具备竞争力——我们本季度正向该州发货首批设备。 第四 ，我们正在建立的公用事业合作关系，是推动美国在电力短缺背景下前行的重要渠道。越来越多的公用事业公司认识到，将Bloom Energy服务器这一清洁基荷发电资产部署在其配电网络中，是满足客户电力增长需求、增强配电网络稳定性和可靠性的更快速、更经济的方式。 我预计我们在公用事业相关业务（通常称为\"表前\"安排）中将取得重大突破。 第五 ，最后，我们正在许多国际市场看到部署Bloom系统以满足快速增长的电力需求的强烈兴趣。我们正在与其中几个市场的潜在本地合作伙伴积极洽谈，期待尽快向大家更新一些捷报。 总结而言， Bloom是对社区友好的现场供电首选解决方案——快速部署、清洁、可靠、具有竞争力。 我们的现场解决方案被部署于为吉瓦级智能工厂、兆瓦级推理数据中心、工厂、商业企业，以及医院、电信枢纽和基本服务等关键任务基础设施供电。Bloom现场供电的需求在国内外均持续增长，我们正在建立强大的合作伙伴关系。这一增长潜力，结合CCS和800 VDC等未来增长机遇，指向Bloom将在不断增长的电力市场中占据重要份额。 这一信念让我们对未来的走向有了清晰的判断。 这将要求我们扩大规模、切实执行，以把握这个百年一遇的机遇。我对我的团队充满信心，深知他们已准备好迎接这一挑战。接下来，有请Simon为大家详细解读我们的财务数据。 Simon Edwards，首席财务官： 谢谢你，KR。大家下午好。提醒一下，我将重点介绍非GAAP调整后的指标。与GAAP的调节说明已包含在我们的新闻稿和补充材料中。 第三季度是Bloom又一个创纪录的季度。 营收达到12.4亿美元，同比增长138%；营业利润达到2.86亿美元，增速更快，同比增长超过500%。 凭借本季度的强劲表现，我们今年第三次上调了全年营收、营业利润和每股收益的预期。在深入细节之前，有必要回顾一下我们今年迄今所取得的成绩。 年初至今的营收已达30.5亿美元，已经比我们2025年全年的营收高出50%。 仅本季度的营业利润就超过了去年全年的营业利润。 这正是我们商业模式中内嵌的运营杠杆效应，如今已在业绩中得到充分体现。 本季度营业利润率从一年前的8.9%扩大至23.1% ，原因在于营收增长了138%，而运营费用仅增长了26%。正如KR所说，要抓住这个百年一遇的机遇，我们既需要规模扩张，也需要高效执行，因此我们将持续投入于创新与工程路线图、增长举措，以及支撑我们规模扩张所需的基础设施。 年初至今的资本支出为2.31亿美元，我们正在投资产能以支持未来增长，并通过运营产生的现金流为这些投资提供资金。 尽管我们的投资规模是2025年全年的4倍，我们的现金余额仍与年初大体持平。 我们的利润结构使我们能够在投资扩大业务规模的同时，保持资产负债表的稳健。这正是我们精心设计并付诸实施的财务模式，目前运行符合预期。 现在来看本季度的具体情况。如我此前所述， 本季度营收为12.4亿美元，同比增长138%，环比增长16%。产品营收为10.7亿美元，同比增长179%，环比增长15%，首次在单季度突破10亿美元大关，占总营收的87%。 产品营收在控制权转移给客户时予以确认，因此是本季度系统交付和验收情况的直接体现。 服务营收为6760万美元，同比增长15%，环比基本持平。安装营收为8490万美元，同比增长29%，环比增长66%。安装范围因客户和项目而异，营收随工程进展按比例确认。因此，安装营收与产品营收并不会在同一季度同步变动，安装营收将随客户项目的时间节点和结构组合而波动。 在利润率方面， 产品毛利率为38.4%，同比提升250个基点，环比提升120个基点 ——这是在我们同时推进新产线爬坡和加急交付的季度中实现的。这直接体现了我们的定价能力以及我们在产品端持续推进的成本削减成效。 服务毛利率为21.4%，同比提升700个基点，这是我们连续第二个季度保持在20%以上。 总体毛利率为34.5%，同比提升412个基点，产品和服务均实现扩张，但部分被安装营收在收入结构中的时间性因素所抵消。鉴于这种季度间的结构性波动，这也是我们以全年为基准来管理和指引毛利率的原因。本季度运营费用为1.41亿美元，反映了我们在工程路线图、增长举措和基础设施方面的持续投入。 营业利润为2.86亿美元，同比增长超过500%，环比增长19%，营业利润率为23.1%，环比提升60个基点。 调整后EBITDA为2.99亿美元，占营收的24%，同比扩张1286个基点。非GAAP摊薄每股收益为0.94美元，去年同期为0.15美元。GAAP摊薄每股收益为0.78美元，去年同期为亏损0.10美元。 在现金方面，本季度经营活动现金流为净使用2700万美元。净利润被营运资本的增加所抵消，营运资本的增加主要由库存、合同资产和应收账款驱动，原因是我们支撑了业务的大幅增长并为未来交付建立了库存储备。如我此前所提，产品营收在控制权转移给客户时予以确认。合同账单则遵循合同里程碑节点，可能发生在不同的季度。因此，现金回收可能滞后于营收确认，两者之间的差额在完成开票和回款之前体现为合同资产和应收账款。 大额交付及相关现金回收的时间节点将因季度而异，这些差异会随时间推移趋于平衡。 我们预计将持续投入营运资本，以支持未来增长并与客户同步扩张规模。 本季度资本支出为1.53亿美元，年初至今累计2.31亿美元，主要用于投资机械设备和生产产能，以支持我们在Fremont和Newark现有工厂内的扩张。以这种增量方式增加产能，意味着我们的资本支出紧跟我们所看到的需求，而非超前于需求。本季度自由现金流为净使用1.81亿美元，年初至今为正4200万美元， 季度末现金余额为25亿美元。 此外，本季度Bloom被纳入 标普500指数 。我们认为这一纳入是对我们在业务规模、盈利能力和稳定性方面所取得成就的认可，我们也欢迎由此带来的更广泛的股东群体。 在业绩指引方面， 我们将全年营收预期上调至44亿至46亿美元，中值对应同比增长约122%。 此次上调反映了我们第三季度的业绩表现，以及对第四季度客户交付时间节点更清晰的能见度。我们的季度节奏由客户准备情况和交付时间节点决定，这也是我们以全年为基准管理业务和提供指引的原因。与今年每次上调一样，我们的预期建立在两个层面之上。第一层是积压订单，我们逐一评估每位客户的现场准备情况和转化时间节点。第二层是对我们管道中需要在当季获得电力供应的客户进行概率加权评估。 随着最后一个季度的到来，年末前后少量交付的时间节点将决定我们最终落在区间的哪个位置。 我们维持最新的非GAAP毛利率预期约为34%。 这高于2025年的30%，也高于年初约32%的原始预期。这一预期反映了我们对第四季度营收结构和各业务线利润率的预判。 我们同时将非GAAP营业利润预期上调至9.6亿至10.3亿美元。 中值对应22%的营业利润率，而我们2月份预期中值时的营业利润率为14%。 我们的非GAAP摊薄每股收益预期现为3.10至3.40美元。 总结而言， 我们正在创造创纪录的业绩、上调预期，并进行必要的投资以把握眼前巨大的市场机遇。 与此同时，我们在持续扩大利润率，并保持资产负债表的稳健。说到这里，接线员，我们现在开始接受提问。 问答环节 主持人： 问答环节现在开始。 （主持人提示）请稍候，我们正在整理提问名单。第一个问题来自摩根大通的 Mark Strouse，您的线路已开通，请提问。 Mark Strouse： 好的，下午好。非常感谢你们接受我们的提问。 KR，我很好奇，能否谈谈最近决定扩大在 Fremont 房地产布局的原因？在本次电话会议上，你们花了相当多的时间讨论 TAM 扩张的多种路径。我想了解的是， 为什么现在做出这个决定？ 既然你们之前提到当前的制造产能可以支持每年超过 5 吉瓦的产出，那么一旦新设施投入运营，我们是否应该认为这一数字将超过 10 吉瓦？ KR Sridhar（创始人兼董事长、首席执行官）： Mark，感谢你的提问。你看，有些事情对我们来说非常清晰，在这个充满不确定性的世界里，有些事情是可以完全确定的。 电力的使用、电力的需求，将会急剧攀升 ，不仅仅是因为 AI，还因为在这个数字时代，有太多的市场领域都需要电力。这不仅仅会发生在美国境内，我们已经开始看到同样的趋势在亚洲、欧洲以及世界其他地区显现。我们看到，对于现场自发电的需求，相较于电网供电，正在从数据中心以外的多个领域涌现出来——这些数据中心被要求自行解决供电问题。 这种需求来自于对 韧性 的追求，来自于对 安全性 的需求。在当前全球各种复杂局势下，关键设施对于可靠、安全的现场供电的需求正变得越来越重要。综合考量这一切，对我们来说非常明显，而且一直都是显而易见的—— 从时间节点来看，5 吉瓦这个里程碑只是漫长旅程中的一个节点 ，我们已经清晰地看到它即将到来，我们需要为超越这一里程碑之后的阶段做好准备。这就是你现在所看到的。我们永远不会以跳跃式的方式扩大产能，而是会像调节模拟旋钮一样，随着需求的增长逐步跟进。我们不会超出我们的视野范围，但也绝不会慢到成为客户获取电力的瓶颈。我们就是通过这样的方式来推进的。我们不会提供具体的时间表，但我们有强烈的信心，市场传递给我们的信号已经足够清晰，告诉我们应该开始为超越 5 吉瓦这一里程碑做准备。这就是我们这样做的原因。希望这回答了你的问题。 Mark Strouse： 非常好，谢谢。接下来是一个简短的追问，问 Simon 的。关于全年毛利率展望维持不变、但收入预期上调这一点，我理解这至少部分是由于产品结构的变化。能否提供更多细节？另外，我知道你们目前还没有给出 2027 年的指引，但 从方向性来看，随着收入规模的扩大，我们是否应该继续预期毛利率会进一步提升？ 谢谢。 Simon Edwards（首席财务官）： 好的，Mark，你好。首先，我想先退一步，看看我们已经走了多远—— 2024 年总体毛利率为 28.7%，2025 年为 30.3%，而第三季度已达到 34.5%。 我认为我们已经展示了随着业务规模扩大而持续提升利润率的良好记录，对于产品毛利率的表现，我感到非常满意。正如我在准备好的发言中提到的， 定价依然强劲 ，我们一直推进的降本举措也已体现在数据中。但与此同时，我们也在平衡利润率的扩张与抓住眼前市场机遇之间的关系。正如 Kara 所提到的，我们正在加快新产线的投产，加急交付以满足客户的时间节点要求，这在短期内会带来一定成本。此外，我们还有多项工程、采购、制造方面的降本项目，这些需要一定时间才能体现在成本端。因此，你问到明年的情况，我们是从 长远视角 来考量的。我们清楚，规模扩张伴随着启动成本，我认为我们在毛利率展望中已经审慎地反映了这一点。但随着这些项目逐步进入量产阶段，随着我们持续优化产线成熟度并提升产能利用率，我们认为将会从规模效应中获得更多收益。我只想说， 在我入职的头六个月里，我对团队在运营层面的表现以及这些进展在数据中的体现都印象深刻。 Mark Strouse： 谢谢。 操作员： 下一个问题来自Evercore ISI的Nick Amakuchi，请提问。 Nick Amakuchi： 嗨，大家好，非常感谢。 Simon，我想深入了解一下自由现金流的情况。本季度显然使用了2700万美元的现金，考虑到利润率的扩张等因素，我想深入了解一下这个问题。有哪些影响因素或一次性项目可以帮助我们理解？ Simon Edwards，首席财务官： 好的，Nick，你好。 首先，我想说的是， 我们真的将这个业务视为一个自我资金运营的业务。 也就是说，当你考虑业务的运营表现时，正是这种表现在为增长所需的投资提供资金。我想强调这一点对我们非常重要，因为 这将减少我们对外部资本的依赖，真正降低我们的执行风险。 同时，我认为这也给了我们KR所提到的灵活性，让我们能够针对客户需求进行投资。所以我想说，在这个背景下， 应该从全年的角度来看待现金生成，而不是从某一个季度来推断。 我们确实相信，这个业务将成为一个自由现金流为正的业务，因为我们能够持续为自身增长提供资金。回到你问题的第一部分，本季度我们在运营中使用了现金，但 这并不是一个趋势的开始。 即使我们增加了对人员和能力的运营投入， 我们今年迄今为止已经产生了正的运营现金流（CFOA）。 正如我在准备好的发言中提到的，我们也为这些客户部署的营运资本（听不清）提供了资金。所以，我认为我们能够从运营角度支持这些投资，同时也为今年迄今的资本支出提供资金，这恰恰体现了这个业务的 资本效率 。当我将这一切与我们从资本支出投资中获得的回报联系起来时， 我们对目前所处的发展轨迹感到非常乐观。 Nick Amakuchi： 很好，谢谢。KR，如果可以的话，我还想深入了解一下，您之前提到了在公用事业方面不断增加的需求和关系。 现在大家显然更多地将你们视为一种 表后解决方案 ，从这个角度来看似乎更具互补性。如果我们考虑一下目前已经公开的信息，我们已经看到不同地区的 综合资源规划（IRP） 中已经包含了燃料电池，能否更具体地阐述一下你们所看到的市场机会和整体可寻址市场（TAM），特别是在受监管的公用事业机会方面？ KR Sridhar，创始人、董事长兼首席执行官： Nick，这是一个很好的问题。首先让我们从客户的角度来谈谈。在这里，我要说，让我们考虑两类客户：一类是 电费缴纳者 ，也就是最终客户；另一类是为这些电费缴纳者提供服务的 公用事业公司 。如果你从优化这两类客户的角度来看， 他们越来越多地开始将我们视为一种配电资产，通过这种资产，他们可以降低总成本，同时继续为客户提供服务。 这对电费缴纳者越有利，公用事业公司就越容易向其政策制定者申请，将采购Bloom Energy服务器纳入费率基础，将其作为输电和配电资产部署到输配电网络中。这对他们意味着什么？ 这使他们能够将我们部署在电表前端，随着负荷的到来进行分配，而无需等待客户的具体订单。 他们可以像现在在综合资源规划中那样，根据计划和需求进行采购，而不需要针对特定客户。他们为什么要这样做，而不是购买集中式资产呢？ 输配电及其相关成本、瓶颈和时间问题对他们来说都行不通。 他们正在认识到这一点。如果客户不得不转向表后方案，他们就会失去客户，失去费率基础。 如果他们失去客户和费率基础，就必须提高其他电费缴纳者的成本，这不是州政府想要的，也不是最终客户想要的。 所以，在这个时间节点上， 我们对整个行业来说都是真正有价值的资产。 随着越来越多的地区开始理解这一点，你将会看到这种情况在多个地区逐步展开。 我们的团队在 向各大公用事业公司宣传将现场电力作为电网补充的好处 方面做得非常出色。我们一直在解释为什么电网存在不足。公用事业公司终于从监管机构那里获得了将这些资产纳入规划所需的空间，所以他们正在抓住这个机会。 我们将这视为未来巨大的业务增长机会。 Nick Amakuchi： 谢谢。 David Arcaro： 哦，你好。非常感谢你们回答我们的问题。AR，我想你们在碳捕获、热电联供以及行业向800伏直流电转型方面有几个未来机遇，我想了解这些未来举措目前在商业机遇方面进展如何，以及你们在近期看到的市场采用情况是怎样的？ KR Sridhar，创始人、董事长兼首席执行官： David，你好。感谢这个问题。 好的，让我来回答这个问题。你们知道吗，我对AEP宣布的700兆瓦碳捕获项目感到无比振奋——该项目将为超大规模客户提供近净零排放电力，在这个案例中他们宣布的客户是Google。这个项目将提供 及时、现场、可靠、无空气污染、无水资源消耗的近净零排放电力 。这还能有多好呢？好的。 我们有——这里有一个关键点，我认为参加电话会议的投资者需要理解。 燃烧技术目前无法提供经济实惠且可扩展的碳捕获路径。 Bloom的技术在商业领域是独一无二的，因为它能够提供用于碳捕获的 浓缩二氧化碳 。这就是Bloom的天才之处、力量所在。它既对钱包有利，又对环境友好。所以我相信，当世界准备好去碳化时，最快的方式就是使用我们的技术配合天然气，生产 既可靠又对地球友好的大量电力 。当世界为此做好准备时，我认为这将是一个 超过1万亿美元的机遇 。这就是我认为它有多大。 800伏直流电是显而易见的选择。 我们在发布的一份报告中表明，在运营的前五年，一个吉瓦级数据中心通过采用800伏直流电，与当前这种过时的工业时代电力传输架构相比，将 节省超过50亿美元 。800伏直流电无论如何都会到来。我们不需要推动市场去实现这一点，但为什么要使用中间所有的转换环节，并多付50亿美元呢？我 极度自信 ，当搭载800伏直流电的服务器机架问世时，我们将看到这种采用趋势的发生。 我们正在与所有超大规模客户进行对话。这一领域有很大的兴趣。当以800伏直流电为标准建设的直流数据中心建成时，这一切就会发生。 不是会不会发生的问题，而是多快发生的问题 ，所以他们比我更能回答时间节点的问题。 关于热量回收，也就是热电联供（CHP），我们坚定地认为，当你进行现场发电时，把那些可以用于制冷、从而减少20%电力需求的热量白白浪费掉， 同样是显而易见不应该做的事 。所以这是对我们所做一切的补充，无论你是向数据中心提供交流电，还是800伏直流电，有没有碳捕获，都无所谓。这成为了一个显而易见的选择。关于热电联供有一点很有趣—— 大多数工业应用，我们相信商业和工业领域（C\u0026I）将是我们巨大的增长方向 ，都将需要蒸汽形式的热能或制冷。 他们将使用热电联供。所以我认为这是一个 巨大的增长方向 ，也是为商业和工业客户使用我们产品创造价值的途径。美妙之处在于，这是 同一个平台 。这就是为什么我们一直告诉大家， Bloom是一个平台，而不是一个产品 。我们能够根据客户需要，为他们提供平台中任意一种或所有选项。 谢谢。 操作员： 下一个问题。 KR Sridhar，创始人兼董事长、首席执行官： David 可能有后续问题。 操作员： 下一个问题来自 RBC Capital Markets 的 Chris Dendrinos。请提问。 Christopher Dendrinos： 好的，非常感谢接受提问。恭喜本季度取得亮眼成绩。我想问一下关于\"上电时间\"的问题——我记得您在之前的发言中提到过，大约一年前你们能够在不到两个月的时间内为 Oracle 完成交付。如您所知，现在需求正在快速增长，你们也在持续扩张规模， \"上电时间\"是否仍然能保持在90天以内，还是说由于订单积压量较大而有所延长？ 另外，能否更具体地说明你们为 Nebius 站点供电的速度？您提到第一个区块即将上电，但这具体对应多少兆瓦？谢谢。 KR Sridhar，创始人兼董事长、首席执行官： 谢谢你，Chris，这是一个非常好的问题。我们的服务器已经为 Nebius 数据中心做好了准备。我们再次重申，我们确实履行了对他们的承诺。 我们不会成为他们整个300兆瓦数据中心上线的瓶颈。 只要我们准备好了，就会立即推进。 不过我想你也了解数据中心是如何建立起来的——它们不是一天之内从0跳到300兆瓦的，而是一个区块一个区块地推进。他们的第一个区块即将就绪，而我们已经为第一个区块做好了准备。在他们每一个后续区块建好之前，我们都会提前到位，确保我们不会成为他们的瓶颈。至于数据中心其余部分的时间安排，需要由客户自己来说明，我们不便置评。 但回到你更宏观的问题。 就在今天早上——我记得是柏林时间，或者也许是昨天，我记不太清了——在柏林 GTC 大会上，NVIDIA 的 CEO 说了这样一句话：一个吉瓦级数据中心每延误一个季度，就意味着损失100亿美元的收入。 也就是说，一个100兆瓦的数据中心，延误一个季度就会损失10亿美元的收入。这个数字远远超过了你在电力模块上所能获得的任何其他价值主张。而且 目前没有任何比我们更清洁的技术，能够在现场供电的同时获得空气排放许可；也没有任何技术能比我们更快地为客户提供电力； 更不用说我们在上一个问题中谈到的全面的未来保障能力，以及我们能够提供的所有附加价值。这就是我们对这一特定领域及其对我们意义持乐观态度的原因。谢谢。 Christopher Dendrinos： 谢谢。再追问一下，回到 Mark 关于扩大业务布局的问题—— 在这方面是否有机会引入更多自动化？你们是如何看待制造业的机遇，以及这可能带来哪些成本节省？ 谢谢。 KR Sridhar，创始人兼董事长、首席执行官： 我认为，凡是参观过我们工厂的人都会记得我们出色的总经理 Brad Fields 说过的一句话。他会提醒大家： 多年前，当我们每年生产100兆瓦的电堆时，我们有大约600名员工全天候工作；而当我们达到每年1吉瓦的产能时，整条生产线仍然只需要600名员工——这意味着效率提升了10倍。当我们达到5吉瓦产能时，那条生产线上依然只需要600名员工。 Bloom 是一家将 降本增效刻入DNA 的公司，持续创新是我们的本能。所以答案是肯定的，我们不仅仅是 AI 的受益者——他们是我们的客户，同时我们也在包括自动化在内的许多不同领域受益于 AI。 Christopher Dendrinos： 谢谢。 KR Sridhar，创始人兼董事长、首席执行官： 谢谢你。 操作员： 下一个问题来自UBS的Manav Gupta，请提问。 Manav Gupta： KR，我想回到上次电话会议，您说了一些非常有见地的话，您提到 LCOE（平准化能源成本）对于现场供电和数据中心来说是一个荒谬的构建，应该关注总成本 。能否帮我们理解一下，数据中心所看到的LCOE与实际输送给他们的电力价格之间的差异，以及您的解决方案实际上更具成本效益？另外，关于您提到的9月15日、16日的那份报告，那是一份非常好的报告，因为它详细说明了通过切换到您的解决方案可以节省的所有资金。我记得您曾提到， 一个1GW的设施通过切换到您的解决方案可以节省高达9%的成本 。最后一个问题，我保证是最后一个——我们了解您的解决方案具有更低的NOx和SOx排放，但我们也认为这里还涉及到 节水优势 。您的解决方案比竞争对手使用更少的水，这在竞争中可能是一个重大优势。如果您能就这些问题的部分内容作出解答，非常感谢。 KR Sridhar，创始人兼董事长兼首席执行官： 好的，Manav，谢谢你。问题很多，我会尽量记住并一一回答。让我先从 水资源 问题开始。 您看，如果针对每吉瓦的数据中心，比较燃烧技术与我们技术在发电厂的 用水量 ，我们的用水量连第二位小数的四舍五入误差都算不上。也就是说，如果您运营一个吉瓦级的数据中心，使用联合循环燃气轮机（CCGT）的话，在整个生命周期内的年用水量是极其巨大的——例如，如果使用湿冷CCGT，在该1GW数据中心的整个生命周期内， 大约会消耗250亿加仑的水 ，这是非常庞大的数字。 相比这250亿加仑， 我们只需要14亿加仑 。从用水量的角度来看，这简直是沧海一粟。好的，这就是理解水资源问题的方式。 现在，您问到与电网电力相比的 成本优势 。 从电网电力到机架供电，电力经过层层传输，从三个九的可靠性（99.9%），到电压和功率层面的不稳定性——我说的不是环保方面的清洁度，而是 电力质量的清洁度 ，这正是UPS（不间断电源）所要解决的问题，还有可靠性问题。再加上将电力转换为您所需电压和直流电的过程，这些都是 从电网电力到机架电力所带来的成本 。 此外，在机架内部，由于电网输送的技术无法快速升降负荷，燃气轮机也无法快速升降负荷，机架内部就会产生低效损耗。为了不烧坏另一侧的涡轮机、发动机或电池，他们只能白白消耗掉这些电力。 而使用燃料电池则完全不需要这样做。 因此，对于数据中心而言，真正的成本是 电力总成本与实际产出的算力（token）之间的比值 ，即每个token的电力成本。从LCOE出发，到输送到电网的电力成本，再到机架电力成本，最终到 每个token的电力成本 。将所有这些加在一起，我们是 压倒性的成本领先者，是总成本最低的方案 。这正是人们开始逐渐理解的事情。 我希望已经回答了您大部分的问题，Manav。我们继续下一个问题。 Manav Gupta： 非常感谢，非常感谢您，先生。谢谢。 操作员： 下一个问题来自Baird的Ben Kallo。为了节省时间，请所有剩余分析师每人只提一个问题，谢谢。Ben，您的线路现已开通，请提问。 Ben Kallo： 你好，谢谢。我有两个问题，很快。第一个，回到Mark和扩张的话题，你们之前谈到过每季度扩张，我记得是250兆瓦到300兆瓦。我只是想了解一下，当你们明年接近5吉瓦的时候，我们应该怎么看待这个问题，以及是否有什么供应方面的限制需要考虑。第二个问题是关于\"邻避效应\"，我们看到一些报道，说也许有些开发商正在向海外转移。我想知道，如果这是真的，我们应该如何期待你们从中获益，以及你们在水资源、噪音、硫氧化物和氮氧化物排放方面的优势，在海外是否同样适用。谢谢。 KR Sridhar，创始人兼董事长、首席执行官： 谢谢你，Ben。关于第一个问题， 让我说清楚，我们从未给出过任何关于季度增长或年度增长的具体数字。 我们所说的是，这就像一个旋钮，我们会根据需求来调大或调小。根据我刚才告诉你们的一切， 我认为我们近期不会调小，只会不断调大。 所以，调大多少，完全取决于负载需求，这是第一点。第二点，关于国际市场的问题，要记住的是， 如果每个token所对应的电力总交付成本，远低于使用Bloom系统消耗天然气的成本，那就意味着产生相同数量token所消耗的燃料会减少。 在大多数国际市场，天然气价格远高于美国，我们所带来的优势会进一步放大。基于所有这些原因， 国际市场对我们非常有吸引力，我们正在考虑国际扩张。 正如我在准备好的发言中所说， 请期待我们在不久的将来在这方面带来一些好消息。 Ben Kallo： 谢谢。 操作员： 下一个问题来自BMO资本市场的Ameet Thakkar，您的线路现已开通，请提问。 Ameet Thakkar： 恭喜本季度的业绩和上调后的展望。我只有一个简短的问题，我会遵守规则。KR，您今天大量谈到了规模的问题。 目前在美国运营的单一站点最大的Bloom部署，以兆瓦计算是多少？ 以及与您提到的即将在怀俄明州或新泽西州部署的项目规模相比，我们应该怎么看？ KR Sridhar，创始人兼董事长、首席执行官： 我们已经处于100兆瓦级别，怀俄明州的项目也是100兆瓦级别，而且正在向吉瓦级别迈进，因为它达到了700兆瓦。 所以，我们最小的系统是150千瓦，为一家小型Home Depot供电，而我们最大的系统正在接近吉瓦级别。我可以告诉你， 每一位客户对我们都很重要，我们让所有客户都满意。 谢谢。 Ameet Thakkar： 谢谢。 操作员： 下一个问题来自Mizuho的Maheep Mandloi。您的线路已开通，请继续。 Maheep Mandloi： 嗨，晚上好。感谢提问。这是一个小问题。关于积压订单的增长，我记得在准备好的发言中，你们提到积压订单的增长速度快于收入增长。我想理解一下，该如何解读这一点——考虑到收入同比增长大约140%。那么，这是否是本季度理解积压订单增长的一个参考框架？谢谢。 KR Sridhar，创始人兼董事长、首席执行官： Maheep，感谢你的问题。幸运的是，你不必等太久，因为现在是第四季度，也是我们年初的时候。我们会给你具体的指引。我认为在过去几个季度里，我们已经向你们证明了我们是有纪律的，我们给出的数字是我们实际能够兑现的。所以我们会给你那个数字。但我想说， 增长是稳健的，是强劲的。所以请期待一个扎实的增长。 我不会在方向上给你划定范围，抱歉。 未知发言人： 好的，感谢提问。 KR Sridhar，创始人兼董事长、首席执行官： 是的。 操作员： 下一个问题来自Bernstein的Sunaina Ocalan。您的线路已开通，请继续。 Sunaina Ocalan： 嗨，下午好。感谢接受我的问题并给我机会提问。也许我可以问一下，鉴于与谷歌的AT交易，您能否介绍一下您与其他超大规模数据中心客户的一些洽谈情况？您是否看到碳捕获与封存（CCS）作为超大规模客户洽谈中的一个潜在选项被越来越多地提及？以及从您的角度来看，这对降低电力成本有何影响？我很欣赏您方案中CO₂排放更清洁这一点。希望能听到更多您的想法。 KR Sridhar，创始人兼董事长、首席执行官： 这是一个非常好的问题。我想说， 是的，我们所有的超大规模客户目前都对碳捕获的可选方案表现出了浓厚的兴趣。 我们认为，随着我们向前推进，这将变得极其重要。我认为， 几乎所有我们的客户很快就会至少开始向我们购买具备碳捕获就绪功能的系统 ，这样当他们所在地区的生态系统中建有CO₂管道并连接到封存井时，他们就能够接入——这是第一点。第二点， 将10%到15%的成本视为大多数超大规模客户今天愿意接受的合理成本，以实现零碳电力供应。 如果能够提供这一点，那将是他们在没有强制要求的情况下自愿选择的方向，而Bloom将能够在这一成本范围内交付，涵盖碳捕获与封存的全部综合成本。 这就是为什么我说我们是最具经济可行性、技术上最成熟的碳捕获与封存平台。 Sunaina Ocalan： 谢谢。 操作员： 您的下一个问题来自Oppenheimer的Colin Rusch。您的线路现已开通，请继续。 Colin Rusch： 非常感谢，各位。这是一个两部分的问题。第一个问题主要是关于 合同资产的增长 ，以及您预计如何将其转化为可开票并完成收款的状态。第二个问题，或者说第二部分，主要是关于 碳捕获货币化的战略 。我认为我们相信你们确实能在这方面产生重大影响。请问您预计是通过服务器销售来实现货币化，还是可能会推出一种新的解决方案，来扩展目前服务中已有的一些机会？ KR Sridhar，创始人兼董事长、首席执行官： 好的，Colin，我来回答第一部分。 关于合同资产的定性，我确实预计它们 会发生周转 。因此，虽然合同资产余额可能会增长，但对我们真正重要的是它们在持续周转——因为我们正在达到开票里程碑并实现现金回收。我认为这是一个重要的细节，我想特别强调。总体而言，我预计随着业务规模的扩大，我们将能够持续有效地管理营运资本。但我认为， 确保应收账款和合同资产都能持续周转是我们的首要关注点 。 Colin，关于我们如何实现碳捕获的货币化——这个答案应该不会让你感到意外。 这正是Bloom在其商业模式乃至产品方案上一贯的做法：我们会迎合终端客户的需求。 如果终端客户恰好是一家具备碳捕获能力的天然气公司或油气公司，他们可以将这一功能附加进来，通过碳信用额度以及来自客户的收入流来实现货币化。我们也可以与合作伙伴协作，提供端到端的完整解决方案，并商议如何分配收益。或者在某些情况下，终端客户本身可能有碳信用额度的需求，他们自行使用，并以隐含电力成本或资本设备加利润的方式向我们支付报酬。 对于以上所有模式，我们都持开放态度。 这就是我们模式的魅力所在—— 我们为客户创造了多种选择的可能性 。这也是我们思考所有业务的方式。归根结底，我们存在的意义是服务客户、满足需求，而通往这一目标的路径有很多种。 说到这里，由于时间已经到了甚至超出了预定时间，让我来做一个总结。我想说，虽然今天你们从我们这里听到的一切都非常积极，但我也想承认 我们目前所处的这个动荡不安的时代 。和你们大多数人一样，我看到世界上存在着大量的不确定性，市场也充满波动。 然而， 正是在这样的时刻，我们更应该提醒自己，对我们共同的未来保持乐观是有充分理由的。 就我个人而言，我可以告诉大家，能够身处Bloom，我感到非常幸运。对我来说，这里是一座充满稳定、确定性与使命感的岛屿。让我来解释一下。 我在一个电力匮乏的地方长大。 我深知无法依赖稳定电力供应意味着什么，它如何压制经济活动、损害人类健康与福祉，这些我都有切身体会。在当今的数字化世界中，拥有电力比我童年时代更加重要。 毫无疑问，电力需求将持续上升，且这一趋势是循环往复的。 有一件事是可以确定的：未来几年，对电力的需求将急剧攀升。而Bloom已经建立了一个平台，能够 以清洁、可靠且大规模的方式 向有需要的人输送电力。正如我们一再证明的那样，我们能够实现这一目标，为股东创造利润和回报，并通过 自我造血的模式 推动业务规模化增长。 我们的未来一片光明。 我非常感激能够与如此强大的团队一起，共同肩负如此有意义的使命。这让我充满活力，我能清晰地看见我们光明的未来。感谢大家对Bloom的支持，祝大家今天愉快。 操作员： 今天的电话会议到此结束，感谢您的参与，您现在可以断开连接了。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 09:08:04+08:00","time":"10-23 09:08","source":"华尔街见闻财报","url":"https://wallstreetcn.com/articles/3784267","tag":"核心财报季","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.06"},{"title":"Meta从盘后大涨到股债双杀：未来支出承诺飙至8250亿美元，信用风险指标创历史新高","summary":"Meta在人工智能基础设施上的资金承诺规模持续膨胀，正引发市场对其信用风险的高度关注。 据Meta周四在监管文件中披露，截至今年9月底， 公司已承诺的未来支出总额约达8250亿美元， 涵盖租约、云计算合同及数据中心等多类协议，其中大量资金与AI计算能力和基础设施建设直接相关。 这一数字较今年7月披露的约7000亿美元大幅攀升，短短数月内新增逾千亿美元承诺。 华尔街见闻提及 ，Meta Q3营收与Q4指引双超预期，公司上调了全年资本支出计划，并宣布新设一类无投票权股票，为未来的收购及其他支出提供潜在融资工具。周三美股盘后涨幅一度超过6.5%。 然而Meta第三季度自由现金流转负至负21.2亿美元，为公司2012年上市以来约14年中首次出现赤字，净利润亦大幅低于分析师预期。 周四美股收盘，Meta跌约7%，市值蒸发超1000亿美元。 衡量Meta信用风险的五年期信用违约互换（CDS）价格飙升至历史最高水平，公司债券相对于美国国债大幅走弱。 巴克莱测算，四季度资本支出高达490亿至590亿美元，届时现金余额或缺口逾200亿美元。 鉴于C类股权融资最早须等到2027年初，年内发债几乎势在必行。 巴克莱基准预期Meta将发行约250亿美元债券，并明确指出\"更大规模交易已非小概率事件\"，数千亿美元级发债压力近在眼前。 支出承诺规模从7000亿跳升至8250亿 本次市场波动的直接导火索，是Meta在季报后披露的最新支出承诺数据。根据公司于周四提交的监管文件，Meta已就各类租约和合同达成约8250亿美元的未来支出协议，其中大部分与人工智能算力及基础设施相关。 具体而言， Meta尚未计入资产负债表的经营性及融资性租约价值达3557亿美元，涵盖从今年剩余时间至2036年陆续生效的数据中心及能源基础设施租约。 此外，截至9月30日，公司另有4545亿美元的不可撤销短期及长期合同，主要涉及第三方云算力采购、数据中心能源协议，以及旗下Reality Labs部门的消费硬件产品。 Meta还披露，公司承诺在五年内购买最高147亿美元的云计算容量，但该金额或因云服务商向其他客户出售容量而有所减少。 相比之下，Meta在今年7月披露的未来支出承诺规模约为7000亿美元，此番披露意味着承诺总额在短短数月内大幅跳升。 四季度资本支出\"高墙\"：债券交易或年底前落地 巴克莱的分析显示，债券发行压力已迫在眉睫。 Meta将2026年资本支出指引区间从1300亿至1450亿美元收窄至1350亿至1450亿美元，这意味着 仅四季度的资本支出即高达490亿至590亿美元 。 巴克莱以中值估算约550亿美元，称之为\"迄今为止单季资本支出规模最大的一次\"。 巴克莱数据显示，三季度扣除股息后，Meta自由现金流净消耗约25亿美元，现金及有价证券余额从903亿美元降至825亿美元。 巴克莱据此推算了债券交易的逻辑 ：Meta今年春季发债时持有约810亿美元现金，当前同为820亿美元。若假设Meta计划维持800亿美元以上的现金缓冲，以三季度经营现金流328亿美元为基准，扣除550亿美元资本支出和约14亿美元股息， Meta年末现金余额约为590亿美元，与800亿美元目标相差约210亿美元，与超大规模云计算公司常见的250亿美元\"标准\"发债规模高度吻合。 而C类股票的流通时间表更加剧了这一紧迫感。新股票预计2027年1月19日方才开始交易，这意味着股权融资在此之前基本无法实现 。正如摩根大通TMT分析师Mark Schilsky所言： C类股的安排意味着（股权融资）最早要到2027年初，悬而未决的压力仍在。 巴克莱的基准情景是Meta完成一笔约250亿美元的债券交易，可能附带欧元债券发行，但同时指出 \"更大规模的交易已不再是小概率事件\" 。巴克莱写道： 我们认为Meta存在尝试超出标准250亿美元规模的可能性。在我们看来， 既然股权信号已经释放，市场或许能够消化规模更大的交易 。一笔超大规模交易将短暂重定市场定价，我们认为这需要公司同步传递'一段时间内不再融资'的明确信号。 信用风险指标触及历史极值 据ICE Data Services数据 ，周四Meta五年期CDS价格单日最高上涨8.9个基点，升至约119.3个基点，创下该合约上市交易以来的盘中最高纪录。 CDS价格越高，意味着投资者为债务违约风险支付的保险成本越大，这一指标的跳升直接反映出市场对Meta债务负担的不安情绪。 市场新晋的\"AI贝塔风向标\"CoreWeave再度遭到重挫，其债券收益率重新升破15%。 超大规模云计算服务商的信用风险持续走高，相关股票亦开始引发投资者警觉。 值得关注的是，Meta的AI扩张路径与微软、Alphabet、亚马逊等竞争对手存在本质差异——Meta通常不对外出售算力，这意味着数据中心的过度投资风险将由公司自身完全承担，而非通过云服务客户加以分散。 在此前的季度财报电话会议上，投资者曾多次追问首席执行官马克·扎克伯格是否有开展云服务业务的具体计划，但扎克伯格并未给出明确答复。与此同时，Meta在季报中上调了全年资本支出预期，并宣布发行新一类无投票权股票，后者未来或可用于支付并购及其他费用。 目前，外界对于Meta能否从其庞大的AI投入中获得足够回报仍存疑虑，而不断攀升的支出承诺与信用风险指标，正促使债券市场投资者重新评估这场豪赌的代价。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-23 08:53:02+08:00","time":"10-23 08:53","source":"华尔街见闻财报","url":"https://wallstreetcn.com/articles/3784232","tag":"核心财报季","impact":"AI智能解读：核心财务指标超预期或逊色于市场共识，直接影响公司估值修复空间及板块情绪。","asset":"美股科技股 / 港股恒生科技 / A股权重核心标的","id":"NO.05"},{"title":"AI崩了，法债爆了，急需美债“避险”！10年期美债收益率创“硅谷银行危机”来最大跌幅","summary":"AI科技股的一轮集中抛售，意外成为美债市场三年来最猛烈的单日反弹的导火索。 周四，10年期美债收益率单日下行19.3个基点至4.952%重回5%以下， 为2023年3月10日硅谷银行危机以来最大单日跌幅 。据Dow Jones Market Da
