    button,input{font:inherit}

    .status-line{display:flex;align-items:center;gap:9px}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:none}
    .update-time{margin-top:3px}
    .disclaimer-small{margin-top:8px;color:#64748b}

    .labels{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .news-id{color:var(--amber);font-weight:850}
    .tag{padding:4px 8px;border-radius:6px;background:#1e293b;color:#cbd5e1;font-size:11px}
    .news-title{font-size:17px;line-height:1.5;font-weight:800;margin:0 0 10px;overflow-wrap:anywhere}
    .news-title a{color:var(--text);text-decoration:none}
    .news-title a:hover{color:#fbbf24}
    .summary{color:#94a3b8;font-size:14px;line-height:1.75;margin:0 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}

    .empty strong{display:block;color:#cbd5e1;margin-bottom:8px}
    footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--border);text-align:center;color:#64748b;font-size:12px;line-height:1.9}

  </style>
</head>

"尚太科技在投资者关系活动中表示，目前公司各项在建项目的整体推进情况良好，建设进度均符合预期目标，部分生产线已具备按计划逐步投产的条件。产能消化方面，当前负极材料行业整体处于供不应求阶段，需求端支撑充分，公司现阶段因自有产能不足，通过外协及满负荷生产满足订单需求，为新增产能的消化提供了坚实基础，上述项目投产后的产能消化具备充分保障。","published":"2026-10-19 09:40:37+08:00","time":"09:40","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.03"},{"title":"创业板指跌1.00%，现报2744.581点；上证指数跌0.33%，现报3704.073点；深证成指跌0.31%，现报11765.473点。","summary":"创业板指跌1.00%，现报2744.581点；上证指数跌0.33%，现报3704.073点；深证成指跌0.31%，现报11765.473点。","published":"2026-10-19 09:38:49+08:00","time":"09:38","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.02"},{"title":"股票ETF上周净流入885亿元 为年内第四高","summary":"持续放量，使得上周股票ETF净流入额来到年内第四高的水平。Wind数据显示，上周股票ETF合计净流入884.93亿元，仅次于7月的 3周水平。4只股票ETF在上周净流入超过百亿，分别是沪深300ETF易方达（净流入196.92亿元）、沪深300ETF华泰柏瑞（净流入176.47亿元）、创业板ETF易方达（净流入111.83亿元）、科创50EFT华夏（净流入104.2亿元）。其中，上周五也是上周单日净流入最高，净流入250.39亿元，仅沪深300ETF华泰柏瑞（净流入129.95亿元）就贡献过半的净流入。","published":"2026-10-19 09:35:33+08:00","time":"09:35","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.01"}]};

<script>
"use strict";
let currentTab = "global";
let dataLoadedFromJson = false;
const channelInfo = {
  global: {title:"国际财经",limit:10},
  asia: {title:"亚太财经",limit:5},
  china: {title:"国内财经",limit:5}
};

function safeText(value, fallback="") {
  if (value === null || value === undefined) return fallback;
  const text = String(value).trim();
  return text || fallback;
}
function makeElement(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}
function getDataObject() {
  // 同时兼容 window.newsData 和旧版顶层 const newsData。
  if (window.newsData && typeof window.newsData === "object") return window.newsData;
  try {
    if (typeof newsData !== "undefined" && newsData && typeof newsData === "object") return newsData;
  } catch (_) {}
  return null;
}
function getItems(tabKey) {
  const data = getDataObject();
  const value = data && data[tabKey];
  return Array.isArray(value) ? value.filter(item => item && safeText(item.title)) : [];
}
function normalizeItem(item,index,total) {
  const number = total-index;
  return {
    id:safeText(item.id,`NO.${String(number).padStart(2,"0")}`),
    title:safeText(item.title,"无标题"),
    summary:safeText(item.summary || item.desc || item.description,"暂无摘要，请打开新闻原文查看。"),
    tag:safeText(item.tag,channelInfo[currentTab].title),
    time:safeText(item.time || item.published,""),
    source:safeText(item.source,"来源未标注"),
    url:safeText(item.url || item.link,""),
    impact:safeText(item.impact,"请结合新闻原文、官方数据及实时行情判断影响。"),
    asset:safeText(item.asset,"相关市场 / 行业")
  };
}
function makeNewsCard(item,index,total) {
  const news=normalizeItem(item,index,total);
  const card=makeElement("article","news-card");
  const top=makeElement("div","news-top");
  const labels=makeElement("div","labels");
  labels.appendChild(makeElement("span","news-id",news.id));
  labels.appendChild(makeElement("span","tag",news.tag));
  top.appendChild(labels);
  top.appendChild(makeElement("time","",news.time));
  card.appendChild(top);

  const title=makeElement("h2","news-title");
  if(news.url && /^https?:\/\//i.test(news.url)) {
    const a=document.createElement("a");
    a.href=news.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=news.title;
    title.appendChild(a);
  } else title.textContent=news.title;
  card.appendChild(title);
  card.appendChild(makeElement("p","summary",news.summary));

  const impact=makeElement("div","impact");
  const impactRow=makeElement("div","");
  impactRow.appendChild(makeElement("strong","","📌 市场传导影响："));
  impactRow.appendChild(document.createTextNode(news.impact));
  impact.appendChild(impactRow);
  const assetRow=makeElement("div","");
  assetRow.appendChild(makeElement("strong","","💡 关联资产标的："));
  assetRow.appendChild(document.createTextNode(news.asset));
  impact.appendChild(assetRow);
  card.appendChild(impact);

  const bottom=makeElement("div","news-bottom");
  bottom.appendChild(makeElement("span","",`来源：${news.source}`));
  if(news.url && /^https?:\/\//i.test(news.url)) {
    const a=document.createElement("a");
    a.href=news.url;a.target="_blank";a.rel="noopener noreferrer";a.className="source-link";a.textContent="阅读原文 ↗";
    bottom.appendChild(a);
  } else bottom.appendChild(makeElement("span","","暂无原文链接"));
  card.appendChild(bottom);
  return card;
}
function renderNews(tabKey,filterQuery="") {
  const container=document.getElementById("newsContainer");
  const query=safeText(filterQuery).toLocaleLowerCase();
  container.replaceChildren();
  document.getElementById("channelCaption").textContent=channelInfo[tabKey].title;
  const original=getItems(tabKey);
  const filtered=original.filter(item=>{
    const text=[item.title,item.summary,item.desc,item.description,item.source,item.tag]
      .map(value=>safeText(value)).join(" ").toLocaleLowerCase();
    return text.includes(query);
  });
  document.getElementById("resultCount").textContent=`${filtered.length} 条新闻`;
  if(original.length===0) {
    const box=makeElement("div","empty");
    box.appendChild(makeElement("strong","",`${channelInfo[tabKey].title}暂时没有可显示的新闻`));
    box.appendChild(makeElement("span","",dataLoadedFromJson
      ?"新闻数据文件已读取，但该频道没有有效新闻。请检查 update.py 输出的频道键名及内容。"
      :"暂未从页面内嵌数据或 news.json 读取到新闻。请检查 GitHub Actions 更新日志及 data/news.json。"));
    container.appendChild(box);return;
  }
  if(filtered.length===0) {
    container.appendChild(makeElement("div","empty","没有找到匹配的新闻，请尝试其他关键词。"));return;
  }
  filtered.forEach((item,index)=>container.appendChild(makeNewsCard(item,index,filtered.length)));
}
function switchTab(key) {
  if(!channelInfo[key]) return;
  currentTab=key;
  document.querySelectorAll("[data-tab]").forEach(button=>{
    button.classList.toggle("active",button.dataset.tab===key);
    button.setAttribute("aria-current",button.dataset.tab===key?"page":"false");
  });
  renderNews(currentTab,document.getElementById("searchInput").value);
}
function updateStatus(message) {
  const counts=Object.keys(channelInfo).map(key=>getItems(key).length);
  const total=counts.reduce((sum,n)=>sum+n,0);
  const statusText=document.getElementById("statusText");
  const dot=document.getElementById("statusDot");
  if(total>0) {
    statusText.textContent=`新闻数据已载入：国际 ${counts[0]} 条 · 亚太 ${counts[1]} 条 · 国内 ${counts[2]} 条`;
    dot.style.background="#10b981";
  } else {
    statusText.textContent=message || "尚未载入新闻数据";
    dot.style.background="#f59e0b";
  }
}
function updateTime(data) {
  const el=document.getElementById("updateTime");
  const time=data && (data.updated_at || data.updatedAt || data.update_time || data.updated);
  if(time) el.textContent=`更新时间：${String(time)}（北京时间）`;
  else if(el.textContent.includes("正在读取")) el.textContent="更新时间：请查看 GitHub Actions 更新日志（北京时间）";
}
async function loadNewsJson() {
  const urls=["./data/news.json","./news.json"];
  for(const path of urls) {
    try {
      const response=await fetch(`${path}${path.includes("?")?"&":"?"}t=${Date.now()}`,{cache:"no-store"});
      if(!response.ok) continue;
      const payload=await response.json();
      const data=payload && (payload.newsData || payload.data || payload);
      if(data && typeof data==="object" &&
         (Array.isArray(data.global)||Array.isArray(data.asia)||Array.isArray(data.china))) {
        const current=getDataObject() || {};
        const currentCount=["global","asia","china"].reduce((sum,key)=>sum+(Array.isArray(current[key])?current[key].length:0),0);
        const fetchedCount=["global","asia","china"].reduce((sum,key)=>sum+(Array.isArray(data[key])?data[key].length:0),0);
        if(fetchedCount>0 && (currentCount===0 || fetchedCount>currentCount)) {
          window.newsData=data;
          dataLoadedFromJson=true;
          updateTime(payload);
        }
        return true;
      }
    } catch(error) {
      // Try the next compatible JSON path.
    }
  }
  return false;
}
async function copyTerminalText() {
  const list=getItems(currentTab);
  const lines=[`【${channelInfo[currentTab].title}】`,""];
  list.forEach((item,index)=>{
    const n=normalizeItem(item,index,list.length);
    lines.push(`${n.id}｜${n.title}`,`摘要：${n.summary}`,`来源：${n.source}`);
    if(n.url) lines.push(`原文：${n.url}`);
    lines.push("");
  });
  const text=lines.join("\n");
  try {
    await navigator.clipboard.writeText(text);
    alert("已复制当前频道的新闻文案。");
  } catch(error) {
    const textarea=document.createElement("textarea");
    textarea.value=text;textarea.style.position="fixed";textarea.style.opacity="0";
    document.body.appendChild(textarea);textarea.select();
    const ok=document.execCommand("copy");textarea.remove();
    alert(ok?"已复制当前频道的新闻文案。":"复制失败，请检查浏览器剪贴板权限。");
  }
}
document.addEventListener("DOMContentLoaded",async()=>{
  document.querySelectorAll("[data-tab]").forEach(button=>button.addEventListener("click",()=>switchTab(button.dataset.tab)));
  document.getElementById("searchInput").addEventListener("input",()=>renderNews(currentTab,document.getElementById("searchInput").value));
  document.getElementById("copyButton").addEventListener("click",copyTerminalText);
  document.getElementById("posterButton").addEventListener("click",()=>window.print());

  // 先显示内嵌数据；如果没有，再尝试读取 update.py 生成的 JSON。
  renderNews(currentTab);
  let counts=["global","asia","china"].reduce((sum,key)=>sum+getItems(key).length,0);
  if(counts===0) {
    const loaded=await loadNewsJson();
    counts=["global","asia","china"].reduce((sum,key)=>sum+getItems(key).length,0);
    if(!loaded && counts===0) {
      updateStatus("没有读取到新闻数据：检查 data/news.json、news.json 和 GitHub Actions。");
    }
  }
  updateStatus();
  updateTime(getDataObject());
  renderNews(currentTab,document.getElementById("searchInput").value);
});
</script>
