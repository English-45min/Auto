<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财经与时政焦点看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #cbd5e1; }
    .card { background-color: #111827; border-color: #1e293b; }
  </style>
</head>
<body class="min-h-screen pb-12">
  <div class="max-w-4xl mx-auto px-4 pt-6">
    
    <!-- 1. 顶部 Header -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center space-x-3">
        <span class="bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded text-xs tracking-wider">FINANCE & POLITICS</span>
        <h1 class="text-xl sm:text-2xl font-bold text-white">财经焦点看板</h1>
      </div>
    </div>

    <!-- 2. 更新状态面板 -->
    <div class="card border rounded-xl p-4 mb-4">
      <div class="flex items-center space-x-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <div id="updateTime" class="text-slate-300 font-medium text-sm">
          更新时间: 正在加载...
        </div>
      </div>
      <p class="text-xs text-slate-500 mt-2">
        新闻来自公开 RSS / 新闻接口；重要性排序为关键词辅助判断，不构成投资建议。
      </p>
    </div>

    <!-- 3. 搜索框 -->
    <div class="mb-6">
      <input type="text" id="searchInput" placeholder="搜索关键词（如：美联储、外交、特朗普、GDP、人民币）..." 
        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
    </div>

    <!-- 4. Tab 切换导航 -->
    <div class="flex border-b border-slate-800 mb-6">
      <button id="tab-global" onclick="switchTab('global')" class="py-3 px-4 font-bold text-amber-500 border-b-2 border-amber-500 transition">
        国际财经 Top 20
      </button>
      <button id="tab-asia" onclick="switchTab('asia')" class="py-3 px-4 font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">
        亚太财经 Top 10
      </button>
      <button id="tab-china" onclick="switchTab('china')" class="py-3 px-4 font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">
        国内财经 Top 10
      </button>
    </div>

    <!-- 5. 新闻列表展现区 -->
    <div class="flex justify-between items-center mb-4">
      <span id="channelTitle" class="text-slate-400 font-medium">国际财经</span>
      <span id="newsCount" class="text-xs text-slate-500">0 条新闻</span>
    </div>

    <div id="newsContainer" class="space-y-4"></div>

    <!-- 6. 页脚免责声明 -->
    <div class="mt-12 pt-6 border-t border-slate-800/60 text-center text-xs text-slate-500 space-y-2">
      <p>免责声明：本看板用于财经信息整理与阅读，不代表任何媒体官方产品，不构成投资建议。</p>
      <p>请以新闻原文、监管机构公告和实时市场数据为准。</p>
      <p>© 2026 财经焦点看板</p>
    </div>

  </div>

  <!-- Python 自动化脚本注入锚点 -->
  <!-- NEWS_DATA_START -->
  <script>
    const newsData = { global: [], asia: [], china: [] };
  </script>
  <!-- NEWS_DATA_END -->

  <script>
    let currentTab = 'global';

    function switchTab(tab) {
      currentTab = tab;
      ['global', 'asia', 'china'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "py-3 px-4 font-bold text-amber-500 border-b-2 border-amber-500 transition";
        } else {
          btn.className = "py-3 px-4 font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition";
        }
      });

      const titleMap = { global: '国际财经', asia: '亚太财经', china: '国内财经' };
      document.getElementById('channelTitle').textContent = titleMap[tab];
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const searchKey = document.getElementById('searchInput').value.trim().toLowerCase();
      let items = (typeof newsData !== 'undefined' && newsData[currentTab]) ? newsData[currentTab] : [];

      if (searchKey) {
        items = items.filter(item => 
          (item.title && item.title.toLowerCase().includes(searchKey)) ||
          (item.summary && item.summary.toLowerCase().includes(searchKey))
        );
      }

      document.getElementById('newsCount').textContent = `${items.length} 条新闻`;

      if (items.length === 0) {
        container.innerHTML = `<div class="card border rounded-xl p-8 text-center text-slate-500">暂无相关新闻或数据加载中...</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="card border rounded-xl p-5 space-y-3 hover:border-slate-700 transition">
          <div class="flex justify-between items-center text-xs">
            <div class="flex items-center space-x-2">
              <span class="text-amber-500 font-bold">${item.id || ''}</span>
              <span class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded">${item.tag || ''}</span>
            </div>
            <span class="text-slate-500">${item.time || ''}</span>
          </div>
          
          <h2 class="text-base sm:text-lg font-bold text-slate-100 leading-snug">${item.title || ''}</h2>
          
          ${item.summary ? `<p class="text-sm text-slate-400 leading-relaxed">${item.summary}</p>` : ''}
          
          <div class="bg-slate-900/60 rounded-lg p-3 text-xs space-y-1.5 border border-slate-800/50">
            <div class="text-slate-400"><span class="text-red-400">📌 市场传导影响:</span> ${item.impact || '需结合原文与实时行情判断。'}</div>
            <div class="text-slate-400"><span class="text-amber-400">💡 关联资产标的:</span> ${item.asset || '相关核心资产'}</div>
          </div>
          
          <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
            <span>来源: ${item.source || '公开源'}</span>
            ${item.url ? `<a href="${item.url}" target="_blank" class="text-slate-400 hover:text-amber-400 transition">阅读原文 ↗</a>` : '<span>暂无原文链接</span>'}
          </div>
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderNews();
    });
  </script>
</body>
</html>
