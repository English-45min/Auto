互动，持续完善新能源技术布局，发布犀牛S固态电池、迅龙秒充、V2G车网互动等技术及相关规划。该行提及，第三季出口58.4万辆，同比升58%。智界V9第三季批发销量约2.2万辆，环比增长明显；智界RX已于9月28日上市。亮眼出口表现有望支撑第三季经营业绩稳健向好，第三季汇兑基数较上半年降低，汇兑损益对利润影响有望弱化。展望2027年，公司指引销量及利润增长20%，并加快欧盟属地化建设、推动海内外组织协同，以应对贸易政策变化。该行维持公司2026及2027年净利润预测分别为202亿元及251亿元不变，维持“跑赢行业”评级及35港元的目标价。","published":"2026-10-21 15:59:23+08:00","time":"15:59","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.09"},{"title":"主动ETF 募集大战即将打响，已经基金宣布获得5亿跟投","summary":"本周五(10月21日)，内地首批主动ETF产品（合计18家）即将登上发行舞台，各方的竞逐也即将开始。 在此关键时刻，发行方之一摩根资产管理（中国）日前公告宣布，公司股东将通过关联方向该公司发行的主动ETF产品投资7500万美元(约合5亿元人民币)，这成为今年初以来新基金发行中罕见的大手笔。 这笔投资不仅显示了摩根的股东方对中国资本市场的信心，亦让周五即将开打的募集大战更趋白热化。 主动ETF迎超大规模投资 根据摩根资管的公告，基于对中国资本市场高质量发展和公司投资管理能力的信心，公司股东将通过其关联方摩根资产管理（亚太），运用自有资金7500万美元（约合5亿元人民币），投资本公司管理的摩根大盘成长主动管理交易型开放式股票证券投资基金，相关投资将在基金上市后开展。 公开数据显示， 本次投资是近年以来主动权益基金领域，基金公司及其股东规模最大的自有资金投资之一。 从绝对数量上说，东财基金在2024年曾经公告：该公司全资控股股东东方财富证券拟投资旗下 ETF、股票型指数基金及偏股混合型基金，金额不超过 20 亿元。但该公司未披露后续具体投向和实现的额度。 首批主动ETF有18家机构同场竞技 首批18只主动ETF， 均于10月22日启动发行，整体发行周期偏短。 其中易方达品质均衡主动管理ETF、华夏质量甄选主动股票ETF、华安均衡慧选主动管理ETF、招商价值智选主动管理ETF等6只产品发行期仅5个交易日，本次发行周期最长的基金为12个交易日。 从投资策略来看，这批产品形成均衡、价值、红利、质量、大盘成长五大主流策略布局，另有2只产品采用量化选股模式。 均衡策略是本次发行中数量最多的路线。有南方均衡配置主动管理ETF、永赢景气均衡主动管理ETF、易方达品质均衡主动管理ETF、华安均衡慧选主动管理ETF等9只产品采用该策略。这类基金不押注单一风格，通过分散持仓控制组合波动，追求长期稳健收益。 价值策略产品，包括招商价值智选主动管理ETF、鹏华价值臻选主动管理ETF等4只基金归入这一赛道。这类基金一般投资估值便宜的资产，注重安全边际，组合防御属性较强。 红利策略以持续高分红、现金流稳定的上市公司为主要选股方向，收益核心依托股息回报。主要有平安红利景气主动管理ETF、大成红利智选主动管理ETF等3只基金。 质量策略聚焦具备深厚护城河、盈利稳定、高ROE的优质企业，目标赚取优质公司长期成长复利。其中，华夏质量甄选主动股票ETF是该策略代表。 大盘成长策略聚焦高景气大盘龙头企业，依靠上市公司业绩增长获取收益，对景气度变化较为敏感，摩根大盘成长主动股票ETF是首批当中唯一一只布局大盘成长方向的主动ETF。 除主观选股路线外，首批产品还包含量化选股版本。富国价值优选量化选股主动管理ETF、天弘均衡量化选股主动管理ETF两只产品依托量化模型开展选股，进一步丰富主动ETF的策略供给。 首发募集规模预计超300亿 10月20日，易方达、华夏、汇添富、南方、富国、鹏华等18家公募同步披露发售安排，旗下主动ETF定于10月23日集中发行。 如果按20亿元募集上限估算，18只产品合计有望引流360亿元。 但看点并不只是首发募集。 首先， 募集速度可能是另一个很关键的参考指标。 率先结束发行，意味着这家产品的客户基础和储备能力有优势，在首批竞争中占得先机。 其次，后续上市后的持续营销也很关键。 这次摩根的股东承诺，会在上市后大规模跟投，这无疑会该公司的主动ETF加了很大一个筹码，后续的规模发展，也十分引人关注。 本文来自华尔街见闻，欢迎下载APP查看更多","published":"2026-10-21 15:05:36+08:00","time":"15:05","source":"华尔街见闻","url":"https://wallstreetcn.com/articles/3784111","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.08"},{"title":"清新环境：公司董事魏远接受纪律审查和监察调查","summary":"清新环境公告称，公司董事魏远涉嫌严重违纪违法，正接受中央纪委国家监委驻中国大唐纪检监察组纪律审查和湖南省邵阳市监察委员会监察调查。魏远除担任公司董事、董事会战略与业务发展（科技创新）委员会委员、董事会提名委员会委员外，未担任公司其他职务，不参与公司日常经营管理；该事项系魏远个人事项，与公司无关，不涉及财务造假、资金占用、违规担保等情形，不会对公司生产经营活动产生重大影响。","published":"2026-10-21 16:07:04+08:00","time":"16:07","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.07"},{"title":"今年前9个月中国内地访日游客数量同比下降55.5%","summary":"日本政府观光局当地时间10月21日公布的数据显示，今年1月至9月，中国内地访日游客数量同比下降55.5%。自日本首相高市早苗发表涉台错误言论以来，中国内地赴日游客数量持续走低。（央视新闻）","published":"2026-10-21 16:06:55+08:00","time":"16:06","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.06"},{"title":"直觉外科盘前跌7.53%，现报405.01美元","summary":"直觉外科盘前跌7.53%，现报405.01美元。消息面上，直觉外科披露美国达芬奇手术量增速放缓且预计定价调整与中国政策变化将致单台手术收入下降，并计提4.5亿美元反垄断和解费用拖累利润。","published":"2026-10-21 16:05:31+08:00","time":"16:05","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.05"},{"title":"大摩：维持MiniMax-W“增持”评级 目标价900港元","summary":"摩根士丹利发布研报称，维持MiniMax(00100)目标价900港元，评级“增持”;该行指出，MiniMax正式推出轻量级大语言模型M3.1 Flash，虽然参数规模与授权细节尚未完全披露，但定价在中国主要轻量级大语言模型中具有竞争力，执行代理任务的成本亦处于有利水准。报告提到，M3.1 Flash在中国人工智能指数中排名第二，仅次于DeepSeek V4.1 Flash。该行亦预期更高阶的M3 Pro将成为展现MiniMax技术实力的主要模型，可能于10月底前推出。","published":"2026-10-21 16:05:29+08:00","time":"16:05","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.04"},{"title":"SK海力士完成40万亿韩元股票回购","summary":"据报道，继三星电子之后，SK海力士的大规模股票回购也于21日结束。SK海力士表示，公司当天在韩国证券交易所（KOSPI）完成了历时两个月、规模达40万亿韩元的股票回购。此前，SK海力士宣布，将投入40.0434万亿韩元回购2407万股公司股票，并在回购完成后将全部股份注销。此次回购股份约占公司已发行股份总数的3.3%，是韩国上市公司规模最大的股票注销操作。SK海力士原先公告的回购期限为8月20日至11月19日，但实际回购工作提前约一个月完成。","published":"2026-10-21 16:03:44+08:00","time":"16:03","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.03"},{"title":"美团据悉考虑发行点心债","summary":"美团据悉考虑最快于未来几周发行离岸人民币债券，这将是公司时隔一年后再次开启境外债融资渠道。据知情人士，美团已获得相关部门批准发行离岸债券，募集资金将用于一般公司用途。美团未回应置评请求。","published":"2026-10-21 15:57:43+08:00","time":"15:57","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.02"},{"title":"联想拟筹集20亿美元贷款，低成本置换旧债","summary":"知情人士透露，联想集团有限公司正在寻求一笔20亿美元贷款，利率优于其拟置换的原有贷款。亚洲贷款市场交易清淡，银行仍愿意向中国头部企业投放信贷。这笔五年期贷款已启动银团分销，利率为担保隔夜融资利率（SOFR）上浮75个基点。该定价相比2022年同等规模贷款大幅收窄；当年那笔贷款为SOFR上浮110个基点外加信用调整利差，这一差异源于基准利率从伦敦同业拆借利率向SOFR切换。","published":"2026-10-21 15:57:04+08:00","time":"15:57","source":"新浪财经","url":"","tag":"国内核心","impact":"需结合原文、官方数据及实时行情进一步判断影响。","asset":"A股 / 人民币 / 国债 / 相关行业","id":"NO.01"}]};

                </span>
                <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300">
                  ${item.tag || '财经'}
                </span>
              </div>
              <span class="font-mono text-slate-400">${item.time || ''}</span>
            </div>

            <h3 class="text-base font-bold text-slate-100 leading-snug mb-2">
              ${item.title || ''}
            </h3>

            ${item.summary ? `
              <p class="text-xs text-slate-300 leading-relaxed mb-3">
                ${item.summary}
              </p>` : ''}

            <div class="bg-slate-900/60 rounded p-2.5 mb-3 text-xs space-y-1.5 border border-slate-800/80">
              <div class="flex items-start text-slate-300">
                <span class="text-red-400 font-bold shrink-0 mr-1.5">📌 市场传导影响:</span>
                <span>${item.impact || '需结合原文、官方数据及实时行情进一步判断影响。'}</span>
              </div>
              <div class="flex items-start text-slate-300">
                <span class="text-amber-400 font-bold shrink-0 mr-1.5">💡 关联资产标的:</span>
                <span>${item.asset || '相关资产标的'}</span>
              </div>
            </div>

            <div class="flex items-center justify-between pt-1 text-xs text-slate-500 border-t border-slate-800/40">
              <span>来源: ${item.source || '官方/权威媒体'}</span>
              ${urlBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    // 页面初始化渲染
    document.addEventListener('DOMContentLoaded', () => {
      renderNews();
    });

    // 移动端下拉刷新手势监听（顶部向下拖拽 > 150px 时无视缓存刷新）
    let startY = 0;
    window.addEventListener('touchstart', (e) => {
      startY = e.touches[0].pageY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const y = e.touches[0].pageY;
      if (window.scrollY === 0 && y - startY > 150) {
        location.reload(true);
      }
    }, { passive: true });
  </script>
</body>
</html>
