<!DOCTYPE html>
<html lang="zh-CN" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>财经与时政焦点看板</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0f17;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Arial, sans-serif;
  overflow-wrap: break-word;
}

.news-card {
  background: #131b2e;
  border: 1px solid #1e293b;
  transition: border-color .2s;
}

.news-card:active {
  background: #1a243d;
}

/* 一级标题：随屏幕宽度调整，必要时允许换行 */
.site-header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

.site-brand {
  flex: 1 1 220px;
  min-width: 0;
}

.site-heading {
  font-size: clamp(12px, 3.5vw, 16px);
  line-height: 1.4;
  overflow-wrap: anywhere;
  word-break: normal;
}

/* 字号调节按钮 */
#fontControls {
  flex-shrink: 0;
}

/* 二级栏目导航：四个栏目平均分配宽度，空间不足自动换行 */
#tabs {
  display: flex;
  flex-wrap: wrap;
  width: 100%;
  max-width: 100%;
  overflow: visible;
  align-items: stretch;
  gap: 0;
}

.tab-button {
  flex: 1 1 25%;
  min-width: 0;
  max-width: 100%;
  min-height: 46px;
  padding: 8px 5px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: normal;
  line-height: 1.35;

  border-bottom: 2px solid transparent;
  color: #94a3b8;
  font-size: clamp(11px, 2.5vw, 14px);
}

.tab-button.active {
  color: #f59e0b;
  border-bottom-color: #f59e0b;
  font-weight: 700;
}

/* 新闻卡片中的新闻标题，保持原有两行显示 */
.adaptive-title {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}

.highlight-word {
  color: #fbbf24;
  background: rgba(245, 158, 11, .12);
  padding: 0 2px;
  border-radius: 2px;
}

.read-title {
  color: #64748b !important;
}

.scrollbar-none {
  scrollbar-width: none;
}

.scrollbar-none::-webkit-scrollbar {
  display: none;
}

/* 手机：标题与按钮分行，二级栏目按空间自动换行 */
@media (max-width: 420px) {
  .site-header-inner {
    align-items: flex-start;
  }

  .site-brand {
    flex: 1 1 100%;
  }

  #fontControls {
    margin-left: auto;
  }

  .tab-button {
    flex: 1 1 25%;
    font-size: 11px;
    min-height: 48px;
    padding: 8px 3px;
  }
}

/* 极窄屏幕：允许每个栏目占据更多宽度，避免文字拥挤 */
@media (max-width: 300px) {
  .tab-button {
    flex-basis: 50%;
    font-size: 12px;
  }
}

@media print {
  body {
    background: white !important;
    color: #111827 !important;
  }

  header,
  #backToTop,
  #fontControls,
  #tabs {
    display: none !important;
  }

  .news-card {
    background: white !important;
    border: 1px solid #ddd !important;
    break-inside: avoid;
  }

  footer {
    color: #555 !important;
  }
}
</style>
</head>

<body class="min-h-screen pb-12">

<!-- 顶部一级标题 -->
<header class="sticky top-0 z-50 bg-[#0b0f17]/95 backdrop-blur-md border-b border-slate-800 px-4 py-3">
  <div class="site-header-inner max-w-3xl mx-auto">

    <div class="site-brand min-w-0 space-y-1">
      <div class="flex items-start gap-2 min-w-0">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0 mt-1"></span>
        <h1 class="site-heading font-bold">
          TERMINAL // 财经与时政焦点
        </h1>
      </div>

      <div id="updateTime" class="text-slate-400 text-xs">
        更新时间：等待后台同步
      </div>
    </div>

    <div id="fontControls"
         class="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs">
      <button type="button"
              onclick="adjustFontSize(-1)"
              class="px-2 py-1 font-bold"
              aria-label="缩小新闻文字">
        A−
      </button>

      <span class="text-slate-600">|</span>

      <button type="button"
              onclick="adjustFontSize(1)"
              class="px-2 py-1 font-bold"
              aria-label="放大新闻文字">
        A+
      </button>
    </div>

  </div>
</header>

<main class="max-w-3xl mx-auto px-4 pt-4">

  <!-- 状态提示 -->
  <section class="mb-4 rounded-xl border border-slate-800 bg-slate-900/60 p-3 text-xs sm:text-sm text-slate-400"
           aria-live="polite">

    <p class="flex items-start gap-2">
      <span id="statusDot"
            class="mt-1 h-2 w-2 shrink-0 rounded-full bg-amber-500"></span>

      <span id="statusText">正在读取新闻数据……</span>
    </p>

    <p class="mt-2">
      新闻来自公开 RSS / 新闻接口；重要性排序为辅助筛选，不构成投资建议。
    </p>
  </section>

  <!-- 搜索框 -->
  <div class="mb-4">
    <label for="searchInput" class="sr-only">搜索新闻</label>

    <input
      id="searchInput"
      type="search"
      placeholder="搜索关键词（如：美联储、芯片、GDP、人民币）……"
      class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500">
  </div>

  <!-- 二级栏目标题：一行放不下时自动换行 -->
  <nav id="tabs"
       class="border-b border-slate-800 mb-4 text-sm"
       aria-label="新闻频道">

    <button
      type="button"
      id="tab-global"
      data-tab="global"
      onclick="switchTab('global')"
      class="tab-button active"
      aria-current="page">
      国际财经 Top 20
    </button>

    <button
      type="button"
      id="tab-asia"
      data-tab="asia"
      onclick="switchTab('asia')"
      class="tab-button">
      亚太市场 Top 10
    </button>

    <button
      type="button"
      id="tab-china"
      data-tab="china"
      onclick="switchTab('china')"
      class="tab-button">
      国内核心 Top 10
    </button>

    <button
      type="button"
      id="tab-earnings"
      data-tab="earnings"
      onclick="switchTab('earnings')"
      class="tab-button">
      📊 核心财报季
    </button>

  </nav>

  <!-- 当前栏目和新闻数量 -->
  <div class="flex items-center justify-between text-xs text-slate-500 mb-3">
    <span id="sectionLabel">国际财经</span>
    <span id="newsCount">0 条新闻</span>
  </div>

  <!-- 新闻内容 -->
  <section id="news-container"
           class="space-y-3.5"
           aria-live="polite">

    <div class="rounded-xl border border-slate-800 p-8 text-center text-sm text-slate-400">
      正在载入新闻……
    </div>

  </section>

  <!-- 页脚 -->
  <footer class="mt-10 pt-6 border-t border-slate-800/60 text-center text-xs text-slate-500 leading-relaxed">
    <p>
      免责声明：本看板用于财经信息整理与阅读，不代表任何媒体官方产品，不构成投资建议。
    </p>

    <p class="mt-1">
      请以新闻原文、监管机构公告和实时市场数据为准。
    </p>

    <p class="mt-2 text-slate-600">
      © 2026 财经焦点看板
    </p>
  </footer>

</main>

<!-- 返回顶部按钮 -->
<button
  id="backToTop"
  type="button"
  onclick="scrollToTop()"
  class="fixed right-5 bottom-6 z-50 hidden bg-slate-800/95 text-amber-400 border border-slate-700 p-3 rounded-full shadow-lg"
  title="返回顶部"
  aria-label="返回顶部">

  <svg class="w-5 h-5"
       fill="none"
       stroke="currentColor"
       viewBox="0 0 24 24">

    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M5 15l7-7 7 7">
    </path>

  </svg>
</button>

<!--
  重要：保留以下数据标记。
  update.py 会自动替换这一区域中的新闻数据。
  不要删除 NEWS_DATA_START 和 NEWS_DATA_END。
-->

<!-- NEWS_DATA_START -->
<script>
window.newsData = window.newsData || {
  global: [],
  asia: [],
  china: [],
  earnings: [],
  updatedAt: ""
};
</script>
<!-- NEWS_DATA_END -->

<script>
(() => {
  'use strict';

  let currentTab = 'global';
  let fontLevel = 0;

  const labels = {
    global: '国际财经',
    asia: '亚太财经',
    china: '国内财经',
    earnings: '核心财报季'
  };

  const limits = {
    global: 20,
    asia: 10,
    china: 10,
    earnings: 20
  };

  const titleSizes = [
    'text-base',
    'text-lg',
    'text-xl'
  ];

  const summarySizes = [
    'text-xs',
    'text-sm',
    'text-base'
  ];

  const words = [
    '降息', '加息', '央行', 'A股', '美联储',
    '半导体', '台积电', '关税', '通胀', 'CPI',
    'GDP', '人民币', '沪指', '港股', '财报',
    '营收', '净利润', '超预期'
  ];

  function data() {
    const d = window.newsData &&
              typeof window.newsData === 'object'
              ? window.newsData
              : {};

    Object.keys(labels).forEach(k => {
      if (!Array.isArray(d[k])) {
        d[k] = [];
      }
    });

    return d;
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  function highlight(value) {
    let s = esc(value);

    words.forEach(word => {
      const escaped = word.replace(
        /[.*+?^${}()|[\]\\]/g,
        '\\$&'
      );

      s = s.replace(
        new RegExp(escaped, 'gi'),
        match => '<span class="highlight-word">' +
                 match +
                 '</span>'
      );
    });

    return s;
  }

  function safeUrl(value) {
    try {
      const url = new URL(String(value || ''), location.href);

      if (url.protocol === 'http:' ||
          url.protocol === 'https:') {
        return url.href;
      }

      return '';
    } catch (_) {
      return '';
    }
  }

  function readMap() {
    try {
      return JSON.parse(
        localStorage.getItem('read_news_items') || '{}'
      ) || {};
    } catch (_) {
      return {};
    }
  }

  function markRead(key, heading) {
    const map = readMap();

    map[key] = true;

    try {
      localStorage.setItem(
        'read_news_items',
        JSON.stringify(map)
      );
    } catch (_) {}

    if (heading) {
      heading.classList.add('read-title');
    }
  }

  function updateStatus() {
    const d = data();

    const total = Object.keys(labels).reduce(
      (sum, key) => sum + d[key].length,
      0
    );

    const time =
      d.updatedAt ||
      d.updateTime ||
      d.updated_at ||
      '';

    document.getElementById('updateTime').textContent =
      time
        ? '更新时间：' + String(time) + '（北京时间）'
        : '更新时间：请查看 GitHub Actions 更新日志';

    document.getElementById('statusText').textContent =
      total
        ? '已载入 ' + total + ' 条新闻；当前页面数据读取正常。'
        : '当前页面没有载入新闻数据，请检查 update.py 及 GitHub Actions 更新日志。';

    document.getElementById('statusDot').className =
      'mt-1 h-2 w-2 shrink-0 rounded-full ' +
      (total ? 'bg-emerald-500' : 'bg-amber-500');
  }

  function render() {
    const d = data();

    const query = document
      .getElementById('searchInput')
      .value
      .trim()
      .toLocaleLowerCase();

    const container =
      document.getElementById('news-container');

    const read = readMap();

    const all = d[currentTab].slice(
      0,
      limits[currentTab] || 20
    );

    const items = all.filter(item => {
      const text = [
        item.title || '',
        item.summary || '',
        item.tag || '',
        item.source || ''
      ].join(' ').toLocaleLowerCase();

      return text.includes(query);
    });

    document.getElementById('sectionLabel').textContent =
      labels[currentTab];

    document.getElementById('newsCount').textContent =
      items.length + ' 条新闻';

    container.replaceChildren();

    if (!items.length) {
      const box = document.createElement('div');

      box.className =
        'rounded-xl border border-slate-800 bg-[#131b2e]/50 ' +
        'p-8 sm:p-10 text-center text-sm text-slate-400 leading-relaxed';

      const heading = document.createElement('p');

      heading.className =
        'font-bold text-slate-200 mb-2';

      heading.textContent = query
        ? '没有找到匹配的新闻'
        : (
            currentTab === 'earnings'
              ? '暂无财报数据'
              : labels[currentTab] + '暂时没有可显示的新闻'
          );

      const message = document.createElement('p');

      message.textContent = query
        ? '请尝试其他关键词。'
        : '请检查后台更新任务是否成功，并确认 update.py 已写入本页面的数据区。这里不会用虚构内容补足数量。';

      box.append(heading, message);
      container.appendChild(box);

      return;
    }

    items.forEach((item, index) => {
      const title = String(
        item.title || '（无标题）'
      );

      const url = safeUrl(
        item.url || item.link || ''
      );

      const key = String(
        item.url || item.link || title
      );

      const card = document.createElement('article');

      card.className =
        'news-card rounded-xl p-4 sm:p-5 shadow-sm';

      card.dataset.newsKey = key;

      /* 新闻编号、分类和时间 */
      const top = document.createElement('div');

      top.className =
        'flex items-center justify-between gap-3 ' +
        'text-xs text-slate-400 mb-2';

      const left = document.createElement('div');

      left.className =
        'flex items-center gap-2 min-w-0';

      const rank = document.createElement('span');

      rank.className =
        'shrink-0 px-1.5 py-0.5 rounded text-[10px] ' +
        'font-bold bg-amber-500/10 text-amber-400 ' +
        'border border-amber-500/20';

      rank.textContent =
        item.id !== undefined &&
        item.id !== null &&
        item.id !== ''
          ? String(item.id)
          : 'NO.' + (index + 1);

      const tag = document.createElement('span');

      tag.className =
        'truncate px-1.5 py-0.5 rounded text-[10px] ' +
        'bg-slate-800 text-slate-300';

      tag.textContent = item.tag || labels[currentTab];

      left.append(rank, tag);

      const time = document.createElement('time');

      time.className = 'font-mono shrink-0';
      time.textContent = item.time || '';

      top.append(left, time);

      /* 新闻标题 */
      const heading = document.createElement('h2');

      heading.className =
        titleSizes[fontLevel] +
        ' news-title font-bold text-slate-100 ' +
        'leading-snug mb-2 adaptive-title' +
        (read[key] ? ' read-title' : '');

      heading.innerHTML = highlight(title);
      heading.title = title;

      /* 新闻摘要 */
      const summary = document.createElement('p');

      summary.className =
        summarySizes[fontLevel] +
        ' text-slate-300 leading-relaxed mb-3';

      summary.innerHTML = highlight(
        item.summary ||
        '暂无摘要，请阅读原文了解详情。'
      );

      /* 市场影响与关联资产 */
      const infoBox = document.createElement('div');

      infoBox.className =
        'bg-slate-900/60 rounded-lg p-3 mb-3 ' +
        'text-xs space-y-2 border border-slate-800/80';

      const impact = document.createElement('p');

      impact.className =
        'flex items-start text-slate-300 gap-1.5';

      const impactLabel = document.createElement('strong');

      impactLabel.className =
        'text-red-400 shrink-0';

      impactLabel.textContent = '📌 市场影响：';

      const impactText = document.createElement('span');

      impactText.textContent =
        item.impact ||
        '需结合新闻原文、官方数据及实时行情进一步判断。';

      impact.append(impactLabel, impactText);

      const asset = document.createElement('p');

      asset.className =
        'flex items-start text-slate-300 gap-1.5';

      const assetLabel = document.createElement('strong');

      assetLabel.className =
        'text-amber-400 shrink-0';

      assetLabel.textContent = '💡 关联资产：';

      const assetText = document.createElement('span');

      assetText.textContent =
        item.asset ||
        '请根据新闻内容核对相关资产。';

      asset.append(assetLabel, assetText);

      infoBox.append(impact, asset);

      /* 新闻来源与原文链接 */
      const bottom = document.createElement('div');

      bottom.className =
        'flex items-center justify-between gap-3 pt-2 ' +
        'text-xs text-slate-500 border-t border-slate-800/60';

      const source = document.createElement('span');

      source.className = 'min-w-0 truncate';

      source.textContent =
        '来源：' + (item.source || '公开新闻源');

      bottom.appendChild(source);

      if (url) {
        const link = document.createElement('a');

        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';

        link.className =
          'shrink-0 text-slate-400 hover:text-amber-400';

        link.textContent =
          currentTab === 'earnings'
            ? '查看财报 ↗'
            : '阅读原文 ↗';

        link.addEventListener('click', () => {
          markRead(key, heading);
        });

        bottom.appendChild(link);
      } else {
        const noLink = document.createElement('span');

        noLink.className = 'shrink-0 text-slate-600';
        noLink.textContent = '暂无原文链接';

        bottom.appendChild(noLink);
      }

      card.append(
        top,
        heading,
        summary,
        infoBox,
        bottom
      );

      card.addEventListener('click', event => {
        if (event.target.closest('a,button')) {
          return;
        }

        markRead(key, heading);
      });

      container.appendChild(card);
    });
  }

  /* 切换新闻栏目 */
  window.switchTab = function(tab) {
    if (!Object.prototype.hasOwnProperty.call(labels, tab)) {
      return;
    }

    currentTab = tab;

    document.querySelectorAll('[data-tab]').forEach(button => {
      const active = button.dataset.tab === tab;

      button.classList.toggle('active', active);

      if (active) {
        button.setAttribute('aria-current', 'page');
      } else {
        button.removeAttribute('aria-current');
      }
    });

    render();

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  };

  /* 调整新闻文字大小 */
  window.adjustFontSize = function(direction) {
    fontLevel = Math.max(
      0,
      Math.min(2, fontLevel + direction)
    );

    render();
  };

  /* 返回页面顶部 */
  window.scrollToTop = function() {
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  };

  /* 滚动时显示或隐藏返回顶部按钮 */
  window.addEventListener('scroll', () => {
    document
      .getElementById('backToTop')
      .classList.toggle('hidden', window.scrollY <= 400);
  }, {
    passive: true
  });

  /* 搜索新闻 */
  document
    .getElementById('searchInput')
    .addEventListener('input', render);

  /* 手机左右滑动切换栏目 */
  const order = [
    'global',
    'asia',
    'china',
    'earnings'
  ];

  let startX = 0;
  let startY = 0;
  let startTime = 0;
  let swipeAllowed = true;

  document.addEventListener('touchstart', event => {
    swipeAllowed = !event.target.closest(
      'a,button,input,textarea,select'
    );

    if (!event.touches[0]) {
      return;
    }

    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
    startTime = Date.now();
  }, {
    passive: true
  });

  document.addEventListener('touchend', event => {
    if (!swipeAllowed || !event.changedTouches[0]) {
      return;
    }

    const dx =
      event.changedTouches[0].clientX - startX;

    const dy =
      event.changedTouches[0].clientY - startY;

    if (
      Date.now() - startTime > 600 ||
      Math.abs(dx) < 75 ||
      Math.abs(dx) < Math.abs(dy) * 1.5
    ) {
      return;
    }

    const index = order.indexOf(currentTab);

    if (dx < 0 && index < order.length - 1) {
      window.switchTab(order[index + 1]);
    } else if (dx > 0 && index > 0) {
      window.switchTab(order[index - 1]);
    }
  }, {
    passive: true
  });

  /* 初始化页面 */
  function init() {
    updateStatus();
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>
</html>
