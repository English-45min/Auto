    <script>
        let currentTab = 'global';

        function renderNews(tab = 'global', filterKeyword = '') {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';
            let list = newsData[tab] || [];

            if (filterKeyword) {
                list = list.filter(item => item.title.includes(filterKeyword) || item.summary.includes(filterKeyword) || item.tag.includes(filterKeyword));
            }

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-500 text-xs">没有找到符合关键词的新闻</div>`;
                return;
            }

            list.forEach((item) => {
                const card = document.createElement('div');
                card.className = "bg-bbCard border border-bbBorder rounded-lg p-4 space-y-2.5 hover:border-bbGold/50 transition duration-150 shadow-sm";
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-bbGold tracking-wider">${item.id}</span>
                            <span class="bg-gray-800 text-gray-300 px-2 py-0.5 rounded text-[10px] font-medium border border-gray-700">${item.tag}</span>
                        </div>
                        <span class="text-bbTextMuted font-mono text-[11px]"><i class="fa-regular fa-clock"></i> ${item.time}</span>
                    </div>
                    <h3 class="text-sm font-bold leading-snug text-gray-100">${item.title}</h3>
                    <p class="text-xs text-gray-300 leading-relaxed">${item.summary}</p>
                    <div class="pt-2.5 border-t border-bbBorder/60 space-y-1.5 text-xs bg-black/20 p-2.5 rounded">
                        <div class="text-gray-300"><span class="text-bbGold font-bold">📌 市场传导影响：</span> ${item.impact}</div>
                        <div class="text-gray-300"><span class="text-blue-400 font-bold">💡 关联资产标的：</span> <span class="font-mono text-gray-200">${item.asset}</span></div>
                    </div>
                    <div class="pt-0.5 flex justify-between items-center text-[10px] text-bbTextMuted">
                        <span>彭博财经 · 每日精编</span><span>来源: Bloomberg/公开数据</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.className = "py-2 text-xs font-bold tracking-wider text-gray-400 transition");
            document.getElementById(`tab-${tab}`).className = "py-2 text-xs font-bold tracking-wider tab-active transition";
            document.getElementById('searchInput').value = '';
            renderNews(tab);
        }

        function filterNews() {
            renderNews(currentTab, document.getElementById('searchInput').value.trim());
        }

        function toggleTheme() {
            const body = document.getElementById('mainBody');
            const icon = document.getElementById('themeIcon');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                icon.className = "fa-solid fa-sun text-yellow-500";
            } else {
                body.classList.add('dark');
                icon.className = "fa-solid fa-moon";
            }
        }

        async function generateSixPosters() {

            renderArea.innerHTML = '<div class="text-center text-xs text-bbGold py-4"><i class="fa-solid fa-spinner fa-spin"></i> 正在生成 6 张 9:16 标准高清晰套图...</div>';
            document.getElementById('posterModal').classList.remove('hidden');

            const allNews = [
                ...newsData.global.map(i => ({ ...i, section: '彭博全球 Top 10' })),
                ...newsData.asia.map(i => ({ ...i, section: '亚太焦点 Top 5' })),
                ...newsData.china.map(i => ({ ...i, section: '国内核心 Top 5' }))
            ];

            const chunkSize = 4;
            const chunks = [];
            for (let i = 0; i < allNews.length; i += chunkSize) {
                chunks.push(allNews.slice(i, i + chunkSize));
            }

            renderArea.innerHTML = '';

            for (let idx = 0; idx < chunks.length; idx++) {
                const group = chunks[idx];
                const wrapper = document.createElement('div');

                let itemsHtml = group.map(item => `
                    <div style="height:130px;border-bottom:1px solid #30363D;padding:6px 0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden;">
                        <div style="font-size:10px;color:#F0B90B;font-weight:bold;display:flex;justify-content:space-between;line-height:14px;height:14px;margin-bottom:4px;">
                            <span>${item.id} · ${item.tag}</span><span style="color:#6B7280;font-size:9px;">${item.section}</span>
                        </div>
                        <div style="font-size:11px;font-weight:bold;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:16px;height:16px;margin-bottom:6px;">${item.title}</div>
                        <div style="font-size:10px;color:#9CA3AF;line-height:15px;height:30px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${item.summary}</div>
                    </div>
                `).join('');

                wrapper.innerHTML = `
                    <div style="height:40px;border-bottom:2px solid #F0B90B;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:4px;">
                        <div>
                            <div style="background:#F0B90B;color:#000;font-size:8px;font-weight:900;display:inline-block;padding:1px 4px;border-radius:2px;">BLOOMBERG</div>
                            <div style="font-size:13px;font-weight:bold;color:#FFF;margin-top:2px;line-height:14px;">每日财经看板</div>
                        </div>
                        <div style="font-size:9px;color:#8B949E;text-align:right;">全景套卡 (${idx + 1}/6)</div>
                    </div>
                    <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;margin:6px 0;">${itemsHtml}</div>
                    <div style="height:46px;background:rgba(255,255,255,0.03);border:1px solid #30363D;padding:4px 10px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;">
                        <div>
                            <div style="font-size:10px;color:#F0B90B;font-weight:bold;line-height:14px;">长按识别二维码</div>
                            <div style="font-size:8px;color:#9CA3AF;line-height:12px;">在线查看完整 20 条解读与标的</div>
                        </div>
                        <div id="qr-eq-${idx}" style="background:#FFF;padding:2px;border-radius:2px;"></div>
                    </div>
                `;

                document.body.appendChild(wrapper);
                new QRCode(wrapper.querySelector(`#qr-eq-${idx}`), { text: window.location.href, width: 34, height: 34 });
                await new Promise(r => setTimeout(r, 150));
                const canvas = await html2canvas(wrapper, { scale: 2, backgroundColor: '#0D1117' });
                const img = document.createElement('img');
                img.src = canvas.toDataURL('image/png');
                img.style.cssText = "width:100%;border-radius:8px;border:1px solid #30363D;";
                renderArea.appendChild(img);
                document.body.removeChild(wrapper);
            }

            // 第 6 张末页
            const lastWrapper = document.createElement('div');
            lastWrapper.style.cssText = `position:absolute;left:-9999px;width:375px;height:720px;background-size:cover;background-position:center;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:24px 20px;background-image:url('./bg.jpg'), linear-gradient(180deg, #1A1F2C 0%, #0D1117 100%);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;`;
            
            lastWrapper.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.35);backdrop-filter:blur(4px);padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);">
                    <div style="background:#F0B90B;color:#000;font-size:8px;font-weight:900;padding:2px 5px;border-radius:2px;">BLOOMBERG</div>
                    <div style="font-size:9px;color:#E5E7EB;letter-spacing:1px;font-weight:bold;">END PAGE · (6/6)</div>
                </div>
                <div style="text-align:center;background:rgba(0,0,0,0.25);backdrop-filter:blur(2px);padding:25px 10px;border-radius:12px;">
                    <div style="font-family:'Playfair Display', Georgia, 'Times New Roman', serif;font-size:38px;font-style:italic;font-weight:700;color:#FFFFFF;text-shadow:0 0 12px rgba(255,255,255,0.9), 0 0 25px rgba(240,185,11,0.7);letter-spacing:1px;line-height:1.2;">God bless you</div>
                    <div style="margin-top:10px;font-size:10px;color:#F0B90B;font-weight:600;letter-spacing:2px;text-shadow:0 1px 3px rgba(0,0,0,0.8);">✦ 愿智慧与财富同在 ✦</div>
                </div>
                <div style="text-align:center;font-size:9px;color:#E5E7EB;background:rgba(0,0,0,0.35);backdrop-filter:blur(4px);padding:6px;border-radius:6px;letter-spacing:1px;">2026 FINANCIAL NEWS TERMINAL · ALL RIGHTS RESERVED</div>
            `;

            document.body.appendChild(lastWrapper);
            await new Promise(r => setTimeout(r, 200));
            const lastCanvas = await html2canvas(lastWrapper, { scale: 2, useCORS: true });
            const lastImg = document.createElement('img');
            lastImg.src = lastCanvas.toDataURL('image/png');
            lastImg.style.cssText = "width:100%;border-radius:8px;border:1px solid #30363D;";
            renderArea.appendChild(lastImg);
            document.body.removeChild(lastWrapper);
        }

        function copyWechatText() {
            const list = newsData[currentTab] || [];
            const tabName = currentTab === 'global' ? '彭博全球 Top 10' : (currentTab === 'asia' ? '亚太焦点 Top 5' : '国内核心 Top 5');
            let txt = `▍ BLOOMBERG 彭博财经终端 · ${tabName}\n--------------------------------\n\n`;
            list.forEach(item => {
                txt += `◆ ${item.id} | ${item.title}\n▸ 简讯：${item.summary}\n▸ 影响：${item.impact}\n\n`;
            });
            txt += `--- \n数据来源：Bloomberg 及公开数据综合编译`;
            navigator.clipboard.writeText(txt).then(() => alert('✅ 彭博终端风格文案已成功复制！'));
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        renderNews('global');
    </script>
</body>
</html>
