name: Daily Update

on:
  schedule:
    - cron: '0 0,6 * * *' # UTC 00:00、06:00；北京时间 08:00、14:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 执行 Python 数据更新脚本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python update.py
      - name: 提交更新后的网页和 AI 缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html ai_cache.json
          git diff --cached --quiet || git commit -m "auto: update finance news and AI insights"
          git push
