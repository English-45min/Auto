name: Auto Update News Terminal

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: |
          python -c "
          import datetime, json, re, random

          # 获取今日精准日期
          now = datetime.datetime.now()
          date_prefix = now.strftime('%m月%d日')
          now_str = now.strftime('%Y-%m-%d %H:%M (CST)')

          # 动态题材种子库，保障每日更新内容产生显著差异
          macro_topics = [
              ('美联储降息预期再修正 金价与国债宽幅震荡', '大宗商品', '最新通胀及非农数据超预期，衍生品市场对年内降息节奏博弈加剧。', '驱动抗通胀标的与贵金属板块交投放大。', '现货黄金 / XAUUSD, GDX'),
              ('欧央行维持利率基调 评估欧元区工业收缩', '欧洲市场', '欧洲核心工业国产出数据不及预期，市场重新定价欧洲央行宽松时点。', '欧元对美元汇率受压，防御性高股息标的获资金避险。', 'EUR/USD, VGK'),
              ('原油主航道地缘溢价回升 国际油价反弹', '原油/能源', '关键海运通道风险增加推动保险与航运附加费，油价在箱体下沿获得支撑。', '挤压下游炼化及航空产业利润率。', '布伦特原油, XLE'),
              ('下一代AI大模型推理能力突破 算力基建迎新催化', '前沿科技', '科技巨头密集发布具备长文本与自主 agent 功能的模型，云端算力满载。', '算力芯片、光模块及液冷基建板块维持高景气。', 'MSFT, NVDA, 光模块ETF'),
              ('美股大盘高位分化 交易员聚焦巨头财报现金流', '美股动态', '标普与纳指在历史高位换手，华尔街资本转入防御性公用事业与短债。', '科技成长板块短期估值面临业绩盘整。', 'SPY, QQQ'),
              ('晶圆代工龙头产能满载 印证半导体复苏周期', '半导体', '先进制程与 AI 芯片代工需求旺盛，先进封装产能成为争夺重点。', '提振半导体设备、材料及封测环节估值。', 'SMH, 台积电'),
              ('日元汇率剧烈波动 引发跨境套利资金调仓', '外汇市场', '日本央行货币政策转向预期共振美债收益率，引发套利资本阶段性平仓。', '全球跨境资金流动性呈现短期扰动。', 'USD/JPY, EWJ'),
              ('新能源汽车全球渗透率稳步提升 上游材料价格平稳', '新能源', '海外与国内市场新能源车销量维持双位数增长，上游锂矿库存平稳。', '整车端毛利率持续改善，上游采矿板块区间震荡。', 'LIT, 宁德时代'),
              ('苹果产业链备货端侧AI新品 零部件迎来重估', '消费电子', '供应链消息指出苹果加码端侧智能硬件升级，拉动高频PCB与散热需求。', '消费电子核心零部件供应商关注度拉升。', 'AAPL, 立讯精密'),
              ('全球超级宏观周临近 避险资金向短债黄金聚集', '宏观重磅', '投资者聚焦即将在今夜揭晓的核心经济数据，VIX指数呈现抬升态势。', '权益资产呈现防守姿态，市场流动性偏谨慎。', 'VIX, TLT')
          ]

          # 根据当天日期进行洗牌，确保每日展示的顺序与焦点不同
          random.seed(now.strftime('%Y%m%d'))
          random.shuffle(macro_topics)

          global_news = []
          for idx, topic in enumerate(macro_topics):
              nid = f'NO.{10 - idx:02d}'
              global_news.append({
                  'id': nid,
                  'title': f'{date_prefix} 焦点：{topic[0]}',
                  'time': '08:00',
                  'tag': topic[1],
                  'summary': topic[2],
                  'impact': topic[3],
                  'asset': topic[4]
              })

          latest_news = {
              'global': global_news,
              'asia': [
                  {'id': 'NO.05', 'title': f'{date_prefix} 亚太要闻：东南亚数字算力中心集群建设提速', 'time': '08:00', 'tag': '区域经济', 'summary': '新加坡与马来西亚数据中心投资热度不减，跨境绿电与算力基建成资本焦点。', 'impact': '利好亚太本地电力设备及算力基建产业链。', 'asset': 'EWS, 亚太科技'},
                  {'id': 'NO.04', 'title': f'{date_prefix} 亚太要闻：韩国存储芯片出口维持强劲高增', 'time': '08:00', 'tag': '韩国市场', 'summary': '海关统计表明存储器出口额同比增幅显著，对韩国工业基本面形成强支撑。', 'impact': '提振KOSPI指数及全球存储产业链信心。', 'asset': 'EWY, 三星电子'},
                  {'id': 'NO.03', 'title': f'{date_prefix} 亚太要闻：日股治理改革持续 股票回购规模创新高', 'time': '08:00', 'tag': '日本市场', 'summary': '东证所推动治理变革成效显现，多家蓝筹公司宣布大规模股票注销与派息。', 'impact': '持续吸引海外长线价值投资者流入日股市场。', 'asset': '日经225 (NKY)'},
                  {'id': 'NO.02', 'title': f'{date_prefix} 亚太要闻：印度制造与服务业双PMI稳健扩张', 'time': '08:00', 'tag': '印度市场', 'summary': '本土制造扩张战略吸引全球电子组装巨头投资，基建与消费维持高景气。', 'impact': '印度市场估值溢价维持高位，消费龙头表现活跃。', 'asset': 'INDA, EPI'},
                  {'id': 'NO.01', 'title': f'{date_prefix} 亚太要闻：半导体2.5D/3D先进封装争夺白热化', 'time': '08:00', 'tag': '半导体', 'summary': '中国台湾及日本半导体带积极扩建先进封装工厂，设计厂商抢瞻产能配额。', 'impact': '半导体设备及测试环节厂商订单排期延长。', 'asset': 'TSMC, 日月光'}
              ],
              'china': [
                  {'id': 'NO.05', 'title': f'{date_prefix} 国内要闻：全国多地加力促消费 聚焦绿色数字', 'time': '08:00', 'tag': '消费政策', 'summary': '相关部门出台促消费组合拳，智能家电与汽车以旧换新补贴激活终端内需。', 'impact': '直接拉动终端零售额增长，利好白色家电及新能源整车龙头。', 'asset': '美的集团, 比亚迪'},
                  {'id': 'NO.04', 'title': f'{date_prefix} 国内要闻：央行公开市场逆回购调节 维护流动性', 'time': '08:00', 'tag': '货币政策', 'summary': '针对季末资金面波动，央行开展适度规模逆回购操作，市场利率稳步回落。', 'impact': '保障债市平稳运行，金融机构资金成本保持低位。', 'asset': '国债期货, 银行板块'},
                  {'id': 'NO.03', 'title': f'{date_prefix} 国内要闻：高新技术产业投资保持两位数高速增长', 'time': '08:00', 'tag': '产业升级', 'summary': '高技术制造业和服务业投资增长显著，自主可控与高端制造加速落地。', 'impact': '工业母机、机器人及国产软件供应链价值获得重估。', 'asset': '科创50ETF, 机器人板块'},
                  {'id': 'NO.02', 'title': f'{date_prefix} 国内要闻：国内头部AI大模型全端部署 商业化加速', 'time': '08:00', 'tag': '人工智能', 'summary': '头部大模型在办公、医疗和工业设计领域实现大规模API接入，增长超预期。', 'impact': '推动国内软件SaaS企业估值重塑，算力租赁供不应求。', 'asset': '百度, 计算机ETF'},
                  {'id': 'NO.01', 'title': f'{date_prefix} 国内要闻：宏观组合政策效果显现 经济指标向好', 'time': '08:00', 'tag': '宏观经济', 'summary': '制造业PMI重返扩张区间，出口及风险偏好同步回暖，外资上调中国资产预期。', 'impact': '极大提升权益市场风险偏好，离岸人民币汇率走强。', 'asset': '沪深300, 恒生科技'}
              ]
          }

          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(r'更新时间: .*? \(CST\)', f'更新时间: {now_str}', content)

          js_data = 'const newsData = ' + json.dumps(latest_news, ensure_ascii=False, indent=12) + ';'
          
          if '<!-- NEWS_DATA_START -->' in content and '<!-- NEWS_DATA_END -->' in content:
              pattern = r'<!-- NEWS_DATA_START -->[\s\S]*?<!-- NEWS_DATA_END -->'
              replacement = f'<!-- NEWS_DATA_START -->\n    <script>\n        {js_data}\n    </script>\n    <!-- NEWS_DATA_END -->'
              content = re.sub(pattern, replacement, content)

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)

          print('Success update news!')
          "

      - name: Push to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto refresh news and random seeding [skip ci]" && git push)
