name: Daily Update

on:
  schedule:
    - cron: '0 0,6 * * *'  # 每天 UTC 0:00 和 6:00 (北京时间 08:00 和 14:00)
  workflow_dispatch:        # 支持在 GitHub Actions 手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 赋予 git push 自动提交写权限

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行 Python 数据更新脚本
        run: python update.py

      - name: 提交更新后的 index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "auto: update terminal news data"
          git pull --rebase
          git push
