name: Daily Update

on:
schedule:
- cron: '0 0,6 * * *'  # 每天北京时间 08:00 和 14:00
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
permissions:
contents: write

steps:
  - name: 检出仓库代码
    uses: actions/checkout@v4

  - name: 配置 Python 环境
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: 执行 Python 数据更新脚本
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python update.py

  - name: 提交更新后的网页
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add index.html
      git diff --cached --quiet || git commit -m "auto: update terminal news data"
      git pull --rebase
      git push
