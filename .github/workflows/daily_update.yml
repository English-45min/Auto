name: Auto Update News Terminal

on:
  schedule:
    # 每天北京时间 (CST) 07:00 自动触发更新
    - cron: '0 23 * * *'
  workflow_dispatch: # 允许在 GitHub 界面随时手动点击运行

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch Latest News and Update index.html
        run: |
          python - << 'EOF'
          import re
          import json
          import datetime
          import urllib.request
          import xml.etree.ElementTree as ET

          # 抓取真实 RSS 源
          rss_urls = [
              "https://feeds.a.dj.com/rss/RSSWorldNews.xml",
              "https://feeds.bloomberg.com/markets/news.rss"
          ]
          
          fetched_items = []
          for url in rss_urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  xml_data = urllib.request.urlopen(req, timeout=10).read()
                  root = ET.fromstring(xml_data)
                  for item in root.findall('.//item'):
                      title = item.find('title')
                      desc = item.find('description')
                      pubDate = item.find('pubDate')
                      
                      t_text = title.text.strip() if title is not None and title.text else "市场动态实时追踪"
                      d_text = desc.text.strip() if desc is not None and desc.text else "全球资本市场最新动态与资产标的联动分析。"
                      # 清洗 HTML 标签
                      d_text = re.sub(r'<[^>]*>', '', d_text)
                      
                      if t_text and t_text not in [i['title'] for i in fetched_items]:
                          fetched_items.append({
                              "title": t_text,
                              "summary": d_text[:120] + "..." if len(d_text) > 120 else d_text
                          })
              except Exception as e:
                  print(f"Fetch RSS error for {url}: {e}")

          # 如果实时抓取到了内容，动态组合；否则使用高质量兜底
          global_news = []
          tags = ["宏观重磅", "大宗商品", "欧洲市场", "原油/能源", "前沿科技", "美股动态", "半导体", "外汇市场", "新能源", "消费电子"]
          assets = ["现货黄金 / XAUUSD", "EUR/USD", "布伦特原油", "NVDA, MSFT", "标普500 (SPY)", "SMH, TSM", "USD/JPY", "宁德时代", "AAPL", "沪深300"]

          for i in range(10):
              no_str = f"NO.{10-i:02d}"
              if i < len(fetched_items):
                  item = fetched_items[i]
                  title = item['title']
                  summary = item['summary']
              else:
                  title = f"全球资本市场第 {10-i} 焦点：宏观流动性与资产定价博弈"
                  summary = "最新市场数据显示多空双方在关键阻力位附近展开激烈争夺，机构正加速调整资产配置权重以应对波动率风险。"
              
              global_news.append({
                  "id": no_str,
                  "title": title,
                  "time": f"{07 - i//3:02d}:{45 - (i*5)%60:02d}",
                  "tag": tags[i % len(tags)],
                  "summary": summary,
                  "impact": "驱动相关产业链及板块短期波动加剧，资金关注度显著提升。",
                  "asset": assets[i % len(assets)]
              })

          now_str = datetime.datetime.now().strftime("%Y-%m-%d %H:%M (CST)")

          latest_news = {
              "global": global_news,
              "asia": [
                  {"id": "NO.05", "title": "亚太数字经济与算力中心集群建设加速推进", "time": "07:20", "tag": "区域经济", "summary": "区域内主要经济体加大数字基础设施投入，跨境供应链及半导体代工保持高景气度。", "impact": "利好电力装备、冷却设备及半导体基建标的。", "asset": "EWS, 亚太科技"},
                  {"id": "NO.04", "title": "韩国存储芯片出口回升 驱动工业基本面企稳", "time": "07:00", "tag": "韩国市场", "summary": "最新海关数据显示存储芯片出口同比增幅明显，对整体工业生产总值形成强支撑。", "impact": "提振KOSPI指数表现，对全球存储产业链利好。", "asset": "EWY, 三星电子"},
                  {"id": "NO.03", "title": "日本股市治理变革持续 蓝筹企业回购规模创新高", "time": "06:40", "tag": "日本市场", "summary": "东京证券交易所推动治理优化成效显著，多家核心企业持续加码股票注销与派息。", "impact": "持续吸引海外长线价值投资者流入。", "asset": "日经225 (NKY)"},
                  {"id": "NO.02", "title": "印度制造与服务业双PMI保持扩张区间", "time": "06:15", "tag": "印度市场", "summary": "制造业扩张政策吸引全球电子大厂加码投资，本土基建与消费需求持续旺盛。", "impact": "印度市场估值维持相对高位，消费龙头表现活跃。", "asset": "INDA, EPI"},
                  {"id": "NO.01", "title": "亚太半导体产业链重组 先进封装产能争夺白热化", "time": "05:30", "tag": "半导体", "summary": "中国台湾与日本积极扩建先进封装工厂，全球各大设计厂商全力抢占未来产能配额。", "impact": "测试及半导体设备订单排期维持高位。", "asset": "TSMC, 日月光"}
              ],
              "china": [
                  {"id": "NO.05", "title": "各地出台提振消费专项举措 聚焦绿色与数字消费", "time": "07:30", "tag": "消费政策", "summary": "相关部门出台促消费组合拳，智能家电与新能源汽车补贴政策持续释放终端活力。", "impact": "直接拉动零售额增长，利好白色家电与整车龙头。", "asset": "美的集团, 比亚迪"},
                  {"id": "NO.04", "title": "央行公开市场灵活开展逆回购 维护流动性合理充裕", "time": "07:10", "tag": "货币政策", "summary": "适度规模逆回购平滑资金面短期波动，银行间市场利率保持平稳运行。", "impact": "保障债市平稳，金融机构资金成本维持低位。", "asset": "国债期货, 银行板块"},
                  {"id": "NO.03", "title": "高技术制造业投资保持两位数增长 产业升级加快", "time": "06:45", "tag": "产业升级", "summary": "自主可控与高端制造加速落地，工业母机与机器人产业链价值获得重估。", "impact": "硬科技与设备制造板块获得资金持续青睐。", "asset": "科创50ETF"},
                  {"id": "NO.02", "title": "国内大模型商业化提速 企业级API接入量超预期", "time": "06:00", "tag": "人工智能", "summary": "大模型在办公、医疗等垂直领域批量落地，企业付费转化率呈现加速上升趋势。", "impact": "推动软件企业估值重塑，算力租赁维持供不应求。", "asset": "百度, 计算机ETF"},
                  {"id": "NO.01", "title": "宏观组合政策效果显现 核心经济指标展现回升态势", "time": "05:15", "tag": "宏观经济", "summary": "制造业PMI重返扩张区间，出口与市场风险偏好同步回暖，外资机构相继上调预期。", "impact": "显著提升市场风险偏好，离岸人民币汇率走强吸引外资。", "asset": "沪深300, 恒生科技"}
              ]
          }

          with open("index.html", "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(r'更新时间: .*? \(CST\)', f'更新时间: {now_str}', content)

          js_data_str = f"const newsData = {json.dumps(latest_news, ensure_ascii=False, indent=12)};"
          pattern = r'<!-- NEWS_DATA_START -->[\s\S]*?<!-- NEWS_DATA_END -->'
          replacement = f'<!-- NEWS_DATA_START -->\n    <script>\n        {js_data_str}\n    </script>\n    <!-- NEWS_DATA_END -->'

          new_content = re.sub(pattern, replacement, content)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(new_content)

          print("成功实现动态 RSS 抓取并写入 index.html！")
          EOF

      - name: Push to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dynamic RSS news [skip ci]" && git push)
