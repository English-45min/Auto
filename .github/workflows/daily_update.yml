
name: Daily Update

on:
  schedule:
    # 每两小时运行一次
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finance-dashboard-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          pip install requests feedparser python-dotenv

      - name: 检查必要文件
        run: |
          test -f update.py
          test -f index.html

      - name: 执行新闻更新
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUTF8: "1"
        run: python update.py

      - name: 提交更新后的网页和缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html ai_cache.json market_cap_cache.json

          if git diff --cached --quiet; then
            echo "没有新的网页变化"
          else
            git commit -m "auto: update finance and Asia Pacific news"
            git push
          fi
