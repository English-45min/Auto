name: Auto Update News Terminal

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: |
          python -c "
          import datetime, json, re

          now = datetime.datetime.now()
          date_prefix = now.strftime('%m月%d日')
          now_str = now.strftime('%Y-%m-%d %H:%M (CST)')

          news_item = lambda nid, title, tag, summary, impact, asset: {
              'id': nid,
              'title': f'{date_prefix} 焦点：{title}',
              'time': '07:30',
              'tag': tag,
              'summary': summary,
              'impact': impact,
              'asset': asset
          }

          latest_news = {
              'global': [
                  news_item('NO.10', '美联储降息预期升温 国际金价再创新高', '大宗商品', '最新通胀数据超预期回落，市场押注美联储将启动二次降息，现货黄金突破关口。', '驱动抗通胀标的与黄金概念股，贵金属板块波动加大。', '现货黄金 / XAUUSD, GDX'),
                  news_item('NO.09', '欧央行维持基调 评估欧洲经济衰退风险', '欧洲市场', '欧洲中央银行最新会议暗示通胀压力持续放缓，但工业产出疲软加剧了停滞忧虑。', '欧元兑美元震荡，欧洲高股息防御性股票受资金青睐。', 'EUR/USD, VGK'),
                  news_item('NO.08', '中东能源运输通道安全引发原油震荡', '原油/能源', '主要海峡地缘局势不确定性增加，保险公司提高航运附加费，布伦特原油高振幅走势。', '提高油气运输成本，对航运及炼化产业利润形成挤压。', '布伦特原油, XLE'),
                  news_item('NO.07', '微软与OpenAI联合发布下一代AI模型', '前沿科技', '新一代大模型在逻辑推理与代码生成领域实现突破，算力需求提升超40%。', '进一步夯实AI产业链底层逻辑，算力芯片与光模块维持强催化。', 'MSFT, NVDA, 光模块ETF'),
                  news_item('NO.06', '美股大盘高位震荡 科技巨头财报前夕谨慎', '美股动态', '标普500与纳斯达克在历史高位维持狭幅整理，交易员密切留意龙头企业现金流。', '短期避险资金流向公用事业及短期国债资产。', 'SPY, QQQ'),
                  news_item('NO.05', '全球芯片巨头强劲财报巩固复苏信号', '半导体', '晶圆代工头部企业披露月度营收，高算力芯片产能保持满载，封测产能持续紧张。', '确认科技硬件行业底部回升，半导体设备及材料端持续受益。', 'SMH, 台积电'),
                  news_item('NO.04', '日元汇率波动剧烈 日本央行加息预期分歧', '外汇市场', '日本工资增长数据强劲，引发对日本央行取消宽松政策的预期，日元呈现V型走势。', '日元套利交易套现压力增加，对全球跨境资金产生扰动。', 'USD/JPY, EWJ'),
                  news_item('NO.03', '新能源汽车渗透率破节点 原材料承压', '新能源', '全球电动汽车销量延续两位数增长，由于上游锂矿产能集中释放，现货供给过剩。', '整车端成本下降利好毛利率，但上游采矿股票估值承压。', 'LIT, 宁德时代'),
                  news_item('NO.02', '苹果公司推进硬件AI化 升级供应链预期', '消费电子', '苹果加码研发适配端侧大模型的下一代芯片，增加高端散热及高频PCB采购。', '消费电子供应链迎换机周期重估，核心零部件供应商关注度拉升。', 'AAPL, 立讯精密'),
                  news_item('NO.01', '美联储决议前夕 全球主要股市避险拉满', '宏观重磅', '全球投资者聚焦今夜美联储主席公开演讲，衍生品市场定价显示对降息路径争议达峰值。', '权益类资产呈现防守态势，资金向短债与黄金聚集。', 'VIX, TLT')
              ],
              'asia': [
                  news_item('NO.05', '亚太数字经济与跨境算力集群建设提速', '区域经济', '区域内数字基础设施投资保持强劲，跨境光缆与绿色电力供应成各方资本争夺焦点。', '利好本地电力设备及算力基建供应链。', 'EWS, 亚太科技'),
                  news_item('NO.04', '韩国存储芯片出口强劲 驱动工业基本面企稳', '韩国市场', '海关最新统计显示存储芯片出口额延续高增势头，对整体工业出口形成强支撑。', '提振KOSPI指数及全球存储产业链。', 'EWY, 三星电子'),
                  news_item('NO.03', '日本东京交易所治理改革延续 回购规模扩大', '日本市场', '治理优化政策持续深化，多家核心蓝筹企业发布大规模注销股票与提升分红计划。', '持续吸引海外长线价值资金流入日股。', '日经225 (NKY)'),
                  news_item('NO.02', '印度制造与服务业双PMI维持强劲扩张区间', '印度市场', '制造业扩张战略吸引全球电子组装巨头密集布局，本土基建投资与消费需求保持旺盛。', '印度权益市场估值维持相对溢价。', 'INDA, EPI'),
                  news_item('NO.01', '亚太半导体产业链重组 2.5D/3D封装争夺白热化', '半导体', '中国台湾与日本等半导体产业带加速扩建先进封装工厂，各大设计厂商抢瞻远期产能。', '半导体测试及设备订单排期维持高位。', 'TSMC, 日月光')
              ],
              'china': [
                  news_item('NO.05', '全国多地加力促消费 聚焦绿色智能与数字终端', '消费政策', '相关部门协同推出促消费组合拳，智能家电与新能源汽车以旧换新补贴有效激活内需。', '直接拉动社会零售总额回暖，利好白色家电龙头。', '美的集团, 比亚迪'),
                  news_item('NO.04', '央行灵活开展公开市场操作 维护流动性充裕', '货币政策', '针对税期及资金面波动，央行开展适度规模逆回购投放，银行间市场利率平稳运行。', '保障债券市场平稳，金融机构资金成本低位波动。', '国债期货, 银行板块'),
                  news_item('NO.03', '高技术产业投资保持高速增长 实体经济升级加快', '产业升级', '高端装备制造与高技术服务业投资比重持续提升，工业母机与机器人商业化提速。', '硬科技与设备制造产业链受资本长期青睐。', '科创50ETF, 机器人板块'),
                  news_item('NO.02', '国内大模型商业化全面提速 企业级应用落地', '人工智能', '多模态大模型在政务、金融及工业设计领域实现大规模API接入，付费转化率超预期。', '推动软件及SaaS板块估值重塑。', '百度, 计算机ETF'),
                  news_item('NO.01', '宏观组合政策综合显现 核心经济指标展现回升向好', '宏观经济', '制造业景气度重返扩张区间，出口增速与市场风险偏好同步共振，外资看多中国资产。', '极大提振权益市场风险偏好，离岸人民币走强。', '沪深300, 恒生科技')
              ]
          }

          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(r'更新时间: .*? \(CST\)', f'更新时间: {now_str}', content)

          js_data = 'const newsData = ' + json.dumps(latest_news, ensure_ascii=False, indent=12) + ';'
          
          if '<!-- NEWS_DATA_START -->' in content and '<!-- NEWS_DATA_END -->' in content:
              pattern = r'<!-- NEWS_DATA_START -->[\s\S]*?<!-- NEWS_DATA_END -->'
              replacement = f'<!-- NEWS_DATA_START -->\n    <script>\n        {js_data}\n    </script>\n    <!-- NEWS_DATA_END -->'
              content = re.sub(pattern, replacement, content)
          else:
              print('Warning: NEWS_DATA tags not found! Injecting before script end.')

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)

          print('Success update!')
          "

      - name: Push to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto update news data [skip ci]" && git push)
