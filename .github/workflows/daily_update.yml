name: Auto Update News Terminal

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch Latest News and Update index.html
        run: |
          python - << 'EOF'
          import re
          import json
          import datetime
          import urllib.request
          import xml.etree.ElementTree as ET

          today = datetime.datetime.now()
          date_prefix = today.strftime("%m月%d日")
          now_str = today.strftime("%Y-%m-%d %H:%M (CST)")

          rss_urls = [
              "https://feeds.a.dj.com/rss/RSSWorldNews.xml",
              "https://feeds.bloomberg.com/markets/news.rss"
          ]
          
          fetched_titles = []
          for url in rss_urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  xml_data = urllib.request.urlopen(req, timeout=5).read()
                  root = ET.fromstring(xml_data)
                  for item in root.findall('.//item')[:10]:
                      t = item.find('title')
                      if t is not None and t.text:
                          fetched_titles.append(t.text.strip())
              except Exception as e:
                  print("RSS fetch note:", e)

          base_global_pool = [
              ("美联储利率路径预期调整 全球资本市场波动率抬升", "宏观重磅", "最新宏观经济指标显示核心通胀黏性超预期，衍生品市场对美联储下一步流动性操作的分歧进一步加大。"),
              ("欧央行暗示维持现行利率 欧洲核心板块承压", "欧洲市场", "受工业产出数据持续疲软影响，欧洲主要经济体近期资本开支放缓，防御性高股息资产受资金青睐。"),
              ("地缘供应链溢价推升 原油与航运指数高位震荡", "原油/能源", "主要能源运输通道及海峡的不确定性导致航运附加费上升，全球大宗商品价格呈现高振幅博弈。"),
              ("科技巨头加码企业级AI算力基建 供应链订单饱满", "前沿科技", "新一代大模型在复杂逻辑与长文本推理上实现性能突破，头部云服务商持续扩大数据中心资本开支。"),
              ("美股核心资产维持高位盘整 机构关注财报现金流", "美股动态", "标普与纳指在历史高位区间维持狭幅震荡，市场交易员正密切评估即将披露的龙头企业现金流指引。"),
              ("全球芯片代工巨头月度营收超预期 确认周期回升", "半导体", "先进制程与AI算力芯片产能保持满载，封测环节排期持续紧张，印证全球硬件终端库存周期见底。"),
              ("日元汇率剧烈波动 引发跨境套利资金加速拆仓", "外汇市场", "日本央行官员最新表态引发市场对宽松货币政策退出的猜想，日元资产及汇率出现阶段性V型反转。"),
              ("新能源汽车全球渗透率创新高 上游原材料区间整理", "新能源", "主要海外与国内市场新能源车销量维持两位数增长，上游锂矿及电池材料库存在供给释放下保持平稳。"),
              ("消费电子供应链迎换机预期 加码端侧AI硬件采购", "消费电子", "主流消费电子品牌正加速推进终端AI化改造，带动高频PCB板及高端散热模组供应链估值重估。"),
              ("宏观组合政策效果持续显现 核心经济指标向好", "宏观经济", "最新高频数据表明国内经济内生动能稳步修复，外资机构相继对相关权益资产维持乐观配置评级。")
          ]

          global_news = []
          for i in range(10):
              item_id = f"NO.{10-i:02d}"
              if i < len(fetched_titles):
                  title = f"{date_prefix}快讯：{fetched_titles[i][:32]}"
                  summary = "依托全球实时金融终端捕捉到的市场异动，该事件对相关多空资产的传导路径正在迅速定价。"
              else:
                  orig_t, tag, summary = base_global_pool[i]
                  title = f"{date_prefix}焦点：{orig_t}"

              global_news.append({
                  "id": item_id,
                  "title": title,
                  "time": f"{07 - i//4:02d}:{45 - (i*6)%60:02d}",
                  "tag": base_global_pool[i][1],
                  "summary": summary,
                  "impact": "短期内驱动相关产业链估值弹性放大，市场交投活跃度显著提升。",
                  "asset": "标普500 (SPY), 现货黄金 / XAUUSD" if i % 2 == 0 else "纳指100 (QQQ), 核心资产标的"
              })

          latest_news = {
              "global": global_news,
              "asia": [
                  {"id": "NO.05", "title": f"{date_prefix} 亚太数字经济与跨境算力集群建设提速", "time": "07:20", "tag": "区域经济", "summary": "区域内数字基础设施投资保持强劲，跨境光缆与绿色电力供应成各方资本争夺焦点。", "impact": "利好本地电力设备及算力基建供应链。", "asset": "EWS, 亚太科技"},
                  {"id": "NO.04", "title": f"{date_prefix} 韩国存储芯片出口强劲 驱动工业基本面企稳", "time": "07:00", "tag": "韩国市场", "summary": "海关最新统计显示存储芯片出口额延续高增势头，对整体工业出口形成强有力的基本面支撑。", "impact": "提振KOSPI指数及全球存储产业链。", "asset": "EWY, 三星电子"},
                  {"id": "NO.03", "title": f"{date_prefix} 日本东京交易所治理改革延续 回购规模扩大", "time": "06:40", "tag": "日本市场", "summary": "治理优化政策持续深化，多家核心蓝筹企业发布大规模注销股票与提升分红比例计划。", "impact": "持续吸引海外长线价值资金流入日股。", "asset": "日经225 (NKY)"},
                  {"id": "NO.02", "title": f"{date_prefix} 印度制造与服务业双PMI维持强劲扩张区间", "time": "06:15", "tag": "印度市场", "summary": "制造业扩张战略吸引全球电子组装巨头密集布局，本土基建投资与消费需求保持旺盛。", "impact": "印度权益市场估值维持相对溢价。", "asset": "INDA, EPI"},
                  {"id": "NO.01", "title": f"{date_prefix} 亚太半导体产业链重组 2.5D/3D封装产能争夺白热化", "time": "05:30", "tag": "半导体", "summary": "中国台湾与日本等半导体产业带加速扩建先进封装工厂，各大设计厂商全力抢占远期产能。", "impact": "半导体测试及设备订单排期维持高位。", "asset": "TSMC, 日月光"}
              ],
              "china": [
                  {"id": "NO.05", "title": f"{date_prefix} 全国多地加力促消费 聚焦绿色智能与数字终端", "time": "07:30", "tag": "消费政策", "summary": "相关部门协同推出促消费组合拳，智能家电与新能源汽车以旧换新补贴有效激活终端内需。", "impact": "直接拉动社会零售总额回暖，利好白色家电龙头。", "asset": "美的集团, 比亚迪"},
                  {"id": "NO.04", "title": f"{date_prefix} 央行灵活开展公开市场操作 维护流动性充裕", "time": "07:10", "tag": "货币政策", "summary": "针对税期及资金面波动，央行开展适度规模逆回购投放，银行间市场利率平稳运行。", "impact": "保障债券市场平稳，金融机构资金成本低位波动。", "asset": "国债期货, 银行板块"},
                  {"id": "NO.03", "title": f"{date_prefix} 高技术产业投资保持高速增长 实体经济升级加快", "time": "06:45", "tag": "产业升级", "summary": "高端装备制造与高技术服务业投资比重持续提升，工业母机与人形机器人商业化落地提速。", "impact": "硬科技与设备制造产业链受资本长期青睐。", "asset": "科创50ETF, 机器人板块"},
                  {"id": "NO.02", "title": f"{date_prefix} 国内大模型商业化全面提速 企业级应用落地", "time": "06:00", "tag": "人工智能", "summary": "多模态大模型在政务、金融及工业设计领域实现大规模API接入，付费转化率超预期。", "impact": "推动软件及SaaS板块估值重塑。", "asset": "百度, 计算机ETF"},
                  {"id": "NO.01", "title": f"{date_prefix} 宏观组合政策综合显现 核心经济指标展现回升向好", "time": "05:15", "tag": "宏观经济", "summary": "制造业景气度重返扩张区间，出口增速与市场风险偏好同步共振，外资机构看多中国资产。", "impact": "极大提振权益市场风险偏好，离岸人民币走强。", "asset": "沪深300, 恒生科技"}
              ]
          }

          with open("index.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          html_content = re.sub(r'更新时间: .*? \(CST\)', f'更新时间: {now_str}', html_content)

          js_data_str = f"const newsData = {json.dumps(latest_news, ensure_ascii=False, indent=12)};"
          pattern = r'<!-- NEWS_DATA_START -->[\s\S]*?<!-- NEWS_DATA_END -->'
          replacement = f'<!-- NEWS_DATA_START -->\n    <script>\n        {js_data_str}\n    </script>\n    <!-- NEWS_DATA_END -->'

          new_html = re.sub(pattern, replacement, html_content)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(new_html)

          print("成功注入每日动态实时更新数据！")
          EOF

      - name: Push to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dynamic daily news [skip ci]" && git push)
