name: Daily Update

on:
  schedule:
    # UTC 00:00、06:00，对应北京时间 08:00、14:00
    - cron: "0 0,6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finance-dashboard-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖库
        # 安装脚本所需的第三方库 requests 和 feedparser
        run: pip install requests feedparser

      - name: 检查必要文件
        run: |
          test -f update.py || {
            echo "错误：找不到 update.py"
            exit 1
          }

          test -f index.html || {
            echo "错误：找不到 index.html"
            exit 1
          }

      - name: 清理旧缓存以强制刷新
        run: |
          rm ai_cache.json || true
          echo "✅ 已手动删除 AI 缓存文件，下次运行将强制请求 DeepSeek。"

      - name: 执行 Python 数据更新脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUTF8: "1"
        run: python update.py

      - name: 提交更新后的网页
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html ai_cache.json || true

          if git diff --cached --quiet; then
            echo "没有新的网页变化，无需提交。"
          else
            git commit -m "auto: update finance news (mega-cap priority fix)"
            git push
          fi
