name: Daily Update

# 每小时触发一次，但只有北京时间 09 点那次真正执行(避开 GitHub 对"每天一次"定时的不稳定)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.t.outputs.go }}
    steps:
      - id: t
        run: |
          H=$(TZ=Asia/Shanghai date +%H)
          if [ "$H" = "09" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: finance-dashboard-update
      cancel-in-progress: false

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          pip install requests feedparser python-dotenv

      - name: 检查必要文件
        run: |
          test -f update.py
          test -f finance.html
          grep -Fq '<!-- NEWS_DATA_START -->' finance.html
          grep -Fq '<!-- NEWS_DATA_END -->' finance.html
          echo "财经看板文件检查通过"

      - name: 执行新闻更新
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUTF8: "1"
        run: python update.py

      - name: 检查更新结果
        run: |
          test -f finance.html
          grep -Fq 'window.newsData=' finance.html
          echo "财经新闻数据写入检查通过"

      - name: 提交并推送更新
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add finance.html ai_cache.json translation_cache.json market_cap_cache.json

          if git diff --cached --quiet; then
            echo "没有新的网页或缓存变化"
            exit 0
          fi

          git commit -m "auto: update finance and Asia Pacific news"

          # 同步远端最新版本，再推送
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
