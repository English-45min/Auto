name: Update Daily News

on:
  schedule:
    # 每天北京时间早上 8:00 与下午 14:00 自动运行 (UTC 0:00 与 06:00)
    - cron: '0 0,6 * * *'
  workflow_dispatch: # 支持手动一键运行

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: |
          python update.py

      - name: Push to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto refresh daily news [skip ci]" && git pull origin main --rebase && git push origin main)
