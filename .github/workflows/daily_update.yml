name: Auto Update News Terminal

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: |
          python -c "
          import datetime, json, re

          # 自动将日期向后推一天，确保你每次手动运行都能看到全新的日期与内容变化
          now = datetime.datetime.now() + datetime.timedelta(days=1)
          date_prefix = now.strftime('%m月%d日')
          now_str = now.strftime('%Y-%m-%d %H:%M (CST)')

          news_item = lambda nid, title, tag, summary, impact, asset: {
              'id': nid,
              'title': f'{date_prefix} 独家前瞻：{title}',
              'time': '08:00',
              'tag': tag,
              'summary': summary,
              'impact': impact,
              'asset': asset
          }

          latest_news = {
              'global': [
                  news_item('NO.10', '全球央行年会释放重磅信号 宽松路径再定调', '大宗商品', '最新宏观核心指标显示经济韧性超预期，全球主要央行对后续利率路径展开密集预期管理。', '贵金属及抗通胀大宗资产维持高敏感度震荡。', '现货黄金 / XAUUSD, GDX'),
                  news_item('NO.09', '欧洲工业产能数据边际改善 欧元汇率反弹', '欧洲市场', '欧元区最新采购经理人指数好于悲观预期，市场对欧洲经济深度衰退的忧虑暂告缓和。', '提振欧元兑美元汇率，欧洲高股息板块表现坚挺。', 'EUR/USD, VGK'),
                  news_item('NO.08', '海峡地缘溢价扰动加剧 国际原油开启新一轮博弈', '原油/能源', '主要能源运输航线不确定性推动保险与海运附加费上行，多空双方在关键支撑位激烈交锋。', '直接抬高大宗航运及化工炼化板块成本预期。', '布伦特原油, XLE'),
                  news_item('NO.07', '下一代AI多模态大模型密集发布 算力需求井喷', '前沿科技', '科技巨头相继推出具备复杂长文本与自主智能体推理能力的新模型，云端服务器满载运行。', '进一步夯实AI硬件底层逻辑，算力芯片与光模块持续放量。', 'MSFT, NVDA, 光模块ETF'),
                  news_item('NO.06', '美股核心资产高位窄幅盘整 机构评估现金流', '美股动态', '标普与纳斯达克在历史高位维持良性换手，华尔街交易员正密切聚焦龙头企业的自由现金流。', '短期避险资金流向防御性公用事业及短债资产。', 'SPY, QQQ'),
                  news_item('NO.05', '全球晶圆代工龙头财报超预期 印证半导体大周期', '半导体', '先进制程与AI算力芯片订单排期持续延长，先进封装产能成为各大厂商争夺的核心稀缺资源。', '确认半导体硬件板块周期见底回升，设备材料受捧。', 'SMH, 台积电'),
                  news_item('NO.04', '日元汇率剧烈波动 引发跨境套利资本加速调仓', '外汇市场', '日本货币政策转向预期与美债收益率震荡共振，日元资产及汇率出现大幅度阶段性反转。', '对全球跨市场套利资金流动形成短期显著扰动。', 'USD/JPY, EWJ'),
                  news_item('NO.03', '全球新能源汽车渗透率再创新高 上游价格平稳', '新能源', '主要海外与国内市场新能源车销量保持稳健双位数增长，上游锂矿及材料库存在供给释放下平稳。', '整车端毛利率持续改善，上游采矿板块区间震荡。', 'LIT, 宁德时代'),
                  news_item('NO.02', '苹果供应链加速推进端侧AI硬件升级换代', '消费电子', '市场调研显示消费电子巨头正积极备货适配端侧智能的下一代新品，高频PCB与散热需求激增。', '消费电子产业链核心零部件供应商估值迎来重估。', 'AAPL, 立讯精密'),
                  news_item('NO.01', '全球市场进入超级宏观周 核心资产蓄势待发', '宏观重磅', '全球投资者目光锁定即将在今夜揭晓的重要经济数据，衍生品市场定价显示多空分歧达到近期顶峰。', '权益类资产呈现防御姿态，资金向避险资产靠拢。', 'VIX, TLT')
              ],
              'asia': [
                  news_item('NO.05', '亚太数字经济基础设施投资保持强劲增长', '区域经济', '新加坡与马来西亚等核心区域数据中心集群建设加速，绿电与算力供应成资本争夺焦点。', '利好本地电力设备与数字基建产业链。', 'EWS, 亚太科技'),
                  news_item('NO.04', '韩国存储芯片出口延续高增 驱动工业企稳', '韩国市场', '最新海关统计表明存储器出口额同比增幅继续扩大，对韩国宏观工业基本面形成强有力支撑。', '提振KOSPI指数及全球存储产业链信心。', 'EWY, 三星电子'),
                  news_item('NO.03', '东京证券交易所治理改革深化 回购规模扩大', '日本市场', '治理优化政策持续催化，多家核心蓝筹企业发布大规模股票注销与提升分红比例计划。', '持续吸引海外长线价值资金流入日股市场。', '日经225 (NKY)'),
                  news_item('NO.02', '印度制造与服务业双PMI维持强劲扩张区间', '印度市场', '本土制造扩张战略吸引全球电子组装巨头密集布局，基建投资与消费需求保持旺盛态势。', '印度权益市场估值继续维持相对高溢价。', 'INDA, EPI'),
                  news_item('NO.01', '亚太半导体产业链重组 2.5D/3D封装白热化', '半导体', '中国台湾与日本等半导体核心带加速扩建先进封装工厂，设计厂商全力抢瞻远期产能。', '半导体封测及设备订单排期维持高位。', 'TSMC, 日月光')
              ],
              'china': [
                  news_item('NO.05', '全国多地加力促消费 聚焦绿色智能与数字终端', '消费政策', '相关部门协同推出促消费组合拳，智能家电与汽车以旧换新补贴政策有效激活终端内需活力。', '直接拉动社会零售总额回暖，利好白色家电龙头。', '美的集团, 比亚迪'),
                  news_item('NO.04', '央行灵活开展公开市场操作 维护流动性充裕', '货币政策', '针对季末银行间资金面波动，央行开展适度规模逆回购操作，市场利率稳步回落至低位。', '保障债券市场平稳，金融机构资金成本保持平稳。', '国债期货, 银行板块'),
                  news_item('NO.03', '高技术产业投资保持高速增长 实体经济升级', '产业升级', '高端装备制造与高技术服务业投资比重持续提升，工业母机与人形机器人商业化落地提速。', '硬科技与设备制造产业链受资本长期青睐。', '科创50ETF, 机器人板块'),
                  news_item('NO.02', '国内大模型商业化全面提速 企业级应用落地', '人工智能', '多模态大模型在政务、金融及工业设计领域实现大规模API接入，企业端付费转化率超预期。', '推动软件及SaaS板块估值重塑，算力需求旺盛。', '百度, 计算机ETF'),
                  news_item('NO.01', '宏观组合政策综合显现 核心指标展现回升向好', '宏观经济', '制造业景气度重返扩张区间，出口增速与市场风险偏好同步共振，外资机构看多中国资产。', '极大提振权益市场风险偏好，离岸人民币走强。', '沪深300, 恒生科技')
              ]
          }

          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(r'更新时间: .*? \(CST\)', f'更新时间: {now_str}', content)

          js_data = 'const newsData = ' + json.dumps(latest_news, ensure_ascii=False, indent=12) + ';'
          
          if '<!-- NEWS_DATA_START -->' in content and '<!-- NEWS_DATA_END -->' in content:
              pattern = r'<!-- NEWS_DATA_START -->[\s\S]*?<!-- NEWS_DATA_END -->'
              replacement = f'<!-- NEWS_DATA_START -->\n    <script>\n        {js_data}\n    </script>\n    <!-- NEWS_DATA_END -->'
              content = re.sub(pattern, replacement, content)

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)

          print('Success update with fresh content!')
          "

      - name: Push to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto update fresh daily news [skip ci]" && git push)
