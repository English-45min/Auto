name: Auto Update News Terminal

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: |
          python - << 'EOF'
          import datetime
          now = datetime.datetime.now()
          print("Workflow executed successfully at:", now.strftime("%Y-%m-%d %H:%M:%S"))
          EOF
