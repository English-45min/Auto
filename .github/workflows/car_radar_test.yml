
name: Car Radar Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token or not chat_id:
              raise SystemExit("缺少 Telegram Secrets，请检查名称。")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = json.dumps({
              "chat_id": chat_id,
              "text": "✅ 二手车雷达测试成功！Telegram 消息推送正常。"
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  if not result.get("ok"):
                      raise SystemExit("Telegram 返回失败，请查看运行日志。")
                  print("Telegram 测试消息发送成功。")
          except urllib.error.HTTPError as exc:
              print("Telegram 请求失败，HTTP 状态码：", exc.code)
              raise SystemExit(1)
          PY
