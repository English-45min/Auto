
name: TG_Bot Daily News Board

on:
  schedule:
    # 主推送：北京时间每天 09:07 (UTC 01:07)
    - cron: “7 1 * * *”
  workflow_dispatch:

# 避免多个定时任务同时执行
concurrency:
  group: telegram-daily-news-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run main.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      # 保存新闻历史和每日推送日期
      - name: Commit & Push Sent History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .sent_history.json .last_push_date.txt

          if git diff --cached --quiet; then
            echo "No push history changes"
            exit 0
          fi

          git commit -m "chore: record daily Telegram push [skip ci]"

          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
