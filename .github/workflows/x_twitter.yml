name: X 科技 AI 中文爆文推送看板

on:
  workflow_dispatch: # 支持在 GitHub Actions 界面手动点击按钮触发
  schedule:
    # 按照 X 平台发帖与互动高峰期，每天定时推送两次（北京时间 08:30 与 20:30）
    - cron: '30 0,12 * * *'

jobs:
  run-twitter-push:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: 执行 X 爆文抓取并推送至 Telegram
        env:
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python main.py
