name: TG_Bot Daily News Board

on:
  schedule:
    # 每天 UTC 0:00 和 12:00（即北京时间 08:00 和 20:00）自动触发
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击运行

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    # 🔑 给 Actions 赋予写权限，以便自动提交和推送 .sent_history.json 历史记录
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run main.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      # 🔑 核心步骤：将脚本更新后的 .sent_history.json 自动 commit 并 push 回仓库
      - name: Commit & Push Sent History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .sent_history.json
          git commit -m "chore: auto-update sent history [skip ci]" || exit 0
          git push
