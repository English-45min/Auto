name: TG_Bot Daily News Board

# 每小时触发一次，但只有北京时间 10 点那次真正执行(避开 GitHub 对"每天一次"定时的不稳定)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.t.outputs.go }}
    steps:
      - id: t
        run: |
          H=$(TZ=Asia/Shanghai date +%H)
          if [ "$H" = "10" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
          fi

  build-and-run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 避免多个任务同时执行
    concurrency:
      group: telegram-daily-news-push
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run main.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      # 保存新闻历史和每日推送日期
      - name: Commit & Push Sent History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .sent_history.json .last_push_date.txt

          if git diff --cached --quiet; then
            echo "No push history changes"
            exit 0
          fi

          git commit -m "chore: record daily Telegram push [skip ci]"

          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
