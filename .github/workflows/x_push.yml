name: Daily Real X Viral Push

on:
  schedule:
    # 定时任务：每隔 1 小时自动运行一次（你可以根据需要修改 cron 表达式）
    - cron: '0 * * * *'
  workflow_dispatch: # 允许你在 GitHub 网页上随时手动点击按钮运行一次

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 迁出代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          pip install feedparser requests

      - name: 运行抓取并推送脚本
        env:
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python main.py
