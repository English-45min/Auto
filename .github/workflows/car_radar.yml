
name: Car Radar

on:
  # 每天北京时间 09:00 自动运行（UTC 01:00）
  schedule:
    - cron: "0 1 * * *"

  # 允许手动启动
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: car-radar
  cancel-in-progress: false

jobs:
  car-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 获取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4
          fi

      # 4. 检查必要配置
      - name: Check configuration
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "缺少 GitHub Secret: TG_BOT_TOKEN"
            exit 1
          fi

          if [ -z "$TG_CHAT_ID" ]; then
            echo "缺少 GitHub Secret: TG_CHAT_ID"
            exit 1
          fi

          if [ ! -f car_radar.py ]; then
            echo "找不到 car_radar.py"
            exit 1
          fi

          if [ ! -f car_radar_config.json ]; then
            echo "找不到 car_radar_config.json"
            exit 1
          fi

      # 5. 运行二手车雷达
      - name: Run Car Radar
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python car_radar.py

      # 6. 检查网页数据文件
      - name: Check generated data
        run: |
          if [ ! -f car_radar_data.json ]; then
            echo "错误：car_radar.py 没有生成 car_radar_data.json"
            exit 1
          fi

          python -m json.tool car_radar_data.json > /dev/null
          echo "车源数据 JSON 检查通过"

      # 7. 将最新车源数据保存到仓库
      - name: Commit updated car data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add car_radar_data.json

          if git diff --cached --quiet; then
            echo "车源数据没有变化，无需提交"
          else
            git commit -m "Update car radar data"
            git push
          fi
