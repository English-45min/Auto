name: Car Radar

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间上午 9 点运行
    # GitHub Actions 使用 UTC 时间，因此是 01:00 UTC
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: car-radar
  cancel-in-progress: false

jobs:
  car-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run car radar
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python car_radar.py

      - name: Save database and dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f car_radar.sqlite3 ]; then
            git add car_radar.sqlite3
          fi

          if [ -f car_radar_data.json ]; then
            git add car_radar_data.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update car radar data"
            git push
          else
            echo "No data changes to commit."
          fi
