name: Car Radar

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 09:00 运行（GitHub Actions 可能延迟启动）
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: car-radar
  cancel-in-progress: false

jobs:
  car-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run car radar
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python car_radar.py

      - name: Save car radar database
        if: always()
        run: |
          if [ -f car_radar.sqlite3 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add car_radar.sqlite3
            git diff --cached --quiet || git commit -m "Update car radar database"
            git push
          fi
