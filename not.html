<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>全球财经时政新闻 · 项目中心</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#0b1220;
  color:#e5e7eb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Microsoft YaHei",sans-serif;
}
.container{
  width:min(920px,92%);
  margin:0 auto;
  padding:65px 0 35px;
}
.header{margin-bottom:38px}
.eyebrow{
  color:#60a5fa;
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:18px;
}
h1{
  font-size:clamp(27px,5vw,40px);
  margin:0 0 13px;
  letter-spacing:1px;
}
.subtitle{
  color:#94a3b8;
  font-size:14px;
  line-height:1.8;
}
.section-title{
  font-size:13px;
  color:#64748b;
  letter-spacing:2px;
  margin:35px 0 16px;
}
.projects{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
}
.project{
  display:flex;
  align-items:center;
  gap:18px;
  padding:23px;
  background:#111c2e;
  border:1px solid #26354b;
  border-radius:15px;
  text-decoration:none;
  color:#e5e7eb;
  transition:.2s;
}
.project:hover{
  transform:translateY(-3px);
  border-color:#60a5fa;
  background:#17263c;
}
.project-icon{
  width:55px;
  height:55px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  background:#1e3350;
  border-radius:13px;
  font-size:27px;
}
.project-info{flex:1;min-width:0}
.project h2{
  font-size:18px;
  margin:0 0 8px;
}
.project p{
  font-size:13px;
  line-height:1.7;
  color:#94a3b8;
  margin:0;
}
.right{
  display:flex;
  align-items:center;
  gap:12px;
}
.status{
  font-size:11px;
  white-space:nowrap;
  padding:5px 10px;
  border-radius:20px;
  background:#12352c;
  color:#4ade80;
}
.status.dev{
  background:#3b2d17;
  color:#fbbf24;
}
.arrow{
  font-size:22px;
  color:#64748b;
}
.footer{
  border-top:1px solid #26354b;
  margin-top:48px;
  padding-top:20px;
  color:#64748b;
  font-size:12px;
  line-height:1.8;
  text-align:center;
}
@media(max-width:520px){
  .container{padding-top:42px}
  .project{padding:17px 14px;gap:12px}
  .project-icon{width:45px;height:45px;font-size:23px}
  .project h2{font-size:16px}
  .project p{font-size:12px}
  .status{font-size:10px;padding:4px 7px}
  .right{gap:6px}
}
</style>
</head>
<body>
<main class="container">
  <header class="header">
    <div class="eyebrow">PERSONAL DIGITAL WORKSPACE</div>
    <h1>全球财经时政新闻</h1>
    <div class="subtitle">
      资讯追踪 · 智能推送 · 二手车信息<br>
      一个入口，管理三个独立项目。
    </div>
  </header>

  <div class="section-title">PROJECTS / 项目入口</div>

  <section class="projects">

    <a class="project" href="./bot.html">
      <div class="project-icon">📰</div>
      <div class="project-info">
        <h2>爆文推送中心</h2>
        <p>热点资讯自动抓取、筛选与 Telegram 推送</p>
      </div>
      <div class="right">
        <span class="status">运行中</span>
        <span class="arrow">›</span>
      </div>
    </a>

    <a class="project" href="./finance.html">
      <div class="project-icon">📊</div>
      <div class="project-info">
        <h2>全球财经看板</h2>
        <p>国际财经、亚太财经、国内财经与核心财报</p>
      </div>
      <div class="right">
        <span class="status">运行中</span>
        <span class="arrow">›</span>
      </div>
    </a>

    <a class="project" href="./car_radar.html">
      <div class="project-icon">🚗</div>
      <div class="project-info">
        <h2>二手车雷达</h2>
        <p>二手车源自动采集、筛选与信息追踪</p>
      </div>
      <div class="right">
        <span class="status dev">开发中</span>
        <span class="arrow">›</span>
      </div>
    </a>

  </section>

  <footer class="footer">
    GLOBAL FINANCE & NEWS WORKSPACE<br>
    独立项目 · 统一入口 · 持续更新
  </footer>
</main>
</body>
</html>
