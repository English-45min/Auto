<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="google" content="notranslate">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="财经看板">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/finance-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/finance-192.png">
<title>BILLBOARD // 财经与时政看点</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0f19;color:#e2e8f0;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:#080d18f2;border-bottom:1px solid #263244;backdrop-filter:blur(12px)}
.wrap{max-width:1100px;margin:auto;padding:14px 18px}
.brand{display:inline-block;padding:7px 13px;border:1px solid #b45309;border-radius:10px;background:#090d16;box-shadow:0 4px 15px #000b}
.brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.04em;background:linear-gradient(#ffe082,#f59e0b,#b45309);background-clip:text;color:transparent;text-shadow:0 2px 3px #000}
.muted{color:#94a3b8}.small{font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;margin:16px 0}
.search{flex:1;min-width:0;background:#111827;color:#e2e8f0;border:1px solid #334155;border-radius:9px;padding:11px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #263244;margin-bottom:18px}
.tab{background:transparent;color:#94a3b8;border:0;border-bottom:2px solid transparent;padding:13px 5px;font-weight:800;cursor:pointer}
.tab.active{color:#fbbf24;border-color:#f59e0b}
.card{background:#111827;border:1px solid #263244;border-radius:14px;padding:16px;margin:12px 0;overflow-wrap:anywhere}
.featured{background:linear-gradient(135deg,#291808,#111827 70%);border:2px solid #b45309;border-radius:17px;padding:16px;margin:16px 0 24px}
.featured h2{color:#fbbf24;margin:0 0 10px}
.featured-card{background:#171c28;border:1px solid #d97706;border-radius:13px;padding:15px;margin-top:12px}
.pill{display:inline-block;background:#1e293b;color:#cbd5e1;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}
.score{background:#451a03;color:#fde68a;font-weight:900}
.title{font-size:18px;line-height:1.5;font-weight:850;margin:8px 0}
.summary{line-height:1.7;color:#cbd5e1}
.ai{background:#0d2430;border:1px solid #155e75;border-radius:10px;padding:12px;margin-top:12px}
.ai h4{color:#7dd3fc;margin:0 0 6px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.research{background:#0b1220;border:1px solid #263244;border-radius:9px;padding:10px;min-width:0}
.research p,.research li{font-size:13px;line-height:1.65;color:#dbeafe;margin:0}
.wide{grid-column:1/-1}
.btn{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:7px 10px;cursor:pointer}
.read{opacity:.62}
a{color:#fbbf24;text-decoration:none}a:hover{text-decoration:underline}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
footer{padding:25px 0;color:#94a3b8;font-size:12px;line-height:1.7}
.install-note{display:none;margin:10px 0;padding:10px 12px;border:1px solid #334155;border-radius:10px;background:#111827;color:#cbd5e1;font-size:13px}
@media(max-width:600px){.wrap{padding:12px}.tab{font-size:12px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.title{font-size:16px}.card{padding:12px}}
</style>
</head>
<body>
<header><div class="wrap row">
  <div><div class="brand"><h1>📊 BILLBOARD // 财经时政看点</h1></div>
  <div class="muted small" style="margin:7px 0 0 3px">全球财经 · 亚太动态 · 中国市场 · 企业财报</div></div>
  <div class="small muted">最近更新：<span id="updateTime">等待数据</span><div id="aiStatus" style="margin-top:5px">AI 状态读取中</div></div>
</div></header>
<main class="wrap">
<div id="installNote" class="install-note">财经看板已支持安装。请使用浏览器菜单中的“安装应用”或“添加到主屏幕”。</div>
<div class="toolbar"><input id="searchInput" class="search" type="search" placeholder="搜索标题、摘要、来源、分析或资产…" aria-label="搜索新闻"></div>
<nav class="tabs" id="tabs">
  <button class="tab" data-tab="global">国际财经 Top 20</button>
  <button class="tab" data-tab="asia">亚太财经 Top 10</button>
  <button class="tab" data-tab="china">国内财经 Top 10</button>
  <button class="tab" data-tab="earnings">核心财报 Top 10</button>
</nav>
<section id="featuredWrap" class="featured"><h2>🔥 当日重点新闻 · TOP 3 深度聚焦</h2><div id="featuredList"></div></section>
<div class="row"><h2 id="sectionTitle" style="font-size:19px">国际财经新闻</h2><span id="count" class="muted small"></span></div>
<p class="muted small">重点新闻按权重排序置顶；下方展示其余资讯。点击“标记已读”可在本设备保留阅读状态。</p>
<div id="newsList" aria-live="polite"><div class="card muted">看板正在初始化……</div></div>
<footer>免责声明：本看板用于财经信息整理与阅读，不代表任何媒体官方产品，不构成投资建议。<br>© 2026 BILLBOARD // 财经时政看点</footer>
</main>

<!-- NEWS_DATA_START -->
<script>window.newsData={};</script>
<!-- NEWS_DATA_END -->

<script>
"use strict";
const labels={global:"国际财经新闻",asia:"亚太财经新闻",china:"国内财经新闻",earnings:"核心财报新闻"};
const tabs=["global","asia","china","earnings"];
const activeKey="financeDashboardActiveTab_v7",readKey="financeDashboardRead_v7";
let active="global",readIds=new Set();
try{
  const t=localStorage.getItem(activeKey);
  if(tabs.includes(t))active=t;
  readIds=new Set(JSON.parse(localStorage.getItem(readKey)||"[]"));
}catch(e){}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeUrl(v){
  try{const u=new URL(String(v||""),location.href);return ["https:","http:"].includes(u.protocol)?u.href:"#";}
  catch(e){return "#";}
}
function articleLink(n){
  const u=safeUrl(n.url);
  return u==="#"?'<span class="muted small">暂无原文链接</span>':`<a href="${esc(u)}" target="_self" rel="noopener">查看原始报道 ↗</a>`;
}
function renderList(a){
  return Array.isArray(a)&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<p>暂无足够信息。</p>";
}
function renderAI(n){
  if(!n.analysis)return '<div class="muted small" style="margin-top:12px">本条资讯暂未加载 AI 深度分析。</div>';
  return `<section class="ai"><div class="row"><strong style="color:#67e8f9">🧭 AI 深度分析</strong><span class="pill">置信度：${esc(n.confidence||"未标注")}</span></div>
  <p class="summary">${esc(n.analysis)}</p><div class="grid">
  <div class="research"><h4>📌 核心逻辑</h4><p>${esc(n.coreLogic||"暂无")}</p></div>
  <div class="research"><h4>📈 潜在市场影响</h4><p>${esc(n.marketImpact||n.impact||"暂无法判断")}</p></div>
  <div class="research"><h4>🔗 传导机制</h4><p>${esc(n.transmission||"信息不足")}</p></div>
  <div class="research"><h4>⏳ 影响周期</h4><p>${esc(n.timeHorizon||"暂不确定")}</p></div>
  <div class="research"><h4>🧾 证据线索</h4>${renderList(n.evidence)}</div>
  <div class="research"><h4>⚖️ 情景分析</h4>${renderList(n.scenarios)}</div>
  <div class="research wide"><h4>⚠️ 风险与信息缺口</h4><p>${esc(n.risk||"尚未识别")}</p></div></div></section>`;
}
function card(n,i,featured=false){
  const rid=active+"_"+String(n.url||n.title||i),isRead=readIds.has(rid);
  const score=Math.max(0,Math.min(100,Number(n._importance??50)||50));
  const cls=featured?"featured-card":"card";
  return `<article class="${cls} ${isRead?"read":""}">
  <div class="row"><div><span class="pill score">${featured?"🔥 TOP "+(i+1)+" · ":""}权重 ${score}/100</span>
  <span class="pill">${esc(n.source||"未知来源")}</span><span class="pill">${esc(n.publishedAt||"")}</span></div>
  <button class="btn small" type="button" data-read-id="${esc(rid)}">${isRead?"✓ 已读":"标记已读"}</button></div>
  <h3 class="title">${esc(n.title||"无标题")}</h3><p class="summary">${esc(n.summary||"暂无摘要")}</p>
  ${renderAI(n)}<div class="row" style="margin-top:12px">${articleLink(n)}
  ${Array.isArray(n.asset)?n.asset.map(x=>`<span class="pill">${esc(x)}</span>`).join(""):""}</div></article>`;
}
function getData(){
  const a=window.newsData&&Array.isArray(window.newsData[active])?window.newsData[active]:[];
  return [...a].sort((x,y)=>(Number(y._importance)||50)-(Number(x._importance)||50)||String(y.publishedAt||"").localeCompare(String(x.publishedAt||"")));
}
function render(){
  const q=(document.getElementById("searchInput").value||"").trim().toLowerCase();
  const all=getData();
  const filtered=all.filter(n=>[n.title,n.summary,n.source,n.analysis,n.coreLogic,n.marketImpact,n.transmission,n.risk,n.originalTitle,...(n.asset||[])].join(" ").toLowerCase().includes(q));
  const useFeatured=!q&&filtered.length>0;
  const fw=document.getElementById("featuredWrap"),fl=document.getElementById("featuredList"),nl=document.getElementById("newsList");
  document.getElementById("sectionTitle").textContent=labels[active];
  fw.style.display=useFeatured?"block":"none";
  if(useFeatured)fl.innerHTML=filtered.slice(0,3).map((n,i)=>card(n,i,true)).join("");else fl.innerHTML="";
  const rest=useFeatured?filtered.slice(3):filtered;
  document.getElementById("count").textContent=`共 ${filtered.length} 条 · 常规列表 ${rest.length} 条`;
  nl.innerHTML=rest.length?rest.map((n,i)=>card(n,i,false)).join(""):'<div class="card muted">当前条件下没有其他新闻。</div>';
}
function setTab(t){
  if(!tabs.includes(t))return;
  active=t;
  try{localStorage.setItem(activeKey,t);}catch(e){}
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  render();window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]");if(b)setTab(b.dataset.tab);
});
document.getElementById("searchInput").addEventListener("input",render);
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-read-id]");if(!b)return;
  readIds.add(b.dataset.readId);
  try{localStorage.setItem(readKey,JSON.stringify([...readIds]));}catch(err){}
  render();
});
if(window.newsData?.updatedAt)document.getElementById("updateTime").textContent=window.newsData.updatedAt;
const s=window.newsData?.aiStats,st=document.getElementById("aiStatus");
st.textContent=window.newsData?.aiEnabled?`🟢 DeepSeek 已配置 · ${window.newsData.aiModel||"deepseek-chat"} · 分析 ${s?.successes||0}/${s?.attempts||0}`:"🟠 等待新闻数据更新";
document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===active));
render();
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{
  if(e.touches.length===1&&!e.target.closest("input,button,a")){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.8){
    const i=tabs.indexOf(active);
    if(dx<0&&i<tabs.length-1)setTab(tabs[i+1]);else if(dx>0&&i>0)setTab(tabs[i-1]);
  }
},{passive:true});
</script>

<script>
/* 财经看板独立 PWA 注册；不使用仓库原有 sw.js */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./finance-sw.js")
      .then(registration=>console.log("财经看板 PWA 已注册：",registration.scope))
      .catch(error=>console.error("财经看板 PWA 注册失败：",error));
  });
}
</script>
</body>
</html>
