document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===active));render();
let sx=0,sy=0;document.addEventListener("touchstart",e=>{if(e.touches.length===1&&!e.target.closest("input,button,a")){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.addEventListener("touchend",e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.8){const i=tabs.indexOf(active);if(dx<0&&i<tabs.length-1)setTab(tabs[i+1]);else if(dx>0&&i>0)setTab(tabs[i-1])}},{passive:true});
</script>
</body>
</html>
